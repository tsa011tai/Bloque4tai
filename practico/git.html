function record(q, ok){
  const s = S.q[q.id] || {ok:0, ko:0, last:null};
  ok ? s.ok++ : s.ko++; s.last = ok ? 1 : 0; s.at = Date.now(); S.q[q.id] = s; save();
}
function startQuiz(list, opts){
  let i = 0; const answers = new Array(list.length).fill(null);
  function letter(n){ return 'ABCD'[n]; }
  function show(){
    const q = list[i]; const a = answers[i]; const t = topicById[q.t];
    view.innerHTML = '<div class="qhead"><h2 class="view" style="margin:0">'+esc(opts.title)+'</h2><span class="pill">'+(i+1)+' / '+list.length+'</span></div>' +
      '<div class="bar"><i style="width:'+(100*(i)/list.length)+'%"></i></div>' +
      '<div class="card"><div class="qhead"><span class="muted">'+q.t+(t?' · '+esc(t.title):'')+'</span><button class="star'+(S.star[q.id]?' on':'')+'" id="starB" title="Marcar para repasar">★</button></div>' +
      '<div class="qtext">'+inline(q.q)+'</div>' +
      q.o.map((o,k) => '<button class="opt" data-k="'+k+'"><span class="l">'+letter(k)+'</span><span>'+inline(o)+'</span></button>').join('') +
      '<div id="fb"></div></div>' +
      '<div class="row" style="justify-content:space-between"><button class="btn ghost" id="pv" '+(i?'':'disabled')+'>← Anterior</button>' +
      '<div class="row">'+(!opts.practice?'<button class="btn ghost" id="blank">Dejar en blanco</button>':'')+'<button class="btn" id="end">Terminar</button><button class="btn primary" id="nx">'+(i===list.length-1?'Ver resultado':'Siguiente →')+'</button></div></div>';
    const opsEl = view.querySelectorAll('.opt');
    function paint(){
      if (a === null || a === undefined) return;
      if (opts.practice){
        opsEl.forEach((b,k) => { b.disabled = true; if (k === q.a) b.classList.add('ok'); else if (k === a) b.classList.add('ko'); });
        const ok = a === q.a;
        document.getElementById('fb').innerHTML = '<div class="expl '+(ok?'ok':'ko')+'"><b>'+(ok?'✔ Correcto.':'✘ Incorrecto. La respuesta es '+letter(q.a)+'.')+'</b> '+inline(q.e)+
          (t?' <a href="#" id="goT">Ver teoría de '+q.t+'</a>':'')+'</div>';
        const g = document.getElementById('goT'); if (g) g.onclick = ev => { ev.preventDefault(); openTopic(q.t); };
      } else {
        opsEl.forEach((b,k) => { b.style.borderColor = k === a ? 'var(--indigo)' : ''; b.querySelector('.l').style.background = k === a ? 'var(--indigo)' : ''; b.querySelector('.l').style.color = k === a ? '#fff' : ''; });
      }
    }
    opsEl.forEach(b => b.onclick = () => {
      if (opts.practice && answers[i] !== null) return;
      const k = +b.dataset.k; answers[i] = k;
      if (opts.practice) record(q, k === q.a);
      show();
    });
    paint();
    document.getElementById('starB').onclick = () => { S.star[q.id] = !S.star[q.id]; if (!S.star[q.id]) delete S.star[q.id]; save(); show(); };
    document.getElementById('pv').onclick = () => { if (i > 0){ i--; show(); } };
    document.getElementById('nx').onclick = () => { if (i < list.length - 1){ i++; show(); window.scrollTo(0,0); } else finish(); };
    document.getElementById('end').onclick = finish;
    const bl = document.getElementById('blank'); if (bl) bl.onclick = () => { answers[i] = null; if (i < list.length - 1){ i++; show(); } else finish(); };
  }
  function finish(){
    if (!opts.practice) list.forEach((q,k) => { if (answers[k] !== null) record(q, answers[k] === q.a); });
    const ok = list.filter((q,k) => answers[k] === q.a).length;
    const ko = list.filter((q,k) => answers[k] !== null && answers[k] !== q.a).length;
    const blank = list.length - ok - ko;
    const net = ok - ko/3; const nota = Math.max(0, 50 * net / list.length);
    const wrong = list.map((q,k) => ({q, a:answers[k]})).filter(x => x.a !== null && x.a !== x.q.a);
    view.innerHTML = '<h2 class="view">Resultado · '+esc(opts.title)+'</h2>' +
      '<div class="grid"><div class="stat"><span class="muted">Aciertos</span><b style="color:var(--ok)">'+ok+'</b></div><div class="stat"><span class="muted">Errores</span><b style="color:var(--ko)">'+ko+'</b></div><div class="stat"><span class="muted">En blanco</span><b>'+blank+'</b></div>' +
      '<div class="stat"><span class="muted">Nota (sobre 50, −1/3 por error)</span><b>'+nota.toFixed(2)+'</b><span class="muted">'+(nota>=25?'✔ Superaría el mínimo de 25':'✘ Por debajo del mínimo de 25')+'</span></div></div>' +
      '<div class="row" style="margin:14px 0"><button class="btn primary" id="again">Nuevo test</button>'+(wrong.length?'<button class="btn" id="redo">Repetir solo los fallos</button>':'')+'</div>' +
      (wrong.length?'<h3>Revisión de fallos</h3>'+wrong.map(x => '<div class="review-item"><div class="muted" style="font-size:13px">'+x.q.t+'</div><b>'+inline(x.q.q)+'</b><div>Tu respuesta: <span style="color:var(--ko)">'+inline(x.q.o[x.a])+'</span></div><div>Correcta: <span style="color:var(--ok)">'+inline(x.q.o[x.q.a])+'</span></div><div class="muted">'+inline(x.q.e)+'</div></div>').join(''):'');
    document.getElementById('again').onclick = () => setTab('test');
    const r = document.getElementById('redo'); if (r) r.onclick = () => startQuiz(wrong.map(x => x.q), {title:'Repetir fallos', practice:true});
  }
  currentView = 'test';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'test'));
  show();
}

/* ---------- console ---------- */
const PROMPTS = {git:'teresa@pc:~/proyecto$ '};
function norm(s){ return s.trim().replace(/\s+/g,' ').toLowerCase(); }
function checkEx(x, input){ const n = norm(input), raw = input.trim().replace(/\s+/g,' '); return x.r.every(p => { try { return p.startsWith('(?c)') ? new RegExp(p.slice(4)).test(raw) : new RegExp(p, 'i').test(n); } catch(e){ return false; } }); }
function renderConsoleSetup(){
  const done = EX.filter((x,k) => S.ex[k]).length;
  view.innerHTML = '<h2 class="view">Consola de práctica</h2><p class="muted">Escribe el comando que pide cada ejercicio y pulsa <span class="kbd">Enter</span>. Admite alias y distinto orden de parámetros. Escribe <span class="kbd">pista</span>, <span class="kbd">solucion</span> o <span class="kbd">saltar</span>. Con <span class="kbd">↑</span> recuperas lo último que escribiste.</p>' +
  '<div class="card"><div class="row">' +
  '<label class="field">Curso<select id="cC"><option value="all">Todos</option>'+Object.keys(COURSES).map(c=>'<option value="'+c+'">'+COURSES[c]+'</option>').join('')+'</select></label>' +
  '<label class="field">Tipo de consola<select id="cM"><option value="all">Todas</option><option value="git">git</option></select></label>' +
  '<label class="field">Ejercicios<select id="cP"><option value="all">Todos</option><option value="pending">Solo pendientes</option></select></label>' +
  '<label class="field">Orden<select id="cO"><option value="seq">Por temario</option><option value="rnd">Aleatorio</option></select></label>' +
  '</div><p class="muted">Llevas '+done+' de '+EX.length+' ejercicios superados.</p><button class="btn primary" id="goC">Abrir consola</button></div>';
  document.getElementById('goC').onclick = () => {
    const c = document.getElementById('cC').value, m = document.getElementById('cM').value, p = document.getElementById('cP').value, o = document.getElementById('cO').value;
    let list = EX.filter((x,k) => (c === 'all' || x.t.startsWith(c + '-')) && (m === 'all' || x.m === m) && (p === 'all' || !S.ex[k]));
    if (o === 'rnd') list = shuffle(list.slice());
    if (!list.length) { toast('No hay ejercicios con esos filtros'); return; }
    startConsole(list, null);
  };
}
function startConsole(list, topicId){
  currentView = 'consola';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'consola'));
  let i = 0, tries = 0, hist = [], hpos = 0, okCount = 0;
  view.innerHTML = '<div class="qhead"><h2 class="view" style="margin:0">Consola'+(topicId?' · '+topicId:'')+'</h2><span class="pill" id="cnt"></span></div>' +
    '<div class="term" id="term"><div id="out"></div><div class="inrow"><span class="prompt" id="pr"></span><input id="cin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escribe el comando"></div></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="hint">Pista</button><button class="btn" id="sol">Ver solución</button><button class="btn" id="skip">Saltar</button><button class="btn ghost" id="back">Volver</button></div>';
  const out = document.getElementById('out'), cin = document.getElementById('cin'), term = document.getElementById('term');
  function ln(txt, cls){ const d = document.createElement('div'); d.className = 'ln ' + (cls||''); d.textContent = txt; out.appendChild(d); term.scrollTop = term.scrollHeight; }
  function task(){
    if (i >= list.length){ ln('— Fin. Has acertado ' + okCount + ' de ' + list.length + '. —', 'okc'); cin.disabled = true; document.getElementById('cnt').textContent = list.length + ' / ' + list.length; return; }
    const x = list[i]; tries = 0;
    document.getElementById('cnt').textContent = (i+1) + ' / ' + list.length;
    document.getElementById('pr').textContent = PROMPTS[x.m] || PROMPTS.git;
    ln('');
    ln('[' + x.t + ' · ' + 'git' + '] ' + x.p, 'task');
    cin.focus();
  }
  function hint(){ const x = list[i]; if (!x) return; const s = x.s; const first = s.split(/\s+/)[0]; ln('Pista: empieza por «' + first + '» y tiene ' + s.split(/\s+/).length + ' palabras.', 'dim'); }
  function solution(){ const x = list[i]; if (!x) return; ln('Solución: ' + x.s, 'sol'); }
  function next(){ i++; task(); }
  cin.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp'){ if (hist.length){ hpos = Math.max(0, hpos - 1); cin.value = hist[hpos]; } e.preventDefault(); return; }
    if (e.key === 'ArrowDown'){ if (hist.length){ hpos = Math.min(hist.length, hpos + 1); cin.value = hist[hpos] || ''; } e.preventDefault(); return; }
    if (e.key !== 'Enter') return;
    const v = cin.value; cin.value = ''; if (!v.trim()) return;
    hist.push(v); hpos = hist.length;
    const x = list[i]; ln((PROMPTS.git) + v);
    const c = norm(v);
    if (c === 'pista' || c === 'hint'){ hint(); return; }
    if (c === 'solucion' || c === 'solución'){ solution(); return; }
    if (c === 'saltar' || c === 'siguiente'){ solution(); next(); return; }
    if (c === 'cls' || c === 'clear' || c === 'clear-host'){ out.innerHTML = ''; task(); return; }
    if (!x) return;
    if (checkEx(x, v)){
      okCount++; const k = EX.indexOf(x); S.ex[k] = (S.ex[k]||0) + 1; save();
      ln('✔ Correcto' + (norm(x.s) !== c ? '  (forma de referencia: ' + x.s + ')' : ''), 'okc'); setTimeout(next, 450);
    } else {
      tries++;
      ln('✘ No es correcto. ' + (tries === 1 ? 'Revisa el nombre del comando y los parámetros.' : tries === 2 ? 'Escribe «pista» si lo necesitas.' : 'Escribe «solucion» para verla.'), 'koc');
    }
  });
  document.getElementById('hint').onclick = () => { hint(); cin.focus(); };
  document.getElementById('sol').onclick = () => { solution(); cin.focus(); };
  document.getElementById('skip').onclick = () => { solution(); next(); };
  document.getElementById('back').onclick = () => topicId ? openTopic(topicId) : setTab('consola');
  term.onclick = () => cin.focus();
  ln('Consola de práctica TAI. Comandos especiales: pista, solucion, saltar, cls.', 'dim');
  task();
}

function topicRanking(){
  const r = topics.map(t => { let ok = 0, ko = 0; (qByTopic[t.id]||[]).forEach(q => { const s = S.q[q.id]; if (s){ ok += s.ok; ko += s.ko; } }); return {t, ok, ko}; })
    .filter(x => x.ko > 0).sort((a,b) => (b.ko/(b.ok+b.ko)) - (a.ko/(a.ok+a.ko)) || b.ko - a.ko).slice(0, 12);
  if (!r.length) return '<div class="card empty">Aún no hay fallos registrados. Haz algún test.</div>';
  return '<div class="card">' + r.map(x => { const p = Math.round(100 * x.ok / (x.ok + x.ko)); return '<div class="row" style="justify-content:space-between;margin:8px 0"><button class="btn ghost" data-go="'+x.t.id+'" style="text-align:left">'+x.t.id+' · '+esc(x.t.title)+'</button><span class="muted">'+p+'% aciertos ('+x.ok+'/'+(x.ok+x.ko)+')</span></div><div class="bar"><i style="width:'+p+'%"></i></div>'; }).join('') + '</div>';
}

  view.innerHTML = '<h2 class="view">Progreso</h2><div class="grid"><div class="stat"><span class="muted">Preguntas respondidas</span><b>'+answered+' / '+QS.length+'</b></div><div class="stat"><span class="muted">Aciertos totales</span><b style="color:var(--ok)">'+ok+'</b></div><div class="stat"><span class="muted">Fallos totales</span><b style="color:var(--ko)">'+ko+'</b></div><div class="stat"><span class="muted">Ejercicios de consola superados</span><b>'+exDone+' / '+EX.length+'</b></div></div>' + per +
    '<div class="card"><h3 style="margin-top:0">Copia de seguridad del progreso</h3><p class="muted">El progreso vive en este navegador. Exporta un fichero para pasarlo a otro equipo.</p><div class="row"><button class="btn" id="exp">Exportar progreso</button><label class="btn">Importar progreso<input type="file" id="imp" accept="application/json" class="hidden"></label><button class="btn" id="rst" style="color:var(--ko)">Borrar todo el progreso</button></div></div>';
  document.getElementById('exp').onclick = () => { const b = new Blob([JSON.stringify(S)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'progreso-tai-windows-redes.json'; a.click(); };
  document.getElementById('imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { S = Object.assign({read:{},q:{},star:{},ex:{}}, JSON.parse(t)); save(); toast('Progreso importado'); renderTree(); renderProgress(); } catch(err){ toast('Fichero no válido'); } }); };
  document.getElementById('rst').onclick = () => { if (confirm('¿Seguro que quieres borrar todo el progreso?')) { S = {read:{}, q:{}, star:{}, ex:{}, last:null, theme:S.theme}; save(); renderTree(); renderProgress(); } };
}

/* ================= init ================= */
renderTree();
setTab('teoria');
})();
</script>
</body>
</html>
