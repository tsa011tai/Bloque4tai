, "Borra app.py", "Saca app.py del área de preparación"], "a": 1, "e": "Equivale al antiguo git checkout -- app.py."}, {"id": 352, "t": "GIT-5.1", "q": "¿Qué hace git restore --staged app.py?", "o": ["Descarta los cambios del fichero", "Hace commit de app.py", "Borra app.py del historial", "Saca app.py del área de preparación sin tocar los cambios del fichero"], "a": 3, "e": "Equivale a git reset HEAD app.py."}, {"id": 353, "t": "GIT-5.1", "q": "¿Qué hace git restore --source=HEAD~2 app.py?", "o": ["Muestra app.py de hace dos commits sin cambiarlo", "Recupera app.py tal como estaba hace dos commits", "Mueve HEAD dos commits atrás", "Borra los dos últimos commits"], "a": 1, "e": "--source indica desde dónde."}, {"id": 354, "t": "GIT-5.1", "q": "¿Qué comando antiguo equivale a git restore app.py?", "o": ["git checkout -- app.py", "git reset --hard app.py", "git revert app.py", "git rm app.py"], "a": 0, "e": "checkout hacía demasiadas cosas."}, {"id": 355, "t": "GIT-5.1", "q": "¿Cuál es el modo por defecto de git reset?", "o": ["--hard", "--keep", "--soft", "--mixed"], "a": 3, "e": "Trampa clásica."}, {"id": 356, "t": "GIT-5.1", "q": "¿Qué hace git reset --soft HEAD~1?", "o": ["Crea un commit inverso", "Deshace el último commit y deja sus cambios preparados", "Deshace el commit y borra los cambios", "Deshace el commit y deja los cambios sin preparar"], "a": 1, "e": "Solo mueve la rama."}, {"id": 357, "t": "GIT-5.1", "q": "¿Qué hace git reset HEAD~1 (sin modo)?", "o": ["Borra los cambios", "Deshace el commit y deja los cambios preparados", "No hace nada", "Deshace el último commit y deja los cambios en los ficheros sin preparar"], "a": 3, "e": "--mixed: vacía el staging."}, {"id": 358, "t": "GIT-5.1", "q": "¿Qué hace git reset --hard HEAD~1?", "o": ["Deshace el último commit y borra sus cambios del área de preparación y de los ficheros", "Crea un commit que deshace el anterior", "Solo cambia el mensaje", "Deshace el commit y deja los cambios preparados"], "a": 0, "e": "Destructivo."}, {"id": 359, "t": "GIT-5.1", "q": "¿Qué modo de reset NO toca ni el área de preparación ni los ficheros?", "o": ["--mixed", "Ninguno", "--hard", "--soft"], "a": 3, "e": "Solo mueve la rama."}, {"id": 360, "t": "GIT-5.1", "q": "¿Qué modo de reset borra los cambios de los ficheros controlados?", "o": ["--hard", "--keep siempre", "--mixed", "--soft"], "a": 0, "e": "Cuidado."}, {"id": 361, "t": "GIT-5.1", "q": "¿Qué hace git revert a1b2c3d?", "o": ["Borra el commit a1b2c3d de la historia", "Crea un commit nuevo que deshace los cambios de a1b2c3d", "Restaura un fichero", "Mueve la rama a a1b2c3d"], "a": 1, "e": "No reescribe la historia."}, {"id": 362, "t": "GIT-5.1", "q": "¿Qué comando es seguro para deshacer un commit ya compartido?", "o": ["git commit --amend", "git reset --hard", "git rebase -i", "git revert"], "a": 3, "e": "Los demás reescriben la historia."}, {"id": 363, "t": "GIT-5.1", "q": "¿Borra git revert el commit original?", "o": ["Sí, y también el remoto", "Solo si está fusionado", "No, añade un commit nuevo que hace lo contrario", "Sí, lo elimina"], "a": 2, "e": "Ambos quedan en la historia."}, {"id": 364, "t": "GIT-5.1", "q": "¿Qué hace git revert HEAD~3?", "o": ["Deshace todos los commits desde HEAD~3", "Deshace los tres últimos commits", "Deshace solo el commit HEAD~3", "Mueve HEAD tres commits atrás"], "a": 2, "e": "Un solo commit."}, {"id": 365, "t": "GIT-5.1", "q": "¿Qué opción necesita git revert para revertir un commit de fusión?", "o": ["-a", "--force", "-m 1 (indicar qué padre se conserva)", "--merge"], "a": 2, "e": "El commit de fusión tiene dos padres."}, {"id": 366, "t": "GIT-5.1", "q": "¿Qué hace git revert -n a1b2c3d?", "o": ["Revierte en el remoto", "Aplica la inversión sin hacer commit todavía", "Revierte sin cambiar nada", "Revierte n commits"], "a": 1, "e": "-n = --no-commit."}, {"id": 367, "t": "GIT-5.1", "q": "¿Qué hace git reset app.py (con una ruta)?", "o": ["Borra app.py", "Saca app.py del área de preparación sin mover la rama", "Mueve la rama al commit anterior", "Descarta los cambios de app.py"], "a": 1, "e": "Igual que git restore --staged app.py."}, {"id": 368, "t": "GIT-5.1", "q": "¿Qué hace git reset --hard origin/main?", "o": ["Deja tu rama exactamente como la tiene el servidor, tirando lo local", "Fusiona origin/main", "Sube tu rama al servidor", "Borra origin/main"], "a": 0, "e": "Destructivo para lo local."}, {"id": 369, "t": "GIT-5.1", "q": "Quieres juntar tus 3 últimos commits locales en uno. ¿Qué secuencia sirve?", "o": ["git revert HEAD~3", "git reset --hard HEAD~3 y luego git commit", "git merge --squash HEAD~3", "git reset --soft HEAD~3 y luego git commit"], "a": 3, "e": "--soft deja los cambios preparados."}, {"id": 370, "t": "GIT-5.1", "q": "Has hecho un commit con un mensaje erróneo y NO lo has subido. ¿Qué es lo más sencillo?", "o": ["git reset --hard", "git commit --amend", "Borrar .git", "git revert HEAD"], "a": 1, "e": "Rehace el último commit."}, {"id": 371, "t": "GIT-5.1", "q": "¿Se pueden recuperar con Git los cambios que nunca llegaron a commit tras un reset --hard?", "o": ["Sí, con git reflog", "No", "Sí, con git fetch", "Sí, con git revert"], "a": 1, "e": "El reflog recupera commits, no cambios sin guardar."}, {"id": 372, "t": "GIT-5.1", "q": "¿Qué variable guarda Git con la posición anterior de la rama antes de un reset?", "o": ["OLD_HEAD", "PREV_HEAD", "ORIG_HEAD", "LAST_HEAD"], "a": 2, "e": "Permite git reset --hard ORIG_HEAD."}, {"id": 373, "t": "GIT-5.1", "q": "¿Qué hace git restore --staged --worktree app.py?", "o": ["Borra app.py", "Solo descarta los cambios del fichero", "Deja app.py como en el último commit, tanto en el área de preparación como en el fichero", "Solo saca del staging"], "a": 2, "e": "Ambos desde HEAD."}, {"id": 374, "t": "GIT-5.1", "q": "¿Qué hace git restore .?", "o": ["Descarta todos los cambios sin preparar del directorio actual y subcarpetas", "Restaura el último commit en el remoto", "Saca todo del staging", "Borra los ficheros sin seguimiento"], "a": 0, "e": "No toca los ficheros untracked."}, {"id": 375, "t": "GIT-5.1", "q": "¿Qué comando antiguo equivale a git restore --staged app.py?", "o": ["git checkout HEAD", "git rm --cached app.py siempre", "git revert app.py", "git reset HEAD app.py"], "a": 3, "e": "Saca del índice."}, {"id": 376, "t": "GIT-5.1", "q": "Metáfora: ¿qué comando es \"arrancar páginas\" del cuaderno?", "o": ["git stash", "git revert", "git reset", "git restore"], "a": 2, "e": "revert es escribir una página que anula otra."}, {"id": 377, "t": "GIT-5.1", "q": "¿Qué comando reescribe la historia?", "o": ["git status", "git revert", "git fetch", "git reset (moviendo la rama atrás)"], "a": 3, "e": "Por eso no se usa en ramas compartidas."}, {"id": 378, "t": "GIT-5.1", "q": "¿Qué hace git revert --no-edit HEAD?", "o": ["Revierte el último commit sin abrir el editor para el mensaje", "No hace nada", "Revierte sin hacer commit", "Revierte el mensaje"], "a": 0, "e": "Usa el mensaje propuesto."}, {"id": 379, "t": "GIT-5.1", "q": "¿Qué hace git reset --hard sin indicar commit?", "o": ["No hace nada", "Descarta todos los cambios de los ficheros controlados y del staging, volviendo a HEAD", "Borra los ficheros sin seguimiento", "Borra el último commit"], "a": 1, "e": "El commit por defecto es HEAD."}, {"id": 380, "t": "GIT-5.1", "q": "¿Qué deshace git restore --staged?", "o": ["Un git push", "Un git add", "Un git commit", "Un git merge"], "a": 1, "e": "Es lo contrario de add."}, {"id": 381, "t": "GIT-5.2", "q": "¿Qué hace git stash?", "o": ["Guarda los cambios en curso en una pila aparte y deja el directorio limpio", "Borra los cambios", "Crea una rama nueva", "Hace commit temporal en el remoto"], "a": 0, "e": "Para atender otra cosa y volver."}, {"id": 382, "t": "GIT-5.2", "q": "¿Qué hace git stash pop?", "o": ["Aplica el último stash y lo quita de la lista", "Muestra el último stash", "Aplica el último stash y lo deja en la lista", "Borra el último stash sin aplicarlo"], "a": 0, "e": "apply lo deja."}, {"id": 383, "t": "GIT-5.2", "q": "¿Qué hace git stash apply?", "o": ["Aplica un stash sin quitarlo de la lista", "Borra todos los stash", "Guarda un stash nuevo", "Aplica y borra el stash"], "a": 0, "e": "Útil para aplicarlo en varias ramas."}, {"id": 384, "t": "GIT-5.2", "q": "¿Qué muestra git stash list?", "o": ["La lista de cambios guardados (stash@{0}, stash@{1}…)", "Las ramas", "Los commits", "Los ficheros ignorados"], "a": 0, "e": "stash@{0} es el más reciente."}, {"id": 385, "t": "GIT-5.2", "q": "¿Qué hace git stash drop stash@{1}?", "o": ["Lo sube al remoto", "Borra ese stash", "Lo aplica", "Lo convierte en rama"], "a": 1, "e": "drop = tirar."}, {"id": 386, "t": "GIT-5.2", "q": "¿Qué hace git stash clear?", "o": ["Aplica todos los stash", "Borra el último stash", "Borra todos los stash", "Limpia el directorio de trabajo"], "a": 2, "e": "Pueden no ser recuperables."}, {"id": 387, "t": "GIT-5.2", "q": "¿Guarda git stash los ficheros nuevos sin seguimiento por defecto?", "o": ["No, hace falta -u (--include-untracked)", "Sí, siempre", "Solo si están en .gitignore", "Solo los de texto"], "a": 0, "e": "Trampa típica."}, {"id": 388, "t": "GIT-5.2", "q": "¿Qué guarda git stash -a?", "o": ["Todos los commits", "Solo los ficheros preparados", "Todas las ramas", "También los ficheros sin seguimiento y los ignorados"], "a": 3, "e": "-a = --all."}, {"id": 389, "t": "GIT-5.2", "q": "¿Qué pasa si git stash pop provoca un conflicto?", "o": ["El stash no se borra; resuelves el conflicto y lo quitas con git stash drop", "El stash se borra igualmente", "Se pierden los cambios", "Se crea una rama nueva automáticamente"], "a": 0, "e": "Por seguridad se conserva."}, {"id": 390, "t": "GIT-5.2", "q": "¿Cuál es la forma recomendada de guardar un stash con descripción?", "o": ["git stash push -m \"descripción\"", "git stash save \"descripción\"", "git stash -d \"descripción\"", "git stash --name \"descripción\""], "a": 0, "e": "save está obsoleto."}, {"id": 391, "t": "GIT-5.2", "q": "¿Qué hace git stash branch nueva-rama?", "o": ["Fusiona el stash en main", "Borra la rama", "Guarda la rama en el stash", "Crea una rama desde el commit donde se hizo el stash y lo aplica allí"], "a": 3, "e": "Evita conflictos."}, {"id": 392, "t": "GIT-5.2", "q": "¿Qué hace git stash show -p stash@{1}?", "o": ["Muestra el contenido de ese stash como parche", "Lo aplica", "Lo borra", "Lo renombra"], "a": 0, "e": "-p = patch."}, {"id": 393, "t": "GIT-5.2", "q": "¿Qué hace git cherry-pick a1b2c3d?", "o": ["Fusiona toda la rama del commit", "Copia ese commit a la rama actual como un commit nuevo", "Mueve el commit y lo borra de su rama", "Revierte el commit"], "a": 1, "e": "Otro hash."}, {"id": 394, "t": "GIT-5.2", "q": "¿Qué hace git cherry-pick -x a1b2c3d?", "o": ["Añade al mensaje una línea \"(cherry picked from commit …)\"", "Lo aplica en todas las ramas", "Excluye el commit", "Lo aplica sin commit"], "a": 0, "e": "Trazabilidad."}, {"id": 395, "t": "GIT-5.2", "q": "¿Qué hace git cherry-pick -n a1b2c3d?", "o": ["Crea una rama nueva", "Aplica los cambios sin hacer commit", "Aplica n commits", "No aplica nada"], "a": 1, "e": "-n = --no-commit."}, {"id": 396, "t": "GIT-5.2", "q": "Tras resolver un conflicto en cherry-pick, ¿qué comando sigue?", "o": ["git cherry-pick --continue", "git cherry-pick --next", "git commit --cherry", "git merge --continue"], "a": 0, "e": "También --abort o --skip."}, {"id": 397, "t": "GIT-5.2", "q": "¿Para qué es típico usar cherry-pick?", "o": ["Clonar un repositorio", "Crear etiquetas", "Borrar commits", "Llevar un arreglo concreto de una rama a otra sin fusionar todo"], "a": 3, "e": "Por ejemplo, un fix a una rama de versión."}, {"id": 398, "t": "GIT-5.2", "q": "¿Qué registra git reflog?", "o": ["Los mensajes de error de Git", "Cada movimiento de HEAD: commits, resets, cambios de rama…", "Solo los push", "Los accesos al servidor"], "a": 1, "e": "La caja negra."}, {"id": 399, "t": "GIT-5.2", "q": "Has hecho git reset --hard y has perdido commits. ¿Qué comando te ayuda a recuperarlos?", "o": ["git fetch", "git stash", "git revert", "git reflog"], "a": 3, "e": "Busca el hash y crea una rama o resetea."}, {"id": 400, "t": "GIT-5.2", "q": "¿Se sube el reflog al servidor con git push?", "o": ["No, es local", "Solo en GitHub", "Sí, siempre", "Solo con --tags"], "a": 0, "e": "Tampoco se clona."}, {"id": 401, "t": "GIT-5.2", "q": "¿Cuánto tiempo se conservan por defecto las entradas del reflog alcanzables?", "o": ["7 días", "Para siempre", "90 días", "1 año"], "a": 2, "e": "30 días las inalcanzables."}, {"id": 402, "t": "GIT-5.2", "q": "Has borrado por error con -D la rama informe. Su último commit era 9f8e7d6. ¿Cómo la recuperas?", "o": ["git fetch informe", "git stash pop informe", "git branch informe 9f8e7d6", "git revert informe"], "a": 2, "e": "El hash lo encuentras en el reflog."}, {"id": 403, "t": "GIT-5.2", "q": "¿Qué significa HEAD@{1} en el reflog?", "o": ["El primer commit del repositorio", "La rama número 1", "Dónde estaba HEAD un movimiento antes", "El commit padre de HEAD"], "a": 2, "e": "No confundir con HEAD~1."}, {"id": 404, "t": "GIT-5.2", "q": "Te llaman con una urgencia a mitad de un cambio que no quieres commitear. ¿Qué usas?", "o": ["git stash", "git reset --hard", "git revert", "git clean -fd"], "a": 0, "e": "Luego git stash pop."}, {"id": 405, "t": "GIT-5.2", "q": "¿Qué hace git stash sin subcomando?", "o": ["Lo mismo que git stash list", "Nada", "Lo mismo que git stash pop", "Lo mismo que git stash push"], "a": 3, "e": "push es el subcomando por defecto."}, {"id": 406, "t": "GIT-5.2", "q": "¿Mueve cherry-pick el commit original?", "o": ["Sí, lo quita de su rama", "Lo convierte en etiqueta", "No, crea una copia; el original sigue en su rama", "Lo borra del historial"], "a": 2, "e": "Copia con otro hash."}, {"id": 407, "t": "GIT-5.2", "q": "¿Qué significa \"stash\"?", "o": ["Pila de commits", "Rama temporal remota", "Alijo o escondite", "Etiqueta"], "a": 2, "e": "Guardar en el cajón."}, {"id": 408, "t": "GIT-5.2", "q": "¿Qué significa \"reflog\"?", "o": ["Registro de errores", "Log remoto", "Lista de reflexiones", "Registro de referencias (reference log)"], "a": 3, "e": "reference log."}, {"id": 409, "t": "GIT-5.3", "q": "¿Qué es una etiqueta (tag) en Git?", "o": ["Una rama que avanza con cada commit", "Un comentario en un fichero", "Un nombre fijo que apunta a un commit, normalmente una versión", "Un tipo de remoto"], "a": 2, "e": "No se mueve."}, {"id": 410, "t": "GIT-5.3", "q": "¿Qué diferencia hay entre una rama y una etiqueta?", "o": ["Ninguna", "La rama avanza con los commits; la etiqueta se queda fija", "La etiqueta avanza y la rama no", "La rama es remota y la etiqueta local"], "a": 1, "e": "Marcapáginas frente a subrayado."}, {"id": 411, "t": "GIT-5.3", "q": "¿Qué comando crea una etiqueta ligera v1.0?", "o": ["git tag v1.0", "git branch v1.0 --tag", "git tag -a v1.0", "git tag -l v1.0"], "a": 0, "e": "Solo un nombre."}, {"id": 412, "t": "GIT-5.3", "q": "¿Qué comando crea una etiqueta anotada v1.0?", "o": ["git tag v1.0 -light", "git tag -d v1.0", "git tag -a v1.0 -m \"Versión 1.0\"", "git tag --simple v1.0"], "a": 2, "e": "-a = annotated."}, {"id": 413, "t": "GIT-5.3", "q": "¿Qué guarda una etiqueta anotada que no guarda una ligera?", "o": ["La rama", "Autor, fecha, mensaje y opcionalmente firma", "El código fuente", "La URL del remoto"], "a": 1, "e": "Es un objeto completo."}, {"id": 414, "t": "GIT-5.3", "q": "¿Qué tipo de etiqueta se recomienda para versiones publicadas?", "o": ["Ligera", "Anotada", "Ninguna", "Cualquiera"], "a": 1, "e": "Y mejor firmada."}, {"id": 415, "t": "GIT-5.3", "q": "¿Qué opción crea una etiqueta firmada?", "o": ["-S", "-s", "-f", "-g"], "a": 1, "e": "git tag -s v1.0 -m \"…\"."}, {"id": 416, "t": "GIT-5.3", "q": "¿Qué comando lista las etiquetas que empiezan por v1.?", "o": ["git log --tags v1", "git tag --find v1", "git tag v1.*", "git tag -l \"v1.*\""], "a": 3, "e": "-l = list."}, {"id": 417, "t": "GIT-5.3", "q": "¿Qué comando sube la etiqueta v1.0 al remoto?", "o": ["git tag --push v1.0", "git push origin v1.0", "git push --tag-only", "git push v1.0 origin"], "a": 1, "e": "git push no las sube por defecto."}, {"id": 418, "t": "GIT-5.3", "q": "¿Qué comando sube todas las etiquetas?", "o": ["git push -t", "git tag --push-all", "git push --all", "git push --tags"], "a": 3, "e": "--all sube ramas, no etiquetas."}, {"id": 419, "t": "GIT-5.3", "q": "¿Qué hace git push --follow-tags?", "o": ["Solo sube etiquetas", "Sube los commits y las etiquetas anotadas que apuntan a ellos", "Borra etiquetas remotas", "Sube todas las etiquetas, también las ligeras"], "a": 1, "e": "Solo anotadas alcanzables."}, {"id": 420, "t": "GIT-5.3", "q": "¿Qué hace git tag -d v1.0?", "o": ["Borra la etiqueta local v1.0", "Borra la etiqueta en el remoto", "Muestra la etiqueta", "Borra el commit etiquetado"], "a": 0, "e": "En el remoto sigue."}, {"id": 421, "t": "GIT-5.3", "q": "¿Cómo se borra la etiqueta v1.0 en el remoto?", "o": ["git remote delete v1.0", "git push --tags --delete", "git push origin --delete v1.0", "git tag -d v1.0"], "a": 2, "e": "tag -d solo borra la local."}, {"id": 422, "t": "GIT-5.3", "q": "¿Qué comando etiqueta un commit anterior concreto?", "o": ["git tag -a v0.9 a1b2c3d -m \"Beta\"", "git tag a1b2c3d v0.9 --old", "git commit --tag v0.9 a1b2c3d", "git tag v0.9 --commit"], "a": 0, "e": "Se indica el hash tras el nombre."}, {"id": 423, "t": "GIT-5.3", "q": "¿Qué muestra git show v1.0?", "o": ["Solo el nombre de la etiqueta", "Todas las etiquetas", "Las ramas que contienen v1.0", "Los datos de la etiqueta y del commit al que apunta"], "a": 3, "e": "Incluye el mensaje si es anotada."}, {"id": 424, "t": "GIT-5.3", "q": "¿Qué significa la salida v1.0-4-g9f8e7d6 de git describe?", "o": ["Hay 4 etiquetas", "Estás 4 commits después de la etiqueta v1.0, en el commit 9f8e7d6", "Es la versión 1.0.4", "Hay 4 conflictos"], "a": 1, "e": "La g indica git."}, {"id": 425, "t": "GIT-5.3", "q": "¿Qué pasa si sacas una etiqueta con git switch --detach v1.0?", "o": ["Se mueve la etiqueta", "Quedas en detached HEAD en el commit de esa versión", "Se crea una rama v1.0", "Se borra la etiqueta"], "a": 1, "e": "Para ver el código de esa versión."}, {"id": 426, "t": "GIT-5.3", "q": "¿Qué comando crea una rama a partir de la versión 1.0?", "o": ["git branch v1.0 arreglo-v1 --from", "git checkout v1.0 arreglo-v1", "git tag -b arreglo-v1 v1.0", "git switch -c arreglo-v1 v1.0"], "a": 3, "e": "Punto de partida = etiqueta."}, {"id": 427, "t": "GIT-5.3", "q": "Has publicado v1.0 con un error. ¿Qué es lo correcto?", "o": ["Mover la etiqueta v1.0 al nuevo commit", "Publicar una nueva versión (por ejemplo v1.0.1), sin mover v1.0", "Hacer git reset en el remoto", "Borrar el repositorio"], "a": 1, "e": "Quien descargó v1.0 tendría la antigua."}, {"id": 428, "t": "GIT-5.3", "q": "¿Qué es una \"release\" en GitHub o GitLab?", "o": ["Una página de versión basada en una etiqueta, con notas y ficheros descargables", "Un fork oficial", "Un commit firmado", "Una rama de pruebas"], "a": 0, "e": "Se construye sobre un tag."}, {"id": 429, "t": "GIT-5.3", "q": "¿Qué comando lista todas las etiquetas?", "o": ["git branch -t", "git show --tags-only", "git tags --all", "git tag"], "a": 3, "e": "Sin argumentos lista."}, {"id": 430, "t": "GIT-5.3", "q": "¿Qué significa -a en git tag -a?", "o": ["all", "auto", "add", "annotated (anotada)"], "a": 3, "e": "Etiqueta anotada."}, {"id": 431, "t": "GIT-5.3", "q": "¿Qué hace git tag v1.0 si estás en el commit 9f8e7d6?", "o": ["Crea una etiqueta ligera v1.0 en 9f8e7d6", "Crea una etiqueta anotada", "Crea una rama v1.0", "Sube la etiqueta"], "a": 0, "e": "Por defecto en HEAD."}, {"id": 432, "t": "GIT-5.3", "q": "¿Qué comando verifica la firma de una etiqueta?", "o": ["git log --tag-signature", "git show --verify v1.0", "git verify-tag v1.0", "git tag --check v1.0"], "a": 2, "e": "verify-commit para commits."}, {"id": 433, "t": "GIT-5.3", "q": "¿Se puede firmar una etiqueta ligera?", "o": ["No, solo las anotadas", "Solo con SSH", "Solo en GitHub", "Sí, con -s"], "a": 0, "e": "La firma va en el objeto tag."}, {"id": 434, "t": "GIT-5.3", "q": "¿Qué etiqueta encuentra git describe por defecto?", "o": ["Cualquier rama", "La primera etiqueta del repositorio", "La última etiqueta ligera", "La etiqueta anotada más cercana"], "a": 3, "e": "--tags incluye las ligeras."}, {"id": 435, "t": "GIT-6.1", "q": "¿Para qué sirve git bisect?", "o": ["Para fusionar dos ramas por la mitad", "Para encontrar qué commit introdujo un error mediante búsqueda binaria", "Para dividir un repositorio en dos", "Para partir un commit en dos"], "a": 1, "e": "Parte el historial por la mitad sucesivamente."}, {"id": 436, "t": "GIT-6.1", "q": "¿Qué comando inicia una búsqueda con bisect?", "o": ["git bisect begin", "git bisect run", "git bisect start", "git bisect init"], "a": 2, "e": "Luego bad y good."}, {"id": 437, "t": "GIT-6.1", "q": "En bisect, ¿qué comando marca el commit actual como erróneo?", "o": ["git bisect error", "git bisect fail", "git bisect bad", "git bisect wrong"], "a": 2, "e": "good = funciona."}, {"id": 438, "t": "GIT-6.1", "q": "En bisect, ¿qué hace git bisect good v1.2?", "o": ["Etiqueta v1.2 como buena versión publicada", "Indica que en v1.2 el programa funcionaba bien", "Vuelve a v1.2", "Termina la búsqueda"], "a": 1, "e": "Marca el límite bueno."}, {"id": 439, "t": "GIT-6.1", "q": "¿Qué comando termina la búsqueda de bisect y te devuelve a donde estabas?", "o": ["git bisect quit", "git bisect stop", "git bisect reset", "git bisect end"], "a": 2, "e": "No olvidarlo."}, {"id": 440, "t": "GIT-6.1", "q": "¿Qué hace git bisect run ./pruebas.sh?", "o": ["Ejecuta el script en todos los commits a la vez", "Automatiza la búsqueda usando el resultado del script en cada paso", "Ejecuta el script al final", "Sube el script"], "a": 1, "e": "0 = bueno, otro valor = malo, 125 = saltar."}, {"id": 441, "t": "GIT-6.1", "q": "En git bisect run, ¿qué código de salida indica que el commit es bueno?", "o": ["255", "1", "0", "125"], "a": 2, "e": "125 = saltar el commit."}, {"id": 442, "t": "GIT-6.1", "q": "Con unos 1000 commits, ¿cuántos pasos necesita aproximadamente bisect?", "o": ["1000", "Unos 10", "Unos 500", "2"], "a": 1, "e": "Búsqueda binaria: log2(1000) ≈ 10."}, {"id": 443, "t": "GIT-6.1", "q": "¿Para qué sirve git worktree?", "o": ["Para clonar en varias carpetas con historiales distintos", "Para tener varias ramas sacadas a la vez en carpetas distintas del mismo repositorio", "Para comprimir el repositorio", "Para ver el árbol de commits"], "a": 1, "e": "Sin clonar otra vez."}, {"id": 444, "t": "GIT-6.1", "q": "¿Qué hace git worktree add ../app-hotfix hotfix/1.2.1?", "o": ["Saca la rama hotfix/1.2.1 en la carpeta ../app-hotfix", "Crea un fork", "Borra la carpeta", "Fusiona hotfix en la carpeta actual"], "a": 0, "e": "Otro árbol de trabajo."}, {"id": 445, "t": "GIT-6.1", "q": "¿Qué es un submódulo de Git?", "o": ["Un fichero grande", "Una carpeta ignorada", "Una rama secundaria", "Otro repositorio incluido dentro del tuyo, fijado en un commit concreto"], "a": 3, "e": "Se registra en .gitmodules."}, {"id": 446, "t": "GIT-6.1", "q": "¿Qué fichero registra los submódulos?", "o": [".gitattributes", ".gitmodules", ".gitsubmodules", ".git/config solamente"], "a": 1, "e": "Se crea con git submodule add."}, {"id": 447, "t": "GIT-6.1", "q": "¿Qué pasa si clonas un repositorio con submódulos sin --recurse-submodules?", "o": ["Se descargan igualmente", "Da error", "Se borran del repositorio", "Las carpetas de los submódulos quedan vacías"], "a": 3, "e": "Se arregla con git submodule update --init --recursive."}, {"id": 448, "t": "GIT-6.1", "q": "¿Qué comando descarga los submódulos si ya clonaste sin ellos?", "o": ["git submodule clone", "git pull --submodules", "git submodule update --init --recursive", "git fetch --sub"], "a": 2, "e": "Inicializa y actualiza."}, {"id": 449, "t": "GIT-6.1", "q": "¿Qué guarda el repositorio principal sobre un submódulo?", "o": ["Solo su URL", "El commit exacto del submódulo", "Una copia de todos sus ficheros", "Siempre la última versión de su rama"], "a": 1, "e": "Por eso hay que actualizarlo explícitamente."}, {"id": 450, "t": "GIT-6.1", "q": "¿Qué significa LFS en Git LFS?", "o": ["Linked File Sync", "Light Fast Storage", "Local File System", "Large File Storage"], "a": 3, "e": "Almacenamiento de ficheros grandes."}, {"id": 451, "t": "GIT-6.1", "q": "¿Viene Git LFS incluido en Git?", "o": ["Solo en Git 3.0", "Sí, desde Git 2.0", "Sí, solo en Linux", "No, es una extensión que hay que instalar"], "a": 3, "e": "El servidor también debe admitirla."}, {"id": 452, "t": "GIT-6.1", "q": "¿Qué hace git lfs track \"*.iso\"?", "o": ["Ignora los .iso", "Sube los .iso a GitHub", "Borra los .iso", "Indica que los .iso se gestionen con LFS (lo apunta en .gitattributes)"], "a": 3, "e": "Hay que añadir .gitattributes."}, {"id": 453, "t": "GIT-6.1", "q": "Con Git LFS, ¿qué se guarda en el repositorio normal?", "o": ["Un puntero pequeño al fichero real", "El fichero completo comprimido", "Nada", "Un enlace simbólico del sistema"], "a": 0, "e": "El fichero va a un almacén LFS."}, {"id": 454, "t": "GIT-6.1", "q": "¿Qué hace git clone --depth 1?", "o": ["Clona solo la rama main con todo su historial", "Clona sin ficheros", "Clona solo el último commit, sin historial (clon superficial)", "Clona solo una carpeta"], "a": 2, "e": "Shallow clone."}, {"id": 455, "t": "GIT-6.1", "q": "¿Qué hace git clone --filter=blob:none?", "o": ["Clona toda la historia de commits pero descarga el contenido de los ficheros cuando hace falta", "Clona sin historial", "Clona solo los ficheros binarios", "Clona sin ramas"], "a": 0, "e": "Clon parcial (blobless)."}, {"id": 456, "t": "GIT-6.1", "q": "¿Qué hace git sparse-checkout set docs src/api?", "o": ["Ignora esas carpetas", "Borra esas carpetas", "Saca al directorio de trabajo solo esas carpetas", "Clona solo esas carpetas desde el remoto"], "a": 2, "e": "Sparse = disperso."}, {"id": 457, "t": "GIT-6.1", "q": "¿Qué hace git gc?", "o": ["Recupera commits perdidos", "Borra ramas antiguas", "Compacta el repositorio y limpia objetos innecesarios", "Hace copia de seguridad"], "a": 2, "e": "gc = garbage collection."}, {"id": 458, "t": "GIT-6.1", "q": "¿Qué hace git fsck?", "o": ["Sincroniza con el remoto", "Comprueba la integridad del repositorio", "Formatea el repositorio", "Fuerza un commit"], "a": 1, "e": "File system check."}, {"id": 459, "t": "GIT-6.1", "q": "¿Qué hace git maintenance start?", "o": ["Para todas las tareas", "Inicia el servidor Git", "Pone el repositorio en solo lectura", "Programa tareas de mantenimiento del repositorio en segundo plano"], "a": 3, "e": "Optimizaciones periódicas."}, {"id": 460, "t": "GIT-6.1", "q": "¿Qué diferencia hay entre clon superficial y clon parcial?", "o": ["Son iguales", "El superficial descarga todo", "El parcial no tiene historial", "El superficial no tiene historial; el parcial tiene la historia y baja los ficheros bajo demanda"], "a": 3, "e": "--depth frente a --filter."}, {"id": 461, "t": "GIT-6.1", "q": "¿Qué hace git submodule update --remote?", "o": ["Sube el submódulo", "Borra el submódulo", "Actualiza el submódulo al último commit de su rama remota", "Desactiva el submódulo"], "a": 2, "e": "Luego hay que hacer commit del cambio."}, {"id": 462, "t": "GIT-6.1", "q": "¿Qué hace git worktree list?", "o": ["Lista los ficheros", "Lista las ramas", "Lista los árboles de trabajo del repositorio", "Lista los remotos"], "a": 2, "e": "Uno por carpeta."}, {"id": 463, "t": "GIT-6.1", "q": "¿Qué hace git worktree add -b urgente ../app-urgente?", "o": ["Mueve la carpeta", "Clona el repositorio", "Borra la rama urgente", "Crea la rama urgente y la saca en la carpeta ../app-urgente"], "a": 3, "e": "-b crea la rama."}, {"id": 464, "t": "GIT-6.2", "q": "¿Qué tipos de objetos guarda Git?", "o": ["blob, branch, merge y push", "blob, tree, commit y tag", "data, index, ref y log", "file, folder, change y label"], "a": 1, "e": "Base de datos de objetos."}, {"id": 465, "t": "GIT-6.2", "q": "¿Qué contiene un objeto blob?", "o": ["Un commit", "El contenido de un fichero, sin nombre ni permisos", "Una rama", "Un directorio"], "a": 1, "e": "El nombre está en el tree."}, {"id": 466, "t": "GIT-6.2", "q": "¿Qué contiene un objeto tree?", "o": ["El contenido de un fichero", "La lista de nombres de ficheros y carpetas con sus permisos y hashes", "El mensaje del commit", "La URL del remoto"], "a": 1, "e": "Representa una carpeta."}, {"id": 467, "t": "GIT-6.2", "q": "¿Qué contiene un objeto commit?", "o": ["Solo el mensaje", "Solo los ficheros cambiados", "Una copia del repositorio", "El tree raíz, los padres, autor, committer, fecha y mensaje"], "a": 3, "e": "Una foto del proyecto."}, {"id": 468, "t": "GIT-6.2", "q": "Dos ficheros con exactamente el mismo contenido y distinto nombre, ¿cuántos blobs ocupan?", "o": ["Depende de la rama", "Dos", "Uno", "Ninguno"], "a": 2, "e": "Mismo contenido = mismo hash."}, {"id": 469, "t": "GIT-6.2", "q": "¿Qué muestra git cat-file -t a1b2c3d?", "o": ["El tamaño del objeto", "La fecha del objeto", "El tipo del objeto (commit, tree, blob o tag)", "El contenido del objeto"], "a": 2, "e": "-t = type."}, {"id": 470, "t": "GIT-6.2", "q": "¿Qué muestra git cat-file -p a1b2c3d?", "o": ["El contenido del objeto de forma legible", "El autor solamente", "La ruta del objeto", "El tipo del objeto"], "a": 0, "e": "-p = pretty-print."}, {"id": 471, "t": "GIT-6.2", "q": "¿Qué comando muestra el hash completo del commit actual?", "o": ["git rev-parse HEAD", "git log --id", "git hash HEAD", "git show --hash"], "a": 0, "e": "Muy usado en scripts."}, {"id": 472, "t": "GIT-6.2", "q": "¿Qué es un hook de Git?", "o": ["Un tipo de rama", "Un remoto especial", "Un script que Git ejecuta automáticamente en ciertos momentos", "Un fichero de configuración global"], "a": 2, "e": "Ej.: pre-commit, pre-push."}, {"id": 473, "t": "GIT-6.2", "q": "¿Dónde están los hooks de un repositorio?", "o": ["En .git/hooks/", "En ~/.gitconfig", "En .githooks/ siempre", "En .gitignore"], "a": 0, "e": "Con ejemplos *.sample."}, {"id": 474, "t": "GIT-6.2", "q": "¿Cuándo se ejecuta el hook pre-commit?", "o": ["Antes de crear el commit; si falla, no hay commit", "En el servidor al recibir", "Antes del push", "Después del commit"], "a": 0, "e": "Útil para linters y pruebas rápidas."}, {"id": 475, "t": "GIT-6.2", "q": "¿Qué hook sirve para comprobar el formato del mensaje de commit?", "o": ["pre-receive", "commit-msg", "pre-push", "post-commit"], "a": 1, "e": "Por ejemplo, Conventional Commits."}, {"id": 476, "t": "GIT-6.2", "q": "¿Qué hook se ejecuta antes de enviar commits al remoto?", "o": ["pre-commit", "pre-push", "commit-msg", "post-receive"], "a": 1, "e": "Para pasar pruebas completas."}, {"id": 477, "t": "GIT-6.2", "q": "¿Cuál de estos hooks se ejecuta en el SERVIDOR?", "o": ["pre-receive", "pre-push", "commit-msg", "pre-commit"], "a": 0, "e": "También update y post-receive."}, {"id": 478, "t": "GIT-6.2", "q": "¿Se copian los hooks al clonar un repositorio?", "o": ["Solo los de servidor", "Solo con --mirror", "No, .git/hooks no forma parte del repositorio", "Sí, siempre"], "a": 2, "e": "Para compartirlos: core.hooksPath."}, {"id": 479, "t": "GIT-6.2", "q": "¿Qué configuración permite usar una carpeta del repositorio como carpeta de hooks?", "o": ["user.hooks", "core.hooks", "core.hooksPath", "hooks.dir"], "a": 2, "e": "git config core.hooksPath .githooks."}, {"id": 480, "t": "GIT-6.2", "q": "¿Qué opción de git commit se salta los hooks pre-commit y commit-msg?", "o": ["--no-verify", "--skip-hooks", "--quiet", "--force"], "a": 0, "e": "Por eso los hooks de cliente no son una medida de seguridad fiable."}, {"id": 481, "t": "GIT-6.2", "q": "¿Qué opción de git commit firma el commit?", "o": ["--sign-off", "-S", "-s", "-g"], "a": 1, "e": "-s (minúscula) añade la línea Signed-off-by."}, {"id": 482, "t": "GIT-6.2", "q": "Desde Git 2.34, ¿con qué tipo de clave se pueden firmar commits además de GPG?", "o": ["SSH", "RSA de TLS", "PGP no existe", "Kerberos"], "a": 0, "e": "gpg.format ssh."}, {"id": 483, "t": "GIT-6.2", "q": "¿Qué configuración hace que se firmen todos los commits?", "o": ["user.signall true", "core.sign true", "commit.sign always", "commit.gpgsign true"], "a": 3, "e": "También con claves SSH."}, {"id": 484, "t": "GIT-6.2", "q": "¿Qué comando verifica la firma de un commit?", "o": ["git verify-commit HEAD", "git sign --check", "git check-sign HEAD", "git log --verify"], "a": 0, "e": "También git log --show-signature."}, {"id": 485, "t": "GIT-6.2", "q": "¿Qué significa el error \"detected dubious ownership in repository\"?", "o": ["El commit no está firmado", "El remoto no existe", "Hay un conflicto de fusión", "El repositorio pertenece a otro usuario y Git se niega a usarlo por seguridad"], "a": 3, "e": "Desde Git 2.35.2 (CVE-2022-24765)."}, {"id": 486, "t": "GIT-6.2", "q": "¿Cómo indicas que confías en un repositorio de otro propietario?", "o": ["git config core.owner yo", "git config --global --add safe.directory /ruta/al/repo", "git trust /ruta/al/repo", "chmod 777 .git"], "a": 1, "e": "safe.directory."}, {"id": 487, "t": "GIT-6.2", "q": "Has subido por error una contraseña a un repositorio remoto. ¿Qué es lo PRIMERO que debes hacer?", "o": ["Renombrar el repositorio", "Borrar el fichero en un commit nuevo", "Hacer git revert", "Revocar o cambiar esa contraseña"], "a": 3, "e": "Puede estar ya copiada."}, {"id": 488, "t": "GIT-6.2", "q": "¿Basta con borrar en un commit nuevo un fichero con una contraseña?", "o": ["Sí, desaparece del todo", "Solo en GitLab", "Sí, si haces push", "No, sigue en el historial"], "a": 3, "e": "Hay que revocarla y limpiar la historia."}, {"id": 489, "t": "GIT-6.2", "q": "¿Qué herramienta recomienda la documentación de Git para reescribir la historia y eliminar ficheros?", "o": ["git clean", "git gc --purge", "git filter-repo", "git filter-branch"], "a": 2, "e": "filter-branch está desaconsejado."}, {"id": 490, "t": "GIT-6.2", "q": "Según la documentación oficial, ¿qué algoritmo sustituirá a SHA-1 como hash por defecto en los repositorios creados con Git 3.0?", "o": ["MD5", "SHA-1", "SHA-256", "SHA-512"], "a": 2, "e": "Según BreakingChanges."}, {"id": 491, "t": "GIT-6.2", "q": "¿Qué formato de referencias usarán por defecto los repositorios nuevos en Git 3.0?", "o": ["sqlite", "files", "reftable", "packed-refs"], "a": 2, "e": "Evita problemas de mayúsculas/minúsculas."}, {"id": 492, "t": "GIT-6.2", "q": "¿Qué comando desaparecerá en Git 3.0, sustituido por git log --raw?", "o": ["git whatchanged", "git diff", "git show", "git log"], "a": 0, "e": "También git pack-redundant."}, {"id": 493, "t": "GIT-6.2", "q": "¿Tiene Git 3.0 fecha de publicación oficial?", "o": ["No, la documentación indica que aún no hay fecha", "Sí, salió en 2025", "Sí, enero de 2026", "Sí, junto con la 2.56"], "a": 0, "e": "Documento BreakingChanges."}, {"id": 494, "t": "GIT-6.2", "q": "¿Qué lenguaje será obligatorio para compilar Git 3.0?", "o": ["Go", "Python", "Java", "Rust"], "a": 3, "e": "Hoy es opcional."}, {"id": 495, "t": "GIT-6.2", "q": "¿Qué hace git ls-files?", "o": ["Lista los ficheros que controla Git (los del índice)", "Lista los ficheros del remoto", "Lista todos los ficheros del disco", "Lista los ficheros ignorados"], "a": 0, "e": "Comando de bajo nivel."}, {"id": 496, "t": "GIT-6.3", "q": "¿Qué es la integración continua (CI)?", "o": ["Hacer copias de seguridad del repositorio", "Fusionar ramas manualmente cada mes", "Desplegar sin probar", "Compilar y probar automáticamente el código cada vez que se sube"], "a": 3, "e": "Detecta errores pronto."}, {"id": 497, "t": "GIT-6.3", "q": "¿Qué diferencia hay entre CI y CD?", "o": ["CD es solo para bases de datos", "Son lo mismo", "CI despliega y CD prueba", "CI integra y prueba automáticamente; CD entrega o despliega automáticamente"], "a": 3, "e": "Continuous Integration / Delivery-Deployment."}, {"id": 498, "t": "GIT-6.3", "q": "¿Dónde se guardan los workflows de GitHub Actions?", "o": ["En .gitlab-ci.yml", "En .github/workflows/", "En .git/hooks/", "En .github/actions.json"], "a": 1, "e": "Ficheros YAML."}, {"id": 499, "t": "GIT-6.3", "q": "¿Cómo se llama el fichero de configuración de GitLab CI/CD?", "o": ["gitlab.yml", ".gitlab/ci.yaml", "Jenkinsfile", ".gitlab-ci.yml"], "a": 3, "e": "En la raíz del repositorio."}, {"id": 500, "t": "GIT-6.3", "q": "¿Cómo se llaman las máquinas que ejecutan los trabajos de CI?", "o": ["Workers de Git", "Agents de Git", "Hooks", "Runners"], "a": 3, "e": "En GitHub y en GitLab."}, {"id": 501, "t": "GIT-6.3", "q": "En GitHub Actions, ¿qué indica la clave on:?", "o": ["El sistema operativo del runner", "Los eventos que lanzan el workflow", "El nombre del repositorio", "Los pasos a ejecutar"], "a": 1, "e": "Ej.: push, pull_request."}, {"id": 502, "t": "GIT-6.3", "q": "En GitHub Actions, ¿qué indica runs-on:?", "o": ["Qué acción usar", "Cuándo se ejecuta", "Qué rama se despliega", "En qué tipo de runner se ejecuta el job"], "a": 3, "e": "Ej.: ubuntu-latest."}, {"id": 503, "t": "GIT-6.3", "q": "En GitHub Actions, ¿qué diferencia hay entre uses: y run:?", "o": ["Son iguales", "run: usa una acción y uses: ejecuta un comando", "uses: es solo para Windows", "uses: usa una acción ya hecha; run: ejecuta un comando"], "a": 3, "e": "Ej.: uses: actions/checkout@v6."}, {"id": 504, "t": "GIT-6.3", "q": "¿Qué hace la acción actions/checkout?", "o": ["Cambia de rama en tu equipo", "Revisa el código", "Descarga el código del repositorio en el runner", "Hace checkout de la rama main en el remoto"], "a": 2, "e": "Suele ser el primer paso."}, {"id": 505, "t": "GIT-6.3", "q": "En GitLab CI, ¿qué clave es obligatoria en un trabajo normal?", "o": ["image", "script", "rules", "stage"], "a": 1, "e": "Los comandos a ejecutar."}, {"id": 506, "t": "GIT-6.3", "q": "En GitLab CI, si no defines stages, ¿cuáles son las etapas por defecto?", "o": ["compile, test, release", "start, run, end", ".pre, build, test, deploy, .post", "build, deploy"], "a": 2, "e": "Un trabajo sin stage va a test."}, {"id": 507, "t": "GIT-6.3", "q": "En GitLab CI, ¿a qué etapa va un trabajo que no indica stage?", "o": ["build", "deploy", "test", ".pre"], "a": 2, "e": "Etapa por defecto."}, {"id": 508, "t": "GIT-6.3", "q": "En GitLab CI, ¿cómo se ejecutan los trabajos de la misma etapa?", "o": ["Aleatoriamente uno", "Solo el primero", "Siempre uno detrás de otro", "En paralelo"], "a": 3, "e": "La siguiente etapa espera a que acabe bien la anterior."}, {"id": 509, "t": "GIT-6.3", "q": "En GitLab CI, ¿qué indica la clave image?", "o": ["El logotipo del proyecto", "La imagen Docker en la que se ejecuta el trabajo", "La imagen que se publica", "Una captura del resultado"], "a": 1, "e": "Ej.: image: node:22."}, {"id": 510, "t": "GIT-6.3", "q": "En GitLab CI, ¿qué se prefiere hoy para decidir cuándo se ejecuta un trabajo?", "o": ["rules", "only/except", "when: never", "triggers"], "a": 0, "e": "only/except son la forma antigua."}, {"id": 511, "t": "GIT-6.3", "q": "¿Qué son los artifacts en CI?", "o": ["Ramas temporales", "Errores del pipeline", "Variables secretas", "Ficheros resultado de un trabajo que se guardan (binarios, informes…)"], "a": 3, "e": "Se pueden pasar a etapas posteriores."}, {"id": 512, "t": "GIT-6.3", "q": "¿Dónde deben guardarse las contraseñas que usa un pipeline?", "o": ["En el README", "En el YAML del pipeline", "Como secretos o variables protegidas de la plataforma", "En un commit cifrado con base64"], "a": 2, "e": "Nunca en el código."}, {"id": 513, "t": "GIT-6.3", "q": "¿Qué es un pipeline?", "o": ["Una rama de Git", "Un tipo de commit", "Un remoto", "La secuencia completa de tareas automáticas (compilar, probar, desplegar)"], "a": 3, "e": "pipeline = tubería."}, {"id": 514, "t": "GIT-6.3", "q": "¿Cómo se llama el ejecutor propio que instalas para GitLab?", "o": ["GitLab Worker Pro", "GitLab Hook", "GitLab Runner", "GitLab Agent Server"], "a": 2, "e": "GitHub también permite runners self-hosted."}, {"id": 515, "t": "GIT-6.3", "q": "¿Cuántos ficheros de workflow puede tener un repositorio de GitHub?", "o": ["Uno por rama", "Ninguno", "Varios, en .github/workflows/", "Solo uno"], "a": 2, "e": "GitLab usa uno principal (con include)."}, {"id": 516, "t": "GIT-6.3", "q": "¿Qué combinación garantiza que nada llegue a main sin revisión ni pruebas?", "o": ["Commits directos a main", "Solo etiquetas firmadas", "Ramas protegidas + PR/MR obligatorio + CI en verde obligatoria", "Solo hooks pre-commit"], "a": 2, "e": "Control en el servidor."}, {"id": 517, "t": "GIT-6.3", "q": "En la regla \"if: $CI_COMMIT_BRANCH == 'main'\" de GitLab, ¿qué se consigue?", "o": ["Que se fusione en main", "Que se ejecute en todas menos main", "Que se cree la rama main", "Que el trabajo solo se ejecute en la rama main"], "a": 3, "e": "Variable predefinida de GitLab."}, {"id": 518, "t": "GIT-6.3", "q": "¿Qué significa \"workflow\" en GitHub Actions?", "o": ["Un tipo de Pull Request", "Un proceso automatizado definido en un fichero YAML", "Un flujo de Git Flow", "Una rama de trabajo"], "a": 1, "e": "Contiene jobs y steps."}, {"id": 519, "t": "GIT-6.3", "q": "En GitHub Actions, ¿qué contiene un job?", "o": ["Varios repositorios", "Un solo comando", "Una serie de steps que se ejecutan en un runner", "Las ramas protegidas"], "a": 2, "e": "workflow > jobs > steps."}, {"id": 520, "t": "GIT-5.3", "q": "¿Qué diferencia hay entre git push --tags y git push --follow-tags?", "o": ["--follow-tags sube todas, también las ligeras", "Son iguales", "--tags sube todas las etiquetas; --follow-tags solo las anotadas que apuntan a commits que se suben", "--tags solo sube las anotadas"], "a": 2, "e": "--follow-tags es más prudente."}, {"id": 521, "t": "GIT-5.3", "q": "¿Qué nombre de etiqueta sigue el convenio habitual de versiones?", "o": ["version_final", "tag1", "v2.1.0", "ultima"], "a": 2, "e": "Prefijo v + SemVer."}, {"id": 522, "t": "GIT-5.3", "q": "Ejecutas git push y luego compruebas el servidor: la etiqueta v1.0 que creaste no está. ¿Por qué?", "o": ["Porque las etiquetas son solo locales y nunca se suben", "Porque falta git commit", "Porque v1.0 es un nombre reservado", "Porque git push no sube etiquetas por defecto"], "a": 3, "e": "Usa git push origin v1.0."}, {"id": 523, "t": "GIT-5.3", "q": "¿Dónde guarda Git las etiquetas dentro de .git?", "o": ["En hooks/", "En refs/tags/", "En refs/heads/", "En logs/"], "a": 1, "e": "Las ramas en refs/heads/."}, {"id": 524, "t": "GIT-5.2", "q": "¿Qué hace git stash -u?", "o": ["Deshace el último stash", "Guarda solo los ficheros preparados", "Actualiza el stash", "Guarda también los ficheros nuevos sin seguimiento"], "a": 3, "e": "-u = include-untracked."}, {"id": 525, "t": "GIT-5.2", "q": "¿Qué hace git cherry-pick a1b2c3d e4f5g6h?", "o": ["Fusiona dos ramas", "Copia todos los commits entre ambos", "Copia esos dos commits a la rama actual", "Compara dos commits"], "a": 2, "e": "Se pueden indicar varios."}, {"id": 526, "t": "GIT-3.3", "q": "Tras resolver un conflicto en un rebase, ¿qué debes hacer antes de git rebase --continue?", "o": ["git commit -m", "git add de los ficheros resueltos", "git push", "git merge --continue"], "a": 1, "e": "Igual que en un merge."}, {"id": 527, "t": "GIT-3.3", "q": "¿Qué rebase es seguro hacer?", "o": ["El de etiquetas publicadas", "El de ramas de otros compañeros", "El de commits locales que todavía no has subido", "El de main compartida"], "a": 2, "e": "Regla de oro."}, {"id": 528, "t": "GIT-4.3", "q": "En Conventional Commits, ¿qué tipo de commit hace subir la versión PARCHE?", "o": ["docs", "refactor", "fix", "feat"], "a": 2, "e": "feat sube la menor."}, {"id": 529, "t": "GIT-4.3", "q": "¿Qué flujo de trabajo usa ramas release/*?", "o": ["Trunk-based", "GitHub Flow", "Ninguno", "Git Flow"], "a": 3, "e": "Para preparar versiones."}, {"id": 530, "t": "GIT-6.3", "q": "¿Qué significan las siglas CI?", "o": ["Central Infrastructure", "Code Inspection", "Commit Index", "Continuous Integration (integración continua)"], "a": 3, "e": "CD = entrega/despliegue continuo."}, {"id": 531, "t": "GIT-6.3", "q": "En GitLab CI, ¿qué hace la clave artifacts: paths: [dist/]?", "o": ["Borra la carpeta dist/", "Despliega dist/ en producción", "Ignora la carpeta dist/", "Guarda la carpeta dist/ como resultado del trabajo"], "a": 3, "e": "Artefactos."}, {"id": 532, "t": "GIT-6.3", "q": "En GitLab CI, ¿cuándo empieza la etapa test?", "o": ["Solo de forma manual", "Cuando terminan con éxito los trabajos de la etapa build", "Antes de build", "A la vez que build"], "a": 1, "e": "Etapas en orden."}, {"id": 533, "t": "GIT-6.3", "q": "¿Qué evento de GitHub Actions lanza un workflow al abrir o actualizar un Pull Request?", "o": ["review", "pull_request", "merge_request", "pr_open"], "a": 1, "e": "on: [push, pull_request]."}, {"id": 534, "t": "GIT-6.3", "q": "¿Qué ventaja principal aporta la integración continua?", "o": ["Detectar errores en minutos, en cuanto se sube el código", "Evitar usar Git", "Eliminar la necesidad de pruebas", "Reducir el número de ramas a una"], "a": 0, "e": "Calidad automática."}, {"id": 535, "t": "GIT-6.3", "q": "¿Qué es un runner self-hosted?", "o": ["Una máquina propia que ejecuta los trabajos de CI en lugar de las de la plataforma", "Un tipo de rama", "Un runner gratuito de GitHub", "Un hook del servidor"], "a": 0, "e": "Útil en redes internas de la Administración."}]</script>
<script type="application/json" id="ex-src">[{"t": "GIT-1.2", "m": "git", "p": "Muestra la versión de Git instalada.", "s": "git --version", "r": ["^git\\s+(--version|version)$"]}, {"t": "GIT-1.2", "m": "git", "p": "Configura tu nombre \"Teresa López\" para todos tus repositorios.", "s": "git config --global user.name \"Teresa López\"", "r": ["^git\\s+config\\s+(set\\s+)?--global\\s+user\\.name\\s+[\"']teresa lópez[\"']$"]}, {"t": "GIT-1.2", "m": "git", "p": "Configura tu correo teresa@ejemplo.es para todos tus repositorios.", "s": "git config --global user.email teresa@ejemplo.es", "r": ["^git\\s+config\\s+(set\\s+)?--global\\s+user\\.email\\s+[\"']?teresa@ejemplo\\.es[\"']?$"]}, {"t": "GIT-1.2", "m": "git", "p": "Haz que los repositorios nuevos empiecen con la rama main (configuración global).", "s": "git config --global init.defaultBranch main", "r": ["^git\\s+config\\s+(set\\s+)?--global\\s+init\\.defaultbranch\\s+main$"]}, {"t": "GIT-1.2", "m": "git", "p": "Muestra toda la configuración de Git (forma clásica).", "s": "git config --list", "r": ["^git\\s+config\\s+(--list|-l|list)$"]}, {"t": "GIT-1.2", "m": "git", "p": "Muestra toda la configuración indicando de qué fichero sale cada valor, con la sintaxis nueva.", "s": "git config list --show-origin", "r": ["^git\\s+config\\s+(list|--list|-l)\\s+--show-origin$"]}, {"t": "GIT-1.2", "m": "git", "p": "Muestra el valor de user.email con la sintaxis nueva (subcomando).", "s": "git config get user.email", "r": ["^git\\s+config\\s+get\\s+user\\.email$"]}, {"t": "GIT-1.2", "m": "git", "p": "Crea el alias global st para el comando status.", "s": "git config --global alias.st status", "r": ["^git\\s+config\\s+(set\\s+)?--global\\s+alias\\.st\\s+status$"]}, {"t": "GIT-1.2", "m": "git", "p": "Configura core.autocrlf con el valor recomendado para Linux, a nivel global.", "s": "git config --global core.autocrlf input", "r": ["^git\\s+config\\s+(set\\s+)?--global\\s+core\\.autocrlf\\s+input$"]}, {"t": "GIT-1.2", "m": "git", "p": "Abre el manual completo del comando git log.", "s": "git help log", "r": ["^(git\\s+help\\s+log|git\\s+log\\s+--help|man\\s+git-log)$"]}, {"t": "GIT-1.3", "m": "git", "p": "Convierte la carpeta actual en un repositorio Git.", "s": "git init", "r": ["^git\\s+init$"]}, {"t": "GIT-1.3", "m": "git", "p": "Crea un repositorio en la carpeta actual con la rama inicial main.", "s": "git init -b main", "r": ["^git\\s+init\\s+(-b\\s+main|--initial-branch[\\s=]main)$"]}, {"t": "GIT-1.3", "m": "git", "p": "Crea un repositorio bare llamado repo.git.", "s": "git init --bare repo.git", "r": ["^git\\s+init\\s+--bare\\s+repo\\.git$"]}, {"t": "GIT-1.3", "m": "git", "p": "Clona https://github.com/age/portal.git.", "s": "git clone https://github.com/age/portal.git", "r": ["^git\\s+clone\\s+https://github\\.com/age/portal\\.git$"]}, {"t": "GIT-1.3", "m": "git", "p": "Clona https://github.com/age/portal.git en una carpeta llamada web.", "s": "git clone https://github.com/age/portal.git web", "r": ["^git\\s+clone\\s+https://github\\.com/age/portal\\.git\\s+web$"]}, {"t": "GIT-1.3", "m": "git", "p": "Clona https://github.com/age/portal.git situándote directamente en la rama develop.", "s": "git clone -b develop https://github.com/age/portal.git", "r": ["^git\\s+clone\\b", "(-b|--branch)[\\s=]develop\\b", "https://github\\.com/age/portal\\.git"]}, {"t": "GIT-1.3", "m": "git", "p": "Clona por SSH el repositorio age/portal de GitHub.", "s": "git clone git@github.com:age/portal.git", "r": ["^git\\s+clone\\s+git@github\\.com:age/portal\\.git$"]}, {"t": "GIT-2.1", "m": "git", "p": "Muestra el estado del repositorio.", "s": "git status", "r": ["^git\\s+(status|st)$"]}, {"t": "GIT-2.1", "m": "git", "p": "Muestra el estado del repositorio en formato corto.", "s": "git status -s", "r": ["^git\\s+status\\s+(-s|--short)$"]}, {"t": "GIT-2.1", "m": "git", "p": "Prepara el fichero index.html para el próximo commit.", "s": "git add index.html", "r": ["^git\\s+add\\s+index\\.html$"]}, {"t": "GIT-2.1", "m": "git", "p": "Prepara todos los cambios de todo el repositorio (nuevos, modificados y borrados).", "s": "git add -A", "r": ["(?c)^git\\s+add\\s+(-A|--all)$"]}, {"t": "GIT-2.1", "m": "git", "p": "Prepara los cambios eligiendo trozo a trozo.", "s": "git add -p", "r": ["^git\\s+add\\s+(-p|--patch)$"]}, {"t": "GIT-2.1", "m": "git", "p": "Haz un commit con el mensaje \"Añade formulario de contacto\".", "s": "git commit -m \"Añade formulario de contacto\"", "r": ["^git\\s+commit\\s+(-m|--message)[\\s=][\"']añade formulario de contacto[\"']$"]}, {"t": "GIT-2.1", "m": "git", "p": "Prepara los ficheros ya controlados que has modificado y haz commit con el mensaje \"Corrige errata\", en un solo comando.", "s": "git commit -am \"Corrige errata\"", "r": ["^git\\s+commit\\b", "(-am\\b|-a\\s+-m\\b|--all\\s+(-m|--message))", "[\"']corrige errata[\"']$"]}, {"t": "GIT-2.1", "m": "git", "p": "Cambia el mensaje del último commit (aún no subido) por \"Añade validación del DNI\".", "s": "git commit --amend -m \"Añade validación del DNI\"", "r": ["^git\\s+commit\\b", "--amend\\b", "(-m|--message)[\\s=][\"']añade validación del dni[\"']"]}, {"t": "GIT-2.1", "m": "git", "p": "Añade lo que tienes preparado al último commit sin cambiar su mensaje.", "s": "git commit --amend --no-edit", "r": ["^git\\s+commit\\b", "--amend\\b", "--no-edit\\b"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra el historial con un commit por línea.", "s": "git log --oneline", "r": ["^git\\s+log\\s+--oneline$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra el historial de todas las ramas en una línea por commit, con el dibujo del árbol.", "s": "git log --oneline --graph --all", "r": ["^git\\s+log\\b", "--oneline\\b", "--graph\\b", "--all\\b"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra solo los 5 últimos commits.", "s": "git log -5", "r": ["^git\\s+log\\s+(-5|-n\\s*5|--max-count[\\s=]5)$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra los commits cuyo autor es Teresa.", "s": "git log --author=\"Teresa\"", "r": ["^git\\s+log\\s+--author[\\s=][\"']?teresa[\"']?$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra los commits cuyo MENSAJE contiene la palabra IVA.", "s": "git log --grep=\"IVA\"", "r": ["^git\\s+log\\s+--grep[\\s=][\"']?iva[\"']?$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra los commits que añadieron o quitaron el texto calcularIva en el código.", "s": "git log -S \"calcularIva\"", "r": ["(?c)^git\\s+log\\s+-S\\s*[\"']?calcularIva[\"']?$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra el historial del fichero informe.py aunque se haya renombrado alguna vez.", "s": "git log --follow informe.py", "r": ["^git\\s+log\\s+--follow\\s+(--\\s+)?informe\\.py$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra los cambios que has hecho y aún NO has preparado.", "s": "git diff", "r": ["^git\\s+diff$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra los cambios preparados que entrarán en el próximo commit.", "s": "git diff --staged", "r": ["^git\\s+diff\\s+(--staged|--cached)$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra todos los cambios del directorio de trabajo respecto al último commit.", "s": "git diff HEAD", "r": ["(?c)^git\\s+diff\\s+(HEAD|@)$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra el detalle del penúltimo commit.", "s": "git show HEAD~1", "r": ["(?c)^git\\s+show\\s+(HEAD~1?|HEAD\\^|@~1?|@\\^)$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra quién cambió cada línea de app.py.", "s": "git blame app.py", "r": ["^git\\s+blame\\s+app\\.py$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra quién cambió las líneas 10 a 20 de app.py.", "s": "git blame -L 10,20 app.py", "r": ["(?c)^git\\s+blame\\b", "-L\\s*10,20\\b", "\\bapp\\.py$"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra el número de commits de cada autor, ordenado.", "s": "git shortlog -sn", "r": ["^git\\s+shortlog\\b", "(-sn|-ns|-s\\s+-n|-n\\s+-s)\\b"]}, {"t": "GIT-2.2", "m": "git", "p": "Muestra los commits que están en la rama feature y no en main.", "s": "git log main..feature", "r": ["^git\\s+log\\s+main\\.\\.feature$"]}, {"t": "GIT-2.3", "m": "git", "p": "Deja de controlar el fichero .env pero mantenlo en tu disco.", "s": "git rm --cached .env", "r": ["^git\\s+rm\\s+--cached\\s+\\.env$"]}, {"t": "GIT-2.3", "m": "git", "p": "Deja de controlar toda la carpeta node_modules (ya añadida por error) sin borrarla del disco.", "s": "git rm -r --cached node_modules", "r": ["^git\\s+rm\\b", "(-r\\b|-rf?\\b)", "--cached\\b", "\\bnode_modules/?$"]}, {"t": "GIT-2.3", "m": "git", "p": "Borra el fichero viejo.txt del disco y prepara su borrado.", "s": "git rm viejo.txt", "r": ["^git\\s+rm\\s+viejo\\.txt$"]}, {"t": "GIT-2.3", "m": "git", "p": "Renombra antiguo.py a nuevo.py con Git.", "s": "git mv antiguo.py nuevo.py", "r": ["^git\\s+mv\\s+antiguo\\.py\\s+nuevo\\.py$"]}, {"t": "GIT-2.3", "m": "git", "p": "Simula qué ficheros sin seguimiento borraría git clean.", "s": "git clean -n", "r": ["^git\\s+clean\\s+(-n|--dry-run)$"]}, {"t": "GIT-2.3", "m": "git", "p": "Borra los ficheros y carpetas sin seguimiento.", "s": "git clean -fd", "r": ["^git\\s+clean\\s+(-fd|-df|-f\\s+-d|-d\\s+-f)$"]}, {"t": "GIT-2.3", "m": "git", "p": "Averigua qué regla de exclusión hace que se ignore app.log.", "s": "git check-ignore -v app.log", "r": ["^git\\s+check-ignore\\b", "(-v|--verbose)\\b", "\\bapp\\.log$"]}, {"t": "GIT-2.3", "m": "git", "p": "Muestra el estado incluyendo también los ficheros ignorados.", "s": "git status --ignored", "r": ["^git\\s+status\\s+--ignored$"]}, {"t": "GIT-3.1", "m": "git", "p": "Lista las ramas locales.", "s": "git branch", "r": ["^git\\s+branch$"]}, {"t": "GIT-3.1", "m": "git", "p": "Lista las ramas locales y remotas.", "s": "git branch -a", "r": ["^git\\s+branch\\s+(-a|--all)$"]}, {"t": "GIT-3.1", "m": "git", "p": "Crea la rama feature/login SIN cambiarte a ella.", "s": "git branch feature/login", "r": ["^git\\s+branch\\s+feature/login$"]}, {"t": "GIT-3.1", "m": "git", "p": "Crea la rama feature/login y cámbiate a ella con el comando moderno.", "s": "git switch -c feature/login", "r": [" git en libs/libreria.", "s": "git submodule add https://github.com/org/libreria.git libs/libreria", "r": ["^git\\s+submodule\\s+add\\s+https://github\\.com/org/libreria\\.git\\s+libs/libreria$"]}, {"t": "GIT-6.1", "m": "git", "p": "Clona https://github.com/org/app.git incluyendo sus submódulos.", "s": "git clone --recurse-submodules https://github.com/org/app.git", "r": ["^git\\s+clone\\b", "--recurse-submodules\\b", "https://github\\.com/org/app\\.git$"]}, {"t": "GIT-6.1", "m": "git", "p": "Descarga los submódulos (y los anidados) de un repositorio ya clonado.", "s": "git submodule update --init --recursive", "r": ["^git\\s+submodule\\s+update\\b", "--init\\b", "--recursive\\b"]}, {"t": "GIT-6.1", "m": "git", "p": "Haz que los ficheros *.iso se gestionen con Git LFS.", "s": "git lfs track \"*.iso\"", "r": ["^git\\s+lfs\\s+track\\s+[\"']?\\*\\.iso[\"']?$"]}, {"t": "GIT-6.1", "m": "git", "p": "Clona https://github.com/org/app.git solo con el último commit (clon superficial).", "s": "git clone --depth 1 https://github.com/org/app.git", "r": ["^git\\s+clone\\b", "--depth[\\s=]1\\b", "https://github\\.com/org/app\\.git$"]}, {"t": "GIT-6.1", "m": "git", "p": "Clona https://github.com/org/app.git con historia completa pero sin descargar el contenido de los ficheros hasta que haga falta.", "s": "git clone --filter=blob:none https://github.com/org/app.git", "r": ["^git\\s+clone\\b", "--filter[\\s=]blob:none\\b", "https://github\\.com/org/app\\.git$"]}, {"t": "GIT-6.1", "m": "git", "p": "Saca al directorio de trabajo solo las carpetas docs y src/api.", "s": "git sparse-checkout set docs src/api", "r": ["^git\\s+sparse-checkout\\s+set\\s+docs\\s+src/api$"]}, {"t": "GIT-6.1", "m": "git", "p": "Comprueba la integridad del repositorio.", "s": "git fsck", "r": ["^git\\s+fsck\\b"]}, {"t": "GIT-6.2", "m": "git", "p": "Muestra el hash completo del commit actual.", "s": "git rev-parse HEAD", "r": ["(?c)^git\\s+rev-parse\\s+(HEAD|@)$"]}, {"t": "GIT-6.2", "m": "git", "p": "Muestra el tipo del objeto a1b2c3d.", "s": "git cat-file -t a1b2c3d", "r": ["^git\\s+cat-file\\s+-t\\s+a1b2c3d$"]}, {"t": "GIT-6.2", "m": "git", "p": "Muestra el contenido legible del objeto a1b2c3d.", "s": "git cat-file -p a1b2c3d", "r": ["^git\\s+cat-file\\s+-p\\s+a1b2c3d$"]}, {"t": "GIT-6.2", "m": "git", "p": "Usa la carpeta .githooks del repositorio como carpeta de hooks.", "s": "git config core.hooksPath .githooks", "r": ["^git\\s+config\\s+(set\\s+)?(--local\\s+)?core\\.hookspath\\s+\\.githooks/?$"]}, {"t": "GIT-6.2", "m": "git", "p": "Haz un commit firmado con el mensaje \"Commit firmado\".", "s": "git commit -S -m \"Commit firmado\"", "r": ["(?c)^git\\s+commit\\b", "(?c)(-S\\b|--gpg-sign)", "[\"']commit firmado[\"']"]}, {"t": "GIT-6.2", "m": "git", "p": "Configura globalmente la firma de commits con claves SSH.", "s": "git config --global gpg.format ssh", "r": ["^git\\s+config\\s+(set\\s+)?--global\\s+gpg\\.format\\s+ssh$"]}, {"t": "GIT-6.2", "m": "git", "p": "Haz que todos tus commits se firmen (configuración global).", "s": "git config --global commit.gpgsign true", "r": ["^git\\s+config\\s+(set\\s+)?--global\\s+commit\\.gpgsign\\s+true$"]}, {"t": "GIT-6.2", "m": "git", "p": "Verifica la firma del último commit.", "s": "git verify-commit HEAD", "r": ["(?c)^git\\s+verify-commit\\s+(HEAD|@)$"]}, {"t": "GIT-6.2", "m": "git", "p": "Marca como seguro el repositorio /srv/app, que pertenece a otro usuario (global).", "s": "git config --global --add safe.directory /srv/app", "r": ["^git\\s+config\\s+(set\\s+--append\\s+--global|--global\\s+--add|--add\\s+--global|set\\s+--global\\s+--append)\\s+safe\\.directory\\s+/srv/app/?$"]}, {"t": "GIT-6.2", "m": "git", "p": "Haz un commit con el mensaje \"WIP\" saltándote los hooks pre-commit y commit-msg.", "s": "git commit --no-verify -m \"WIP\"", "r": ["^git\\s+commit\\b", "(--no-verify|-n)\\b", "[\"']wip[\"']"]}, {"t": "GIT-6.3", "m": "git", "p": "Crea la carpeta donde GitHub Actions busca los workflows.", "s": "mkdir -p .github/workflows", "r": ["^mkdir\\s+-p\\s+\\.github/workflows/?$"]}, {"t": "GIT-6.3", "m": "git", "p": "Prepara el fichero de configuración de GitLab CI/CD para el próximo commit.", "s": "git add .gitlab-ci.yml", "r": ["^git\\s+add\\s+\\.gitlab-ci\\.yml$"]}, {"t": "GIT-6.3", "m": "git", "p": "Prepara el workflow ci.yml de GitHub Actions para el próximo commit.", "s": "git add .github/workflows/ci.yml", "r": ["^git\\s+add\\s+\\.github/workflows/ci\\.yml$"]}]</script>
<script>
(function(){
"use strict";
/* ================= data ================= */
const MD = document.getElementById('md-src').textContent;
const QS = JSON.parse(document.getElementById('q-src').textContent);
const EX = JSON.parse(document.getElementById('ex-src').textContent);
const COURSES = {GIT:'Git'};
const KEY = 'tai-git-v1';

/* ================= storage ================= */
let S = {read:{}, q:{}, star:{}, ex:{}, last:null, theme:null};
function load(){ try{ const r = localStorage.getItem(KEY); if(r){ S = Object.assign(S, JSON.parse(r)); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
load();

/* ================= theme ================= */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
applyTheme();
document.getElementById('themeBtn').onclick = () => {
  const dark = S.theme === 'dark';
  S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
};

/* ================= markdown ================= */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m,c) => { codes.push(c); return '\u0000' + (codes.length-1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:)]|$)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (m,i) => '<code>' + esc(codes[+i]) + '</code>');
  return s;
}
function highlight(code){
  return code.split('\n').map(l => {
    if (/^\s*(#|::|!|REM\s)/.test(l) && !/^\s*#\{/.test(l)) return '<span class="cm">' + esc(l) + '</span>';
    const k = l.search(/\s(#|::|!)\s/);
    if (k >= 0) return esc(l.slice(0, k)) + '<span class="cm">' + esc(l.slice(k)) + '</span>';
    return esc(l);
  }).join('\n');
}
function splitCells(r){
  r = r.trim().replace(/^\|/, '').replace(/\|$/, '');
  const out = []; let cur = '', inCode = false;
  for (const ch of r){
    if (ch === '`') inCode = !inCode;
    if (ch === '|' && !inCode){ out.push(cur.trim()); cur = ''; } else cur += ch;
  }
  out.push(cur.trim()); return out;
}
function mdToHtml(src){
  const lines = src.split('\n'); let html = ''; let i = 0;
  while (i < lines.length){
    let l = lines[i];
    let bx = l.match(/^:::(\w+)\s*$/);
    if (bx){
      let inner = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) { inner.push(lines[i]); i++; }
      i++;
      html += '<div class="box box-' + bx[1] + '">' + mdToHtml(inner.join('\n')) + '</div>'; continue;
    }
    if (/^```/.test(l)){
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      html += '<pre><button class="copy">Copiar</button><code>' + highlight(code.join('\n')) + '</code></pre>'; continue;
    }
    if (/^---\s*$/.test(l)){ html += '<hr>'; i++; continue; }
    let h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h){ const n = Math.min(h[1].length+0,4); html += '<h'+n+'>'+inline(h[2])+'</h'+n+'>'; i++; continue; }
    if (/^\|/.test(l)){
      let rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = splitCells;
      let t = '<div class="tbl"><table><thead><tr>' + cells(rows[0]).map(c => '<th>'+inline(c)+'</th>').join('') + '</tr></thead><tbody>';
      rows.slice(2).forEach(r => { t += '<tr>' + cells(r).map(c => '<td>'+inline(c)+'</td>').join('') + '</tr>'; });
      html += t + '</tbody></table></div>'; continue;
    }
    if (/^>/.test(l)){
      let q = [];
      while (i < lines.length && /^>/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/,'')); i++; }
      const txt = q.join('\n'); let cls = '';
      if (txt.includes('⚠️')) cls = 'trap'; else if (txt.includes('💡')) cls = 'key'; else if (txt.includes('🏛️')) cls = 'age';
      html += '<blockquote class="'+cls+'">' + q.filter(x=>x.trim()).map(x => '<p>'+inline(x)+'</p>').join('') + '</blockquote>'; continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l); let items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let it = lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''); const indent = /^\s{2,}/.test(lines[i]); i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s*```/.test(lines[i])) { it += ' ' + lines[i].trim(); i++; }
        let extra = '';
        if (i < lines.length && /^\s+```/.test(lines[i])) {
          let code = []; i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i].replace(/^\s{2}/,'')); i++; }
          i++; extra = '<pre><button class="copy">Copiar</button><code>' + highlight(code.join('\n')) + '</code></pre>';
        }
        items.push({t:it, sub:indent, extra});
      }
      const tag = ordered ? 'ol' : 'ul';
      html += '<'+tag+'>' + items.map(x => '<li'+(x.sub?' style="margin-left:18px"':'')+'>'+inline(x.t)+x.extra+'</li>').join('') + '</'+tag+'>'; continue;
    }
    if (!l.trim()){ i++; continue; }
    let p = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#|```|\||>|---|\s*([-*]|\d+\.)\s)/.test(lines[i])) { p.push(lines[i]); i++; }
    html += '<p>' + inline(p.join(' ')) + '</p>';
  }
  return html;
}

/* ================= parse course structure ================= */
const intro = []; const topics = []; const tree = [];
(function parse(){
  const lines = MD.split('\n'); let course = null, level = null, topic = null, inCode = false;
  for (const l of lines){
    if (/^```/.test(l)) inCode = !inCode;
    if (!inCode){
      let m;
      if ((m = l.match(/^# (.+)$/)) && !/^# Curso TAI/.test(l)){
        const name = m[1].trim(); const code = Object.keys(COURSES).find(k => COURSES[k] === name) || name;
        course = {code, name, levels:[]}; tree.push(course); level = null; topic = null; continue;
      }
      if ((m = l.match(/^## (.+)$/)) && course){ level = {name:m[1].trim(), topics:[]}; course.levels.push(level); topic = null; continue; }
      if ((m = l.match(/^### ((GIT)-\d+\.\d+) · (.+)$/))){
        topic = {id:m[1], title:m[3].trim(), course:course.code, level:level.name, md:''}; topics.push(topic); level.topics.push(topic); continue;
      }
    }
    if (topic) topic.md += l + '\n'; else if (!course) intro.push(l);
  }
  topics.forEach(t => { t.md = t.md.replace(/\n---\s*\n*$/, '\n'); });
})();
const topicById = Object.fromEntries(topics.map(t => [t.id, t]));
const qByTopic = {}; QS.forEach(q => (qByTopic[q.t] = qByTopic[q.t] || []).push(q));

/* ================= sidebar ================= */
const treeEl = document.getElementById('tree');
function coursePct(c){ const ts = topics.filter(t => t.course === c); return Math.round(100 * ts.filter(t => S.read[t.id]).length / ts.length); }
function renderTree(filter){
  filter = (filter || '').toLowerCase().trim();
  let h = '<button class="topic'+(current==='intro'?' active':'')+'" data-t="intro"><span class="dot"></span><span>Inicio y cómo usar este curso</span></button>';
  tree.forEach(c => {
    let ch = '';
    c.levels.forEach(lv => {
      const ts = lv.topics.filter(t => !filter || (t.id + ' ' + t.title + ' ' + t.md).toLowerCase().includes(filter));
      if (!ts.length) return;
      const open = filter || ts.some(t => t.id === current);
      ch += '<details class="lvl"'+(open?' open':'')+'><summary>'+esc(lv.name)+'</summary>' +
        ts.map(t => '<button class="topic'+(S.read[t.id]?' read':'')+(t.id===current?' active':'')+'" data-t="'+t.id+'"><span class="dot"></span><span><b>'+t.id+'</b> · '+esc(t.title)+'</span></button>').join('') + '</details>';
    });
    if (!ch) return;
    const open = filter || (topicById[current] && topicById[current].course === c.code);
    h += '<details class="course"'+(open?' open':'')+'><summary><span>'+esc(c.name)+'</span><span class="pct">'+coursePct(c.code)+'%</span></summary>' + ch + '</details>';
  });
  treeEl.innerHTML = h || '<p class="muted">Sin resultados</p>';
}
treeEl.addEventListener('click', e => {
  const b = e.target.closest('.topic'); if (!b) return;
  openTopic(b.dataset.t); document.getElementById('side').classList.remove('open');
});
document.getElementById('search').addEventListener('input', e => renderTree(e.target.value));
document.getElementById('menuBtn').onclick = e => { e.stopPropagation(); document.getElementById('side').classList.toggle('open'); };
document.addEventListener('click', e => { const sd = document.getElementById('side'); if (sd.classList.contains('open') && !sd.contains(e.target)) sd.classList.remove('open'); });

/* ================= views ================= */
const view = document.getElementById('view');
let current = S.last || 'intro';
let currentView = 'teoria';
function setTab(v){
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  window.scrollTo(0,0);
  ({teoria:renderTheory, test:renderTestSetup, consola:renderConsoleSetup, repaso:renderReview, progreso:renderProgress})[v]();
}
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.view); });

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
view.addEventListener('click', e => {
  const c = e.target.closest('.copy'); if (!c) return;
  const code = c.parentElement.querySelector('code').innerText;
  (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('Copiado'), () => toast('No se pudo copiar'));
});

/* ---------- theory ---------- */
function openTopic(id){ current = id; S.last = id; save(); renderTree(document.getElementById('search').value); setTab('teoria'); }
function renderTheory(){
  if (current === 'intro' || !topicById[current]){
    const counts = Object.keys(COURSES).map(c => '<div class="stat"><span class="muted">'+COURSES[c]+'</span><b>'+topics.filter(t=>t.course===c).length+' temas</b><span class="muted">'+QS.filter(q=>q.t.startsWith(c+'-')).length+' preguntas</span></div>').join('');
    view.innerHTML = '<div class="doc">' + mdToHtml(intro.join('\n')) + '</div>' +
      '<div class="grid">'+counts+'</div>' +
      '<div class="card"><h3 style="margin-top:0">Cómo usar esta web</h3><ul>' +
      '<li><b>Teoría</b>: elige un tema en el índice. Cada tema empieza con dos recuadros: <b>🧭 En pocas palabras</b> (explicación sencilla) y <b>🔤 Para recordarlo</b> (el inglés de los comandos y trucos). Marca cada tema como estudiado para ver tu avance.</li>' +
      '<li><b>Test</b>: '+QS.length+' preguntas con explicación. Puedes filtrar por curso, nivel o tema, o hacer un simulacro con la penalización real (−1/3).</li>' +
      '<li><b>Consola</b>: '+EX.length+' ejercicios en los que escribes el comando (git, y algunos de ssh y gh) y se corrige al momento.</li>' +
      '<li><b>Repaso</b>: tus fallos y las preguntas marcadas con ★ para volver a practicarlas.</li>' +
      '<li>El progreso se guarda en este navegador. En <b>Progreso</b> puedes exportarlo e importarlo.</li></ul>' +
      '<div class="row"><button class="btn primary" id="startBtn">Empezar por el primer tema</button></div></div>';

/* ---------- quiz ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function levelOf(t){ return t.split('-')[1].split('.')[0]; }
function filterQs(c, lv, tp, mode){
  return QS.filter(q => {
    if (c !== 'all' && !q.t.startsWith(c + '-')) return false;
    if (lv !== 'all' && levelOf(q.t) !== lv) return false;
    if (tp !== 'all' && q.t !== tp) return false;
    const s = S.q[q.id];
    if (mode === 'new' && s) return false;
    if (mode === 'fail' && !(s && s.last === 0)) return false;
    if (mode === 'star' && !S.star[q.id]) return false;
    return true;
  });
}
function renderTestSetup(){
  view.innerHTML = '<h2 class="view">Test</h2><p class="muted">'+QS.length+' preguntas tipo test con trampas típicas de examen. Cada respuesta se guarda para el repaso.</p>' +

  '<label class="field">Tema<select id="fT"></select></label>' +

  const fC = document.getElementById('fC'), fL = document.getElementById('fL'), fT = document.getElementById('fT'), fM = document.getElementById('fM'), fN = document.getElementById('fN'), info = document.getElementById('fInfo');
