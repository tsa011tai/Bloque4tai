**Cómo leer este temario**

- `:::facil` **🧭 En pocas palabras** = explicación sencilla con un ejemplo de la vida real. Empieza siempre por aquí.
- `:::ingles` **🔤 Para recordarlo** = de qué palabra inglesa viene cada comando y opción, y trucos para memorizarlos.
- `código` = comando exacto. Git **distingue mayúsculas y minúsculas** en sus opciones: `git branch -d` (borra con seguridad) **no** es lo mismo que `git branch -D` (borra a la fuerza).
- `> ⚠️ Trampa:` = lo que suelen preguntar para pillarte.

## La idea de Git en una imagen

Piensa en un **videojuego con partidas guardadas**:

- Cada **commit** es una **partida guardada**: puedes volver a ella cuando quieras.
- Una **rama** es una **partida alternativa**: pruebas un camino distinto sin estropear la principal.
- **Fusionar** (*merge*) es juntar lo que has conseguido en dos partidas.
- Un **remoto** (GitHub, GitLab…) es **la nube** donde subes tus partidas para que las vean tus compañeros o para no perderlas.

## Guía rápida: el inglés de Git

> 💡 Clave: los comandos de Git son **verbos en inglés**. `git add` = "Git, añade". `git commit` = "Git, confirma (guarda)". Si entiendes la palabra, entiendes el comando.

### Verbos de Git

| Comando | Palabra | Significa | Piensa en… |
|---|---|---|---|
| `init` | initialize | inicializar | crear un repositorio nuevo **vacío** |
| `clone` | clonar | copiar un repositorio entero | la oveja Dolly: copia **completa**, con todo el historial |
| `status` | estado | ¿cómo está todo? | la pregunta que harás **cien veces al día** |
| `add` | añadir | pasar cambios al área de preparación | meter cosas en la **caja** antes de cerrarla |
| `commit` | comprometer, confirmar | guardar una foto del proyecto | **cerrar la caja** y ponerle etiqueta |
| `log` | cuaderno de bitácora | ver el historial | el diario del barco |
| `diff` | difference | ver diferencias | "¿qué ha cambiado?" |

| `checkout` | revisar, sacar | cambiar de rama o recuperar ficheros (comando antiguo, "navaja suiza") | sacar un libro de la biblioteca |
| `merge` | fusionar | juntar ramas | dos ríos que se juntan |
| `rebase` | cambiar la base | mover tus commits encima de otra rama | trasplantar una rama |

| `stash` | alijo, escondite | guardar cambios a medias en un cajón | esconder los deberes en el cajón |
| `restore` | restaurar | descartar cambios de ficheros | |
| `reset` | reiniciar | mover la rama hacia atrás | |

### Palabras de Git

| Palabra | Significa | Piensa en… |
|---|---|---|
| Repository (repo) | depósito | la carpeta del proyecto **con todo su historial** (`.git`) |
| Working tree / directory | árbol o directorio de trabajo | tus ficheros tal y como los ves |
| Staging area / index | área de preparación / índice | la "caja" con lo que entrará en el próximo commit |
| Commit | confirmación | una foto del proyecto con autor, fecha y mensaje |
| HEAD | cabeza | "**dónde estoy ahora**" (normalmente, la rama actual) |
| Branch | rama | un puntero móvil a un commit |
| Remote / origin | remoto / origen | el servidor; `origin` es el nombre por defecto del remoto del que clonaste |
| Upstream | aguas arriba | la rama remota que sigue tu rama local |

# Git

## Nivel 1 — Fundamentos

### GIT-1.1 · Qué es el control de versiones y qué es Git

:::facil
**🧭 En pocas palabras.** Un **sistema de control de versiones** (VCS, *Version Control System*) guarda **el historial de cambios** de unos ficheros: qué cambió, quién lo cambió, cuándo y por qué. Así puedes **volver atrás**, **trabajar varias personas a la vez** sin pisaros y saber **de dónde viene cada línea**.

**Imagínatelo así:** sin control de versiones acabas con `informe_final.docx`, `informe_final_v2.docx`, `informe_final_DE_VERDAD.docx`… Git sustituye todo eso por **una sola carpeta** con un historial ordenado de "fotos".
:::
:::ingles
**🔤 Para recordarlo**
- **VCS** = *Version Control System*, sistema de control de versiones. También **SCM** (*Source Code Management*).
- **Git** = en el argot británico, "persona tonta". Linus Torvalds bromeó con que pone a sus proyectos su propio nombre (Linux, Git).
- **Distributed** = distribuido: **cada copia tiene el historial completo**.
- **Snapshot** = instantánea, foto. Git guarda **fotos** del proyecto, no listas de diferencias.
:::

**Tipos de control de versiones**

| Tipo | Cómo funciona | Ejemplos |
|---|---|---|
| **Local** | El historial está solo en tu equipo | RCS |
| **Centralizado** (CVCS) | Un **servidor central** tiene el historial; los usuarios solo tienen la versión con la que trabajan. Si el servidor cae, nadie puede guardar versiones | **Subversion (SVN)**, CVS |
| **Distribuido** (DVCS) | **Cada clon tiene el repositorio completo** con todo el historial. Puedes trabajar **sin conexión** | **Git**, Mercurial |

**Datos de Git que caen en el examen**

- Lo creó **Linus Torvalds en 2005** para desarrollar el **núcleo Linux**, cuando dejaron de poder usar BitKeeper gratis. Hoy lo mantiene **Junio C. Hamano**.
- Es **software libre** (licencia **GPL v2**).
- Guarda **instantáneas** (*snapshots*) completas del proyecto; si un fichero no cambia, reutiliza el anterior.
- Identifica cada objeto por un **hash**: por defecto **SHA-1** (40 caracteres hexadecimales). Ya admite **SHA-256** (64 caracteres) y **Git 3.0** lo usará por defecto en los repositorios nuevos.
- Casi todo es **local**, así que es muy rápido: `git log`, `git diff` o `git commit` no necesitan red.
- La **integridad** está garantizada: si un fichero se corrompe, el hash no coincide y Git lo detecta.

**Git no es GitHub**

| | Qué es |
|---|---|
| **Git** | El **programa** de control de versiones. Funciona en tu equipo, sin internet |
| **GitHub** | Un **servicio web** (de Microsoft) que aloja repositorios Git y añade Pull Requests, issues, Actions… |
| **GitLab** | Plataforma parecida; se puede instalar **en tus propios servidores** (muy usada en la Administración) |
| **Gitea / Forgejo / Bitbucket** | Otras plataformas que alojan repositorios Git |

> ⚠️ Trampa: "Git necesita conexión a un servidor para hacer commit". **Falso.** Git es **distribuido**: el commit se guarda **en tu repositorio local**. La red solo se usa para `clone`, `fetch`, `pull` y `push`.

> ⚠️ Trampa: **Git ≠ GitHub**. GitHub es una plataforma que **usa** Git. Puedes usar Git toda la vida sin GitHub.

> ⚠️ Trampa: Git guarda **instantáneas** (fotos completas), no "diferencias" como hacían CVS o SVN. (Internamente comprime con *deltas* en los packfiles, pero el modelo es de instantáneas.)

> 🏛️ AGE: muchas administraciones alojan su código en **GitLab propio** (instalado en sus servidores) y publican software libre en el **Centro de Transferencia de Tecnología (CTT)** del portal de administración electrónica.

### GIT-1.2 · Instalación y configuración

:::facil
**🧭 En pocas palabras.** Antes de usar Git hay que **instalarlo** y decirle **quién eres** (nombre y correo), porque **cada commit lleva tu firma**. La configuración se guarda en tres niveles: **sistema** (todo el equipo), **global** (tu usuario) y **local** (un solo repositorio). **Gana el más concreto**: el local.

**Imagínatelo así:** las normas de un **país**, de una **ciudad** y de **tu casa**. Si chocan, mandan las de tu casa.
:::
:::ingles
**🔤 Para recordarlo**
- `config` = *configuration*. `--global` = global (tu usuario), `--local` = local (este repo), `--system` = sistema (todos los usuarios).
- Desde Git 2.46 hay **subcomandos claros**: `git config set`, `get`, `unset`, `list`, `edit`. La forma antigua (`git config user.name "Ana"`, `--list`, `--unset`) **sigue funcionando**, pero la documentación oficial la marca como **obsoleta**.
- `alias` = alias, apodo: `git st` en vez de `git status`.
- **autocrlf** = *auto Carriage Return Line Feed*: convierte los finales de línea de Windows (CRLF) y Linux (LF).
:::

**Instalar y comprobar**

```bash
sudo apt install git          # Debian / Ubuntu
sudo dnf install git          # RHEL / Fedora
winget install --id Git.Git   # Windows (Git for Windows, incluye Git Bash)
git --version                 # comprobar versión: git version 2.56.0
```

**Configuración mínima (lo primero que se hace)**

```bash
git config --global user.name "Teresa López"          # tu nombre (forma clásica, la más vista en exámenes)
git config --global user.email "teresa@ejemplo.es"    # tu correo
git config set --global user.name "Teresa López"      # lo mismo con la sintaxis nueva (subcomando set)
git config --global init.defaultBranch main           # nombre de la rama inicial en repos nuevos
git config --global core.editor "nano"                # editor para los mensajes de commit
git config --global pull.rebase false                 # al hacer pull: fusionar (merge)
git config --global alias.st status                   # crea el alias: git st = git status
```

**Ver la configuración**

```bash
git config --list                       # toda la configuración (forma clásica)
git config list --show-origin           # sintaxis nueva, y de qué fichero sale cada valor
git config user.name                    # un valor concreto (clásica)
git config get user.email               # un valor concreto (nueva)
git config --global --unset alias.st    # borrar un valor (clásica) = git config unset --global alias.st
git config --global --edit              # abrir el fichero en el editor (= git config edit --global)
```

**Los tres niveles**

| Opción | Fichero | Afecta a |
|---|---|---|
| `--system` | `/etc/gitconfig` (o `$(prefix)/etc/gitconfig`) | Todos los usuarios del equipo |
| `--global` | `~/.gitconfig` (o `~/.config/git/config`) | Tu usuario, en todos tus repos |
| `--local` (**por defecto al escribir**) | `.git/config` del repositorio | Solo ese repositorio |

Se leen en ese orden y **el último valor leído gana**: **local > global > system**. Por encima de todo, `git -c clave=valor comando` cambia un valor solo para ese comando.

**Finales de línea (`core.autocrlf`)**

| Valor | Uso típico |
|---|---|
| `true` | **Windows**: convierte LF→CRLF al sacar ficheros y CRLF→LF al guardarlos |
| `input` | **Linux / macOS**: convierte CRLF→LF al guardar, no toca nada al sacar |
| `false` | No convierte nada |

**Pedir ayuda**

```bash
git help commit        # manual completo de commit
git commit --help      # lo mismo
git commit -h          # resumen corto de opciones en la consola
```

> ⚠️ Trampa: si no configuras `user.name` y `user.email`, Git **no te deja hacer commit** (o intenta adivinarlos y avisa). Es lo **primero** que se configura.

> ⚠️ Trampa: **prioridad**: **local** gana a global, y global gana a system. Al escribir sin indicar nivel, `git config` escribe en **local** (`.git/config`).

> ⚠️ Trampa: hoy la rama inicial por defecto de `git init` sigue siendo **`master`** (con un aviso). Se cambia con `init.defaultBranch` o `git init -b main`. **Git 3.0** pasará a usar `main`. GitHub y GitLab ya crean `main` por defecto.

> 💡 Clave: `git config --global user.name "Nombre"` y `git config --global user.email "correo"`: los dos comandos que **siempre** caen.

### GIT-1.3 · Las tres áreas y el ciclo de vida de un fichero

:::facil
**🧭 En pocas palabras.** En Git tus cambios pasan por **tres sitios**:
1. **Directorio de trabajo** (*working tree*): tus ficheros, donde editas.
2. **Área de preparación** (*staging area* o *index*): lo que has elegido para la próxima foto.
3. **Repositorio** (*repository*, la carpeta `.git`): las fotos ya guardadas (commits).

**Imagínatelo así:** una **mudanza**. Tu casa es el directorio de trabajo; la **caja abierta** donde metes cosas es el *staging* (`git add`); cuando la **cierras con cinta y le pones etiqueta**, haces el commit (`git commit`) y va al camión (el repositorio).
:::
:::ingles
**🔤 Para recordarlo**
- `init` = *initialize*: crea la carpeta oculta `.git`.
- `clone` = clonar: copia **todo** el repositorio, historial incluido.
- **Stage** = escenario: "subir al escenario" los cambios que saldrán en la foto. **Index** = índice (el nombre técnico).
- **Tracked / untracked** = con seguimiento / sin seguimiento.
- **Modified / staged / committed** = modificado / preparado / confirmado.
:::

```
 Directorio de trabajo   --git add-->   Área de preparación   --git commit-->   Repositorio (.git)
   (working tree)                       (staging / index)                     (commits)
        ^                                                                          |
        +-------------------------- git switch / git restore ----------------------+
```

**Estados de un fichero**

| Estado | Qué significa | Cómo llega ahí |
|---|---|---|
| **Untracked** (sin seguimiento) | Git lo ve pero **no lo controla** | Fichero nuevo |
| **Unmodified** (sin cambios) | Igual que en el último commit | Tras un commit |
| **Modified** (modificado) | Cambiado, pero **aún no preparado** | Lo editas |
| **Staged** (preparado) | Marcado para el **próximo commit** | `git add` |

**Crear o conseguir un repositorio**

```bash
mkdir proyecto && cd proyecto
git init                       # convierte la carpeta en repositorio (crea .git)
git init -b main               # igual, con la rama inicial "main"
git init --bare repo.git       # repositorio "desnudo" sin directorio de trabajo (para servidores)

git clone https://github.com/usuario/proyecto.git          # copia completa en la carpeta "proyecto"
git clone https://github.com/usuario/proyecto.git miapp    # la copia en la carpeta "miapp"
git clone git@github.com:usuario/proyecto.git              # por SSH
git clone -b develop https://github.com/usuario/proyecto.git   # clona y se sitúa en la rama develop
```

**¿Qué hay dentro de `.git`?**

| Elemento | Qué guarda |
|---|---|
| `objects/` | Todos los objetos (contenido de ficheros, carpetas, commits) |
| `refs/heads/` | Las ramas locales |
| `refs/tags/` | Las etiquetas |
| `HEAD` | Dónde estás: normalmente `ref: refs/heads/main` |
| `config` | La configuración **local** del repositorio |
| `index` | El área de preparación |
| `hooks/` | Scripts que se ejecutan en ciertos momentos |

> ⚠️ Trampa: **borrar la carpeta `.git` borra todo el historial**. Los ficheros de trabajo quedan, pero ya no es un repositorio.

> ⚠️ Trampa: un repositorio **bare** (`--bare`) **no tiene directorio de trabajo**: solo el contenido de `.git`. Se usa en **servidores** para recibir `push`. Por convenio su carpeta acaba en `.git` (`repo.git`).

> ⚠️ Trampa: `git clone` ya **configura el remoto `origin`** apuntando a la URL de la que clonaste y crea la rama local por defecto. No hace falta `git remote add`.

> 💡 Clave: el flujo básico es **editar → `git add` → `git commit`**. Si te preguntan "¿qué área hay entre el directorio de trabajo y el repositorio?", la respuesta es **el área de preparación (staging area / index)**.

## Nivel 2 — El trabajo diario

### GIT-2.1 · status, add y commit

:::facil
**🧭 En pocas palabras.** Tres comandos que usarás **todo el día**:
- `git status` → **¿cómo está todo?** (qué está modificado, qué está preparado, qué es nuevo).
- `git add` → **mete** cambios en la caja (staging).
- `git commit` → **cierra** la caja y guarda la foto con un mensaje.

**Imagínatelo así:** `git status` es **mirar la caja** antes de cerrarla, para no olvidar nada ni meter lo que no toca.
:::
:::ingles
**🔤 Para recordarlo**
- `-m` = **m**essage, mensaje del commit.
- `-a` (en commit) = **a**ll: prepara automáticamente los ficheros **ya controlados** que hayas modificado o borrado.
- `-A` (en add) = **A**ll: todo el árbol, también nuevos y borrados.
- `-p` = **p**atch: elegir **trozo a trozo** qué añadir.
- `--amend` = enmendar, corregir el **último** commit.
- `-s` (en status) = **s**hort, formato corto.
:::

```bash
git status                      # estado detallado
git status -s                   # formato corto: ?? nuevo, M modificado, A añadido
git add index.html              # prepara un fichero
git add src/                    # prepara una carpeta
git add .                       # prepara todo lo del directorio actual y subcarpetas (nuevos, modificados y borrados)
git add -A                      # prepara TODO el repositorio
git add -p                      # elige trozo a trozo (y = sí, n = no, s = dividir, q = salir)
git commit -m "Añade formulario de contacto"     # guarda la foto con mensaje
git commit                      # abre el editor para escribir el mensaje
git commit -am "Corrige errata" # -a + -m: prepara los ficheros YA controlados y hace commit
git commit --amend -m "Mensaje corregido"        # rehace el último commit (mensaje o contenido)
git commit --amend --no-edit    # añade lo preparado al último commit sin cambiar el mensaje
```

**`git status -s` (formato corto)**

| Código | Significa |
|---|---|
| `??` | Sin seguimiento (nuevo) |
| `A ` | Añadido al staging (nuevo y preparado) |
| `M ` (columna izquierda) | Modificado **y preparado** |
| ` M` (columna derecha) | Modificado **sin preparar** |
| `D` | Borrado |

La **columna izquierda** es el área de preparación; la **derecha**, el directorio de trabajo.

**Buenos mensajes de commit**

- Primera línea **corta** (unos 50 caracteres), en **imperativo**: "Añade validación del DNI", no "añadido" ni "cosas".
- Una línea en blanco y, si hace falta, el **porqué** del cambio.
- Un commit = **un cambio lógico**. Mejor varios commits pequeños que uno gigante.
- Muchos equipos usan **Conventional Commits**: `feat: añade login`, `fix: corrige cálculo del IVA`, `docs:`, `refactor:`, `test:`, `chore:` (se ve en GIT-4.3).

> ⚠️ Trampa: `git commit -a` **no incluye ficheros nuevos** (untracked). Solo los que Git ya controlaba. Para los nuevos hace falta `git add` antes.

> ⚠️ Trampa: `git add -A` (mayúscula) = todo el repositorio. En Git 2.x, `git add .` también incluye los **borrados**, pero **solo del directorio actual hacia abajo**.

> ⚠️ Trampa: `--amend` **crea un commit nuevo** (con otro hash) que sustituye al anterior. **No lo uses en commits que ya has subido** (*push*) y que otros pueden tener: les reescribes la historia.

> ⚠️ Trampa: si modificas un fichero **después** de hacer `git add`, el commit guardará la versión **del momento del add**. Tienes que volver a hacer `git add`.

> 💡 Clave: `git status` es el comando que más se usa. Ante la duda en el supuesto práctico: **status → add → commit**.

### GIT-2.2 · Ver el historial y las diferencias

:::facil
**🧭 En pocas palabras.**
- `git log` → **el diario**: lista de commits (quién, cuándo, qué mensaje).
- `git show` → **una página del diario** en detalle (el commit y sus cambios).
- `git diff` → **qué ha cambiado** entre dos sitios.
- `git blame` → **quién** escribió cada línea de un fichero.

**Imagínatelo así:** `git diff` es el juego de **"busca las diferencias"** entre dos dibujos.
:::
:::ingles
**🔤 Para recordarlo**
- `log` = cuaderno de bitácora. `--oneline` = en una línea. `--graph` = dibujo de ramas. `--all` = todas las ramas.
- `diff` = *difference*. `--staged` = lo preparado (sinónimo: `--cached`).
- `blame` = culpar: "¿quién tiene la culpa de esta línea?".
- `HEAD~1` = "el padre de HEAD" (la virgulilla `~` = **pasos hacia atrás**). `HEAD~3` = tres commits atrás.
- `-S` = *search*, buscar commits que añaden o quitan un texto ("pico", *pickaxe*).
:::

```bash
git log                              # historial completo de la rama actual
git log --oneline                    # una línea por commit: hash corto + mensaje
git log --oneline --graph --all      # árbol de todas las ramas (¡muy útil!)
git log -5                           # solo los 5 últimos (también -n 5)
git log --author="Teresa"            # commits de un autor
git log --since="2 weeks ago"        # de las dos últimas semanas (también --until)
git log --grep="IVA"                 # commits cuyo MENSAJE contiene "IVA"
git log -S "calcularIva"             # commits que AÑADEN o QUITAN ese texto en el código
git log -p fichero.py                # historial de un fichero con sus cambios
git log --stat                       # qué ficheros cambió cada commit
git log --follow antiguo.py          # sigue el historial aunque el fichero se renombrara
git log main..feature                # commits que están en feature y NO en main
git show a1b2c3d                     # detalle de un commit
git show HEAD~1                      # el penúltimo commit
git show v1.0:config.yml             # contenido de un fichero en la etiqueta v1.0
git shortlog -sn                     # número de commits por autor
git blame app.py                     # autor y commit de cada línea
git blame -L 10,20 app.py            # solo las líneas 10 a 20
```

**Las tres comparaciones de `git diff` (muy preguntado)**

| Comando | Compara | Pregunta que responde |
|---|---|---|
| `git diff` | Directorio de trabajo ↔ **staging** | ¿Qué he cambiado y **aún no he preparado**? |
| `git diff --staged` (= `--cached`) | **Staging** ↔ último commit | ¿Qué **entrará en el próximo commit**? |
| `git diff HEAD` | Directorio de trabajo ↔ último commit | ¿Qué he cambiado en total desde el último commit? |
| `git diff main feature` | Una rama ↔ otra | ¿En qué se diferencian dos ramas? |
| `git diff a1b2c3d e4f5g6h` | Un commit ↔ otro | |

**Referirse a commits**

| Forma | Significa |
|---|---|
| `a1b2c3d` | Hash abreviado (basta con 7 caracteres si no es ambiguo) |
| `HEAD` | El commit en el que estás |
| `HEAD~1`, `HEAD~2` | Uno, dos commits atrás (siguiendo el primer padre) |
| `HEAD^` | El padre (= `HEAD~1`); `HEAD^2` = **segundo padre** de un commit de fusión |
| `main`, `v1.0` | El commit al que apunta esa rama o etiqueta |
| `@` | Atajo de `HEAD` |

> ⚠️ Trampa: `git diff` **sin opciones no muestra lo que ya has preparado** con `git add`. Para eso: `git diff --staged` (o `--cached`, que es lo mismo).

> ⚠️ Trampa: `--grep` busca en el **mensaje** del commit; `-S` busca en el **contenido** (el código que cambió).

> ⚠️ Trampa: `HEAD~2` = **dos commits atrás**. `HEAD^2` = el **segundo padre** de un merge. No son lo mismo.

> 💡 Clave: `git log --oneline --graph --all` es el comando para **ver de un vistazo** todas las ramas y cómo se han fusionado.

### GIT-2.3 · .gitignore, borrar, mover y limpiar

:::facil
**🧭 En pocas palabras.** Hay ficheros que **no deben ir nunca al repositorio**: contraseñas, ficheros compilados, carpetas de dependencias (`node_modules/`), registros (`*.log`)… Se listan en un fichero llamado **`.gitignore`** y Git hace como si no existieran.

Para **borrar** o **mover** ficheros controlados se usan `git rm` y `git mv`, y para **limpiar** ficheros sin seguimiento, `git clean`.

**Imagínatelo así:** `.gitignore` es la lista de **"no se admiten"** en la puerta de una discoteca.
:::
:::ingles
**🔤 Para recordarlo**
- **ignore** = ignorar. `!` delante = **excepción** ("esto sí").
- `rm` = *remove*, borrar. `--cached` = solo del **índice** (deja de controlarlo, pero **el fichero se queda** en tu disco).
- `mv` = *move*, mover o renombrar.
- `clean` = limpiar. `-n` = *dry-ru**n***, simular. `-f` = **f**orce. `-d` = **d**irectorios. `-x` = también los ignorados.
:::

**Ejemplo de `.gitignore`**

```gitignore
# Los comentarios van SIEMPRE en su propia línea
# Cualquier fichero .log, en cualquier carpeta
*.log
# Excepción: este SÍ se controla
!importante.log
# La carpeta build SOLO en la raíz del repositorio
/build
# Cualquier CARPETA llamada node_modules (la barra final = solo directorios)
node_modules/
# Variables con contraseñas: ¡nunca al repositorio!
.env
# Los PDF de doc y de todas sus subcarpetas
doc/**/*.pdf
```

**Reglas de los patrones (según la documentación oficial)**

| Patrón | Significa |
|---|---|
| `#` al principio | Comentario |
| `*` | Cualquier cosa **excepto** `/` |
| `?` | Un carácter cualquiera |
| `!` al principio | **Excepción**: vuelve a incluir algo que se excluyó antes |
| `/` al principio | Ancla el patrón a la carpeta del `.gitignore` (normalmente la raíz) |
| `/` al final | Solo coincide con **carpetas** |
| `**` | Cualquier número de carpetas |

**Dónde se pueden poner reglas de exclusión**

| Sitio | ¿Se comparte con el equipo? |
|---|---|
| `.gitignore` (en el repo; puede haber uno por carpeta) | **Sí** (se hace commit de él) |
| `.git/info/exclude` | **No**: solo en tu copia |
| `core.excludesFile` (por defecto `~/.config/git/ignore`) | **No**: global para todos tus repos (ficheros del editor, `.DS_Store`…) |

```bash
git check-ignore -v app.log      # ¿por qué se ignora este fichero? (qué regla y de qué fichero)
git status --ignored             # muestra también los ignorados
```

**Borrar, mover y limpiar**

```bash
git rm viejo.txt                 # borra el fichero del disco Y prepara el borrado
git rm --cached secreto.env      # deja de controlarlo, pero el fichero SIGUE en tu disco
git rm -r --cached node_modules  # lo mismo con una carpeta (-r = recursivo)
git mv antiguo.py nuevo.py       # renombra y prepara el cambio
git clean -n                     # SIMULA: qué ficheros sin seguimiento se borrarían
git clean -f                     # borra los ficheros sin seguimiento (hace falta -f)
git clean -fd                    # también carpetas sin seguimiento
git clean -fdx                   # también los IGNORADOS (cuidado: borra .env, compilados…)
git clean -i                     # modo interactivo
```

> ⚠️ Trampa: **`.gitignore` no afecta a ficheros que ya se controlan**. Si `config.env` ya estaba en el repositorio, añadirlo al `.gitignore` no sirve: primero `git rm --cached config.env` y luego commit.

> ⚠️ Trampa: `git rm fichero` **borra el fichero de tu disco**. `git rm --cached fichero` **no**: solo deja de controlarlo.

> ⚠️ Trampa: `git clean` sin `-f` **no hace nada** (por seguridad, `clean.requireForce` está activado por defecto). Usa **`-n`** primero para ver qué borraría. Lo que borra `git clean` **no se puede recuperar con Git**, porque nunca estuvo en el repositorio.

> ⚠️ Trampa: en `.gitignore` los comentarios (`#`) solo valen **al principio de la línea**. `*.log # logs` **no** es un comentario: Git lo toma como parte del patrón.

> ⚠️ Trampa: Git **no controla carpetas vacías**, solo ficheros. Para conservar una carpeta vacía se mete dentro un fichero (por convenio, `.gitkeep`).

> ⚠️ Trampa: si excluyes una **carpeta**, no puedes volver a incluir con `!` un fichero que está **dentro**: Git ni siquiera entra en la carpeta.

> 🏛️ AGE: subir **contraseñas, certificados o datos personales** a un repositorio es un incidente de seguridad (ENS y RGPD). Por eso `.env`, `*.pem` o `*.p12` deben ir siempre en el `.gitignore`.

## Nivel 3 — Ramas

### GIT-3.1 · Ramas: crear, cambiar y borrar

:::facil
**🧭 En pocas palabras.** Una **rama** es una **línea de trabajo independiente**. Creas una rama para una tarea (por ejemplo, `feature/login`), trabajas en ella sin molestar a nadie y, cuando está lista, la **fusionas** con la principal (`main`).

Técnicamente, una rama es solo **una etiqueta que apunta a un commit** y avanza sola cuando haces commits. Por eso crear ramas en Git es **instantáneo**. **HEAD** indica **en qué rama estás**.

**Imagínatelo así:** las ramas son **vías de tren paralelas**; `git switch` es el **cambio de agujas**.
:::
:::ingles
**🔤 Para recordarlo**
- `branch` = rama. `-d` = **d**elete (seguro). `-D` = **D**elete a la fuerza (mayúscula = "a lo bestia"). `-m` = **m**ove (renombrar). `-a` = **a**ll (locales y remotas). `-r` = **r**emote. `-v` = **v**erbose.
- `switch` = cambiar. `-c` = **c**reate (crear y cambiar).
- `checkout` = sacar. `-b` = **b**ranch (crear y cambiar). Es el comando **antiguo**; `switch` y `restore` (desde Git 2.23, en 2019) lo dividieron en dos más claros.
- **detached HEAD** = cabeza separada: estás en un commit, **no** en una rama.
:::

```bash
git branch                       # lista las ramas locales (* = la actual)
git branch -a                    # locales y remotas
git branch -vv                   # con el último commit y la rama remota que siguen
git branch feature/login         # CREA la rama (pero te quedas donde estabas)
git switch feature/login         # CAMBIA a esa rama
git switch -c feature/login      # CREA y CAMBIA a la vez (lo más habitual)
git checkout -b feature/login    # lo mismo con el comando antiguo
git checkout feature/login       # cambiar con el comando antiguo
git switch -                     # vuelve a la rama anterior (como "cd -")
git switch -c hotfix v1.0        # crea una rama a partir de la etiqueta v1.0
git branch -m nuevo-nombre       # renombra la rama actual
git branch -m viejo nuevo        # renombra otra rama
git branch -d feature/login      # BORRA la rama (solo si ya está fusionada)
git branch -D experimento        # BORRA a la fuerza (aunque no esté fusionada: se pierden sus commits)
git branch --merged              # ramas ya fusionadas en la actual (se pueden borrar)
git branch --no-merged           # ramas con trabajo sin fusionar
git branch --delete-merged       # novedad de Git 2.56: borra las ramas locales ya fusionadas en su rama remota
```

**HEAD y el modo "detached HEAD"**

- Normalmente HEAD apunta a una **rama** (`.git/HEAD` contiene `ref: refs/heads/main`).
- Si haces `git switch --detach a1b2c3d` (o `git checkout a1b2c3d`), HEAD apunta **directamente a un commit**: estás en **detached HEAD**.
- Sirve para **mirar** cómo estaba el proyecto. Si haces commits ahí y te vas, **quedan huérfanos** (se pueden recuperar con `reflog` durante un tiempo). Para conservarlos: `git switch -c nueva-rama`.

**Cambiar de rama con cambios sin guardar**

- Si tus cambios **no chocan** con la otra rama, Git te deja cambiar y **se los lleva contigo**.
- Si **chocan**, Git **se niega** a cambiar. Opciones: hacer commit, guardarlos con `git stash` (GIT-5.2) o descartarlos.

> ⚠️ Trampa: `git branch nombre` **crea** la rama pero **no te cambia** a ella. Para crear y cambiar: `git switch -c nombre` o `git checkout -b nombre`.

> ⚠️ Trampa: `-d` (minúscula) **se niega** a borrar una rama con trabajo sin fusionar; `-D` (mayúscula) la borra **igualmente**. No puedes borrar **la rama en la que estás**.

> ⚠️ Trampa: en `git switch` la opción de crear es **`-c`**; en `git checkout` es **`-b`**. No los mezcles: `git switch -b` **da error**.

> ⚠️ Trampa: borrar una rama **local** no borra la **remota**. Para eso: `git push origin --delete nombre` (GIT-4.1).

> 💡 Clave: una rama es **un puntero ligero a un commit**. Crearla no copia ficheros: por eso es instantáneo.

### GIT-3.2 · Fusionar ramas y resolver conflictos

:::facil
**🧭 En pocas palabras.** **Fusionar** (*merge*) es **traer los cambios de otra rama a la tuya**. Te sitúas en la rama que **recibe** (normalmente `main`) y le dices qué rama quieres traer:

```bash
git switch main
git merge feature/login
```

Puede pasar de dos formas:
- **Fast-forward** (avance rápido): `main` no ha cambiado desde que creaste la rama → Git solo **mueve la etiqueta hacia delante**. No hay commit nuevo.
- **Fusión de tres vías** (*three-way merge*): las dos ramas han avanzado → Git crea un **commit de fusión** (*merge commit*) con **dos padres**.

Si las dos ramas cambiaron **las mismas líneas**, hay **conflicto** y te toca decidir a ti.

**Imagínatelo así:** dos personas editan la **misma frase** de un documento. Git no sabe cuál vale y te pregunta.
:::
:::ingles
**🔤 Para recordarlo**
- `merge` = fusionar. `--abort` = abortar, **cancelar** la fusión y volver a como estabas.
- `--no-ff` = *no fast-forward*: crear **siempre** commit de fusión (así queda constancia de la rama).
- `--ff-only` = solo si se puede hacer avance rápido; si no, falla.
- `--squash` = aplastar: junta todos los cambios de la rama en **un solo** cambio preparado (tú haces el commit).
- **ours / theirs** = lo nuestro (la rama en la que estás) / lo suyo (la que traes).
:::

```bash
git switch main
git merge feature/login               # fusiona feature/login en main
git merge --no-ff feature/login       # fuerza commit de fusión aunque se pudiera avanzar rápido
git merge --ff-only feature/login     # solo si es fast-forward; si no, se niega
git merge --squash feature/login      # trae los cambios aplastados SIN hacer commit…
git commit -m "Añade login"           # …y tú haces un único commit
git merge --abort                     # cancela una fusión con conflictos
```

**Resolver un conflicto, paso a paso**

1. `git merge rama` → Git avisa: `CONFLICT (content): Merge conflict in app.py`.
2. `git status` → muestra los ficheros en conflicto como **"both modified"**.
3. Abres el fichero. Git ha puesto unas **marcas**:

```text
<<<<<<< HEAD
precio = base * 1.21
=======
precio = base * IVA_GENERAL
>>>>>>> feature/iva
```

- Entre `<<<<<<< HEAD` y `=======` → **tu versión** (la rama en la que estás).
- Entre `=======` y `>>>>>>> feature/iva` → **la versión que traes**.

4. Editas: dejas el código correcto y **borras las tres marcas**.
5. `git add app.py` → marcas el conflicto como **resuelto**.
6. `git commit` → terminas la fusión (Git propone un mensaje).

```bash
git diff --name-only --diff-filter=U  # lista solo los ficheros en conflicto
git checkout --ours app.py            # quedarte con TU versión entera de ese fichero
git checkout --theirs app.py          # quedarte con la versión de la OTRA rama
git mergetool                         # abre una herramienta gráfica de fusión
git add --resolved                    # novedad de Git 2.56: prepara solo los ficheros resueltos (falla si quedan marcas)
```

> ⚠️ Trampa: `git merge X` **trae X a la rama en la que estás**. Para meter `feature` en `main`, primero **`git switch main`** y luego `git merge feature`. Hacerlo al revés mete `main` en `feature`.

> ⚠️ Trampa: un **fast-forward no crea commit de fusión**. Si quieres que quede constancia de la rama, usa `--no-ff`.

> ⚠️ Trampa: `git merge --squash` **no hace commit** ni registra la fusión: deja los cambios preparados y tú haces el commit. La rama original **no aparece como fusionada**.

> ⚠️ Trampa: para marcar un conflicto como resuelto se usa **`git add`** (no hay un comando "resolve"). Si haces commit sin borrar las marcas `<<<<<<<`, **se guardan en el código**.

> 💡 Clave: un **commit de fusión tiene dos padres**. En `git log --graph` se ve como dos líneas que se juntan.

### GIT-3.3 · Rebase: reescribir la base de una rama

:::facil
**🧭 En pocas palabras.** `git rebase main` coge **tus commits** de la rama actual y los **vuelve a aplicar, uno a uno, encima del último commit de `main`**. El resultado es una historia **lineal**, sin commits de fusión, como si hubieras empezado tu trabajo **hoy**.

**Imagínatelo así:** estás en la cola de la frutería, llega gente delante y tú te **vuelves a poner al final de la cola**, con tu misma compra. Tus commits son "nuevos" (otro hash), pero con los mismos cambios.

El **rebase interactivo** (`git rebase -i`) sirve para **arreglar tus commits antes de compartirlos**: juntarlos, cambiar mensajes, borrar alguno o reordenarlos.
:::
:::ingles
**🔤 Para recordarlo**
- **rebase** = re + base: **cambiar la base** (el punto de partida) de tu rama.
- `-i` = **i**nteractive.
- En el editor del rebase interactivo: **p**ick (coger tal cual), **r**eword (cambiar mensaje), **e**dit (parar para modificar), **s**quash (aplastar con el anterior **juntando mensajes**), **f**ixup (aplastar **tirando** el mensaje), **d**rop (soltar, borrar), e**x**ec (ejecutar un comando).
- `--continue` / `--skip` / `--abort` = continuar / saltar este commit / cancelar todo.
:::

```bash
git switch feature/login
git rebase main                 # pone los commits de feature/login encima de main
# si hay conflicto: lo resuelves, git add fichero y…
git rebase --continue           # sigue con el siguiente commit
git rebase --skip               # se salta el commit que da problemas
git rebase --abort              # cancela y deja todo como estaba

git rebase -i HEAD~3            # interactivo: revisa los 3 últimos commits
git commit --fixup=a1b2c3d      # crea un commit "fixup!" para corregir a1b2c3d…
git rebase -i --autosquash main # …y el rebase lo coloca y lo aplasta solo
```

**El editor del rebase interactivo** (los commits aparecen del **más antiguo** al más reciente):

```text
pick a1b2c3d Añade formulario
squash e4f5g6h Corrige errata del formulario
reword 7h8i9j0 Añade validacion
drop k1l2m3n Pruebas temporales
```

| Orden | Letra | Qué hace |
|---|---|---|
| `pick` | `p` | Usar el commit tal cual |
| `reword` | `r` | Usarlo, pero **cambiar el mensaje** |
| `edit` | `e` | Pararse ahí para modificar el commit (luego `git rebase --continue`) |
| `squash` | `s` | Fusionarlo con el **anterior** y **combinar los mensajes** |
| `fixup` | `f` | Fusionarlo con el anterior **descartando su mensaje** |
| `drop` | `d` | **Eliminar** el commit (también vale borrar la línea) |
| `exec` | `x` | Ejecutar un comando (por ejemplo, las pruebas) |

**Merge o rebase**

| | `merge` | `rebase` |
|---|---|---|
| Historia | Real, con **commits de fusión** (forma de "trenza") | **Lineal**, más limpia |
| ¿Reescribe commits? | **No** | **Sí** (crea commits nuevos con otro hash) |
| ¿Seguro con ramas compartidas? | **Sí** | **No**, solo con commits **que no has compartido** |

> ⚠️ Trampa: **la regla de oro del rebase**: **no hagas rebase de commits que ya has subido** y que otras personas pueden tener. Les cambias la historia y tendrán problemas. Úsalo solo en tu trabajo **local**.

> ⚠️ Trampa: `squash` **junta los mensajes**; `fixup` **descarta** el mensaje del commit aplastado. Ambos lo unen con el commit **anterior** (el de arriba en la lista).

> ⚠️ Trampa: en el rebase interactivo los commits salen en orden **del más antiguo (arriba) al más nuevo (abajo)**, al revés que en `git log`.

> ⚠️ Trampa: tras hacer rebase de una rama que **ya estaba en el remoto**, `git push` normal **se rechaza**. Habría que forzar, y lo seguro es `git push --force-with-lease` (GIT-4.1), nunca en ramas compartidas.

> 💡 Clave: **merge conserva la historia; rebase la reescribe para que quede lineal**.

## Nivel 4 — Remotos y colaboración

### GIT-4.1 · Repositorios remotos: fetch, pull y push

:::facil
**🧭 En pocas palabras.** Un **remoto** es **otra copia del repositorio** en un servidor (GitHub, GitLab…). Con él te comunicas con cuatro verbos:
- `git clone` → **copia** el repositorio por primera vez.
- `git fetch` → **trae** las novedades del servidor, pero **no toca tu trabajo**.
- `git pull` → **trae y fusiona** (= `fetch` + `merge`, o `fetch` + `rebase`).
- `git push` → **sube** tus commits al servidor.

**Imagínatelo así:** `fetch` es **mirar el buzón** y dejar las cartas en la mesa sin abrirlas; `pull` es **recogerlas y meterlas en tus carpetas**; `push` es **echar tus cartas al buzón**.
:::
:::ingles
**🔤 Para recordarlo**
- **fetch** = ir a buscar y traer (lo que hace un perro con la pelota).
- **pull** = tirar **hacia ti**. **push** = **empujar** hacia fuera.
- **origin** = origen: el nombre que Git da al remoto **del que clonaste**.
- `-u` = *set-**u**pstream*: "recuerda que esta rama va con esa rama remota". Después basta con `git push` y `git pull` a secas.
- `--force-with-lease` = forzar **"con contrato"**: solo si el remoto sigue como tú lo viste.
- `--prune` = podar: borrar referencias a ramas remotas que ya no existen.
:::

**Gestionar remotos**

```bash
git remote                          # nombres de los remotos (origin)
git remote -v                       # nombres y URL (fetch y push)
git remote add origin https://github.com/teresa/app.git   # añade un remoto llamado origin
git remote add upstream https://github.com/original/app.git  # el repo original (si trabajas con un fork)
git remote rename origin github     # renombra
git remote set-url origin git@github.com:teresa/app.git   # cambia la URL (p. ej. de HTTPS a SSH)
git remote remove upstream          # elimina el remoto (también: git remote rm)
git remote show origin              # detalles: ramas, seguimiento…
```

**Traer y subir**

```bash
git fetch                           # trae novedades del remoto por defecto (origin)
git fetch --all                     # de todos los remotos
git fetch --prune                   # y borra las ramas remotas que ya no existen (también -p)
git pull                            # fetch + integración en la rama actual
git pull --rebase                   # fetch + rebase (historia lineal)
git pull origin main                # trae la rama main de origin
git push -u origin main             # primera subida: sube main y la deja "vinculada" (upstream)
git push                            # siguientes veces
git push origin feature/login       # sube otra rama
git push origin --delete feature/login   # BORRA la rama en el remoto
git push --force-with-lease         # forzar de forma segura (tras rebase de TU rama)
git push --tags                     # sube todas las etiquetas
```

**Ramas remotas y de seguimiento**

- `origin/main` es una **rama de seguimiento remoto**: tu **foto** de cómo estaba `main` en el servidor la última vez que hablaste con él. Solo se actualiza con `fetch`/`pull`/`push`.
- `main` es **tu** rama local. Cuando "sigue" a `origin/main` (su *upstream*), `git status` te dice si vas **por delante** (*ahead*: tienes commits sin subir) o **por detrás** (*behind*: hay commits nuevos en el servidor).

```bash
git branch -vv                       # qué rama remota sigue cada rama local y si vas ahead/behind
git log main..origin/main            # qué commits hay en el servidor que yo no tengo (tras un fetch)
git switch feature/x                 # si solo existe origin/feature/x, Git crea la local y la vincula
```

**Cuando `git push` se rechaza**

Si alguien subió commits antes que tú, el servidor **rechaza** tu push (*non-fast-forward*, `rejected`). Lo correcto: **`git pull`** (traer e integrar) y después **`git push`**.

**Qué hace `git pull` si las ramas han divergido**

En las versiones actuales de Git, si tu rama y la remota **han divergido** y no has configurado cómo integrar, **`git pull` falla** y te pide elegir:

```bash
git config --global pull.rebase false   # fusionar (merge): crea commit de fusión si hace falta
git config --global pull.rebase true    # rebase: historia lineal
git config --global pull.ff only        # solo avance rápido; si han divergido, falla
```

> ⚠️ Trampa: **`git fetch` no modifica tu rama ni tus ficheros**. Solo actualiza las ramas `origin/...`. Es **seguro** en cualquier momento. `git pull` **sí** modifica tu rama.

> ⚠️ Trampa: `git pull` = **`git fetch` + `git merge`** (o `git rebase` si se configura o se usa `--rebase`).

> ⚠️ Trampa: `git push --force` **machaca** el remoto con tu versión y puede **borrar commits de otros**. `--force-with-lease` solo fuerza si nadie ha subido nada desde tu último fetch. **Nunca** se fuerza en `main` compartida.

> ⚠️ Trampa: `git push` **no sube las etiquetas** por defecto. Hay que subirlas aparte (`git push origin v1.0` o `git push --tags`).

> ⚠️ Trampa: `origin` **no es una palabra reservada**: es solo el nombre por defecto del remoto. Podrías llamarlo de otra forma.

> 💡 Clave: secuencia típica del día: **`git pull` → trabajar → `git add` → `git commit` → `git push`**.

### GIT-4.2 · GitHub y GitLab: forks, Pull Requests y autenticación

:::facil
**🧭 En pocas palabras.** GitHub y GitLab añaden a Git una **web para colaborar**:
- **Fork**: tu **copia personal** de un repositorio ajeno, en tu cuenta. Puedes cambiarla sin permiso del dueño.
- **Pull Request** (GitHub) o **Merge Request** (GitLab): **"por favor, revisad y fusionad mis cambios"**. Es donde se hace la **revisión de código** (*code review*).
- **Issues**: incidencias y tareas.
- **Ramas protegidas**: nadie puede subir directamente a `main`; hay que pasar por PR/MR con revisión y pruebas.

**Imagínatelo así:** un PR es como **entregar un trabajo al profesor**: lo revisa, te pide cambios y, cuando está bien, lo acepta.
:::
:::ingles
**🔤 Para recordarlo**
- **fork** = tenedor, bifurcación: el camino se divide en dos.
- **Pull Request** = petición de que **tiren** (*pull*) de tus cambios. **Merge Request** = petición de **fusión**: es lo mismo con el nombre de GitLab.
- **upstream** = aguas arriba: el repositorio **original** del que hiciste fork.
- **PAT** = *Personal Access Token*, token de acceso personal (una "contraseña" generada para Git y la API).
- **ed25519** = el tipo de clave SSH recomendado hoy (moderno, corto y seguro).
:::

**Flujo con fork (proyectos abiertos)**

```bash
# 1. En la web: botón "Fork" → se crea github.com/teresa/proyecto
git clone git@github.com:teresa/proyecto.git              # 2. clonas TU fork
cd proyecto
git remote add upstream https://github.com/original/proyecto.git   # 3. el original como "upstream"
git switch -c fix/errata                                  # 4. rama para tu cambio
git commit -am "Corrige errata en README"
git push -u origin fix/errata                             # 5. subes a TU fork
# 6. En la web: "Compare & pull request" hacia el repositorio original
git fetch upstream && git rebase upstream/main            # 7. mantener tu rama al día con el original
```

En un equipo con permisos de escritura **no hace falta fork**: se crean ramas en el mismo repositorio y se abre el PR/MR desde ellas.

**Autenticación**

| Método | URL | Cómo te identificas |
|---|---|---|
| **HTTPS** | `https://github.com/usuario/repo.git` | Usuario + **token (PAT)**. GitHub **dejó de aceptar la contraseña de la cuenta** para operaciones Git en **agosto de 2021** |
| **SSH** | `git@github.com:usuario/repo.git` | **Par de claves**: la pública se sube a la web, la privada se queda en tu equipo |

```bash
ssh-keygen -t ed25519 -C "teresa@ejemplo.es"     # genera el par de claves (~/.ssh/id_ed25519 y .pub)
cat ~/.ssh/id_ed25519.pub                        # copiar la PÚBLICA y pegarla en la web (Settings → SSH keys)
ssh -T git@github.com                            # probar la conexión
git config --global credential.helper cache      # guarda credenciales HTTPS en memoria un rato (15 min por defecto)
```

| `credential.helper` | Dónde guarda la credencial |
|---|---|
| `cache` | En **memoria**, temporalmente |
| `store` | En un fichero **en texto plano** (`~/.git-credentials`): poco seguro |
| `manager` | **Git Credential Manager** (incluido en Git for Windows): almacén seguro del sistema |

**Herramientas de línea de comandos de las plataformas**

```bash
gh auth login                    # GitHub CLI: iniciar sesión
gh repo clone teresa/proyecto    # clonar
gh pr create --fill              # crear un Pull Request desde la rama actual
gh pr checkout 42                # traer a tu equipo el PR número 42 para probarlo
glab mr create                   # GitLab CLI: crear un Merge Request
```

**Funciones de colaboración que se preguntan**

| Función | Para qué |
|---|---|
| **Ramas protegidas** | Impedir push directo o forzado a `main`; exigir PR/MR, revisiones y pruebas en verde |
| **CODEOWNERS** | Fichero que indica **quién debe revisar** cada parte del código |
| **Revisión de código** | Comentarios línea a línea, aprobar o pedir cambios |
| **Formas de fusionar un PR** | *Merge commit*, *Squash and merge* (un solo commit) o *Rebase and merge* (historia lineal) |
| **Issues / incidencias** | Tareas y errores; `Closes #12` en un commit o PR cierra la incidencia 12 al fusionar |
| **Roles** | GitHub: Read, Triage, Write, Maintain, Admin. GitLab: Guest, Planner, Reporter, Developer, Maintainer, Owner |

> ⚠️ Trampa: **Pull Request (GitHub) = Merge Request (GitLab)**. Mismo concepto, distinto nombre.

> ⚠️ Trampa: un **fork** es una copia **en el servidor** (en tu cuenta); un **clone** es una copia **en tu equipo**. Normalmente haces las dos cosas: fork y luego clone de tu fork.

> ⚠️ Trampa: en SSH, la clave que se sube a GitHub/GitLab es la **pública** (`.pub`). La **privada nunca se comparte**.

> ⚠️ Trampa: en GitHub, para Git por HTTPS ya **no vale la contraseña** de la cuenta: se usa un **token (PAT)** o SSH.

> 🏛️ AGE: es habitual un **GitLab interno** con ramas protegidas, revisión obligatoria por un *Maintainer* e integración continua antes de fusionar a `main`.

### GIT-4.3 · Flujos de trabajo, Conventional Commits y versionado semántico

:::facil
**🧭 En pocas palabras.** Un **flujo de trabajo** (*workflow*) son las **normas del equipo** sobre qué ramas existen y cómo se fusionan. Los más conocidos:
- **Git Flow**: muchas ramas fijas (`main`, `develop`, `feature/*`, `release/*`, `hotfix/*`). Ordenado pero pesado.
- **GitHub Flow**: muy simple: `main` siempre lista para desplegar + ramas cortas + Pull Request.
- **Trunk-based development**: todos integran en la rama principal (*trunk*, tronco) **muy a menudo**, con ramas que duran horas o pocos días.

**Imagínatelo así:** Git Flow es una **autopista con muchos carriles y salidas**; GitHub Flow es **una carretera principal con desvíos cortos**.
:::
:::ingles
**🔤 Para recordarlo**
- **feature** = funcionalidad. **release** = publicación, versión. **hotfix** = arreglo **en caliente** (urgente, en producción).
- **trunk** = tronco (del árbol): la rama principal.
- **Conventional Commits**: `feat` = *feature*, `fix` = arreglo, `docs` = documentación, `refactor` = reorganizar sin cambiar comportamiento, `test` = pruebas, `chore` = tarea rutinaria.
- **SemVer** = *Semantic Versioning*: **MAYOR.MENOR.PARCHE** (*MAJOR.MINOR.PATCH*).
:::

**Git Flow** (propuesto por Vincent Driessen en 2010)

| Rama | Para qué | Sale de | Se fusiona en |
|---|---|---|---|
| `main` (o `master`) | Lo que está **en producción**; cada versión, etiquetada | — | — |
| `develop` | Integración del **desarrollo** | `main` | — |
| `feature/*` | Una funcionalidad nueva | `develop` | `develop` |
| `release/*` | Preparar una versión (pruebas, últimos ajustes) | `develop` | `main` **y** `develop` |
| `hotfix/*` | Arreglo **urgente** de producción | `main` | `main` **y** `develop` |

**Comparativa**

| Flujo | Ramas | Ideal para |
|---|---|---|
| **Git Flow** | `main`, `develop`, `feature`, `release`, `hotfix` | Versiones planificadas (aplicaciones con "versión 2.3") |
| **GitHub Flow** | `main` + ramas de funcionalidad + PR | Despliegue continuo (webs, servicios) |
| **GitLab Flow** | GitHub Flow + ramas de **entorno** (`staging`, `production`) o de versión | Varios entornos de despliegue |
| **Trunk-based** | `trunk`/`main` + ramas **muy cortas**; lo incompleto se oculta con *feature flags* | Integración continua intensiva |

**Conventional Commits**

```text
feat: añade inicio de sesión con Cl@ve
fix(facturas): corrige redondeo del IVA
docs: actualiza el README
feat!: elimina la API v1
```

- Formato: `tipo(ámbito opcional): descripción`.
- `!` tras el tipo, o un pie `BREAKING CHANGE:`, indica un **cambio incompatible**.

**Versionado semántico (SemVer): `MAYOR.MENOR.PARCHE`**

| Sube… | Cuándo | Ejemplo | Conventional Commits |
|---|---|---|---|
| **MAYOR** | Cambios **incompatibles** | 1.4.2 → **2.0.0** | `BREAKING CHANGE` / `!` |
| **MENOR** | Funcionalidad nueva **compatible** | 1.4.2 → 1.**5**.0 | `feat` |
| **PARCHE** | Correcciones **compatibles** | 1.4.2 → 1.4.**3** | `fix` |

Al subir una cifra, **las de su derecha vuelven a 0**. Las versiones `0.y.z` son de desarrollo inicial (todo puede cambiar). `1.0.0-beta.1` es una **pre-versión**.

> ⚠️ Trampa: en **Git Flow**, `hotfix` sale de **`main`** (no de develop) y se fusiona en **`main` y en `develop`**, para que el arreglo no se pierda.

> ⚠️ Trampa: en SemVer, de 1.9.0 con una funcionalidad nueva se pasa a **1.10.0**, no a 2.0.0. Cada número es independiente.

> ⚠️ Trampa: **GitHub Flow no tiene rama `develop`**: solo `main` y ramas cortas.

> 💡 Clave: `feat` → sube la **menor**, `fix` → sube el **parche**, cambio incompatible → sube la **mayor**.

## Nivel 5 — Deshacer, recuperar y versionar

### GIT-5.1 · Deshacer cambios: restore, reset y revert

:::facil
**🧭 En pocas palabras.** Hay que elegir la herramienta según **dónde está el error**:
- Cambios **sin preparar** que quieres tirar → `git restore fichero`.
- Algo que has **preparado** (`git add`) y no querías → `git restore --staged fichero`.
- El **último commit** está mal y **no lo has subido** → `git commit --amend` o `git reset`.
- Un commit **ya subido y compartido** → `git revert` (crea un commit nuevo que lo deshace).

**Imagínatelo así:** `reset` es **arrancar páginas** del cuaderno (desaparecen); `revert` es **escribir una página nueva** que dice "lo de la página 5 queda anulado". Si el cuaderno ya lo han fotocopiado tus compañeros, **no arranques páginas**: escribe una nueva.
:::
:::ingles
**🔤 Para recordarlo**
- **restore** = restaurar ficheros. `--staged` = en el área de preparación. `--source` = desde qué commit.
- **reset** = reiniciar: mueve **la rama** a otro commit. `--soft` (suave), `--mixed` (mixto, **por defecto**), `--hard` (duro, **destructivo**).
- **revert** = revertir: crea un commit **inverso**. No borra nada.
- 🧠 Truco para reset: **soft** = solo mueve la rama; **mixed** = además vacía la caja (staging); **hard** = además **tira** tus cambios de los ficheros. Cuanto más "duro", más cosas borra.
:::

**Restaurar ficheros (`git restore`, desde Git 2.23)**

```bash
git restore app.py                      # descarta los cambios SIN preparar (vuelve a como está en el staging)
git restore .                           # lo mismo con todo
git restore --staged app.py             # saca app.py del staging (el cambio sigue en el fichero)
git restore --source=HEAD~2 app.py      # recupera app.py tal como estaba hace 2 commits
git restore --staged --worktree app.py  # deja app.py como en el último commit (staging y fichero)
# Equivalentes antiguos que aún verás:
git checkout -- app.py                  # = git restore app.py
git reset HEAD app.py                   # = git restore --staged app.py
```

**`git reset`: mover la rama**

```bash
git reset --soft HEAD~1     # deshace el último commit; sus cambios quedan PREPARADOS
git reset HEAD~1            # (--mixed, por defecto) deshace el commit; cambios en los ficheros, SIN preparar
git reset --hard HEAD~1     # deshace el commit y BORRA sus cambios (¡destructivo!)
git reset --hard origin/main   # deja tu rama exactamente como el servidor (tira lo local)
git reset --soft HEAD~3 && git commit -m "Un solo commit"   # junta los 3 últimos commits en uno
git reset --hard ORIG_HEAD   # deshacer el reset: Git guarda en ORIG_HEAD dónde estaba la rama antes
```

| Modo | Rama (HEAD) | Staging | Ficheros | Uso típico |
|---|---|---|---|---|
| `--soft` | Se mueve | **Igual** | **Igual** | Rehacer el commit (juntar commits, cambiar mensaje) |
| `--mixed` (**defecto**) | Se mueve | Se vacía | **Igual** | Deshacer commit y volver a elegir qué preparar |
| `--hard` | Se mueve | Se vacía | **Se pierden los cambios** | Tirarlo todo y volver a un estado limpio |

**`git revert`: deshacer con un commit nuevo**

```bash
git revert a1b2c3d          # crea un commit que deshace los cambios de a1b2c3d
git revert HEAD             # deshace el último commit
git revert --no-edit HEAD   # sin abrir el editor para el mensaje
git revert -n a1b2c3d       # aplica la inversión sin hacer commit todavía (--no-commit)
git revert -m 1 f00ba12     # revertir un COMMIT DE FUSIÓN: -m 1 = conservar el primer padre
```

**Qué usar en cada caso**

| Situación | Comando |
|---|---|
| Tirar cambios de un fichero sin preparar | `git restore fichero` |
| Quitar algo del staging | `git restore --staged fichero` |
| Corregir el mensaje del último commit (no subido) | `git commit --amend` |
| Deshacer commits **locales** | `git reset` (`--soft` / `--mixed` / `--hard`) |
| Deshacer un commit **ya compartido** | **`git revert`** |

> ⚠️ Trampa: **`git reset --hard` destruye** los cambios no guardados de los ficheros controlados. Los commits "quitados" aún se pueden recuperar un tiempo con `git reflog` (GIT-5.2), pero los cambios que **nunca llegaron a commit, no**.

> ⚠️ Trampa: el modo **por defecto** de `git reset` es **`--mixed`**, no `--soft` ni `--hard`.

> ⚠️ Trampa: **`revert` no borra el commit original**: añade uno nuevo que hace lo contrario. Por eso es **el único seguro en ramas compartidas**. `reset` reescribe la historia.

> ⚠️ Trampa: `git revert HEAD~3` deshace **solo** ese commit, no los tres últimos.

> ⚠️ Trampa: `git reset fichero` (con ruta) **no mueve la rama**: solo saca el fichero del staging, igual que `git restore --staged fichero`.

> 💡 Clave: **¿ya está subido y compartido? → `revert`. ¿Es solo local? → `reset` o `--amend`.**

### GIT-5.2 · stash, cherry-pick y reflog: guardar, copiar y recuperar

:::facil
**🧭 En pocas palabras.**
- `git stash` → **guarda tus cambios a medias en un cajón** y te deja el directorio limpio (para cambiar de rama o atender una urgencia). Luego los recuperas con `git stash pop`.
- `git cherry-pick` → **copia un commit concreto** de otra rama a la tuya (por ejemplo, un arreglo).
- `git reflog` → **la caja negra**: registra **cada movimiento de HEAD** (commits, resets, cambios de rama…). Sirve para **recuperar** commits "perdidos".

**Imagínatelo así:** te llama tu jefa con una urgencia cuando estás a mitad de algo: **guardas los papeles en el cajón** (`stash`), atiendes la urgencia y luego **los sacas** (`pop`).
:::
:::ingles
**🔤 Para recordarlo**
- **stash** = alijo, escondite. `push` = guardar (es lo que hace `git stash` a secas). `pop` = sacar **y borrar** del cajón. `apply` = sacar **sin borrar**. `list`, `show`, `drop` (tirar uno), `clear` (vaciar todo).
- `-u` = *include-**u**ntracked*: incluir también los ficheros **nuevos**.
- **cherry-pick** = recoger **solo la cereza que quieres** del árbol.
- **reflog** = *reference log*, registro de referencias.
:::

**`git stash`**

```bash
git stash                         # guarda los cambios (de ficheros controlados) y limpia
git stash push -m "formulario a medias"   # con descripción
git stash -u                      # incluye ficheros nuevos (sin seguimiento)
git stash list                    # stash@{0}: el más reciente, stash@{1}…
git stash show -p stash@{1}       # ver qué contiene
git stash pop                     # aplica el último y lo QUITA de la lista
git stash apply stash@{1}         # aplica ese stash y lo DEJA en la lista
git stash drop stash@{1}          # borra uno
git stash clear                   # borra todos
git stash branch nueva-rama       # crea una rama desde donde se hizo el stash y lo aplica allí
```

**`git cherry-pick`**

```bash
git switch main
git cherry-pick a1b2c3d           # copia ese commit encima de main (con otro hash)
git cherry-pick -x a1b2c3d        # añade al mensaje "(cherry picked from commit …)"
git cherry-pick -n a1b2c3d        # aplica los cambios sin hacer commit (--no-commit)
git cherry-pick a1b2c3d e4f5g6h   # varios commits
git cherry-pick --continue        # tras resolver un conflicto (también --abort, --skip)
```

**`git reflog`: recuperar lo "perdido"**

```bash
git reflog                        # historial de movimientos de HEAD
# a1b2c3d HEAD@{0}: reset: moving to HEAD~2
# 9f8e7d6 HEAD@{1}: commit: Añade informe mensual   ← el commit que "perdí"
git reset --hard HEAD@{1}         # volver a ese estado…
git switch -c rescate 9f8e7d6     # …o, más prudente, crear una rama en ese commit
git branch recuperada 9f8e7d6     # recuperar una rama borrada por error con -D
```

> ⚠️ Trampa: **`pop` aplica y borra** del cajón; **`apply` aplica y lo deja**. Si `pop` da conflicto, el stash **no se borra**: lo resuelves y lo quitas tú con `git stash drop`.

> ⚠️ Trampa: `git stash` **sin `-u` no guarda los ficheros nuevos** (sin seguimiento): se quedan en el directorio. `-a` (`--all`) guarda además los **ignorados**.

> ⚠️ Trampa: `git stash save "mensaje"` está **obsoleto**: se usa `git stash push -m "mensaje"`.

> ⚠️ Trampa: el **reflog es local**: no se sube al servidor ni se clona. Sus entradas caducan (por defecto **90 días**, y **30** las de commits que ya no son alcanzables).

> ⚠️ Trampa: `cherry-pick` **copia** el commit (crea uno **nuevo** con otro hash); no lo mueve.

> 💡 Clave: "He hecho `reset --hard` y he perdido commits" → **`git reflog`**.

### GIT-5.3 · Etiquetas y versiones

:::facil
**🧭 En pocas palabras.** Una **etiqueta** (*tag*) es un **nombre fijo para un commit importante**, normalmente una versión: `v1.0`, `v2.3.1`. A diferencia de una rama, **no se mueve**.

Hay dos tipos:
- **Ligera** (*lightweight*): solo un nombre que apunta a un commit, como un pósit.
- **Anotada** (*annotated*): un objeto completo con **autor, fecha, mensaje** y, si quieres, **firma**. Es la recomendada para publicar versiones.

**Imagínatelo así:** una rama es un **marcapáginas que avanzas** mientras lees; una etiqueta es **un subrayado** que se queda siempre en la misma página.
:::
:::ingles
**🔤 Para recordarlo**
- **tag** = etiqueta. `-a` = **a**nnotated (anotada). `-m` = **m**essage. `-s` = **s**igned (firmada). `-d` = **d**elete. `-l` = **l**ist.
- **describe** = describir: dice a qué distancia estás de la última etiqueta.
- **release** = publicación: en GitHub/GitLab, una página de versión construida **sobre una etiqueta**, con notas y ficheros descargables.
:::

```bash
git tag                               # lista las etiquetas
git tag -l "v1.*"                     # lista con patrón
git tag v1.0                          # etiqueta LIGERA en el commit actual
git tag -a v1.0 -m "Versión 1.0"      # etiqueta ANOTADA (recomendada)
git tag -a v0.9 a1b2c3d -m "Beta"     # etiqueta un commit anterior
git tag -s v1.0 -m "Versión firmada"  # anotada y FIRMADA
git show v1.0                         # datos de la etiqueta y del commit
git push origin v1.0                  # sube UNA etiqueta
git push --tags                       # sube TODAS las etiquetas
git push --follow-tags                # sube los commits y las etiquetas ANOTADAS que apuntan a ellos
git tag -d v1.0                       # borra la etiqueta LOCAL
git push origin --delete v1.0         # borra la etiqueta en el REMOTO
git switch --detach v1.0              # ver el código de esa versión (detached HEAD)
git switch -c arreglo-v1 v1.0         # crear una rama a partir de la versión 1.0
git describe                          # p. ej. v1.0-4-g9f8e7d6 = 4 commits después de v1.0
```

| | Ligera | Anotada |
|---|---|---|
| Comando | `git tag v1.0` | `git tag -a v1.0 -m "…"` |
| Guarda autor, fecha y mensaje | No | **Sí** |
| Se puede firmar | No | **Sí** (`-s`) |
| Uso | Marcas temporales o privadas | **Versiones publicadas** |

> ⚠️ Trampa: `git push` **no sube etiquetas**. Hay que hacer `git push origin v1.0` o `git push --tags`.

> ⚠️ Trampa: `git tag -d v1.0` solo borra la etiqueta **local**. En el remoto sigue hasta que haces `git push origin --delete v1.0`.

> ⚠️ Trampa: **no muevas** una etiqueta ya publicada: quien la descargó tendrá la antigua. Si te equivocaste, publica **otra versión** (v1.0.1).

> 💡 Clave: para versiones oficiales, **etiquetas anotadas** (`-a`) y, a ser posible, **firmadas** (`-s`).

## Nivel 6 — Profesional

### GIT-6.1 · Depuración, repositorios grandes y varios proyectos

:::facil
**🧭 En pocas palabras.** Herramientas para situaciones de profesional:
- `git bisect` → encontrar **qué commit introdujo un error** haciendo una **búsqueda binaria** (partiendo el historial por la mitad una y otra vez).
- `git worktree` → tener **varias ramas sacadas a la vez** en carpetas distintas.
- **Submódulos** → meter **otro repositorio dentro** del tuyo, fijado en un commit concreto.
- **Git LFS** → guardar **ficheros grandes** (vídeos, ISO, diseños) fuera del historial normal.
- **Clon superficial, parcial y sparse-checkout** → descargar **menos** cuando el repositorio es enorme.

**Imagínatelo así:** `bisect` es el juego de **"adivina el número del 1 al 100"**: "¿mayor o menor?". En unos 7 intentos lo encuentras.
:::
:::ingles
**🔤 Para recordarlo**
- **bisect** = bisecar, partir en dos. `good` = bueno (aquí funcionaba), `bad` = malo (aquí falla), `reset` = terminar y volver.
- **worktree** = árbol de trabajo (otra carpeta de trabajo del mismo repo).
- **submodule** = submódulo. **superproject** = el repositorio que lo contiene.
- **LFS** = *Large File Storage*, almacenamiento de ficheros grandes.
- `--depth` = profundidad (cuántos commits de historia). **shallow** = superficial. **sparse** = disperso, escaso (solo algunas carpetas).
:::

**`git bisect`**

```bash
git bisect start
git bisect bad                    # el commit actual tiene el error
git bisect good v1.2              # en v1.2 funcionaba
# Git te sitúa a mitad de camino: pruebas y le dices…
git bisect good                   # …aquí funciona, o…
git bisect bad                    # …aquí falla. Repite hasta que Git diga "X is the first bad commit"
git bisect reset                  # terminar y volver a donde estabas
git bisect run ./pruebas.sh       # automático: el script devuelve 0 si va bien y otro valor si falla (125 = saltar)
```

**`git worktree`**

```bash
git worktree add ../app-hotfix hotfix/1.2.1   # saca la rama hotfix/1.2.1 en otra carpeta
git worktree add -b urgente ../app-urgente    # crea la rama "urgente" y la saca en otra carpeta
git worktree list
git worktree remove ../app-hotfix
```

**Submódulos**

```bash
git submodule add https://github.com/org/libreria.git libs/libreria   # añade (crea .gitmodules)
git clone --recurse-submodules https://github.com/org/app.git         # clonar CON los submódulos
git submodule update --init --recursive    # si ya clonaste sin ellos: descargarlos
git submodule update --remote              # actualizar al último commit de su rama
```

El repositorio principal guarda **el commit exacto** del submódulo, no "la última versión".

**Git LFS** (extensión aparte: `git-lfs`)

```bash
git lfs install                   # activar LFS para tu usuario (una vez)
git lfs track "*.iso"             # gestionar los .iso con LFS (lo apunta en .gitattributes)
git add .gitattributes
git lfs ls-files                  # ficheros gestionados por LFS
```

En el repositorio se guarda solo un **puntero** pequeño; el fichero real va a un almacén LFS.

**Repositorios muy grandes**

```bash
git clone --depth 1 https://…/repo.git             # SUPERFICIAL: solo el último commit (sin historia)
git clone --filter=blob:none https://…/repo.git    # PARCIAL: historia completa, el contenido de ficheros se descarga cuando hace falta
git sparse-checkout set docs src/api               # solo saca esas carpetas al directorio de trabajo
git maintenance start                              # tareas de mantenimiento en segundo plano
git gc                                             # compactar y limpiar objetos innecesarios
git fsck                                           # comprobar la integridad del repositorio
```

> ⚠️ Trampa: `git bisect` hace una **búsqueda binaria**: con 1000 commits encuentra el culpable en unos **10 pasos**. No te olvides de **`git bisect reset`** al terminar.

> ⚠️ Trampa: al clonar un repositorio con submódulos **sin** `--recurse-submodules`, las carpetas de los submódulos quedan **vacías**. Se arreglan con `git submodule update --init --recursive`.

> ⚠️ Trampa: un clon **superficial** (`--depth 1`) **no tiene el historial**; uno **parcial** (`--filter=blob:none`) **sí** tiene toda la historia de commits, pero descarga el contenido de los ficheros cuando los necesita.

> ⚠️ Trampa: **Git LFS no viene con Git**: es una extensión que hay que instalar, y el servidor tiene que admitirla.

### GIT-6.2 · Por dentro, hooks y seguridad

:::facil
**🧭 En pocas palabras.**
- **Por dentro**, Git es una **base de datos de objetos** identificados por su hash: **blob** (contenido de un fichero), **tree** (una carpeta), **commit** (una foto) y **tag** (etiqueta anotada).
- Los **hooks** (ganchos) son **scripts que Git ejecuta automáticamente** en ciertos momentos: antes de un commit, antes de un push… Sirven para pasar pruebas o comprobar el formato.
- **Seguridad**: firmar commits, no subir secretos y saber qué hacer si se cuela uno.

**Imagínatelo así:** el hash es la **huella dactilar** de cada objeto: si cambia una coma, cambia la huella. Por eso no se puede modificar la historia sin que se note.
:::
:::ingles
**🔤 Para recordarlo**
- **blob** = *Binary Large OBject*: el contenido de un fichero (sin nombre). **tree** = árbol: una carpeta (nombres + punteros). **commit** = la foto (árbol + padres + autor + mensaje).
- `cat-file` = "muéstrame el fichero (objeto)". `-t` = **t**ype, `-p` = **p**retty-print (mostrar bonito).
- **hook** = gancho. **pre-** = antes, **post-** = después.
- `-S` (mayúscula) en commit = **S**ign, firmar. `--no-verify` = no verificar (salta los hooks pre-commit y commit-msg).
:::

**Los objetos de Git**

| Objeto | Contiene |
|---|---|
| **blob** | El **contenido** de un fichero (sin nombre ni permisos) |
| **tree** | Lista de nombres de ficheros y carpetas, con sus permisos y el hash de cada blob o tree |
| **commit** | El hash del **tree** raíz, el/los **padre(s)**, **autor**, **committer**, fecha y **mensaje** |
| **tag** (anotada) | El objeto etiquetado, nombre, autor, mensaje y firma opcional |

```bash
git rev-parse HEAD            # hash completo del commit actual
git cat-file -t a1b2c3d       # tipo del objeto: commit, tree, blob o tag
git cat-file -p a1b2c3d       # contenido del objeto, legible
git ls-tree HEAD              # el tree del último commit
git ls-files                  # ficheros que controla Git (los del índice)
git hash-object fichero.txt   # hash que tendría ese fichero como blob
```

**Hooks**

| Hook | Cuándo | Uso típico |
|---|---|---|
| `pre-commit` | **Antes** de crear el commit | Pasar el linter o las pruebas rápidas; si falla, **no hay commit** |
| `prepare-commit-msg` | Antes de abrir el editor del mensaje | Plantilla de mensaje |
| `commit-msg` | Tras escribir el mensaje | Comprobar el formato (p. ej., Conventional Commits) |
| `post-commit` | Después del commit | Avisos |
| `pre-push` | Antes de enviar al remoto | Pruebas completas |
| `pre-receive`, `update`, `post-receive` | **En el servidor**, al recibir un push | Rechazar pushes, desplegar |

- Están en `.git/hooks/` (Git trae ejemplos `*.sample`). Deben ser **ejecutables** y llamarse exactamente como el hook.
- **No se clonan ni se suben**: `.git/hooks` no forma parte del repositorio. Para compartirlos: una carpeta del repo y `git config core.hooksPath .githooks`, o herramientas como *pre-commit*.
- `git commit --no-verify` se salta `pre-commit` y `commit-msg`.

**Firmar commits y etiquetas**

```bash
git config --global gpg.format ssh                          # firmar con clave SSH (desde Git 2.34) en vez de GPG
git config --global user.signingkey ~/.ssh/id_ed25519.pub
git commit -S -m "Commit firmado"                           # firmar un commit
git config --global commit.gpgsign true                     # firmar todos los commits
git log --show-signature -1                                 # comprobar la firma
git verify-commit HEAD                                      # verificar un commit (también verify-tag)
```

**Seguridad práctica**

- **"detected dubious ownership"**: desde Git **2.35.2** (2022, vulnerabilidad CVE-2022-24765), Git **se niega a trabajar** en un repositorio cuyo propietario es otro usuario. Si confías en él: `git config --global --add safe.directory /ruta/al/repo`.
- **Si subes un secreto** (contraseña, token, clave): **lo primero es revocarlo o cambiarlo**, porque ya puede estar copiado. Después se limpia la historia con **`git filter-repo`** (la documentación de Git desaconseja el antiguo `git filter-branch`) y se fuerza la subida, avisando al equipo.
- **Prevenir**: `.gitignore`, hooks `pre-commit` que buscan secretos, y la protección de las plataformas (GitHub *secret scanning* / *push protection*).

**Lo que cambiará en Git 3.0** (sin fecha todavía, según la documentación oficial *BreakingChanges*)

| Cambio | Hoy | Git 3.0 |
|---|---|---|
| Hash de los repositorios nuevos | SHA-1 | **SHA-256** |
| Rama inicial | `master` | **`main`** |
| Almacenamiento de referencias | `files` | **`reftable`** |
| Comandos retirados | `git whatchanged`, `git pack-redundant` | Desaparecen (`git log --raw` sustituye a `whatchanged`) |
| `safe.bareRepository` | `all` | `explicit` (más seguro) |
| Compilar Git | Rust opcional | **Rust obligatorio** |

> ⚠️ Trampa: **los hooks no se comparten al clonar**: viven en `.git/hooks`, que no se sube. Tampoco son una medida de seguridad fiable en el cliente, porque se pueden saltar con `--no-verify`. Lo que de verdad obliga son los hooks **del servidor** y las **ramas protegidas**.

> ⚠️ Trampa: un **blob no guarda el nombre** del fichero; el nombre está en el **tree**. Dos ficheros con el mismo contenido comparten blob.

> ⚠️ Trampa: si se filtra una contraseña en un commit, **borrar el fichero en un commit nuevo no basta**: sigue en el historial. Hay que **revocarla** y limpiar la historia.

> 💡 Clave: `pre-commit` se ejecuta **antes** del commit y puede **impedirlo** si devuelve un código distinto de 0.

> 🏛️ AGE: el **ENS** exige proteger la integridad y trazabilidad del software: ramas protegidas, revisión obligatoria, commits firmados y no publicar secretos son prácticas habituales.

### GIT-6.3 · Integración continua: GitHub Actions y GitLab CI/CD

:::facil
**🧭 En pocas palabras.** La **integración continua** (CI) hace que, **cada vez que alguien sube código**, un servidor **compile y pase las pruebas automáticamente**. El **despliegue continuo** (CD) va más allá: si todo está bien, **lo publica**. Así los errores se detectan en minutos, no semanas después.

- En **GitHub** se llama **GitHub Actions** y se configura con ficheros YAML en **`.github/workflows/`**.
- En **GitLab** se llama **GitLab CI/CD** y se configura con el fichero **`.gitlab-ci.yml`** en la raíz del repositorio.
- Las tareas las ejecutan unas máquinas llamadas **runners**.

**Imagínatelo así:** un **control de calidad en la cadena de montaje**: cada pieza que llega se revisa sola, sin que nadie tenga que acordarse.
:::
:::ingles
**🔤 Para recordarlo**
- **CI** = *Continuous Integration*. **CD** = *Continuous Delivery / Deployment* (entrega o despliegue continuo).
- **pipeline** = tubería: la secuencia completa de tareas.
- **workflow** = flujo de trabajo (GitHub). **job** = trabajo. **step** = paso. **stage** = etapa (GitLab).
- **runner** = corredor: la máquina que ejecuta los trabajos.
- `on:` = "**cuando** pase esto". `runs-on:` = "ejecútate **en**". `uses:` = "**usa** esta acción ya hecha". `run:` = "**ejecuta** este comando".
- **artifact** = artefacto: el resultado que se guarda (un binario, un informe).
:::

**GitHub Actions: `.github/workflows/ci.yml`**

```yaml
name: CI
on: [push, pull_request]          # se lanza al hacer push y al abrir/actualizar un PR
jobs:
  pruebas:
    runs-on: ubuntu-latest        # runner de GitHub con Ubuntu
    steps:
      - uses: actions/checkout@v6 # acción oficial que descarga el código (la versión @vN cambia con el tiempo)
      - run: npm ci               # instalar dependencias
      - run: npm test             # pasar las pruebas
```

**GitLab CI/CD: `.gitlab-ci.yml`**

```yaml
stages:            # etapas, en orden
  - build
  - test
  - deploy

compilar:
  stage: build
  image: node:22   # imagen Docker en la que se ejecuta el trabajo
  script:          # comandos (obligatorio en cada trabajo)
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

pruebas:
  stage: test
  image: node:22
  script:
    - npm test

desplegar:
  stage: deploy
  script:
    - ./desplegar.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"   # solo en la rama main
```

**Comparativa**

| | GitHub Actions | GitLab CI/CD |
|---|---|---|
| Fichero | `.github/workflows/*.yml` (puede haber varios) | `.gitlab-ci.yml` (en la raíz) |
| Unidad de trabajo | `jobs` con `steps` | *jobs* agrupados en `stages` |
| Ejecutores | *Runners* de GitHub o propios (*self-hosted*) | *Runners* de GitLab o propios (**GitLab Runner**) |
| Reutilizar | **Acciones** (`uses:`) del Marketplace | Plantillas e `include:` |
| Condiciones | `on:` (eventos), `if:` | `rules:` (se prefieren a las antiguas `only`/`except`) |

- En GitLab, si no defines `stages`, las etapas por defecto son **`.pre`, `build`, `test`, `deploy`, `.post`**, y un trabajo sin `stage` va a **`test`**.
- Los trabajos de **la misma etapa** se ejecutan **en paralelo**; la etapa siguiente empieza cuando **termina bien** la anterior.
- Las contraseñas se guardan como **secretos / variables protegidas** de la plataforma, **nunca** en el YAML.

> ⚠️ Trampa: el fichero de GitLab se llama exactamente **`.gitlab-ci.yml`** (con punto delante) y va en la **raíz**. Los de GitHub van en **`.github/workflows/`**.

> ⚠️ Trampa: **CI** = integrar y probar automáticamente; **CD** = entregar o desplegar automáticamente. No son lo mismo.

> ⚠️ Trampa: en GitLab, la clave **`script`** es la única obligatoria de un trabajo normal; en GitHub Actions cada paso usa **`run:`** (un comando) o **`uses:`** (una acción ya hecha).

> 💡 Clave: con **ramas protegidas + PR/MR + CI en verde obligatoria**, nada llega a `main` sin revisión y sin pasar las pruebas.
