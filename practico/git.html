"id": 55, "t": "GIT-1.2", "q": "¿Qué pasa si intentas hacer commit sin user.name ni user.email configurados?", "o": ["Git usa la cuenta de GitHub", "Git no te deja o intenta adivinarlos y te avisa para que los configures", "Se hace commit anónimo sin aviso", "Se borra el commit"], "a": 1, "e": "Es lo primero que se configura."}, {"id": 56, "t": "GIT-1.2", "q": "¿Qué configuración define qué hace git pull cuando hay divergencias, eligiendo merge?", "o": ["git config --global pull.ff never", "git config --global pull.rebase false", "git config --global merge.pull yes", "git config --global pull.merge true"], "a": 1, "e": "true = rebase; pull.ff only = solo avance rápido."}, {"id": 57, "t": "GIT-1.2", "q": "¿Qué forma de escribir un valor es la moderna (subcomando)?", "o": ["git config set --global user.name \"Ana\"", "git config --set user.name \"Ana\"", "git set-config user.name \"Ana\"", "git config write user.name \"Ana\""], "a": 0, "e": "Introducida en Git 2.46."}, {"id": 58, "t": "GIT-1.2", "q": "Las formas clásicas como git config --list o git config --unset, ¿funcionan todavía?", "o": ["No, se eliminaron", "Sí, pero la documentación las marca como obsoletas en favor de los subcomandos", "Solo en Windows", "Solo con --system"], "a": 1, "e": "Se recomienda migrar a list, get, set, unset."}, {"id": 59, "t": "GIT-1.2", "q": "¿Qué versión de Git es la última estable a finales de 2026?", "o": ["La 1.9", "La 3.0", "La 2.40", "La 2.56"], "a": 3, "e": "Git 2.56 salió el 28 de septiembre de 2026; Git 3.0 aún no tiene fecha."}, {"id": 60, "t": "GIT-1.2", "q": "¿Qué rama crean por defecto GitHub y GitLab en los repositorios nuevos?", "o": ["master", "develop", "trunk", "main"], "a": 3, "e": "git init local sigue con master salvo configuración."}, {"id": 61, "t": "GIT-1.3", "q": "¿Cuáles son las tres áreas principales de trabajo en Git?", "o": ["Local, remoto y nube", "Cliente, servidor y proxy", "Ramas, etiquetas y commits", "Directorio de trabajo, área de preparación (staging/index) y repositorio"], "a": 3, "e": "Editar → add → commit."}, {"id": 62, "t": "GIT-1.3", "q": "¿Qué otro nombre recibe el área de preparación (staging area)?", "o": ["Caché remota", "Índice (index)", "Árbol de trabajo", "Reflog"], "a": 1, "e": "Se guarda en .git/index."}, {"id": 63, "t": "GIT-1.3", "q": "¿Qué comando pasa cambios del directorio de trabajo al área de preparación?", "o": ["git commit", "git add", "git push", "git stage --all"], "a": 1, "e": "Luego git commit los guarda en el repositorio."}, {"id": 64, "t": "GIT-1.3", "q": "¿Qué comando guarda lo preparado en el repositorio local?", "o": ["git save", "git commit", "git push", "git add"], "a": 1, "e": "push sube al remoto."}, {"id": 65, "t": "GIT-1.3", "q": "¿Qué estado tiene un fichero nuevo que Git aún no controla?", "o": ["Committed", "Modified", "Untracked (sin seguimiento)", "Staged"], "a": 2, "e": "Aparece como ?? en git status -s."}, {"id": 66, "t": "GIT-1.3", "q": "Modificas un fichero controlado y aún no haces git add. ¿En qué estado está?", "o": ["Modified (modificado sin preparar)", "Untracked", "Staged", "Committed"], "a": 0, "e": "Tras git add pasa a staged."}, {"id": 67, "t": "GIT-1.3", "q": "¿Qué hace git init?", "o": ["Inicia sesión en GitHub", "Descarga un repositorio de GitHub", "Crea un repositorio nuevo vacío en la carpeta actual (la carpeta .git)", "Crea el primer commit automáticamente"], "a": 2, "e": "No crea ningún commit."}, {"id": 68, "t": "GIT-1.3", "q": "¿Qué hace git clone URL?", "o": ["Sincroniza dos repositorios locales", "Copia solo la última versión de los ficheros", "Copia el repositorio completo, con todo su historial, y configura el remoto origin", "Crea un fork en GitHub"], "a": 2, "e": "Clone = copia completa."}, {"id": 69, "t": "GIT-1.3", "q": "Tras git clone, ¿cómo se llama por defecto el remoto?", "o": ["origin", "master", "remote", "upstream"], "a": 0, "e": "Apunta a la URL de la que clonaste."}, {"id": 70, "t": "GIT-1.3", "q": "¿Qué pasa si borras la carpeta .git de un proyecto?", "o": ["Se pierde todo el historial; los ficheros de trabajo quedan pero ya no es un repositorio", "Se borran también todos los ficheros", "No pasa nada, Git la regenera", "Solo se pierden las ramas remotas"], "a": 0, "e": ".git es el repositorio."}, {"id": 71, "t": "GIT-1.3", "q": "¿Qué es un repositorio bare?", "o": ["Un repositorio sin ramas", "Un repositorio sin commits", "Un repositorio sin directorio de trabajo, usado normalmente en servidores", "Un repositorio sin remoto"], "a": 2, "e": "Se crea con git init --bare."}, {"id": 72, "t": "GIT-1.3", "q": "¿Qué comando crea un repositorio bare?", "o": ["git clone --server repo.git", "git init --bare repo.git", "git init --empty repo.git", "git bare init"], "a": 1, "e": "Por convenio la carpeta acaba en .git."}, {"id": 73, "t": "GIT-1.3", "q": "¿Qué contiene el fichero .git/HEAD normalmente?", "o": ["El último mensaje de commit", "La lista de ficheros ignorados", "Una referencia a la rama actual, por ejemplo ref: refs/heads/main", "La URL del remoto"], "a": 2, "e": "Indica dónde estás."}, {"id": 74, "t": "GIT-1.3", "q": "¿Dónde guarda Git las ramas locales dentro de .git?", "o": ["hooks/", "objects/", "refs/heads/", "refs/tags/"], "a": 2, "e": "Las etiquetas en refs/tags/."}, {"id": 75, "t": "GIT-1.3", "q": "¿Dónde guarda Git el contenido de ficheros, árboles y commits?", "o": ["En .git/objects/", "En .git/refs/", "En .git/index", "En .git/logs/"], "a": 0, "e": "Base de datos de objetos."}, {"id": 76, "t": "GIT-1.3", "q": "¿Qué comando clona un repositorio en una carpeta llamada miapp?", "o": ["git clone miapp https://github.com/usuario/proyecto.git", "git clone https://github.com/usuario/proyecto.git miapp", "git clone --dir=miapp", "git init miapp https://github.com/usuario/proyecto.git"], "a": 1, "e": "El último argumento es el directorio destino."}, {"id": 77, "t": "GIT-1.3", "q": "¿Qué comando clona y se sitúa directamente en la rama develop?", "o": ["git clone URL develop", "git clone -d develop URL", "git clone --develop URL", "git clone -b develop URL"], "a": 3, "e": "-b = --branch."}, {"id": 78, "t": "GIT-1.3", "q": "¿Qué comando crea un repositorio con la rama inicial main?", "o": ["git init --main", "git init -b main", "git init -m main", "git init main"], "a": 1, "e": "-b = --initial-branch."}, {"id": 79, "t": "GIT-1.3", "q": "Tras git clone, ¿hace falta git remote add origin?", "o": ["Solo en Windows", "Sí, siempre", "Solo si el repositorio es privado", "No, clone ya configura origin"], "a": 3, "e": "Es una trampa típica."}, {"id": 80, "t": "GIT-1.3", "q": "¿Cuál es el flujo básico de trabajo en Git?", "o": ["Editar → git add → git commit", "git init → git push → git add", "git push → git add → git commit", "git commit → editar → git add"], "a": 0, "e": "Y git push para compartirlo."}, {"id": 81, "t": "GIT-1.3", "q": "¿Qué fichero guarda la configuración local de un repositorio?", "o": [".gitconfig en la raíz", ".git/config", ".git/HEAD", ".gitignore"], "a": 1, "e": "--local."}, {"id": 82, "t": "GIT-1.3", "q": "¿Qué guarda .git/index?", "o": ["La lista de remotos", "Los hooks", "El historial completo", "El área de preparación"], "a": 3, "e": "Lo que entrará en el próximo commit."}, {"id": 83, "t": "GIT-1.3", "q": "¿Qué hay en .git/hooks?", "o": ["Las ramas remotas", "Las etiquetas", "Scripts que Git ejecuta automáticamente en ciertos momentos", "Copias de seguridad"], "a": 2, "e": "Ejemplos *.sample."}, {"id": 84, "t": "GIT-1.3", "q": "¿Qué protocolo usa la URL git@github.com:usuario/proyecto.git?", "o": ["FTP", "Git sin cifrar", "HTTPS", "SSH"], "a": 3, "e": "La forma usuario@host:ruta es SSH."}, {"id": 85, "t": "GIT-1.3", "q": "En la metáfora de la mudanza, ¿qué representa git add?", "o": ["Deshacer la mudanza", "Cerrar la caja y etiquetarla", "Mandar el camión", "Meter cosas en la caja abierta (área de preparación)"], "a": 3, "e": "Cerrar la caja = commit."}, {"id": 86, "t": "GIT-1.3", "q": "¿Qué estado tiene un fichero justo después de un commit sin más cambios?", "o": ["Staged", "Unmodified (sin cambios)", "Modified", "Untracked"], "a": 1, "e": "Igual que en el último commit."}, {"id": 87, "t": "GIT-1.3", "q": "¿Puede un fichero estar a la vez preparado y modificado?", "o": ["Solo en repos bare", "Sí, si lo modificas otra vez después de git add", "No, nunca", "Solo si es binario"], "a": 1, "e": "El commit guardará la versión del momento del add."}, {"id": 88, "t": "GIT-1.3", "q": "¿Qué comando inicializa Git en una carpeta existente con ficheros?", "o": ["git start", "git init dentro de esa carpeta", "git clone .", "git add --init"], "a": 1, "e": "Luego git add y git commit."}, {"id": 89, "t": "GIT-1.3", "q": "¿Qué hace git init sobre los ficheros existentes en la carpeta?", "o": ["Los sube a GitHub", "Los borra", "Los añade y hace commit automáticamente", "Nada: quedan como untracked hasta que los añadas"], "a": 3, "e": "Solo crea .git."}, {"id": 90, "t": "GIT-1.3", "q": "¿Qué área hay entre el directorio de trabajo y el repositorio?", "o": ["El remoto", "El reflog", "El área de preparación (staging area / index)", "El stash"], "a": 2, "e": "Respuesta típica de examen."}, {"id": 91, "t": "GIT-2.1", "q": "¿Qué comando muestra qué ficheros están modificados, preparados o sin seguimiento?", "o": ["git log", "git diff --names", "git show", "git status"], "a": 3, "e": "El más usado del día a día."}, {"id": 92, "t": "GIT-2.1", "q": "¿Qué opción muestra git status en formato corto?", "o": ["-c", "-1", "-s", "--mini"], "a": 2, "e": "-s = short."}, {"id": 93, "t": "GIT-2.1", "q": "En git status -s, ¿qué significa \"??\"?", "o": ["Fichero sin seguimiento (nuevo)", "Fichero ignorado", "Fichero en conflicto", "Fichero borrado"], "a": 0, "e": "Untracked."}, {"id": 94, "t": "GIT-2.1", "q": "En git status -s, ¿qué indica la columna izquierda?", "o": ["El remoto", "El autor", "El estado en el directorio de trabajo", "El estado en el área de preparación"], "a": 3, "e": "La derecha es el directorio de trabajo."}, {"id": 95, "t": "GIT-2.1", "q": "En git status -s aparece \" M app.py\" (M en la columna derecha). ¿Qué significa?", "o": ["app.py está modificado pero no preparado", "app.py es nuevo", "app.py está en conflicto", "app.py está preparado"], "a": 0, "e": "Columna derecha = directorio de trabajo."}, {"id": 96, "t": "GIT-2.1", "q": "¿Qué hace git add -A?", "o": ["Prepara solo los ficheros nuevos", "Prepara todos los cambios del repositorio: nuevos, modificados y borrados", "Prepara solo los modificados", "Añade un remoto"], "a": 1, "e": "-A = all."}, {"id": 97, "t": "GIT-2.1", "q": "¿Qué hace git add . en Git 2.x?", "o": ["Prepara nuevos, modificados y borrados del directorio actual y sus subcarpetas", "Prepara solo los ficheros nuevos de todo el repo", "Hace commit de todo", "Prepara solo los modificados, nunca los borrados"], "a": 0, "e": "-A abarca todo el repositorio."}, {"id": 98, "t": "GIT-2.1", "q": "¿Qué hace git add -p?", "o": ["Permite elegir trozo a trozo qué cambios preparar", "Prepara solo los ficheros de Python", "Prepara y sube al remoto", "Muestra el patch sin preparar nada"], "a": 0, "e": "-p = patch."}, {"id": 99, "t": "GIT-2.1", "q": "¿Qué hace git commit -m \"mensaje\"?", "o": ["Crea una etiqueta", "Prepara todos los ficheros y sube", "Cambia el mensaje del último commit", "Crea un commit con lo preparado y ese mensaje"], "a": 3, "e": "-m = message."}, {"id": 100, "t": "GIT-2.1", "q": "¿Qué pasa si ejecutas git commit sin -m?", "o": ["Se usa \"Initial commit\"", "Se hace commit sin mensaje", "Da error siempre", "Se abre el editor para escribir el mensaje"], "a": 3, "e": "El editor de core.editor."}, {"id": 101, "t": "GIT-2.1", "q": "¿Qué hace git commit -a?", "o": ["Prepara todos los ficheros, incluidos los nuevos", "Prepara automáticamente los ficheros YA controlados que se han modificado o borrado y hace commit", "Hace commit y push", "Hace commit en todas las ramas"], "a": 1, "e": "No incluye ficheros nuevos."}, {"id": 102, "t": "GIT-2.1", "q": "Tienes un fichero nuevo nunca añadido. ¿Entra con git commit -am \"x\"?", "o": ["No, -a solo afecta a ficheros ya controlados", "Solo si es de texto", "Sí, siempre", "Solo si está en la raíz"], "a": 0, "e": "Trampa típica: hace falta git add antes."}, {"id": 103, "t": "GIT-2.1", "q": "¿Qué hace git commit --amend?", "o": ["Firma el último commit", "Deshace el último commit borrándolo", "Fusiona dos ramas", "Rehace el último commit (por ejemplo, para cambiar el mensaje o añadir algo olvidado)"], "a": 3, "e": "Crea un commit nuevo con otro hash."}, {"id": 104, "t": "GIT-2.1", "q": "¿Qué hace git commit --amend --no-edit?", "o": ["Crea un commit vacío", "Añade lo preparado al último commit sin cambiar su mensaje", "Deshace el último commit", "Cambia el mensaje sin abrir editor"], "a": 1, "e": "Útil cuando olvidaste un fichero."}, {"id": 105, "t": "GIT-2.1", "q": "¿Por qué no se debe usar --amend en un commit ya subido y compartido?", "o": ["Porque borra el repositorio remoto", "Porque no funciona en commits subidos", "Porque elimina las etiquetas", "Porque crea un commit nuevo con otro hash y reescribe la historia que otros ya tienen"], "a": 3, "e": "Reescribir historia compartida causa problemas."}, {"id": 106, "t": "GIT-2.1", "q": "Haces git add app.py y luego vuelves a modificar app.py. Si haces git commit, ¿qué versión se guarda?", "o": ["La última versión del fichero", "Ninguna", "Ambas en dos commits", "La versión del momento del git add"], "a": 3, "e": "Hay que volver a hacer git add."}, {"id": 107, "t": "GIT-2.1", "q": "¿Cómo debe ser la primera línea de un buen mensaje de commit?", "o": ["Corta (unos 50 caracteres) y en imperativo, describiendo el cambio", "Larga, con todos los detalles", "El número del commit", "Siempre \"cambios\""], "a": 0, "e": "Ej.: \"Añade validación del DNI\"."}, {"id": 108, "t": "GIT-2.1", "q": "¿Qué principio se recomienda para el tamaño de los commits?", "o": ["Un commit por fichero siempre", "Un commit por semana", "Un commit al final del día con todo", "Un commit por cambio lógico, mejor pequeños"], "a": 3, "e": "Facilita revisar y deshacer."}, {"id": 109, "t": "GIT-2.1", "q": "En Conventional Commits, ¿qué tipo se usa para una corrección de error?", "o": ["fix", "chore", "feat", "docs"], "a": 0, "e": "feat es nueva funcionalidad."}, {"id": 110, "t": "GIT-2.1", "q": "En git status -s, ¿qué significa \"A \" (A en la columna izquierda)?", "o": ["Fichero en conflicto", "Fichero borrado", "Fichero nuevo añadido al área de preparación", "Fichero ignorado"], "a": 2, "e": "A = added."}, {"id": 111, "t": "GIT-2.1", "q": "¿Qué comando prepara solo el fichero index.html?", "o": ["git push index.html", "git stage --only index.html --all", "git add index.html", "git commit index.html"], "a": 2, "e": "Se puede indicar ficheros o carpetas."}, {"id": 112, "t": "GIT-2.1", "q": "¿Qué comando prepara todo el contenido de la carpeta src?", "o": ["git add --dir src", "git add -r src", "git commit src/", "git add src/"], "a": 3, "e": "Git añade recursivamente."}, {"id": 113, "t": "GIT-2.1", "q": "¿Qué significa la opción -m en git commit?", "o": ["merge", "main", "message", "modify"], "a": 2, "e": "El mensaje del commit."}, {"id": 114, "t": "GIT-2.1", "q": "¿Qué hace git commit -am \"Corrige errata\"?", "o": ["Añade todos los ficheros nuevos y hace commit", "Hace amend del último commit", "Hace commit en todas las ramas", "Prepara los ficheros ya controlados modificados y hace commit con ese mensaje"], "a": 3, "e": "-a + -m."}, {"id": 115, "t": "GIT-2.1", "q": "¿Qué comando debes ejecutar antes de un commit para revisar qué vas a guardar?", "o": ["git status (y git diff --staged)", "git reset", "git push", "git clean"], "a": 0, "e": "Revisar la caja antes de cerrarla."}, {"id": 116, "t": "GIT-2.1", "q": "En el modo git add -p, ¿qué tecla acepta el trozo mostrado?", "o": ["a", "q", "y", "s"], "a": 2, "e": "y = yes, n = no, s = dividir, q = salir."}, {"id": 117, "t": "GIT-2.1", "q": "¿Qué contiene un commit además de los cambios?", "o": ["La lista de ramas", "Autor, fecha, mensaje y referencia a su commit padre", "La contraseña del usuario", "Solo el mensaje"], "a": 1, "e": "Y el árbol de ficheros."}, {"id": 118, "t": "GIT-2.1", "q": "¿Qué hace git status cuando todo está guardado?", "o": ["Indica que no hay nada que confirmar y el árbol de trabajo está limpio", "Muestra el historial completo", "Muestra el último commit", "Da error"], "a": 0, "e": "\"nothing to commit, working tree clean\"."}, {"id": 119, "t": "GIT-2.1", "q": "¿Qué tipo de Conventional Commits indica una nueva funcionalidad?", "o": ["fix", "test", "refactor", "feat"], "a": 3, "e": "feat = feature."}, {"id": 120, "t": "GIT-2.2", "q": "¿Qué comando muestra el historial de commits?", "o": ["git status", "git log", "git show-log", "git history --all"], "a": 1, "e": "log = bitácora."}, {"id": 121, "t": "GIT-2.2", "q": "¿Qué opción de git log muestra cada commit en una sola línea?", "o": ["--compact", "--oneline", "-1", "--short"], "a": 1, "e": "Hash corto y mensaje."}, {"id": 122, "t": "GIT-2.2", "q": "¿Qué comando dibuja el árbol de todas las ramas de forma compacta?", "o": ["git log --oneline --graph --all", "git branch --tree", "git show --graph", "git status --all"], "a": 0, "e": "Muy útil para ver fusiones."}, {"id": 123, "t": "GIT-2.2", "q": "¿Cómo se muestran solo los 5 últimos commits?", "o": ["git log -5", "git log --top=5", "git log +5", "git log --last 5"], "a": 0, "e": "También git log -n 5."}, {"id": 124, "t": "GIT-2.2", "q": "¿Qué hace git log --author=\"Teresa\"?", "o": ["Filtra por committer de GitHub", "Cambia el autor de los commits", "Muestra solo los commits cuyo autor coincide con Teresa", "Muestra los ficheros de Teresa"], "a": 2, "e": "Filtro por autor."}, {"id": 125, "t": "GIT-2.2", "q": "¿Qué busca git log --grep=\"IVA\"?", "o": ["Commits cuyo mensaje contiene IVA", "Ramas con IVA en el nombre", "Commits que cambian código con IVA", "Ficheros llamados IVA"], "a": 0, "e": "--grep busca en el mensaje."}, {"id": 126, "t": "GIT-2.2", "q": "¿Qué busca git log -S \"calcularIva\"?", "o": ["Commits que añaden o quitan ese texto en el contenido", "Commits cuyo mensaje contiene ese texto", "Commits firmados", "Commits de una rama llamada calcularIva"], "a": 0, "e": "Pickaxe: busca en el código."}, {"id": 127, "t": "GIT-2.2", "q": "¿Qué hace git log -p fichero.py?", "o": ["Imprime el fichero", "Muestra los permisos", "Muestra el historial de ese fichero con los cambios de cada commit", "Muestra solo el último commit"], "a": 2, "e": "-p = patch."}, {"id": 128, "t": "GIT-2.2", "q": "¿Qué opción de git log sigue el historial de un fichero aunque se haya renombrado?", "o": ["--track", "--follow", "--all", "--rename"], "a": 1, "e": "git log --follow nombre."}, {"id": 129, "t": "GIT-2.2", "q": "¿Qué muestra git log --stat?", "o": ["Qué ficheros cambió cada commit y cuántas líneas", "Estadísticas de GitHub", "El tamaño del repositorio", "El tiempo de cada commit"], "a": 0, "e": "Resumen por fichero."}, {"id": 130, "t": "GIT-2.2", "q": "¿Qué compara git diff sin opciones?", "o": ["El área de preparación con el último commit", "El local con el remoto", "Dos ramas", "El directorio de trabajo con el área de preparación"], "a": 3, "e": "Lo modificado y aún no preparado."}, {"id": 131, "t": "GIT-2.2", "q": "¿Qué compara git diff --staged?", "o": ["El local con el remoto", "Dos commits cualesquiera", "El directorio de trabajo con el área de preparación", "El área de preparación con el último commit"], "a": 3, "e": "Lo que entrará en el próximo commit."}, {"id": 132, "t": "GIT-2.2", "q": "¿Qué opción es sinónimo de --staged en git diff?", "o": ["--index-only", "--head", "--cached", "--prepared"], "a": 2, "e": "Son lo mismo."}, {"id": 133, "t": "GIT-2.2", "q": "¿Qué compara git diff HEAD?", "o": ["El último commit con el penúltimo", "Las dos últimas ramas", "El área de preparación con el remoto", "El directorio de trabajo con el último commit"], "a": 3, "e": "Todo lo cambiado desde el último commit."}, {"id": 134, "t": "GIT-2.2", "q": "Haces git add de todo y ejecutas git diff. ¿Qué muestra?", "o": ["Todos los cambios", "Nada, porque no hay cambios sin preparar", "El último commit", "Un error"], "a": 1, "e": "Usa git diff --staged."}, {"id": 135, "t": "GIT-2.2", "q": "¿Qué muestra git show a1b2c3d?", "o": ["El fichero a1b2c3d", "Los datos y los cambios de ese commit", "La rama a1b2c3d", "Todos los commits desde a1b2c3d"], "a": 1, "e": "Detalle de un objeto."}, {"id": 136, "t": "GIT-2.2", "q": "¿Qué representa HEAD~1?", "o": ["El primer commit del repositorio", "La rama remota", "El siguiente commit", "El commit anterior a HEAD (el padre)"], "a": 3, "e": "~ = pasos hacia atrás."}, {"id": 137, "t": "GIT-2.2", "q": "¿Qué representa HEAD~3?", "o": ["Tres commits antes de HEAD, siguiendo el primer padre", "Los tres últimos commits", "El tercer padre de HEAD", "La tercera rama"], "a": 0, "e": "Pasos hacia atrás."}, {"id": 138, "t": "GIT-2.2", "q": "¿Qué representa HEAD^2?", "o": ["Dos commits atrás", "La segunda rama", "El segundo padre de un commit de fusión", "El commit siguiente"], "a": 2, "e": "No confundir con HEAD~2."}, {"id": 139, "t": "GIT-2.2", "q": "¿Qué hace git blame app.py?", "o": ["Muestra, línea a línea, qué commit y qué autor la cambió por última vez", "Muestra los errores de compilación", "Revierte el último cambio", "Borra las líneas erróneas"], "a": 0, "e": "blame = culpar."}, {"id": 140, "t": "GIT-2.2", "q": "¿Cómo limitas git blame a las líneas 10 a 20?", "o": ["git blame -n 10..20 app.py", "git blame -L 10,20 app.py", "git blame --lines 10-20 app.py", "git blame app.py 10 20"], "a": 1, "e": "-L inicio,fin."}, {"id": 141, "t": "GIT-2.2", "q": "¿Qué muestra git shortlog -sn?", "o": ["Los últimos commits en corto", "Los nombres de las ramas", "El número de commits por autor, ordenado", "El tamaño de cada commit"], "a": 2, "e": "-s resumen, -n ordenar."}, {"id": 142, "t": "GIT-2.2", "q": "¿Qué muestra git log main..feature?", "o": ["Los commits que están en feature y no en main", "Todos los commits de ambas ramas", "Los commits de main que no están en feature", "La diferencia de ficheros"], "a": 0, "e": "A..B = en B pero no en A."}, {"id": 143, "t": "GIT-2.2", "q": "¿Cuántos caracteres del hash suelen bastar para referirse a un commit?", "o": ["64", "7, si no es ambiguo", "2", "Los 40 siempre"], "a": 1, "e": "Hash abreviado."}, {"id": 144, "t": "GIT-2.2", "q": "¿Qué muestra git show v1.0:config.yml?", "o": ["La configuración de la etiqueta", "El contenido de config.yml en la etiqueta v1.0", "Un error", "Los cambios de config.yml desde v1.0"], "a": 1, "e": "revisión:ruta."}, {"id": 145, "t": "GIT-2.2", "q": "¿Qué hace git log --since=\"2 weeks ago\"?", "o": ["Programa un commit", "Muestra commits de hace exactamente dos semanas", "Muestra los commits de las dos últimas semanas", "Borra commits anteriores a dos semanas"], "a": 2, "e": "También --until."}, {"id": 146, "t": "GIT-2.2", "q": "¿Qué símbolo es atajo de HEAD?", "o": ["~", "*", "#", "@"], "a": 3, "e": "git show @ = git show HEAD."}, {"id": 147, "t": "GIT-2.2", "q": "¿Qué comando compara la rama main con la rama feature?", "o": ["git status main feature", "git diff main feature", "git log main feature --diff", "git compare main feature"], "a": 1, "e": "También main..feature."}, {"id": 148, "t": "GIT-2.2", "q": "¿Qué hace git log --oneline -1?", "o": ["Borra el último commit", "Muestra solo el último commit en una línea", "Muestra una rama", "Muestra el primer commit del repositorio"], "a": 1, "e": "-1 = un commit."}, {"id": 149, "t": "GIT-2.3", "q": "¿Para qué sirve el fichero .gitignore?", "o": ["Para ignorar errores de compilación", "Para bloquear usuarios", "Para indicar qué ficheros sin seguimiento debe ignorar Git", "Para borrar ficheros del historial"], "a": 2, "e": "Ej.: *.log, node_modules/, .env."}, {"id": 150, "t": "GIT-2.3", "q": "¿Afecta .gitignore a ficheros que ya están controlados por Git?", "o": ["Sí, los borra del repositorio", "Sí, deja de mostrarlos automáticamente", "No, hay que dejar de controlarlos con git rm --cached", "Solo tras un git push"], "a": 2, "e": "Trampa clásica."}, {"id": 151, "t": "GIT-2.3", "q": "¿Qué hace git rm --cached secreto.env?", "o": ["Deja de controlar el fichero, pero lo mantiene en tu disco", "Borra el fichero del historial completo", "Borra el fichero del disco y del repositorio", "Cifra el fichero"], "a": 0, "e": "--cached = solo del índice."}, {"id": 152, "t": "GIT-2.3", "q": "¿Qué hace git rm viejo.txt?", "o": ["Lo borra del historial", "Lo mueve a la papelera de Git", "Solo deja de controlarlo", "Borra el fichero del disco y prepara su borrado para el próximo commit"], "a": 3, "e": "Sin --cached también lo borra del disco."}, {"id": 153, "t": "GIT-2.3", "q": "¿Qué patrón de .gitignore ignora todos los ficheros .log de cualquier carpeta?", "o": ["/*.log", "log/", "*.log", "!*.log"], "a": 2, "e": "Sin barra coincide a cualquier nivel."}, {"id": 154, "t": "GIT-2.3", "q": "¿Qué significa el patrón /build en .gitignore?", "o": ["build solo en la carpeta del .gitignore (normalmente la raíz)", "Cualquier carpeta build", "Solo ficheros llamados build", "Todos los ficheros excepto build"], "a": 0, "e": "La barra inicial ancla el patrón."}, {"id": 155, "t": "GIT-2.3", "q": "¿Qué significa la barra final en node_modules/?", "o": ["Que solo coincide en la raíz", "Que es una excepción", "Que solo coincide con carpetas", "Que es un comentario"], "a": 2, "e": "Barra final = directorios."}, {"id": 156, "t": "GIT-2.3", "q": "¿Qué significa ! al principio de un patrón de .gitignore?", "o": ["Ignorar solo carpetas", "Ignorar siempre", "Comentario", "Excepción: vuelve a incluir algo excluido antes"], "a": 3, "e": "Ej.: !importante.log."}, {"id": 157, "t": "GIT-2.3", "q": "¿Cómo se escribe un comentario en .gitignore?", "o": ["Con // en cualquier lugar", "Con # al principio de la línea", "Con -- al principio", "Con ; al final"], "a": 1, "e": "Un # a mitad de línea no es comentario."}, {"id": 158, "t": "GIT-2.3", "q": "La línea \"*.log # registros\" en .gitignore, ¿ignora los .log?", "o": ["No como se espera: el # a mitad de línea forma parte del patrón", "Da error de sintaxis", "Ignora todo el repositorio", "Sí, el texto tras # es un comentario"], "a": 0, "e": "Los comentarios van en su propia línea."}, {"id": 159, "t": "GIT-2.3", "q": "¿Qué significa ** en un patrón como doc/**/*.pdf?", "o": ["Cualquier número de carpetas intermedias", "Ficheros ocultos", "Exactamente dos carpetas", "Un carácter cualquiera"], "a": 0, "e": "Coincide a cualquier profundidad."}, {"id": 160, "t": "GIT-2.3", "q": "¿Dónde pones exclusiones que solo afectan a tu copia y no se comparten?", "o": ["En .gitattributes", "En .git/info/exclude", "En .gitignore de la raíz", "En .git/config"], "a": 1, "e": "core.excludesFile sirve para todos tus repos."}, {"id": 161, "t": "GIT-2.3", "q": "¿Qué configuración define un fichero de exclusiones global para todos tus repositorios?", "o": ["global.gitignore", "core.excludesFile", "user.ignore", "core.ignoreGlobal"], "a": 1, "e": "Por defecto ~/.config/git/ignore."}, {"id": 162, "t": "GIT-2.3", "q": "¿Qué comando dice qué regla hace que un fichero se ignore?", "o": ["git check-ignore -v fichero", "git log --ignored", "git status --why", "git ignore --show fichero"], "a": 0, "e": "Muestra la regla y el fichero de origen."}, {"id": 163, "t": "GIT-2.3", "q": "¿Qué hace git mv antiguo.py nuevo.py?", "o": ["Copia el fichero", "Mueve el fichero a otra rama", "Renombra el fichero y prepara el cambio", "Borra antiguo.py del historial"], "a": 2, "e": "mv = move."}, {"id": 164, "t": "GIT-2.3", "q": "¿Qué hace git clean -n?", "o": ["Borra los ficheros sin seguimiento", "Simula y muestra qué ficheros sin seguimiento se borrarían", "Borra los ficheros ignorados", "Limpia el historial"], "a": 1, "e": "-n = dry run."}, {"id": 165, "t": "GIT-2.3", "q": "¿Qué hace git clean sin opciones con la configuración por defecto?", ¿Cómo dejas de controlar toda la carpeta node_modules ya añadida por error?", "o": ["git reset --hard node_modules", "git clean -fd node_modules", "git rm -r --cached node_modules", "git ignore node_modules"], "a": 2, "e": "Y añadir node_modules/ al .gitignore."}, {"id": 174, "t": "GIT-2.3", "q": "¿Qué hace git status --ignored?", "o": ["Muestra también los ficheros ignorados", "Borra los ignorados", "Muestra solo los modificados", "Ignora el estado"], "a": 0, "e": "Útil para revisar."}, {"id": 175, "t": "GIT-2.3", "q": "¿Qué patrón ignora el fichero .env de cualquier carpeta?", "o": ["**.env/", "/.env/", ".env", "!.env"], "a": 2, "e": "Sin barra coincide a cualquier nivel."}, {"id": 176, "t": "GIT-2.3", "q": "¿Qué hace git clean -i?", "o": ["Borra todo sin preguntar", "Inicializa el repositorio", "Abre un modo interactivo para elegir qué borrar", "Ignora los ficheros"], "a": 2, "e": "-i = interactive."}, {"id": 177, "t": "GIT-2.3", "q": "¿Qué hace * en un patrón de .gitignore?", "o": ["Niega el patrón", "Coincide con cualquier número de carpetas", "Coincide con cualquier cadena excepto la barra /", "Es un comentario"], "a": 2, "e": "** sí cruza carpetas."}, {"id": 178, "t": "GIT-3.1", "q": "¿Qué es técnicamente una rama en Git?", "o": ["Un puntero móvil a un commit", "Una carpeta dentro de .git con los ficheros duplicados", "Una copia completa de todos los ficheros", "Un repositorio independiente"], "a": 0, "e": "Por eso crear ramas es instantáneo."}, {"id": 179, "t": "GIT-3.1", "q": "¿Qué indica HEAD?", "o": ["El primer commit del repositorio", "El último commit subido", "Dónde estás ahora: normalmente la rama actual", "La rama remota principal"], "a": 2, "e": "HEAD = \"estoy aquí\"."}, {"id": 180, "t": "GIT-3.1", "q": "¿Qué hace git branch feature/login?", "o": ["Borra la rama", "Crea la rama, pero te quedas en la rama actual", "Cambia a la rama si existe", "Crea la rama y te cambia a ella"], "a": 1, "e": "Trampa clásica."}, {"id": 181, "t": "GIT-3.1", "q": "¿Qué comando crea una rama y te cambia a ella con la sintaxis moderna?", "o": ["git checkout -c feature/login", "git switch -c feature/login", "git switch -b feature/login", "git branch -c feature/login --go"], "a": 1, "e": "En checkout la opción es -b."}, {"id": 182, "t": "GIT-3.1", "q": "¿Qué comando crea una rama y te cambia a ella con el comando antiguo?", "o": ["git checkout -b feature/login", "git branch -b feature/login", "git switch -b feature/login", "git checkout -c feature/login"], "a": 0, "e": "-b = branch."}, {"id": 183, "t": "GIT-3.1", "q": "¿Qué hace git switch -?", "o": ["Borra la rama actual", "Crea una rama sin nombre", "Vuelve a la rama en la que estabas antes", "Lista las ramas"], "a": 2, "e": "Como cd -."}, {"id": 184, "t": "GIT-3.1", "q": "¿Qué lista git branch -a?", "o": ["Solo las ramas activas", "Todas las etiquetas", "Las ramas de todos los repositorios del equipo", "Las ramas locales y las remotas"], "a": 3, "e": "-a = all."}, {"id": 185, "t": "GIT-3.1", "q": "¿Qué muestra git branch -vv?", "o": ["Las ramas borradas", "Las ramas en modo muy silencioso", "Cada rama con su último commit y la rama remota que sigue (ahead/behind)", "Solo las ramas remotas"], "a": 2, "e": "Doble verbose."}, {"id": 186, "t": "GIT-3.1", "q": "¿Qué hace git branch -d feature/login si la rama NO está fusionada?", "o": ["La borra también del remoto", "Se niega a borrarla", "La fusiona y luego la borra", "La borra sin avisar"], "a": 1, "e": "Hace falta -D para forzar."}, {"id": 187, "t": "GIT-3.1", "q": "¿Qué hace git branch -D experimento?", "o": ["Borra la rama remota", "La desactiva temporalmente", "Borra la rama aunque no esté fusionada", "La borra solo si está fusionada"], "a": 2, "e": "D mayúscula = forzar."}, {"id": 188, "t": "GIT-3.1", "q": "¿Puedes borrar la rama en la que estás?", "o": ["Solo si es main", "Sí, con -D", "No, primero tienes que cambiar a otra", "Sí, con -d"], "a": 2, "e": "Git no lo permite."}, {"id": 189, "t": "GIT-3.1", "q": "¿Qué hace git branch -m nuevo-nombre?", "o": ["Crea una rama nueva", "Renombra la rama actual", "Fusiona la rama actual", "Mueve commits a otra rama"], "a": 1, "e": "-m = move."}, {"id": 190, "t": "GIT-3.1", "q": "¿Qué muestra git branch --merged?", "o": ["Las ramas con commits sin subir", "Las ramas ya fusionadas en la rama actual", "Las ramas remotas", "Las ramas en conflicto"], "a": 1, "e": "Candidatas a borrarse."}, {"id": 191, "t": "GIT-3.1", "q": "¿Qué muestra git branch --no-merged?", "o": ["Las ramas con trabajo aún no fusionado en la actual", "Las ramas vacías", "Las ramas remotas borradas", "Las ramas protegidas"], "a": 0, "e": "Contrario de --merged."}, {"id": 192, "t": "GIT-3.1", "q": "¿Qué novedad añadió Git 2.56 a git branch?", "o": ["--delete-merged, que borra las ramas locales ya fusionadas en su rama remota", "--protect", "--create-remote", "--sync"], "a": 0, "e": "Publicada el 28 de septiembre de 2026."}, {"id": 193, "t": "GIT-3.1", "q": "¿En qué versión de Git aparecieron git switch y git restore?", "o": ["Git 2.23 (2019)", "Git 2.56 (2026)", "Git 1.0 (2005)", "Git 3.0"], "a": 0, "e": "Dividieron las funciones de checkout."}, {"id": 194, "t": "GIT-3.1", "q": "¿Qué es el estado \"detached HEAD\"?", "o": ["Hay un conflicto sin resolver", "HEAD apunta directamente a un commit, no a una rama", "La rama main se ha borrado", "El repositorio no tiene remoto"], "a": 1, "e": "Ocurre al sacar un commit o una etiqueta."}, {"id": 195, "t": "GIT-3.1", "q": "¿Qué comando te deja en detached HEAD en un commit concreto con la sintaxis moderna?", "o": ["git switch a1b2c3d", "git branch --detach a1b2c3d", "git switch --detach a1b2c3d", "git restore a1b2c3d"], "a": 2, "e": "Con checkout: git checkout a1b2c3d."}, {"id": 196, "t": "GIT-3.1", "q": "Has hecho commits en detached HEAD y quieres conservarlos. ¿Qué haces?", "o": ["Crear una rama ahí: git switch -c nueva-rama", "git reset --hard", "git push directamente", "Nada, se guardan solos en main"], "a": 0, "e": "Si te vas sin rama, quedan huérfanos."}, {"id": 197, "t": "GIT-3.1", "q": "Cambias de rama con cambios sin guardar que chocan con la otra rama. ¿Qué hace Git?", "o": ["Hace commit automático", "Borra tus cambios", "Se niega a cambiar para no perder tus cambios", "Crea una rama nueva"], "a": 2, "e": "Opciones: commit, stash o descartar."}, {"id": 198, "t": "GIT-3.1", "q": "Cambias de rama con cambios sin guardar que NO chocan. ¿Qué pasa?", "o": ["Git cambia de rama y tus cambios te acompañan", "Git se niega siempre", "Se hace stash automático", "Los cambios se pierden"], "a": 0, "e": "Siguen en el directorio de trabajo."}, {"id": 199, "t": "GIT-3.1", "q": "¿Borrar una rama local borra también la rama en el remoto?", "o": ["Sí, siempre", "Solo en GitLab", "No, hay que usar git push origin --delete rama", "Solo con -D"], "a": 2, "e": "Son independientes."}, {"id": 200, "t": "GIT-3.1", "q": "¿Qué hace git switch -c hotfix v1.0?", "o": ["Fusiona v1.0 en hotfix", "Crea la etiqueta hotfix", "Crea la rama hotfix a partir de la etiqueta v1.0 y cambia a ella", "Borra la etiqueta v1.0"], "a": 2, "e": "El último argumento es el punto de partida."}, {"id": 201, "t": "GIT-3.1", "q": "¿Por qué crear una rama en Git es casi instantáneo?", "o": ["Porque usa la nube", "Porque solo crea un puntero; no copia ficheros", "Porque comprime los ficheros", "Porque solo funciona con ramas vacías"], "a": 1, "e": "Un fichero pequeño con un hash."}, {"id": 202, "t": "GIT-3.1", "q": "¿Qué hace git checkout feature/login?", "o": ["Cambia a la rama feature/login", "Fusiona la rama", "Crea la rama", "Borra la rama"], "a": 0, "e": "Equivale a git switch feature/login."}, {"id": 203, "t": "GIT-3.1", "q": "¿Qué ocurre con git switch -b nueva?", "o": ["Borra la rama", "Da error: en switch la opción de crear es -c", "Crea la rama", "Cambia a la rama"], "a": 1, "e": "-b es de checkout."}, {"id": 204, "t": "GIT-3.1", "q": "Escribes git switch feature/x, no existe en local pero sí origin/feature/x. ¿Qué hace Git por defecto?", "o": ["Da error siempre", "Hace merge de origin/feature/x en la actual", "Crea una rama vacía", "Crea la rama local feature/x siguiendo a origin/feature/x"], "a": 3, "e": "Opción --guess activa por defecto."}, {"id": 205, "t": "GIT-3.1", "q": "¿Qué rama está marcada con * en la salida de git branch?", "o": ["La rama actual", "La rama principal", "La rama protegida", "La rama más reciente"], "a": 0, "e": "Donde apunta HEAD."}, {"id": 206, "t": "GIT-3.1", "q": "¿Qué hace git branch -m viejo nuevo?", "o": ["Fusiona viejo en nuevo", "Borra viejo", "Copia viejo a nuevo", "Renombra la rama viejo a nuevo"], "a": 3, "e": "Renombrar otra rama."}, {"id": 207, "t": "GIT-3.2", "q": "Quieres traer los cambios de feature a main. ¿Qué haces?", "o": ["git merge main feature", "git push feature main", "git switch feature y luego git merge main", "git switch main y luego git merge feature"], "a": 3, "e": "Te sitúas en la rama que recibe."}, {"id": 208, "t": "GIT-3.2", "q": "¿Qué es una fusión fast-forward?", "o": ["Una fusión que ignora conflictos", "La rama solo avanza el puntero porque no hay divergencia; no se crea commit de fusión", "Una fusión entre remotos", "Una fusión que crea dos commits"], "a": 1, "e": "Avance rápido."}, {"id": 209, "t": "GIT-3.2", "q": "¿Cuándo crea Git un commit de fusión?", "o": ["Cuando las dos ramas han avanzado por separado (fusión de tres vías)", "Nunca", "Solo con --squash", "Siempre"], "a": 0, "e": "Three-way merge."}, {"id": 210, "t": "GIT-3.2", "q": "¿Cuántos padres tiene un commit de fusión normal?", "o": ["Dos", "Tres", "Ninguno", "Uno"], "a": 0, "e": "Uno de cada rama."}, {"id": 211, "t": "GIT-3.2", "q": "¿Qué hace git merge --no-ff feature?", "o": ["Crea siempre un commit de fusión aunque se pudiera hacer fast-forward", "Impide la fusión", "Fusiona sin commit", "Hace fast-forward obligatorio"], "a": 0, "e": "Deja constancia de la rama."}, {"id": 212, "t": "GIT-3.2", "q": "¿Qué hace git merge --ff-only feature?", "o": ["Fusiona solo ficheros nuevos", "Ignora los conflictos", "Fusiona solo si es posible el avance rápido; si no, falla", "Crea siempre un commit de fusión"], "a": 2, "e": "Útil para no crear commits de fusión."}, {"id": 213, "t": "GIT-3.2", "q": "¿Qué hace git merge --squash feature?", "o": ["Aplasta los conflictos automáticamente", "Hace un commit de fusión con dos padres", "Trae todos los cambios de feature como un único cambio preparado, sin hacer commit", "Fusiona y borra la rama feature"], "a": 2, "e": "Tú haces el commit después."}, {"id": 214, "t": "GIT-3.2", "q": "Tras git merge --squash, ¿aparece la rama como fusionada?", "o": ["Solo con --no-ff", "Solo si haces push", "Sí, siempre", "No, no se registra la fusión"], "a": 3, "e": "Solo se trajeron los cambios."}, {"id": 215, "t": "GIT-3.2", "q": "¿Qué hace git merge --abort?", "o": ["Acepta todos los cambios de la otra rama", "Deshace el último commit", "Cancela una fusión con conflictos y vuelve al estado anterior", "Borra la rama fusionada"], "a": 2, "e": "abort = abortar."}, {"id": 216, "t": "GIT-3.2", "q": "¿Cuándo hay un conflicto de fusión?", "o": ["Cuando las ramas tienen nombres parecidos", "Siempre que se fusiona", "Cuando las dos ramas cambiaron las mismas líneas de un fichero", "Cuando una rama tiene más commits"], "a": 2, "e": "Git no sabe qué versión elegir."}, {"id": 217, "t": "GIT-3.2", "q": "En un conflicto, ¿qué hay entre <<<<<<< HEAD y =======?", "o": ["Un comentario de Git", "La versión común original", "Tu versión (la de la rama en la que estás)", "La versión de la rama que traes"], "a": 2, "e": "Entre ======= y >>>>>>> está la otra."}, {"id": 218, "t": "GIT-3.2", "q": "En un conflicto, ¿qué hay entre ======= y >>>>>>> rama?", "o": ["El mensaje del commit", "La versión de la rama que estás fusionando", "La versión del remoto", "Tu versión"], "a": 1, "e": "Lo que traes."}, {"id": 219, "t": "GIT-3.2", "q": "¿Cómo marcas un fichero en conflicto como resuelto?", "o": ["Editándolo, quitando las marcas y haciendo git add", "git resolve fichero", "git merge --resolved fichero", "git commit --conflict"], "a": 0, "e": "No existe git resolve."}, {"id": 220, "t": "GIT-3.2", "q": "¿Qué paso termina una fusión tras resolver los conflictos?", "o": ["git push", "git branch -d", "git merge --end", "git commit"], "a": 3, "e": "Git propone el mensaje."}, {"id": 221, "t": "GIT-3.2", "q": "¿Qué muestra git status durante un conflicto para los ficheros afectados?", "o": ["untracked", "both modified", "renamed", "deleted by us"], "a": 1, "e": "Ambos lados lo modificaron."}, {"id": 222, "t": "GIT-3.2", "q": "¿Qué pasa si haces commit sin borrar las marcas <<<<<<<?", "o": ["Las marcas quedan guardadas en el código", "Git las borra automáticamente", "El commit falla siempre", "Se deshace la fusión"], "a": 0, "e": "Hay que revisar bien."}, {"id": 223, "t": "GIT-3.2", "q": "¿Qué hace git checkout --ours app.py durante un conflicto?", "o": ["Borra el fichero", "Se queda con tu versión completa de ese fichero", "Cancela la fusión", "Se queda con la versión de la otra rama"], "a": 1, "e": "--theirs = la otra."}, {"id": 224, "t": "GIT-3.2", "q": "¿Qué hace git checkout --theirs app.py durante un conflicto?", "o": ["Restaura el último commit", "Abre la herramienta de fusión", "Se queda con tu versión", "Se queda con la versión de la rama que traes"], "a": 3, "e": "theirs = suyo."}, {"id": 225, "t": "GIT-3.2", "q": "¿Qué comando abre una herramienta gráfica para resolver conflictos?", "o": ["git resolve", "git diff --gui", "git conflict", "git mergetool"], "a": 3, "e": "Configurable con merge.tool."}, {"id": 226, "t": "GIT-3.2", "q": "¿Qué novedad de Git 2.56 ayuda al terminar conflictos?", "o": ["git commit --fix-conflicts", "git add --resolved, que prepara solo los ficheros resueltos y falla si quedan marcas", "git merge --auto", "git resolve-all"], "a": 1, "e": "Novedad de la 2.56."}, {"id": 227, "t": "GIT-3.2", "q": "Estás en feature y ejecutas git merge main. ¿Qué ocurre?", "o": ["Da error", "Se traen los cambios de main a feature", "Se fusionan y se borra main", "Se traen los cambios de feature a main"], "a": 1, "e": "Siempre a la rama actual."}, {"id": 228, "t": "GIT-3.2", "q": "¿Qué comando lista solo los ficheros en conflicto?", "o": ["git ls-files --merged", "git log --conflicts", "git status --conflicts-only", "git diff --name-only --diff-filter=U"], "a": 3, "e": "U = unmerged."}, {"id": 229, "t": "GIT-3.2", "q": "¿Por qué algunos equipos usan --no-ff al fusionar ramas de funcionalidad?", "o": ["Para borrar la rama automáticamente", "Para que la fusión sea más rápida", "Para que quede en la historia un commit que agrupe la funcionalidad", "Para evitar conflictos"], "a": 2, "e": "Historia más legible por funcionalidades."}, {"id": 230, "t": "GIT-3.2", "q": "En \"ours/theirs\" durante un merge, ¿qué es \"ours\"?", "o": ["La rama en la que estás", "La rama main siempre", "La rama que traes", "La rama remota"], "a": 0, "e": "Lo nuestro."}, {"id": 231, "t": "GIT-3.2", "q": "¿Qué hace git merge si la rama actual ya contiene todos los commits de la otra?", "o": ["Da error", "Indica que ya está actualizada (Already up to date)", "Borra la otra rama", "Crea un commit vacío"], "a": 1, "e": "No hay nada que fusionar."}, {"id": 232, "t": "GIT-3.2", "q": "¿Se puede producir un conflicto en una fusión fast-forward?", "o": ["No, porque no hay cambios divergentes", "Sí, siempre", "Solo con ficheros binarios", "Solo en Windows"], "a": 0, "e": "Solo se mueve el puntero."}, {"id": 233, "t": "GIT-3.2", "q": "En git log --graph, ¿cómo se ve un commit de fusión?", "o": ["Como un punto aislado", "Como dos líneas que se juntan", "Como una línea recta", "No aparece"], "a": 1, "e": "Tiene dos padres."}, {"id": 234, "t": "GIT-3.2", "q": "¿Qué estrategia de fusión crea el commit de fusión cuando las ramas han divergido?", "o": ["La fusión de tres vías (three-way merge)", "Fast-forward", "Squash obligatorio", "Cherry-pick"], "a": 0, "e": "Usa el ancestro común y las dos puntas."}, {"id": 235, "t": "GIT-3.2", "q": "¿Qué tres commits usa una fusión de tres vías?", "o": ["Los tres últimos commits de main", "El primero, el último y HEAD", "El ancestro común y las puntas de las dos ramas", "Tres commits elegidos al azar"], "a": 2, "e": "Merge base + dos puntas."}, {"id": 236, "t": "GIT-3.3", "q": "¿Qué hace git rebase main estando en feature?", "o": ["Sube feature a main", "Borra los commits de feature", "Vuelve a aplicar los commits de feature encima del último commit de main", "Fusiona main en feature con un commit de fusión"], "a": 2, "e": "Historia lineal."}, {"id": 237, "t": "GIT-3.3", "q": "¿Qué diferencia principal hay entre merge y rebase?", "o": ["merge borra commits y rebase no", "merge conserva la historia con commits de fusión; rebase la reescribe para que sea lineal", "Son exactamente iguales", "rebase solo funciona con remotos"], "a": 1, "e": "Rebase crea commits nuevos."}, {"id": 238, "t": "GIT-3.3", "q": "¿Cuál es la \"regla de oro\" del rebase?", "o": ["Hacer rebase siempre antes de cada commit", "No hacer rebase en ramas locales", "Hacer rebase solo en main", "No hacer rebase de commits que ya has compartido con otros"], "a": 3, "e": "Reescribe la historia de otros."}, {"id": 239, "t": "GIT-3.3", "q": "Tras un rebase, ¿tienen los commits el mismo hash que antes?", "o": ["Solo el primero cambia", "Sí, siempre", "No, son commits nuevos con otro hash", "Solo si no hay conflictos"], "a": 2, "e": "Los cambios son iguales, los commits no."}, {"id": 240, "t": "GIT-3.3", "q": "Durante un rebase con conflicto, tras resolverlo y hacer git add, ¿qué comando sigue?", "o": ["git commit --continue", "git rebase --next", "git merge --continue", "git rebase --continue"], "a": 3, "e": "También --skip o --abort."}, {"id": 241, "t": "GIT-3.3", "q": "¿Qué hace git rebase --abort?", "o": ["Cancela el rebase y deja todo como estaba antes", "Borra la rama", "Salta el commit actual", "Termina el rebase aceptando todo"], "a": 0, "e": "Vuelta atrás completa."}, {"id": 242, "t": "GIT-3.3", "q": "¿Qué hace git rebase --skip?", "o": ["Salta todos los conflictos", "Cancela el rebase", "Se salta el commit que está dando problemas y continúa", "Salta a main"], "a": 2, "e": "Ese commit no se aplica."}, {"id": 243, "t": "GIT-3.3", "q": "¿Qué hace git rebase -i HEAD~3?", "o": ["Abre un rebase interactivo para modificar los 3 últimos commits", "Borra los 3 últimos commits", "Hace rebase de 3 ramas", "Muestra los 3 últimos commits"], "a": 0, "e": "-i = interactive."}, {"id": 244, "t": "GIT-3.3", "q": "En el rebase interactivo, ¿qué hace \"pick\"?", "o": ["Borra el commit", "Cambia el mensaje", "Usa el commit tal cual", "Lo fusiona con el anterior"], "a": 2, "e": "Opción por defecto."}, {"id": 245, "t": "GIT-3.3", "q": "En el rebase interactivo, ¿qué hace \"reword\"?", "o": ["Lo divide en dos", "Usa el commit pero permite cambiar su mensaje", "Borra el commit", "Reordena el commit"], "a": 1, "e": "r = reword."}, {"id": 246, "t": "GIT-3.3", "q": "En el rebase interactivo, ¿qué hace \"squash\"?", "o": ["Fusiona el commit con el anterior combinando los mensajes", "Para el rebase en ese commit", "Fusiona el commit con el anterior descartando su mensaje", "Borra el commit"], "a": 0, "e": "fixup descarta el mensaje."}, {"id": 247, "t": "GIT-3.3", "q": "En el rebase interactivo, ¿qué hace \"fixup\"?", "o": ["Cambia el autor", "Fusiona combinando los mensajes", "Corrige automáticamente los errores del código", "Fusiona el commit con el anterior descartando su mensaje"], "a": 3, "e": "f = fixup."}, {"id": 248, "t": "GIT-3.3", "q": "En el rebase interactivo, ¿qué hace \"drop\"?", "o": ["Lo mueve al final", "Elimina el commit", "Lo deja sin mensaje", "Lo convierte en etiqueta"], "a": 1, "e": "También vale borrar la línea."}, {"id": 249, "t": "GIT-3.3", "q": "En el rebase interactivo, ¿qué hace \"edit\"?", "o": ["Para el rebase en ese commit para que puedas modificarlo", "Borra el commit", "Abre el fichero en el editor", "Cambia solo el mensaje"], "a": 0, "e": "Después git rebase --continue."}, {"id": 250, "t": "GIT-3.3", "q": "En el rebase interactivo, ¿qué hace \"exec\"?", "o": ["Sale del rebase", "Exporta el commit", "Ejecuta el commit dos veces", "Ejecuta un comando de shell en ese punto"], "a": 3, "e": "x = exec; para si el comando falla."}, {"id": 251, "t": "GIT-3.3", "q": "¿En qué orden aparecen los commits en el editor del rebase interactivo?", "o": ["Del más reciente al más antiguo", "Por orden alfabético", "Por autor", "Del más antiguo (arriba) al más reciente (abajo)"], "a": 3, "e": "Al revés que git log."}, {"id": 252, "t": "GIT-3.3", "q": "¿Qué hace git commit --fixup=a1b2c3d?", "o": ["Revierte a1b2c3d", "Corrige a1b2c3d inmediatamente", "Borra a1b2c3d", "Crea un commit marcado como \"fixup!\" para corregir a1b2c3d en un rebase posterior"], "a": 3, "e": "Se combina con --autosquash."}, {"id": 253, "t": "GIT-3.3", "q": "¿Qué hace --autosquash en git rebase -i?", "o": ["Fusiona sin preguntar", "Resuelve los conflictos solo", "Aplasta todos los commits en uno", "Coloca y marca automáticamente los commits fixup!/squash! junto a su commit objetivo"], "a": 3, "e": "Se activa por defecto con rebase.autoSquash."}, {"id": 254, "t": "GIT-3.3", "q": "¿Qué ocurre al hacer git push normal tras rebasar una rama que ya estaba en el remoto?", "o": ["Se sube sin problema", "Se rechaza porque la historia ya no es compatible", "Se borra la rama remota", "Se fusiona automáticamente"], "a": 1, "e": "Habría que forzar (con --force-with-lease) si la rama es solo tuya."}, {"id": 255, "t": "GIT-3.3", "q": "¿Qué ventaja tiene el rebase frente al merge?", "o": ["Es seguro en ramas compartidas", "Deja una historia lineal y más fácil de leer", "No produce conflictos nunca", "No reescribe la historia"], "a": 1, "e": "A cambio, reescribe commits."}, {"id": 256, "t": "GIT-3.3", "q": "¿Qué ventaja tiene el merge frente al rebase?", "o": ["Nunca da conflictos", "Deja una historia lineal", "Borra los commits innecesarios", "No t fetch?", "o": ["Trae las novedades y las fusiona en tu rama", "Sube tus commits", "Trae las novedades del remoto sin modificar tu rama ni tus ficheros", "Borra las ramas remotas"], "a": 2, "e": "Solo actualiza las ramas origin/..."}, {"id": 265, "t": "GIT-4.1", "q": "¿A qué equivale git pull?", "o": ["git fetch seguido de git push", "git clone seguido de git commit", "git fetch seguido de git merge (o git rebase)", "git push seguido de git merge"], "a": 2, "e": "Traer e integrar."}, {"id": 266, "t": "GIT-4.1", "q": "¿Qué hace git push?", "o": ["Sube tus commits locales al remoto", "Descarga los commits del remoto", "Prepara los ficheros", "Crea un remoto"], "a": 0, "e": "push = empujar."}, {"id": 267, "t": "GIT-4.1", "q": "¿Es seguro ejecutar git fetch en cualquier momento?", "o": ["No, puede borrar cambios", "Sí, porque no toca tu trabajo", "Solo sin cambios pendientes", "Solo en main"], "a": 1, "e": "Solo actualiza referencias remotas."}, {"id": 268, "t": "GIT-4.1", "q": "¿Qué comando muestra los remotos con sus URL?", "o": ["git show remote", "git remote --list-urls", "git remote -v", "git config remote"], "a": 2, "e": "-v = verbose."}, {"id": 269, "t": "GIT-4.1", "q": "¿Qué comando añade un remoto llamado origin?", "o": ["git origin add https://github.com/teresa/app.git", "git remote new origin https://github.com/teresa/app.git", "git add remote origin https://github.com/teresa/app.git", "git remote add origin https://github.com/teresa/app.git"], "a": 3, "e": "remote add nombre URL."}, {"id": 270, "t": "GIT-4.1", "q": "¿Qué comando cambia la URL del remoto origin?", "o": ["git remote rename origin git@github.com:teresa/app.git", "git remote set-url origin git@github.com:teresa/app.git", "git config origin.url git@github.com:teresa/app.git --move", "git remote change origin git@github.com:teresa/app.git"], "a": 1, "e": "Por ejemplo para pasar de HTTPS a SSH."}, {"id": 271, "t": "GIT-4.1", "q": "¿Qué comando renombra el remoto origin a github?", "o": ["git remote rename origin github", "git branch -m origin github", "git remote set-url origin github", "git remote mv origin github"], "a": 0, "e": "rename viejo nuevo."}, {"id": 272, "t": "GIT-4.1", "q": "¿Qué hace git push -u origin main?", "o": ["Actualiza main desde origin", "Sube todas las ramas", "Sube main y borra la rama local", "Sube main y la deja vinculada a origin/main para futuros push y pull"], "a": 3, "e": "-u = set-upstream."}, {"id": 273, "t": "GIT-4.1", "q": "Tras git push -u origin main, ¿qué basta escribir las siguientes veces?", "o": ["git upload", "git push origin main --again", "git push -u", "git push"], "a": 3, "e": "Ya conoce el upstream."}, {"id": 274, "t": "GIT-4.1", "q": "¿Qué es origin/main?", "o": ["Una etiqueta", "Una rama de seguimiento remoto: tu copia de cómo estaba main en el servidor la última vez", "Una rama local normal", "La rama main del servidor en tiempo real"], "a": 1, "e": "Se actualiza con fetch, pull o push."}, {"id": 275, "t": "GIT-4.1", "q": "git status dice \"Your branch is ahead of 'origin/main' by 2 commits\". ¿Qué significa?", "o": ["Tienes 2 commits locales sin subir", "Hay 2 conflictos", "Has borrado 2 commits", "Hay 2 commits en el servidor que no tienes"], "a": 0, "e": "ahead = por delante."}, {"id": 276, "t": "GIT-4.1", "q": "git status dice \"behind 'origin/main' by 3 commits\". ¿Qué significa?", "o": ["Has perdido 3 commits", "Tienes 3 commits sin subir", "Hay 3 ficheros sin preparar", "Hay 3 commits en el servidor que no tienes integrados"], "a": 3, "e": "behind = por detrás."}, {"id": 277, "t": "GIT-4.1", "q": "Tu git push se rechaza porque alguien subió antes. ¿Qué haces?", "o": ["git push --force siempre", "Borrar tu rama", "git pull para integrar sus cambios y luego git push", "git reset --hard"], "a": 2, "e": "Nunca fuerces en ramas compartidas."}, {"id": 278, "t": "GIT-4.1", "q": "¿Qué diferencia hay entre --force y --force-with-lease?", "o": ["--force-with-lease borra el remoto", "--force solo funciona en ramas nuevas", "--force-with-lease solo fuerza si el remoto sigue como lo viste en tu último fetch", "Son iguales"], "a": 2, "e": "Evita machacar commits de otros."}, {"id": 279, "t": "GIT-4.1", "q": "¿Qué comando borra la rama feature/login en el remoto?", "o": ["git push origin --delete feature/login", "git push --remove feature/login", "git remote delete feature/login", "git branch -D origin/feature/login"], "a": 0, "e": "También git push origin :feature/login."}, {"id": 280, "t": "GIT-4.1", "q": "¿Sube git push las etiquetas por defecto?", "o": ["Solo las ligeras", "Sí, todas", "No, hay que subirlas aparte", "Solo las anotadas"], "a": 2, "e": "git push origin v1.0 o --tags."}, {"id": 281, "t": "GIT-4.1", "q": "¿Qué hace git fetch --prune?", "o": ["Borra los commits antiguos", "Comprime el repositorio", "Trae novedades y borra las ramas de seguimiento remoto que ya no existen en el servidor", "Borra tus ramas locales"], "a": 2, "e": "-p = prune."}, {"id": 282, "t": "GIT-4.1", "q": "¿Qué hace git pull si tu rama y la remota han divergido y no has configurado pull.rebase ni pull.ff?", "o": ["Hace rebase siempre", "Borra tus commits locales", "Hace merge siempre", "Falla y te pide elegir cómo integrar"], "a": 3, "e": "En las versiones actuales de Git."}, {"id": 283, "t": "GIT-4.1", "q": "¿Qué hace git config pull.ff only?", "o": ["Que git pull solo actualice si es posible avance rápido", "Que git pull siempre haga merge", "Que git pull suba cambios", "Que git pull siempre haga rebase"], "a": 0, "e": "Si han divergido, falla."}, {"id": 284, "t": "GIT-4.1", "q": "¿Es \"origin\" una palabra reservada de Git?", "o": ["Sí, solo en GitHub", "Sí, no se puede cambiar", "Es el nombre de la rama principal", "No, es solo el nombre por defecto del remoto"], "a": 3, "e": "Se puede renombrar."}, {"id": 285, "t": "GIT-4.1", "q": "¿Qué comando muestra detalles del remoto origin, como ramas y seguimiento?", "o": ["git remote -vv origin", "git log origin", "git show origin", "git remote ", "o": ["Sube main a origin", "Clona origin", "Trae la rama main de origin y la integra en tu rama actual", "Borra main de origin"], "a": 2, "e": "Indica remoto y rama."}, {"id": 294, "t": "GIT-4.2", "q": "¿Qué es un fork en GitHub o GitLab?", "o": ["Una rama protegida", "Una copia en tu equipo", "Un commit de fusión", "Una copia de un repositorio ajeno en tu cuenta del servidor"], "a": 3, "e": "Un clone es la copia local."}, {"id": 295, "t": "GIT-4.2", "q": "¿Cómo se llama en GitLab lo que en GitHub es un Pull Request?", "o": ["Push Request", "Merge Request", "Fork Request", "Change Request"], "a": 1, "e": "Mismo concepto."}, {"id": 296, "t": "GIT-4.2", "q": "¿Para qué sirve un Pull Request?", "o": ["Para descargar cambios del remoto", "Para pedir que se revisen y fusionen tus cambios en otra rama", "Para crear un fork", "Para borrar una rama"], "a": 1, "e": "Es donde se hace la revisión de código."}, {"id": 297, "t": "GIT-4.2", "q": "Al trabajar con un fork, ¿qué nombre se suele dar al remoto del repositorio original?", "o": ["fork", "master", "upstream", "origin"], "a": 2, "e": "origin es tu fork."}, {"id": 298, "t": "GIT-4.2", "q": "¿Qué diferencia hay entre fork y clone?", "o": ["El fork es una copia en el servidor (tu cuenta); el clone es una copia en tu equipo", "El fork no tiene historial", "El clone es en el servidor y el fork en tu equipo", "Son lo mismo"], "a": 0, "e": "Normalmente haces ambos."}, {"id": 299, "t": "GIT-4.2", "q": "¿Qué clave SSH se sube a GitHub o GitLab?", "o": ["Ambas", "La pública (.pub)", "La privada", "Ninguna, se usa la contraseña"], "a": 1, "e": "La privada nunca se comparte."}, {"id": 300, "t": "GIT-4.2", "q": "¿Qué comando genera un par de claves SSH del tipo recomendado hoy?", "o": ["ssh-keygen -t md5", "git ssh-keygen", "ssh-keygen -t ed25519 -C \"teresa@ejemplo.es\"", "ssh-add -t ed25519"], "a": 2, "e": "ed25519 es moderno y seguro."}, {"id": 301, "t": "GIT-4.2", "q": "¿Qué comando prueba la conexión SSH con GitHub?", "o": ["git ssh --test", "git remote test", "ssh -T git@github.com", "ping github.com:22"], "a": 2, "e": "Responde con tu usuario si va bien."}, {"id": 302, "t": "GIT-4.2", "q": "Desde agosto de 2021, ¿qué no acepta GitHub para operaciones Git por HTTPS?", "o": ["Las claves SSH", "La contraseña de la cuenta", "Los repositorios públicos", "Los tokens personales"], "a": 1, "e": "Se usa un token (PAT) o SSH."}, {"id": 303, "t": "GIT-4.2", "q": "¿Qué es un PAT?", "o": ["Una etiqueta anotada", "Un tipo de rama", "Un Personal Access Token, que sustituye a la contraseña para Git y la API", "Un formato de parche"], "a": 2, "e": "Personal Access Token."}, {"id": 304, "t": "GIT-4.2", "q": "¿Qué credential.helper guarda las credenciales en texto plano?", "o": ["cache", "manager", "osxkeychain", "store"], "a": 3, "e": "En ~/.git-credentials: poco seguro."}, {"id": 305, "t": "GIT-4.2", "q": "¿Qué credential.helper guarda las credenciales en memoria temporalmente?", "o": ["manager", "store", "cache", "memory"], "a": 2, "e": "15 minutos por defecto."}, {"id": 306, "t": "GIT-4.2", "q": "¿Qué herramienta incluye Git for Windows para guardar credenciales de forma segura?", "o": ["Git Credential Manager", "PuTTY", "OpenSSL", "KeePass"], "a": 0, "e": "credential.helper manager."}, {"id": 307, "t": "GIT-4.2", "q": "¿Para qué sirven las ramas protegidas?", "o": ["Para cifrar el código", "Para que no se pueda clonar", "Para impedir push directo o forzado y exigir revisión y pruebas antes de fusionar", "Para ocultar la rama"], "a": 2, "e": "Se configuran en la plataforma."}, {"id": 308, "t": "GIT-4.2", "q": "¿Qué indica el fichero CODEOWNERS?", "o": ["Quién es el dueño del servidor", "Las ramas protegidas", "Quién debe revisar cada parte del código", "La licencia del proyecto"], "a": 2, "e": "GitHub y GitLab lo admiten."}, {"id": 309, "t": "GIT-4.2", "q": "¿Qué hace la opción \"Squash and merge\" de un Pull Request?", "o": ["Hace rebase de cada commit", "Fusiona con un commit de fusión", "Fusiona : ["En main y en develop", "Solo en develop", "Solo en main", "En release"], "a": 0, "e": "Para no perder el arreglo."}, {"id": 326, "t": "GIT-4.3", "q": "En Git Flow, ¿de qué rama salen las ramas feature?", "o": ["De main", "De hotfix", "De develop", "De release"], "a": 2, "e": "Y vuelven a develop."}, {"id": 327, "t": "GIT-4.3", "q": "En Git Flow, ¿qué contiene main?", "o": ["El desarrollo diario", "Las funcionalidades a medias", "Solo los hotfix", "Lo que está en producción, con cada versión etiquetada"], "a": 3, "e": "develop es la integración."}, {"id": 328, "t": "GIT-4.3", "q": "En Git Flow, ¿dónde se fusiona una rama release al terminarla?", "o": ["En main y en develop", "Solo en develop", "En hotfix", "Solo en feature"], "a": 0, "e": "Se etiqueta la versión en main."}, {"id": 329, "t": "GIT-4.3", "q": "¿Qué caracteriza a GitHub Flow?", "o": ["main siempre lista para desplegar, ramas cortas y Pull Requests", "Commits directos a main sin revisión", "Ramas por entorno", "Ramas develop y release"], "a": 0, "e": "Muy simple."}, {"id": 330, "t": "GIT-4.3", "q": "¿Tiene GitHub Flow una rama develop?", "o": ["Sí, se llama next", "Solo en proyectos grandes", "No", "Sí, obligatoria"], "a": 2, "e": "Solo main y ramas de funcionalidad."}, {"id": 331, "t": "GIT-4.3", "q": "¿Qué caracteriza al trunk-based development?", "o": ["Una rama por desarrollador para siempre", "Ramas de larga duración por funcionalidad", "Integrar en la rama principal muy a menudo, con ramas que duran horas o pocos días", "No usar ramas nunca y no hacer commits"], "a": 2, "e": "Con feature flags para lo incompleto."}, {"id": 332, "t": "GIT-4.3", "q": "¿Qué son las feature flags en trunk-based development?", "o": ["Ramas protegidas", "Etiquetas de Git", "Interruptores que ocultan funcionalidades incompletas aunque el código esté en main", "Commits firmados"], "a": 2, "e": "Permiten integrar sin activar."}, {"id": 333, "t": "GIT-4.3", "q": "¿Qué añade GitLab Flow respecto a GitHub Flow?", "o": ["Ramas de entorno (staging, production) o de versión", "Ramas develop y hotfix", "Commits sin revisión", "Repositorios bare"], "a": 0, "e": "Para varios entornos."}, {"id": 334, "t": "GIT-4.3", "q": "¿Qué flujo encaja mejor con versiones planificadas (v2.3, v2.4)?", "o": ["Ninguno", "Git Flow", "Trunk-based", "GitHub Flow"], "a": 1, "e": "Ramas release y hotfix."}, {"id": 335, "t": "GIT-4.3", "q": "En SemVer, ¿qué significan los tres números de 2.5.1?", "o": ["MAYOR.MENOR.PARCHE", "PARCHE.MENOR.MAYOR", "RAMA.COMMIT.ETIQUETA", "AÑO.MES.DÍA"], "a": 0, "e": "MAJOR.MINOR.PATCH."}, {"id": 336, "t": "GIT-4.3", "q": "En SemVer, ¿qué número sube con un cambio incompatible?", "o": ["El MENOR", "Ninguno", "El PARCHE", "El MAYOR"], "a": 3, "e": "1.4.2 → 2.0.0."}, {"id": 337, "t": "GIT-4.3", "q": "En SemVer, ¿qué número sube con una funcionalidad nueva compatible?", "o": ["Todos", "El MAYOR", "El MENOR", "El PARCHE"], "a": 2, "e": "1.4.2 → 1.5.0."}, {"id": 338, "t": "GIT-4.3", "q": "En SemVer, ¿qué número sube con una corrección compatible?", "o": ["El PARCHE", "El MAYOR", "Ninguno", "El MENOR"], "a": 0, "e": "1.4.2 → 1.4.3."}, {"id": 339, "t": "GIT-4.3", "q": "Versión 1.9.0 y añades una funcionalidad compatible. ¿Siguiente versión?", "o": ["2.0.0", "1.10.0", "1.9.1", "1.91.0"], "a": 1, "e": "Cada número es independiente."}, {"id": 340, "t": "GIT-4.3", "q": "Versión 1.4.7 y haces un cambio incompatible. ¿Siguiente versión?", "o": ["2.4.7", "2.0.0", "1.4.8", "1.5.0"], "a": 1, "e": "Los números de la derecha vuelven a 0."}, {"id": 341, "t": "GIT-4.3", "q": "En SemVer, ¿qué indica una versión 0.y.z?", "o": ["Desarrollo inicial: la API puede cambiar en cualquier momento", "Versión estable", "Versión de seguridad", "Versión retirada"], "a": 0, "e": "Antes de la 1.0.0."}, {"id": 342, "t": "GIT-4.3", "q": "¿Qué es 1.0.0-beta.1 en SemVer?", "o": ["Un parche de 1.0.0", "Una versión posterior a 1.0.0", "Una pre-versión de 1.0.0", "Una versión no válida"], "a": 2, "e": "Las pre-versiones van
