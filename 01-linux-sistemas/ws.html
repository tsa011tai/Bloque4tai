2, "e": "Se configura en la interfaz o subinterfaz que da servicio a los clientes."}, {"id": 776, "t": "NET-4.4", "q": "¿Qué diferencia hay entre enable secret y enable password?", "o": ["Son idénticos", "enable password es más seguro", "enable secret se almacena con un hash fuerte y prevalece sobre enable password", "enable secret solo vale para SSH"], "a": 2, "e": "Si ambos existen, se usa enable secret."}, {"id": 777, "t": "NET-4.4", "q": "¿Qué comando limita las líneas VTY a conexiones SSH?", "o": ["ip ssh enable", "line vty ssh", "transport input ssh", "ssh only"], "a": 2, "e": "Además se requiere nombre de dominio, claves RSA y login local."}, {"id": 778, "t": "NET-4.4", "q": "¿Qué letra identifica en show ip route a una ruta aprendida por OSPF?", "o": ["S", "O", "R", "D"], "a": 1, "e": "C conectada, L local, S estática, R RIP, D EIGRP, B BGP."}, {"id": 779, "t": "NET-4.4", "q": "¿Qué comando muestra los dispositivos Cisco vecinos?", "o": ["show arp neighbors", "show cdp neighbors", "show neighbors all", "show lldp vecinos"], "a": 1, "e": "show lldp neighbors para el estándar LLDP."}, {"id": 780, "t": "NET-4.4", "q": "¿Qué comando configura una subinterfaz para la VLAN 10 en router-on-a-stick?", "o": ["vlan encapsulation 10", "ip vlan 10", "encapsulation dot1Q 10", "switchport access vlan 10"], "a": 2, "e": "Se aplica en interface g0/0.10 antes de la IP."}, {"id": 781, "t": "NET-5.1", "q": "¿Cuántos bits tiene el identificador de VLAN en 802.1Q?", "o": ["8", "12", "10", "16"], "a": 1, "e": "4096 valores; utilizables 1-4094."}, {"id": 782, "t": "NET-5.1", "q": "¿Cuántos bytes añade la etiqueta 802.1Q a la trama?", "o": ["2", "12", "4", "8"], "a": 2, "e": "TPID (0x8100) + PCP + DEI + VID."}, {"id": 783, "t": "NET-5.1", "q": "¿Qué tipo de puerto transporta varias VLAN etiquetadas entre switches?", "o": ["Nativo", "Troncal (trunk)", "Acceso", "Espejo"], "a": 1, "e": "Los de acceso pertenecen a una sola VLAN y no etiquetan."}, {"id": 784, "t": "NET-5.1", "q": "¿Cómo viaja la VLAN nativa por un troncal 802.1Q?", "o": ["Cifrada", "Sin etiquetar", "No viaja", "Con doble etiqueta"], "a": 1, "e": "Por defecto es la VLAN 1; debe coincidir en ambos extremos."}, {"id": 785, "t": "NET-5.1", "q": "Dos PC conectados al mismo switch pero en VLAN distintas no se comunican. ¿Por qué?", "o": ["Porque tienen la misma máscara", "Porque falta un hub", "Porque el switch está averiado", "Porque cada VLAN es un dominio de difusión distinto y hace falta un dispositivo de capa 3"], "a": 3, "e": "Se necesita un router o un switch L3."}, {"id": 786, "t": "NET-5.1", "q": "¿Cuál es el método más escalable de enrutamiento entre VLAN?", "o": ["Un hub", "Un switch multicapa con SVI", "Un puente", "Un router con una interfaz física por VLAN"], "a": 1, "e": "Router-on-a-stick es válido pero el troncal puede convertirse en cuello de botella."}, {"id": 787, "t": "NET-5.1", "q": "¿Qué es una SVI?", "o": ["Un puerto troncal", "Una interfaz virtual de capa 3 asociada a una VLAN en un switch", "Una VLAN privada", "Un tipo de cable"], "a": 1, "e": "Se crea con interface vlan N."}, {"id": 788, "t": "NET-5.1", "q": "¿Qué protocolo propietario de Cisco negocia troncales automáticamente y conviene desactivar?", "o": ["DTP", "VTP", "LACP", "CDP"], "a": 0, "e": "DTP permite ataques de salto de VLAN."}, {"id": 789, "t": "NET-5.1", "q": "¿Qué protocolo de Cisco propaga la base de datos de VLAN entre switches?", "o": ["VTP", "STP", "DTP", "HSRP"], "a": 0, "e": "Mal configurado puede borrar VLAN de toda la red."}, {"id": 790, "t": "NET-5.1", "q": "¿Qué encapsulación de troncal propietaria de Cisco está obsoleta?", "o": ["VXLAN", "QinQ", "802.1Q", "ISL"], "a": 3, "e": "Hoy se usa 802.1Q."}, {"id": 791, "t": "NET-5.1", "q": "¿Qué rango de VLAN se considera \"extendido\"?", "o": ["4095 – 8191", "1 – 1005", "1006 – 4094", "0 – 1000"], "a": 2, "e": "1-1005 es el rango normal."}, {"id": 792, "t": "NET-5.2", "q": "¿Para qué sirve STP?", "o": ["Para agregar enlaces", "Para enrutar entre VLAN", "Para asignar IP", "Para evitar bucles de capa 2 bloqueando enlaces redundantes"], "a": 3, "e": "Los bucles provocan tormentas de difusión."}, {"id": 793, "t": "NET-5.2", "q": "¿Qué switch se elige como puente raíz en STP?", "o": ["El de mayor MAC", "El que tenga más puertos", "El de menor Bridge ID (menor prioridad y, en empate, menor MAC)", "El de mayor prioridad"], "a": 2, "e": "La prioridad por defecto es 32768."}, {"id": 794, "t": "NET-5.2", "q": "¿Cuál es la prioridad STP por defecto?", "o": ["32768", "4096", "65535", "0"], "a": 0, "e": "Se configura en múltiplos de 4096."}, {"id": 795, "t": "NET-5.2", "q": "¿Cuáles son los estados de puerto de STP 802.1D?", "o": ["Activo, pasivo y espera", "Descarte, aprendizaje y envío", "Up, down y testing", "Bloqueo, escucha, aprendizaje, envío y deshabilitado"], "a": 3, "e": "RSTP los reduce a descarte, aprendizaje y envío."}, {"id": 796, "t": "NET-5.2", "q": "¿Qué estándar es Rapid Spanning Tree (RSTP)?", "o": ["802.1w", "802.1s", "802.1Q", "802.1D"], "a": 0, "e": "802.1s es MSTP; 802.1Q es VLAN."}, {"id": 797, "t": "NET-5.2", "q": "¿En qué puertos se debe habilitar PortFast?", "o": ["En todos los puertos", "En puertos de acceso conectados a equipos finales", "Solo en el puente raíz", "En troncales entre switches"], "a": 1, "e": "Pasa directamente a envío sin esperar los estados de STP."}, {"id": 798, "t": "NET-5.2", "q": "¿Qué protección desactiva un puerto con PortFast si recibe una BPDU?", "o": ["Loop Guard", "BPDU Guard", "Port Security", "Root Guard"], "a": 1, "e": "Evita que se conecte un switch no autorizado."}, {"id": 799, "t": "NET-5.2", "q": "¿Qué protocolo estándar agrega varios enlaces físicos en uno lógico?", "o": ["VRRP", "PAgP", "STP", "LACP (802.3ad / 802.1AX)"], "a": 3, "e": "PAgP es el propietario de Cisco."}, {"id": 800, "t": "NET-5.2", "q": "¿Qué protocolo FHRP es estándar (no propietario)?", "o": ["VRRP", "CARP de Cisco", "GLBP", "HSRP"], "a": 0, "e": "HSRP y GLBP son de Cisco."}, {"id": 801, "t": "NET-5.2", "q": "¿Qué protocolo de redundancia de puerta de enlace balancea la carga entre varios routers activos?", "o": ["GLBP", "HSRP", "STP", "VRRP"], "a": 0, "e": "HSRP y VRRP tienen un único router activo/maestro."}, {"id": 802, "t": "NET-5.2", "q": "¿Cuánto tarda aproximadamente STP clásico en converger?", "o": ["5 minutos", "Menos de 1 segundo", "Entre 30 y 50 segundos", "2 segundos"], "a": 2, "e": "Por los temporizadores max age (20 s) y forward delay (15 s × 2)."}, {"id": 803, "t": "NET-5.2", "q": "¿Qué tecnología de Windows Server agrega tarjetas de red para Hyper-V integrándolas en el conmutador virtual?", "o": ["LBFO obligatoriamente", "MPIO", "SET (Switch Embedded Teaming)", "DFS"], "a": 2, "e": "LBFO es el NIC Teaming clásico."}, {"id": 804, "t": "NET-5.2", "q": "¿Qué coste STP (revisado) tiene un enlace de 1 Gbps?", "o": ["19", "100", "2", "4"], "a": 3, "e": "10 Mbps = 100, 100 Mbps = 19, 1 Gbps = 4, 10 Gbps = 2."}, {"id": 805, "t": "NET-5.3", "q": "Un router tiene las rutas 10.0.0.0/8 y 10.1.1.0/24. ¿Cuál usa para llegar a 10.1.1.5?", "o": ["La que tenga menor métrica, sea cual sea", "10.0.0.0/8, por ser más general", "10.1.1.0/24, por la coincidencia de prefijo más largo", "Las dos alternativamente"], "a": 2, "e": "El prefijo más específico gana siempre."}, {"id": 806, "t": "NET-5.3", "q": "¿Qué distancia administrativa tiene OSPF en Cisco?", "o": ["110", "90", "120", "1"], "a": 0, "e": "Conectada 0, estática 1, EIGRP 90, OSPF 110, RIP 120."}, {"id": 807, "t": "NET-5.3", "q": "¿Qué distancia administrativa tiene una ruta estática en Cisco?", "o": ["110", "1", "0", "5"], "a": 1, "e": "0 corresponde a redes directamente conectadas."}, {"id": 808, "t": "NET-5.3", "q": "¿Qué métrica usa RIP?", "o": ["Retardo y ancho de banda", "Atributos de ruta", "Número de saltos (máximo 15)", "Coste según ancho de banda"], "a": 2, "e": "16 saltos = inalcanzable."}, {"id": 809, "t": "NET-5.3", "q": "¿Qué algoritmo usa OSPF?", "o": ["Path vector", "DUAL", "Dijkstra (SPF)", "Bellman-Ford"], "a": 2, "e": "DUAL es de EIGRP; Bellman-Ford de RIP."}, {"id": 810, "t": "NET-5.3", "q": "¿Cómo se llama el área troncal de OSPF a la que deben conectarse las demás?", "o": ["Área 0", "Área troncal 255", "Área raíz", "Área 1"], "a": 0, "e": "También llamada backbone."}, {"id": 811, "t": "NET-5.3", "q": "¿Qué tipo de protocolo es BGP?", "o": ["Estado de enlace interior", "Vector de ruta, protocolo de pasarela exterior (EGP)", "De capa 2", "Vector distancia interior"], "a": 1, "e": "Intercambia rutas entre sistemas autónomos por TCP 179."}, {"id": 812, "t": "NET-5.3", "q": "¿Qué es una ruta estática flotante?", "o": ["Una ruta IPv6", "Una ruta por defecto", "Una ruta estática con distancia administrativa mayor que la dinámica, que actúa como respaldo", "Una ruta que cambia de interfaz"], "a": 2, "e": "Solo se instala si desaparece la ruta principal."}, {"id": 813, "t": "NET-5.3", "q": "¿Qué protocolos son de tipo estado de enlace?", "o": ["RIP y EIGRP", "RIP y OSPF", "OSPF e IS-IS", "BGP y RIP"], "a": 2, "e": "Construyen un mapa completo de la topología."}, {"id": 814, "t": "NET-5.3", "q": "¿Cómo calcula OSPF el coste de una interfaz?", "o": ["Número de saltos", "Ancho de banda de referencia dividido entre el ancho de banda de la interfaz", "Carga y fiabilidad", "Retardo total"], "a": 1, "e": "La referencia por defecto es 100 Mbps (conviene subirla en redes rápidas)."}, {"id": 815, "t": "NET-5.3", "q": "¿Qué es la ruta por defecto en IPv6?", "o": ["::1/128", "fe80::/10", "::/0", "0.0.0.0/0"], "a": 2, "e": "Coincide con cualquier destino IPv6."}, {"id": 816, "t": "NET-5.3", "q": "¿Cuándo se usa la distancia administrativa para elegir una ruta?", "o": ["Cuando varias fuentes ofrecen exactamente el mismo prefijo", "Solo en rutas por defecto", "Nunca en Cisco", "Siempre antes que el prefijo más largo"], "a": 0, "e": "Primero el prefijo más largo; la AD desempata mismos prefijos de distinto origen."}, {"id": 817, "t": "NET-5.3", "q": "¿Qué protocolo de enrutamiento usa el algoritmo DUAL?", "o": ["BGP", "OSPF", "EIGRP", "RIP"], "a": 2, "e": "Mantiene sucesores y sucesores factibles sin bucles."}, {"id": 818, "t": "NET-5.4", "q": "¿Qué mitigación protege contra el desbordamiento de la tabla MAC de un switch?", "o": ["DHCP snooping", "Port security (limitar el número de MAC por puerto)", "HSRP", "BPDU Guard"], "a": 1, "e": "Las acciones posibles son shutdown, restrict o protect."}, {"id": 819, "t": "NET-5.4", "q": "¿Qué función impide que un servidor DHCP no autorizado conectado a un puerto de usuario reparta IP?", "o": ["DHCP snooping", "PortFast", "Port security", "DAI"], "a": 0, "e": "Solo los puertos de confianza pueden enviar respuestas DHCP."}, {"id": 820, "t": "NET-5.4", "q": "¿Qué función de switch mitiga la suplantación ARP?", "o": ["DAI (Dynamic ARP Inspection)", "LACP", "STP", "VTP"], "a": 0, "e": "Usa la tabla de DHCP snooping para validar las respuestas ARP."}, {"id": 821, "t": "NET-5.4", "q": "¿Qué medida mitiga el salto de VLAN por doble etiquetado?", "o": ["Aumentar el MTU", "Activar CDP", "Usar la VLAN 1 para usuarios", "Cambiar la VLAN nativa a una VLAN sin uso y desactivar DTP"], "a": 3, "e": "El ataque aprovecha que la VLAN nativa viaja sin etiqueta."}, {"id": 822, "t": "NET-5.4", "q": "En 802.1X, ¿qué papel desempeña el switch?", "o": ["Suplicante", "Autenticador", "Controlador de dominio", "Servidor de autenticación"], "a": 1, "e": "El suplicante es el cliente y el servidor de autenticación es el RADIUS."}, {"id": 823, "t": "NET-5.4", "q": "¿Qué método EAP exige certificados tanto en el cliente como en el servidor?", "o": ["LEAP", "EAP-TLS", "EAP-MD5", "PEAP-MSCHAPv2"], "a": 1, "e": "Es el más seguro; PEAP solo exige certificado en el servidor."}, {"id": 824, "t": "NET-5.4", "q": "¿Qué protocolo transporta EAP entre el suplicante y el switch?", "o": ["RADIUS", "TACACS+", "EAPOL", "LDAP"], "a": 2, "e": "Entre el switch y el servidor se usa RADIUS."}, {"id": 825, "t": "NET-5.4", "q": "¿Qué protocolo AAA usa TCP 49 y cifra el paquete completo?", "o": ["RADIUS", "Kerberos", "TACACS+", "LDAP"], "a": 2, "e": "RADIUS usa UDP y solo cifra la contraseña."}, {"id": 826, "t": "NET-5.4", "q": "¿Qué hay al final de toda ACL de Cisco?", "o": ["Un permit any implícito", "Nada", "Un deny any implícito", "Un log implícito"], "a": 2, "e": "Si solo hay líneas deny, se bloquea todo el tráfico."}, {"id": 827, "t": "NET-5.4", "q": "¿Dónde se recomienda colocar una ACL estándar?", "o": ["Lo más cerca posible del destino", "En el núcleo de la red", "En todas las interfaces", "Lo más cerca posible del origen"], "a": 0, "e": "Solo filtran por IP origen; cerca del origen bloquearían demasiado."}, {"id": 828, "t": "NET-5.4", "q": "¿Qué números identifican a las ACL extendidas numeradas de Cisco?", "o": ["200-299", "100-199 y 2000-2699", "700-799", "1-99 y 1300-1999"], "a": 1, "e": "Las estándar usan 1-99 y 1300-1999."}, {"id": 829, "t": "NET-5.4", "q": "¿Qué técnica permite autenticar por la MAC a dispositivos que no soportan 802.1X (impresoras)?", "o": ["MAB (MAC Authentication Bypass)", "ARP estático", "WPS", "PortFast"], "a": 0, "e": "Es menos seguro porque las MAC se pueden falsificar."}, {"id": 830, "t": "NET-5.4", "q": "¿Qué significan las siglas AAA?", "o": ["Autenticación, Acceso y Alertas", "Antivirus, Antispam y Antimalware", "Acceso, Auditoría y Administración", "Autenticación, Autorización y Contabilidad (Accounting)"], "a": 3, "e": "RADIUS y TACACS+ son protocolos AAA."}, {"id": 831, "t": "NET-5.4", "q": "¿Qué función verifica que la IP origen de un puerto coincide con la asignada por DHCP?", "o": ["IP Source Guard", "Storm control", "BPDU Guard", "DAI"], "a": 0, "e": "También se apoya en la tabla de DHCP snooping."}, {"id": 832, "t": "NET-6.1", "q": "¿Qué tipo de cortafuegos mantiene una tabla de conexiones y permite automáticamente el tráfico de respuesta?", "o": ["Filtrado de paquetes sin estado", "Hub de capa 1", "Con estado (stateful)", "Proxy inverso"], "a": 2, "e": "Las ACL clásicas son sin estado."}, {"id": 833, "t": "NET-6.1", "q": "¿Qué protege específicamente un WAF?", "o": ["La red Wi-Fi", "Los switches de acceso", "Aplicaciones web frente a ataques como inyección SQL o XSS", "El correo electrónico"], "a": 2, "e": "Web Application Firewall, capa 7."}, {"id": 834, "t": "NET-6.1", "q": "¿Dónde debe ubicarse un servidor web accesible desde Internet?", "o": ["En la DMZ", "Junto a los controladores de dominio", "En la LAN de usuarios", "En la red de gestión"], "a": 0, "e": "Así un compromiso no da acceso directo a la red interna."}, {"id": 835, "t": "NET-6.1", "q": "¿Qué diferencia hay entre un IDS y un IPS?", "o": ["El IDS bloquea y el IPS alerta", "El IDS detecta y alerta fuera de línea; el IPS se sitúa en línea y puede bloquear", "El IPS solo funciona en hosts", "Son idénticos"], "a": 1, "e": "El IDS suele recibir una copia del tráfico por SPAN o TAP."}, {"id": 836, "t": "NET-6.1", "q": "¿Qué es un falso negativo en un IDS?", "o": ["Una alerta sin ataque real", "Un tráfico legítimo bloqueado", "Un ataque real que no se detecta", "Un error de configuración"], "a": 2, "e": "Es el caso más peligroso; el falso positivo es una alerta errónea."}, {"id": 837, "t": "NET-6.1", "q": "¿Qué método de detección encuentra ataques desconocidos pero genera más falsos positivos?", "o": ["Por firmas", "Por hash", "Por listas blancas de IP", "Por anomalías (comportamiento)"], "a": 3, "e": "Las firmas detectan ataques conocidos con precisión."}, {"id": 838, "t": "NET-6.1", "q": "¿Qué política por defecto se recomienda en un cortafuegos?", "o": ["Permitir todo el tráfico saliente y entrante", "Permitir todo y bloquear lo malicioso", "Denegar todo y permitir solo lo necesario", "Depende del fabricante"], "a": 2, "e": "Principio de mínimo privilegio aplicado a la red."}, {"id": 839, "t": "NET-6.1", "q": "¿Qué es un NGFW?", "o": ["Un switch con PoE", "Un antivirus de escritorio", "Un cortafuegos de nueva generación que identifica aplicaciones y usuarios e integra IPS e inspección TLS", "Un servidor DNS"], "a": 2, "e": "Trabaja de la capa 3 a la 7."}, {"id": 840, "t": "NET-6.1", "q": "¿Qué principio resume el modelo Zero Trust?", "o": ["Nunca confiar, verificar siempre, aunque el acceso venga de la red interna", "Bloquear todo Internet", "Confiar en todo lo que está dentro del perímetro", "Eliminar las contraseñas"], "a": 0, "e": "Documentado en NIST SP 800-207."}, {"id": 841, "t": "NET-6.1", "q": "¿Qué arquitectura de DMZ usa dos cortafuegos, idealmente de distintos fabricantes?", "o": ["Hub and spoke", "Three-legged", "Back-to-back (doble cortafuegos)", "DMZ de host único"], "a": 2, "e": "Si se compromete uno, queda el otro."}, {"id": 842, "t": "NET-6.1", "q": "¿Qué es un proxy transparente?", "o": ["Un proxy que no registra nada", "Un proxy sin cifrado", "Un proxy que intercepta el tráfico sin que haya que configurarlo en los clientes", "Un proxy inverso"], "a": 2, "e": "Se suele implementar redirigiendo el tráfico en el router o firewall."}, {"id": 843, "t": "NET-6.1", "q": "¿Qué es un honeypot?", "o": ["Una VLAN de invitados", "Un servidor de copias", "Un tipo de cortafuegos", "Un sistema señuelo para atraer y estudiar a los atacantes"], "a": 3, "e": "Ayuda a detectar actividad maliciosa."}, {"id": 844, "t": "NET-6.2", "q": "¿Qué protocolo de IPsec proporciona cifrado?", "o": ["IKE", "AH (protocolo IP 51)", "GRE", "ESP (protocolo IP 50)"], "a": 3, "e": "AH solo autentica e integra; no cifra."}, {"id": 845, "t": "NET-6.2", "q": "¿Qué puerto usa IKE?", "o": ["UDP 4500 exclusivamente", "TCP 1723", "TCP 500", "UDP 500"], "a": 3, "e": "UDP 4500 se usa con NAT-T; TCP 1723 es PPTP."}, {"id": 846, "t": "NET-6.2", "q": "¿Qué hace NAT-T en IPsec?", "o": ["Sustituye a IKE", "Cifra la cabecera NAT", "Encapsula ESP en UDP 4500 para que atraviese dispositivos NAT", "Asigna IP a los clientes VPN"], "a": 2, "e": "ESP no tiene puertos y NAT/PAT no puede traducirlo."}, {"id": 847, "t": "NET-6.2", "q": "¿Qué modo de IPsec cifra el paquete IP completo y lo encapsula en uno nuevo?", "o": ["Agresivo", "Principal", "Túnel", "Transporte"], "a": 2, "e": "Modo principal y agresivo son modos de la fase 1 de IKEv1."}, {"id": 848, "t": "NET-6.2", "q": "¿Qué protocolo de VPN está roto y no debe usarse?", "o": ["WireGuard", "OpenVPN", "IKEv2", "PPTP"], "a": 3, "e": "Además Windows Server 2025 lo deshabilita por defecto en RRAS."}, {"id": 849, "t": "NET-6.2", "q": "¿Qué es el split tunneling?", "o": ["Separar voz y datos", "Usar dos proveedores de Internet", "Dividir la VPN en dos túneles cifrados", "Enviar por la VPN solo el tráfico corporativo y el resto directamente a Internet"], "a": 3, "e": "Mejora el rendimiento pero reduce el control y la inspección."}, {"id": 850, "t": "NET-6.2", "q": "¿Qué puerto UDP usa WireGuard por defecto?", "o": ["51820", "500", "1194", "443"], "a": 0, "e": "1194 es OpenVPN."}, {"id": 851, "t": "NET-6.2", "q": "¿Qué algoritmo permite a dos extremos acordar una clave secreta por un canal inseguro?", "o": ["AES", "Diffie-Hellman", "MD5", "SHA-256"], "a": 1, "e": "AES es cifrado simétrico; SHA y MD5 son funciones hash."}, {"id": 852, "t": "NET-6.2", "q": "¿Qué VPN de Microsoft encapsula el tráfico en HTTPS (443)?", "o": ["PPTP", "L2TP", "SSTP", "GRE"], "a": 2, "e": "Atraviesa la mayoría de firewalls."}, {"id": 853, "t": "NET-6.2", "q": "¿Qué protocolo de túnel (protocolo IP 47) no cifra y suele combinarse con IPsec?", "o": ["L2TP", "ESP", "AH", "GRE"], "a": 3, "e": "Generic Routing Encapsulation."}, {"id": 854, "t": "NET-6.2", "q": "¿Qué tipo de VPN conecta dos sedes de forma permanente entre sus pasarelas?", "o": ["Split tunneling", "Sitio a sitio", "SSL de portal", "Acceso remoto"], "a": 1, "e": "La de acceso remoto conecta a un usuario individual."}, {"id": 855, "t": "NET-6.3", "q": "En Wireshark, ¿cuál es un filtro de visualización válido para mostrar el tráfico de la IP 10.0.0.5?", "o": ["ip = 10.0.0.5", "ip.addr == 10.0.0.5", "src 10.0.0.5 only", "host 10.0.0.5"], "a": 1, "e": "host 10.0.0.5 es sintaxis de filtro de captura (BPF)."}, {"id": 856, "t": "NET-6.3", "q": "¿Qué sintaxis usan los filtros de captura de Wireshark y tcpdump?", "o": ["SQL", "BPF (Berkeley Packet Filter)", "La de los filtros de visualización", "Expresiones regulares"], "a": 1, "e": "Ej.: tcp port 443 and host 10.0.0.5."}, {"id": 857, "t": "NET-6.3", "q": "¿Qué filtro de Wireshark muestra solo los paquetes SYN iniciales de TCP?", "o": ["tcp.syn", "tcp.flags == SYN-ACK", "syn only", "tcp.flags.syn == 1 && tcp.flags.ack == 0"], "a": 3, "e": "Útil para detectar escaneos de puertos."}, {"id": 858, "t": "NET-6.3", "q": "¿Qué es el jitter?", "o": ["La variación del retardo entre paquetes", "El porcentaje de paquetes perdidos", "El retardo total de ida y vuelta", "El ancho de banda disponible"], "a": 0, "e": "Es crítico en voz y vídeo."}, {"id": 859, "t": "NET-6.3", "q": "¿Qué herramienta mide el ancho de banda real entre dos equipos?", "o": ["nslookup", "arp", "ping", "iperf3"], "a": 3, "e": "Se ejecuta un servidor en un extremo y un cliente en el otro."}, {"id": 860, "t": "NET-6.3", "q": "¿Qué valor DSCP se usa habitualmente para el tráfico de voz?", "o": ["CS1 (8)", "AF11 (10)", "0 (Best Effort)", "EF (46)"], "a": 3, "e": "Expedited Forwarding."}, {"id": 861, "t": "NET-6.3", "q": "¿Qué tecnología exporta estadísticas de flujos (quién habla con quién y cuánto)?", "o": ["NetFlow / IPFIX", "Syslog", "SNMP traps", "LLDP"], "a": 0, "e": "sFlow es una alternativa basada en muestreo."}, {"id": 862, "t": "NET-6.3", "q": "¿Qué se configura en un switch para copiar el tráfico de un puerto a otro donde hay un analizador?", "o": ["Un puerto espejo (SPAN)", "PortFast", "Un troncal", "Una VLAN privada"], "a": 0, "e": "Un TAP de red es la alternativa física."}, {"id": 863, "t": "NET-6.3", "q": "¿Cuáles de estas son herramientas de monitorización de red?", "o": ["Nagios, Zabbix y PRTG", "Apache, Nginx e IIS", "MySQL, Oracle y PostgreSQL", "Word, Excel y PowerPoint"], "a": 0, "e": "Monitorizan disponibilidad y rendimiento por SNMP, agentes, etc."}, {"id": 864, "t": "NET-6.3", "q": "¿Qué filtro de Wireshark muestra las retransmisiones TCP?", "o": ["retransmit", "tcp.resend == 1", "tcp.retry", "tcp.analysis.retransmission"], "a": 3, "e": "Muchas retransmisiones indican pérdida de paquetes o congestión."}, {"id": 865, "t": "NET-6.4", "q": "¿En qué orden se diagnostica un puesto sin red empezando desde el propio equipo?", "o": ["ping a un nombre, ipconfig, ping a la puerta de enlace", "ipconfig, ping 127.0.0.1, ping a la puerta de enlace, ping a una IP externa, ping a un nombre", "tracert, nslookup, ipconfig", "Reiniciar el router primero"], "a": 1, "e": "Se avanza del equipo local hacia el exterior."}, {"id": 866, "t": "NET-6.4", "q": "Un equipo hace ping a 8.8.8.8 pero no a www.age.es. ¿Dónde está el problema?", "o": ["En el cable", "En la resolución DNS", "En el DHCP", "En la puerta de enlace"], "a": 1, "e": "Hay conectividad IP pero no se resuelven nombres."}, {"id": 867, "t": "NET-6.4", "q": "Un equipo llega a los equipos de su red pero no a otras redes. ¿Causa más probable?", "o": ["Puerta de enlace incorrecta o ausente", "Cable desconectado", "Desajuste de dúplex", "DNS mal configurado"], "a": 0, "e": "Sin puerta de enlace no sabe cómo salir de su subred."}, {"id": 868, "t": "NET-6.4", "q": "Un servidor responde al ping pero la aplicación web no carga. ¿Qué compruebas primero?", "o": ["Que el puerto del servicio esté abierto y el servicio en marcha (por ejemplo Test-NetConnection -Port 443)", "La configuración DHCP", "El cable de red", "La tabla ARP"], "a": 0, "e": "Ping solo demuestra conectividad ICMP."}, {"id": 869, "t": "NET-6.4", "q": "Las páginas web pequeñas cargan, pero las grandes y las conexiones VPN se cuelgan. ¿Causa probable?", "o": ["DHCP agotado", "DNS caído", "Bucle STP", "Problema de MTU (fragmentación o PMTUD bloqueado)"], "a": 3, "e": "Si se filtran los ICMP \"fragmentación necesaria\", PMTUD no funciona."}, {"id": 870, "t": "NET-6.4", "q": "La red se colapsa de repente, los switches están al 100 % de CPU y hay difusiones masivas. ¿Qué ocurre?", "o": ["Un bucle de capa 2 (STP deshabilitado o mal configurado)", "Una IP duplicada", "Un certificado caducado", "Un servidor DNS caído"], "a": 0, "e": "Una tormenta de difusión típica."}, {"id": 871, "t": "NET-6.4", "q": "Un servidor responde de forma intermitente y arp -a muestra que su IP cambia de MAC. ¿Qué pasa?", "o": ["Hay una IP duplicada en la red", "El DNS está mal", "La máscara es incorrecta", "El cable está roto"], "a": 0, "e": "Dos equipos responden a la misma IP."}, {"id": 872, "t": "NET-6.4", "q": "Hay conflictos de IP con una impresora con IP fija dentro del rango del DHCP. ¿Solución?", "o": ["Reiniciar el switch", "Cambiar la máscara del DHCP", "Crear una exclusión (o una reserva) en el ámbito DHCP para esa IP", "Desactivar el DNS"], "a": 2, "e": "Las IP fijas deben quedar fuera del rango repartible."}, {"id": 873, "t": "NET-6.4", "q": "Un servidor no responde al ping pero su web funciona. ¿Explicación más probable?", "o": ["El cortafuegos bloquea ICMP", "La web usa UDP", "El servidor está apagado", "El DNS está caído"], "a": 0, "e": "Es habitual en Windows (por defecto) y en Internet."}, {"id": 874, "t": "NET-6.4", "q": "¿Qué comando de PowerShell sirve para ver qué proceso escucha en el 3389?", "o": ["Resolve-DnsName 3389", "Test-Connection -Port 3389", "Get-NetTCPConnection -LocalPort 3389", "Get-NetAdapter -Port 3389"], "a": 2, "e": "La columna OwningProcess da el PID."}, {"id": 875, "t": "NET-6.5", "q": "En un supuesto de redes, ¿qué red usaría un ministerio para intercambiar servicios con una comunidad autónoma?", "o": ["GÉANT", "La Red SARA, intranet de las Administraciones Públicas españolas", "RedIRIS", "Una VPN sobre Internet sin más, porque no existe red común"], "a": 1, "e": "Se conecta con la red europea TESTA; la red académica es RedIRIS."}, {"id": 876, "t": "NET-6.5", "q": "¿Con qué red europea se interconecta la Red SARA?", "o": ["TESTA", "GÉANT", "RedIRIS", "SWIFT"], "a": 0, "e": "GÉANT es la red académica europea."}, {"id": 877, "t": "NET-6.5", "q": "¿Qué grupo de medidas del ENS trata la protección de las comunicaciones?", "o": ["org.1", "mp.info", "mp.com", "op.exp"], "a": 2, "e": "Incluye perímetro seguro y segregación de redes."}, {"id": 878, "t": "NET-6.5", "q": "¿Qué herramienta del CCN-CERT detecta amenazas persistentes avanzadas en el tráfico de red?", "o": ["INES", "CARMEN", "PILAR", "LUCÍA"], "a": 1, "e": "Analiza tráfico para identificar comportamientos anómalos."}, {"id": 879, "t": "NET-6.5", "q": "¿Qué es SDN?", "o": ["Un tipo de fibra", "Un protocolo de enrutamiento exterior", "Una VPN de Microsoft", "Redes definidas por software, con el plano de control centralizado y separado del plano de datos"], "a": 3, "e": "OpenFlow fue uno de los primeros protocolos SDN."}, {"id": 880, "t": "NET-6.5", "q": "¿Qué es NFV?", "o": ["Una norma de cableado", "El sucesor de NAT", "La virtualización de funciones de red (firewall, router, balanceador) en servidores estándar", "Un sistema de ficheros de red"], "a": 2, "e": "Network Functions Virtualization."}, {"id": 881, "t": "NET-6.5", "q": "¿Qué combina SASE?", "o": ["Wi-Fi y 5G", "DNS y DHCP", "Capacidades de red WAN (SD-WAN) y de seguridad entregadas desde la nube", "Switches y routers en un mismo chasis"], "a": 2, "e": "Secure Access Service Edge."}, {"id": 882, "t": "NET-6.5", "q": "Según la buena práctica y el ENS, ¿cómo debe acceder un usuario a la red de un organismo desde casa?", "o": ["Compartiendo carpetas por SMB en Internet", "Por RDP abierto a Internet", "Por VPN con autenticación de doble factor y registro de la actividad", "Por Telnet con contraseña fuerte"], "a": 2, "e": "Exponer RDP o SMB directamente a Internet es un riesgo grave."}, {"id": 883, "t": "NET-6.5", "q": "¿Qué segmentación es recomendable en la red de un organismo?", "o": ["Solo separar la Wi-Fi", "Separar por planta del edificio sin filtrado", "Una única VLAN plana para todos", "VLAN separadas para usuarios, servidores, gestión, voz e invitados, con cortafuegos entre zonas"], "a": 3, "e": "Limita el movimiento lateral de un atacante."}, {"id": 884, "t": "PS-1.1", "q": "¿En qué carpeta se instala por defecto PowerShell 7 en Windows?", "o": ["C:\\Windows\\PowerShell7", "C:\\ProgramData\\pwsh", "C:\\Program Files\\PowerShell\\7", "C:\\Windows\\System32\\WindowsPowerShell\\v1.0"], "a": 2, "e": "La ruta de v1.0 corresponde a Windows PowerShell 5.1 (el \"v1.0\" es histórico)."}, {"id": 885, "t": "PS-1.1", "q": "¿Qué comando de WinGet instala PowerShell 7?", "o": ["Install-Module PowerShell7", "winget add pwsh", "winget install Microsoft.PowerShell", "Update-PowerShell -Version 7"], "a": 2, "e": "También se puede instalar con el MSI oficial."}, {"id": 886, "t": "PS-1.1", "q": "¿Qué editor está en modo mantenimiento y solo soporta Windows PowerShell 5.1?", "o": ["Notepad++", "PowerShell ISE", "Visual Studio Code", "Windows Terminal"], "a": 1, "e": "Microsoft recomienda VS Code con la extensión PowerShell."}, {"id": 887, "t": "PS-1.2", "q": "¿Qué hace Get-Help about_Operators?", "o": ["Abre la web de Microsoft", "Da error porque no es un cmdlet", "Lista todos los cmdlets con operadores", "Muestra el tema conceptual sobre los operadores de PowerShell"], "a": 3, "e": "Los temas about_* explican conceptos."}, {"id": 888, "t": "PS-1.2", "q": "Si escribes Get-ChildItem C:\\Windows, ¿a qué parámetro se asigna C:\\Windows?", "o": ["A -Path, porque es el parámetro en la posición 0", "A -Name", "A -Filter", "A -Include"], "a": 0, "e": "Es un parámetro posicional."}, {"id": 889, "t": "PS-1.2", "q": "¿Qué combinación de teclas muestra todas las opciones de autocompletado disponibles en la consola?", "o": ["Ctrl+C", "Alt+Tab", "F7 obligatoriamente", "Ctrl+Espacio"], "a": 3, "e": "Tab completa de una en una; Ctrl+Espacio muestra el menú (PSReadLine)."}, {"id": 890, "t": "PS-1.3", "q": "¿Qué cmdlet crea un alias para la sesión actual?", "o": ["New-Alias -Name np -Value notepad.exe", "alias np=notepad.exe", "Set-Command np notepad.exe", "Add-Alias np notepad.exe"], "a": 0, "e": "Set-Alias también vale; para que sea permanente se añade al perfil."}, {"id": 891, "t": "PS-1.3", "q": "¿Qué alias de PowerShell corresponde a Select-Object?", "o": ["select", "sel", "pick", "so"], "a": 0, "e": "Sort-Object es sort; Select-String es sls."}, {"id": 892, "t": "PS-1.3", "q": "¿Qué cmdlet ejecuta el alias kill?", "o": ["Exit-PSSession", "Remove-Item", "Stop-Process", "Stop-Service"], "a": 2, "e": "kill y spps son alias de Stop-Process (en Windows)."}, {"id": 893, "t": "PS-1.4", "q": "¿Qué comando ejecuta un script ignorando la directiva de ejecución sin cambiarla de forma permanente?", "o": ["Start-Process .\\script.ps1 -Bypass", "pwsh -ExecutionPolicy Bypass -File .\\script.ps1", "Set-ExecutionPolicy Unrestricted -Force", "Unblock-File -All"], "a": 1, "e": "Afecta solo a ese proceso."}, {"id": 894, "t": "PS-1.4", "q": "¿Qué directiva de ejecución exige que todos los scripts, incluidos los locales, estén firmados?", "o": ["RemoteSigned", "Restricted", "AllSigned", "Bypass"], "a": 2, "e": "RemoteSigned solo exige firma a los descargados."}, {"id": 895, "t": "PS-1.5", "q": "¿Qué cmdlet copia una carpeta con todo su contenido?", "o": ["Copy-Item C:\\Origen D:\\Destino -All", "Copy-Folder C:\\Origen D:\\Destino", "Move-Item C:\\Origen D:\\Destino -Copy", "Copy-Item C:\\Origen D:\\Destino -Recurse"], "a": 3, "e": "Sin -Recurse solo copia la carpeta vacía."}, {"id": 896, "t": "PS-1.5", "q": "¿Qué cmdlet devuelve el contenido de un fichero como un único string?", "o": ["Get-Content fichero.txt -Raw", "Get-Content fichero.txt -AsString", "Read-File fichero.txt", "Get-Content fichero.txt -Single"], "a": 0, "e": "Útil para ConvertFrom-Json o reemplazos multilínea."}, {"id": 897, "t": "PS-1.5", "q": "¿Qué parámetro de Get-ChildItem devuelve solo carpetas?", "o": ["-Directory", "-Type Dir", "-Container", "-Folder"], "a": 0, "e": "-File devuelve solo ficheros."}, {"id": 898, "t": "PS-1.5", "q": "¿Qué cmdlet renombra un fichero?", "o": ["Rename-Item C:\\a.txt -NewName b.txt", "Set-Item C:\\a.txt -Name b.txt", "Rename-File C:\\a.txt b.txt", "Move-Item C:\\a.txt -Name b.txt"], "a": 0, "e": "Alias ren o rni."}, {"id": 899, "t": "PS-2.1", "q": "¿Qué escribe \"Total: $($lista.Count)\" si $lista tiene 3 elementos?", "o": ["Total: 3", "Total: System.Object[].Count", "Total: $($lista.Count)", "Total:"], "a": 0, "e": "La subexpresión $() evalúa la propiedad dentro de la cadena."}, {"id": 900, "t": "PS-2.1", "q": "¿Qué escribe \"Total: $lista.Count\" si $lista = @(1,2,3)?", "o": ["Total: $lista.Count", "Total: 3", "Total: 1 2 3.Count", "Un error"], "a": 2, "e": "Solo se expande la variable; .Count se toma como texto. Hay que usar $( )."}, {"id": 901, "t": "PS-2.1", "q": "¿Qué genera 1..5?", "o": ["El número 15", "Un rango de letras", "Un array con los números del 1 al 5", "Un error"], "a": 2, "e": "El operador de rango crea una secuencia de enteros."}, {"id": 902, "t": "PS-2.1", "q": "¿Qué devuelve \"servidor01\" -like \"serv*\"?", "o": ["serv", "True", "False", "Un error"], "a": 1, "e": "-like usa comodines: * cualquier secuencia, ? un carácter."}, {"id": 903, "t": "PS-2.1", "q": "¿Qué devuelve \"a-b-c\" -replace \"-\", \"_\"?", "o": ["a-b-c", "_", "a_b_c", "a_b-c"], "a": 2, "e": "-replace sustituye todas las coincidencias (usa regex)."}, {"id": 904, "t": "PS-2.1", "q": "¿Qué contiene $Matches después de \"abc123\" -match \"\\d+\"?", "o": ["La coincidencia encontrada (123) en $Matches[0]", "True", "abc", "Nada, -match no rellena variables"], "a": 0, "e": "-match rellena la tabla automática $Matches."}, {"id": 905, "t": "PS-2.1", "q": "¿Qué hace [int]$x = \"42\"?", "o": ["Declara $x como entero y convierte la cadena \"42\" al número 42", "Da error porque no se puede convertir", "Crea un array", "Guarda la cadena \"42\""], "a": 0, "e": "Las variables tipadas convierten el valor asignado."}, {"id": 906, "t": "PS-2.1", "q": "¿Qué tipo de objeto crea [PSCustomObject]@{ Nombre = \"Ana\"; Edad = 30 }?", "o": ["Un array de dos elementos", "Un string", "Un objeto personalizado con propiedades Nombre y Edad", "Un hashtable"], "a": 2, "e": "Muy usado para construir informes."}, {"id": 907, "t": "PS-2.2", "q": "¿Qué hace Get-Service -Name Spooler | Stop-Service?", "o": ["Muestra el servicio y luego para todos", "Pasa el objeto del servicio por el pipeline y lo detiene", "Detiene el servicio en remoto", "Da error porque Stop-Service no acepta pipeline"], "a": 1, "e": "Stop-Service acepta objetos ServiceController por valor."}, {"id": 908, "t": "PS-2.2", "q": "¿Qué parámetro de Get-Member muestra solo las propiedades?", "o": ["-OnlyProperties", "-Type Prop", "-Properties", "-MemberType Property"], "a": 3, "e": "También existe -MemberType Method."}, {"id": 909, "t": "PS-2.2", "q": "¿Qué devuelve (Get-Service Spooler).Status?", "o": ["La lista de servicios", "El nombre del servicio", "Un error", "El estado del servicio (por ejemplo Running)"], "a": 3, "e": "Los paréntesis ejecutan primero y luego se accede a la propiedad."}, {"id": 910, "t": "PS-2.3", "q": "¿Qué comando muestra los 5 ficheros más grandes de una carpeta?", "o": ["Get-ChildItem | Measure-Object -Max 5", "Get-ChildItem | Where-Object Length -First 5", "Get-ChildItem -File -Top 5 -Size", "Get-ChildItem -File | Sort-Object Length -Descending | Select-Object -First 5"], "a": 3, "e": "Ordenar por Length descendente y tomar 5."}, {"id": 911, "t": "PS-2.3", "q": "¿Qué hace Select-Object -Skip 2?", "o": ["Omite los dos primeros objetos", "Selecciona dos objetos al azar", "Elimina las dos últimas propiedades", "Salta dos líneas en pantalla"], "a": 0, "e": "Se combina con -First para paginar."}, {"id": 912, "t": "PS-2.3", "q": "¿Qué cmdlet cuenta los objetos que recibe por defecto?", "o": ["Sort-Object", "Count-Object", "Measure-Object", "Group-Object"], "a": 2, "e": "Devuelve la propiedad Count."}, {"id": 913, "t": "PS-2.3", "q": "¿Qué comando filtra los procesos con más de 100 segundos de CPU cuyo nombre empieza por s?", "o": ["Get-Process | Where-Object { $_.CPU -gt 100 -and $_.Name -like \"s*\" }", "Get-Process | Select-Object CPU -gt 100", "Get-Process -CPU 100 -Name s*", "Get-Process | Where-Object CPU > 100 and Name = s*"], "a": 0, "e": "Con varias condiciones se usa el bloque de script con -and."}, {"id": 914, "t": "PS-2.4", "q": "¿Qué comando exporta los servicios a CSV con punto y coma como separador?", "o": ["Export-Csv -Service servicios.csv", "Get-Service | Export-Csv servicios.csv -Delimiter ';' -NoTypeInformation", "Get-Service | Out-File servicios.csv -Separator ';'", "Get-Service | ConvertTo-Csv ; > servicios.csv"], "a": 1, "e": "El punto y coma facilita abrirlo con Excel en español."}, {"id": 915, "t": "PS-2.4", "q": "¿Qué cmdlet genera un informe HTML a partir de objetos?", "o": ["Out-Html", "ConvertTo-Html", "New-HtmlReport", "Export-Html"], "a": 1, "e": "Después se guarda con Out-File."}, {"id": 916, "t": "PS-2.4", "q": "¿Qué codificación usa por defecto PowerShell 7 al escribir ficheros?", "o": ["ASCII", "UTF-16LE", "ANSI", "UTF-8 sin BOM"], "a": 3, "e": "En 5.1 dependía del cmdlet (Out-File UTF-16LE, Set-Content ANSI)."}, {"id": 917, "t": "PS-2.4", "q": "¿Qué hace Out-File informe.txt -Append?", "o": ["Muestra el fichero", "Crea un fichero nuevo con otro nombre", "Sobrescribe el fichero", "Añade la salida al final del fichero"], "a": 3, "e": "Equivale a >>."}, {"id": 918, "t": "PS-3.1", "q": "¿Qué cmdlet muestra los servicios de los que depende el servicio Spooler?", "o": ["Get-Service Spooler -RequiredServices", "Get-ServiceDependency Spooler", "Get-Service Spooler -Parents", "Get-Service Spooler -DependentServices"], "a": 0, "e": "-DependentServices muestra los que dependen de él."}, {"id": 919, "t": "PS-3.1", "q": "¿Qué comando de cmd inicia el servicio de cola de impresión?", "o": ["start spooler", "sc run spooler", "net start spooler", "service spooler start"], "a": 2, "e": "net stop lo detiene; sc start también funciona."}, {"id": 920, "t": "PS-3.1", "q": "¿Qué cmdlet espera a que termine un proceso?", "o": ["Stop-Process -Wait", "Suspend-Process", "Get-Process -Wait", "Wait-Process"], "a": 3, "e": "También Start-Process -Wait al lanzarlo."}, {"id": 921, "t": "PS-3.1", "q": "¿Qué comando de cmd termina todos los procesos notepad.exe?", "o": ["kill notepad", "taskkill /IM notepad.exe /F", "taskkill /PID notepad.exe", "tasklist /kill notepad"], "a": 1, "e": "/IM indica el nombre de imagen."}, {"id": 922, "t": "PS-3.2", "q": "¿Cómo se accede a HKEY_USERS desde PowerShell sin crear una unidad?", "o": ["Get-ChildItem HKEY_USERS:", "Get-ChildItem Registry::HKEY_USERS", "Get-ChildItem HKU:", "Get-Registry -Hive Users"], "a": 1, "e": "Se usa la ruta del proveedor con el prefijo Registry::."}, {"id": 923, "t": "PS-3.2", "q": "¿Qué cmdlet crea una nueva clave del registro?", "o": ["New-Item -Path HKCU:\\Software\\MiApp", "New-RegKey HKCU:\\Software\\MiApp", "Add-Content HKCU:\\Software\\MiApp", "New-ItemProperty -Path HKCU:\\Software\\MiApp"], "a": 0, "e": "Las claves son elementos; los valores, propiedades."}, {"id": 924, "t": "PS-3.2", "q": "¿Qué cmdlet lista las unidades disponibles de todos los proveedores?", "o": ["Get-Location -All", "Get-Disk", "Get-Volume", "Get-PSDrive"], "a": 3, "e": "Incluye C:, HKLM:, Env:, Cert:, etc."}, {"id": 925, "t": "PS-3.3", "q": "¿Qué cmdlet lista los miembros del grupo local Administradores (en español)?", "o": ["net group Administradores", "Get-LocalUser -Group Administradores", "Get-ADGroupMember Administradores", "Get-LocalGroupMember -Group \"Administradores\""], "a": 3, "e": "net localgroup Administradores es el equivalente cmd."}, {"id": 926, "t": "PS-3.3", "q": "¿Qué comando de cmd añade un usuario local con contraseña?", "o": ["useradd soporte", "net user soporte P@ss2026 /add", "net user /new soporte", "net localgroup soporte /add P@ss2026"], "a": 1, "e": "useradd es de Linux."}, {"id": 927, "t": "PS-3.4", "q": "¿Qué cmdlet formatea la unidad E: en NTFS con la etiqueta Datos?", "o": ["Format-Disk E -NTFS -Label Datos", "Format-Volume -DriveLetter E -FileSystem NTFS -NewFileSystemLabel Datos", "New-Partition -DriveLetter E -Format NTFS -Label Datos", "New-Volume E -Format NTFS"], "a": 1, "e": "En cmd sería format E: /FS:NTFS /V:Datos /Q."}, {"id": 928, "t": "PS-3.4", "q": "¿Qué cmdlet muestra la información del sistema (equivalente a systeminfo)?", "o": ["Get-WmiInfo", "Get-SystemInfo", "Get-Host", "Get-ComputerInfo"], "a": 3, "e": "Admite -Property para elegir campos."}, {"id": 929, "t": "PS-3.4", "q": "¿Qué comando de cmd reinicia el equipo inmediatamente?", "o": ["shutdown /a", "restart /now", "shutdown /s /t 0", "shutdown /r /t 0"], "a": 3, "e": "/s apaga; /a cancela."}, {"id": 930, "t": "PS-3.5", "q": "¿Qué cmdlet lee eventos de un fichero .evtx exportado?", "o": ["Get-WinEvent -Path C:\\export.evtx", "Get-Content C:\\export.evtx", "Import-EventLog C:\\export.evtx", "Get-EventLog -File C:\\export.evtx"], "a": 0, "e": "Get-WinEvent admite -Path."}, {"id": 931, "t": "PS-3.5", "q": "¿Qué Event ID indica que un usuario cambió su propia contraseña?", "o": ["4723", "4738", "4720", "4724"], "a": 0, "e": "4724 es el restablecimiento por un administrador; 4738 cambio de cuenta."}, {"id": 932, "t": "PS-3.5", "q": "¿Qué Event ID registra un fallo de preautenticación Kerberos (contraseña incorrecta en dominio)?", "o": ["4768", "4776", "4771", "4769"], "a": 2, "e": "4768 solicitud de TGT; 4769 ticket de servicio; 4776 validación NTLM."}, {"id": 933, "t": "PS-3.5", "q": "¿Qué Event ID indica que se asignaron privilegios especiales en un inicio de sesión (administrador)?", "o": ["4672", "4688", "4648", "4624"], "a": 0, "e": "4688 es creación de proceso; 4648 inicio con credenciales explícitas."}, {"id": 934, "t": "PS-3.5", "q": "¿Qué tipo de inicio de sesión (Logon Type) tiene un acceso a una carpeta compartida?", "o": ["7 (desbloqueo)", "2 (interactivo)", "10 (remoto interactivo)", "3 (red)"], "a": 3, "e": "El tipo 3 aparece al acceder a recursos por la red."}, {"id": 935, "t": "PS-4.1", "q": "¿Qué escribe este código: $n = 5; if ($n -gt 3) { \"Mayor\" } else { \"Menor\" }?", "o": ["True", "Mayor", "Un error por usar -gt", "Menor"], "a": 1, "e": "5 es mayor que 3."}, {"id": 936, "t": "PS-4.1", "q": "¿Qué escribe: foreach ($i in 1..3) { if ($i -eq 2) { continue }; $i }?", "o": ["1", "1 y 3", "1, 2 y 3", "2"], "a": 1, "e": "continue salta la iteración del 2."}, {"id": 937, "t": "PS-4.1", "q": "¿Qué escribe: foreach ($i in 1..3) { if ($i -eq 2) { break }; $i }?", "o": ["2 y 3", "1 y 3", "1", "1, 2 y 3"], "a": 2, "e": "break sale del bucle al llegar al 2."}, {"id": 938, "t": "PS-4.1", "q": "¿Qué ocurre con un bucle while ($false) { \"hola\" }?", "o": ["Da error de sintaxis", "No se ejecuta nunca", "Se ejecuta infinitamente", "Se ejecuta una vez"], "a": 1, "e": "while comprueba la condición antes de la primera iteración (al contrario que do-while)."}, {"id": 939, "t": "PS-4.2", "q": "¿Qué atributo hace obligatorio un parámetro?", "o": ["[Required()]", "[Mandatory]", "[Parameter(Mandatory)]", "[ValidateNotNull()] sin más"], "a": 2, "e": "Si no se proporciona, PowerShell lo pide."}, {"id": 940, "t": "PS-4.2", "q": "¿Qué atributo permite que un parámetro reciba valores del pipeline?", "o": ["[Pipeline()]", "[Parameter(ValueFromPipeline)]", "[Parameter(Pipe)]", "[AcceptPipeline]"], "a": 1, "e": "ValueFromPipelineByPropertyName enlaza por nombre de propiedad."}, {"id": 941, "t": "PS-4.2", "q": "¿Qué atributo limita un parámetro entero a valores entre 1 y 100?", "o": ["[ValidateLength(1,100)]", "[ValidateRange(1,100)]", "[ValidateSet(1..100)]", "[Range(1,100)]"], "a": 1, "e": "ValidateLength limita la longitud de cadenas."}, {"id": 942, "t": "PS-4.2", "q": "¿Qué devuelve una función que contiene las líneas \"a\", \"b\" y return \"c\"?", "o": ["Solo c", "Solo a", "a, b y c", "Nada"], "a": 2, "e": "Todo lo que no se asigna o descarta forma parte de la salida."}, {"id": 943, "t": "PS-4.3", "q": "¿Qué cmdlet crea un error no terminal?", "o": ["exit 1", "break", "throw", "Write-Error"], "a": 3, "e": "throw genera errores terminales."}, {"id": 944, "t": "PS-4.3", "q": "¿Qué parámetro común guarda los errores de un comando en una variable?", "o": ["-OutVariable", "-ErrorAction", "-WarningAction", "-ErrorVariable"], "a": 3, "e": "-ErrorVariable err guarda los errores en $err."}, {"id": 945, "t": "PS-4.3", "q": "¿Qué contiene $Error[0]?", "o": ["El error más reciente", "El número de errores", "El error del script actual solamente", "El primer error de la sesión"], "a": 0, "e": "$Error es una lista con el último error en la posición 0."}, {"id": 946, "t": "PS-4.4", "q": "¿Qué cmdlet carga en PowerShell 7 un módulo que solo funciona en Windows PowerShell?", "o": ["Import-Module NombreModulo -Version 5.1", "Import-Module NombreModulo -UseWindowsPowerShell", "Import-Module NombreModulo -Legacy", "Install-Module NombreModulo -Compat"], "a": 1, "e": "Crea una sesión implícita de 5.1 en segundo plano."}, {"id": 947, "t": "PS-4.4", "q": "¿Qué extensión tiene el manifiesto de un módulo?", "o": [".ps1xml", ".psm1", ".mof", ".psd1"], "a": 3, "e": "Contiene la versión, el autor, las dependencias y lo que exporta."}, {"id": 948, "t": "PS-4.4", "q": "¿Qué cmdlet busca un módulo en la PowerShell Gallery?", "o": ["Search-Module", "Get-Module -Online", "Get-InstalledModule", "Find-Module"], "a": 3, "e": "Find-PSResource es el equivalente en PSResourceGet."}, {"id": 949, "t": "PS-4.5", "q": "¿Qué cmdlet espera a que un trabajo en segundo plano termine?", "o": ["Wait-Job", "Stop-Job", "Receive-Job -Wait", "Get-Job -Wait"], "a": 0, "e": "Receive-Job -Wait también existe, pero el cmdlet específico es Wait-Job."}, {"id": 950, "t": "PS-4.5", "q": "¿Qué cmdlet registra (crea) una tarea programada?", "o": ["Register-ScheduledTask", "New-ScheduledTask -Register", "schtasks.ps1", "Add-ScheduledTask"], "a": 0, "e": "New-ScheduledTask crea un objeto en memoria sin registrarlo."}, {"id": 951, "t": "PS-4.5", "q": "¿Qué cmdlet elimina una tarea programada?", "o": ["Remove-ScheduledTask", "Delete-ScheduledTask", "Disable-ScheduledTask", "Unregister-ScheduledTask"], "a": 3, "e": "Disable-ScheduledTask solo la deshabilita."}, {"id": 952, "t": "PS-5.1", "q": "¿Qué cmdlet crea sesiones remotas persistentes para reutilizarlas?", "o": ["Enter-PSSession", "Invoke-Command -Persist", "Connect-PSRemote", "New-PSSession"], "a": 3, "e": "Se usan con Invoke-Command -Session y se cierran con Remove-PSSession."}, {"id": 953, "t": "PS-5.1", "q": "¿Qué cmdlet copia un fichero a un equipo remoto a través de una sesión de PowerShell?", "o": ["Copy-Item -ComputerName SRV01 C:\\a.txt", "Send-File SRV01 C:\\a.txt", "Invoke-Command -Copy C:\\a.txt", "Copy-Item -Path C:\\a.txt -Destination C:\\ -ToSession $s"], "a": 3, "e": "-FromSession copia en sentido contrario."}, {"id": 954, "t": "PS-5.1", "q": "¿Qué cmdlet ejecuta un script local en varios equipos remotos?", "o": ["Invoke-Script -Remote SRV01", "Start-Job -ComputerName SRV01", "Invoke-Command -ComputerName SRV01, SRV02 -FilePath C:\\Scripts\\inventario.ps1", "Enter-PSSession SRV01, SRV02 -Script inventario.ps1"], "a": 2, "e": "El script se envía y ejecuta en cada equipo."}, {"id": 955, "t": "PS-5.1", "q": "¿Cómo se pasa el valor de una variable local $svc a un bloque de Invoke-Command?", "o": ["No es posible", "Con $global:svc", "Escribiendo $svc directamente", "Usando $using:svc dentro del bloque (o -ArgumentList)"], "a": 3, "e": "El bloque se ejecuta en otro equipo donde $svc no existe."}, {"id": 956, "t": "PS-5.1", "q": "¿Qué servicio debe estar en marcha para PowerShell Remoting con WinRM?", "o": ["WinRM (Administración remota de Windows)", "LanmanServer", "RemoteRegistry", "TermService"], "a": 0, "e": "Enable-PSRemoting lo configura e inicia."}, {"id": 957, "t": "PS-5.2", "q": "¿Qué cmdlet crea una conexión CIM reutilizable a un equipo remoto?", "o": ["New-PSSession -Cim", "Connect-Wmi", "Get-CimConnection", "New-CimSession"], "a": 3, "e": "Se pasa a otros cmdlets con -CimSession."}, {"id": 958, "t": "PS-5.2", "q": "¿Qué cmdlet invoca un método de una clase CIM, por ejemplo para crear un proceso?", "o": ["Start-CimProcess", "Invoke-CimMethod", "Invoke-WmiCommand", "Set-CimInstance -Method"], "a": 1, "e": "Invoke-CimMethod -ClassName Win32_Process -MethodName Create."}, {"id": 959, "t": "PS-5.2", "q": "¿Qué clase CIM contiene el fabricante y el modelo del equipo?", "o": ["Win32_BIOS", "Win32_ComputerSystem", "Win32_OperatingSystem", "Win32_Product"], "a": 1, "e": "Propiedades Manufacturer y Model."}, {"id": 960, "t": "PS-5.3", "q": "¿Con qué tecnología cifra ConvertFrom-SecureString por defecto?", "o": ["RSA del dominio", "AES con clave pública", "Base64 sin cifrar", "DPAPI, ligada al usuario y equipo actuales"], "a": 3, "e": "Solo el mismo usuario en el mismo equipo puede descifrarla (salvo que se use -Key)."}, {"id": 961, "t": "PS-5.3", "q": "¿En qué registro se encuentran los eventos 4104 de PowerShell?", "o": ["Security", "Application", "Microsoft-Windows-PowerShell/Operational", "System"], "a": 2, "e": "Script Block Logging se habilita por GPO."}, {"id": 962, "t": "PS-5.3", "q": "¿Qué cmdlet registra un punto de conexión JEA a partir de un fichero .pssc?", "o": ["Enable-PSRemoting -JEA", "Set-PSSessionConfiguration -Create", "New-JEAEndpoint Soporte", "Register-PSSessionConfiguration -Name Soporte -Path .\\Soporte.pssc"], "a": 3, "e": "Los usuarios se conectan con -ConfigurationName Soporte."}, {"id": 963, "t": "PS-5.3", "q": "¿Qué módulos ofrecen un almacén de secretos para scripts de PowerShell?", "o": ["CimCmdlets y NetTCPIP", "ActiveDirectory y GroupPolicy", "PSReadLine y Pester", "SecretManagement y SecretStore"], "a": 3, "e": "Get-Secret y Set-Secret."}, {"id": 964, "t": "PS-6.1", "q": "En un alta masiva desde CSV, ¿cómo compruebas si el usuario ya existe sin provocar un error?", "o": ["Test-ADUser alopez", "Exists-ADUser alopez", "Get-ADUser -Filter \"SamAccountName -eq 'alopez'\"", "Get-ADUser alopez -ErrorAction Continue"], "a": 2, "e": "Con -Filter devuelve nada si no existe; con -Identity daría un error."}, {"id": 965, "t": "PS-6.1", "q": "¿Qué falta en este comando para que la cuenta pueda iniciar sesión? New-ADUser -Name \"Ana\" -SamAccountName ana", "o": ["Nada, ya está activa", "El parámetro -Department", "Contraseña (-AccountPassword) y habilitarla (-Enabled $true)", "Reiniciar el DC"], "a": 2, "e": "Por defecto New-ADUser crea la cuenta deshabilitada si no se indica contraseña y -Enabled."}, {"id": 966, "t": "PS-6.1", "q": "¿Qué hace este comando? Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly | Disable-ADAccount -WhatIf", "o": ["Deshabilita los usuarios inactivos", "Borra los usuarios inactivos", "Desbloquea los usuarios inactivos", "Muestra qué usuarios inactivos 90 días se deshabilitarían, sin hacerlo"], "a": 3, "e": "-WhatIf solo simula."}, {"id": 967, "t": "PS-6.1", "q": "¿Qué hace este código? Get-Content servidores.txt | ForEach-Object { Test-Connection $_ -Count 1 -Quiet }", "o": ["Abre una sesión remota con cada servidor", "Hace un ping a cada servidor de la lista y devuelve True o False", "Lee el fichero y lo muestra", "Borra los servidores que no responden"], "a": 1, "e": "$_ es cada línea del fichero."}, {"id": 968, "t": "PS-6.1", "q": "¿Qué cmdlet se usa para comprobar en un script de inventario si el puerto 3389 responde en cada servidor?", "o": ["Test-NetConnection $srv -Port 3389", "Get-NetTCPConnection -RemoteAddress $srv", "Test-Connection $srv -Port 3389", "Resolve-DnsName $srv -Port 3389"], "a": 0, "e": "Leer la propiedad TcpTestSucceeded."}, {"id": 969, "t": "PS-6.1", "q": "Para cambiar el departamento de todos los usuarios de la OU TIC, ¿qué comando es correcto?", "o": ["Set-ADUser -OU TIC -Department \"TIC\"", "Get-ADOrganizationalUnit TIC | Set-ADUser -Department TIC", "Set-ADUser * -Department TIC", "Get-ADUser -Filter * -SearchBase \"OU=TIC,DC=age,DC=local\" | Set-ADUser -Department \"TIC\""], "a": 3, "e": "-SearchBase limita la búsqueda a la OU."}, {"id": 970, "t": "PS-6.1", "q": "¿Cómo se añaden todos los usuarios del departamento TIC al grupo GG_TIC?", "o": ["New-ADGroup GG_TIC -Filter TIC", "Get-ADUser -Filter \"Department -eq 'TIC'\" | ForEach-Object { Add-ADGroupMember GG_TIC -Members $_ }", "Add-ADGroupMember GG_TIC -Department TIC", "Set-ADGroup GG_TIC -Members Department=TIC"], "a": 1, "e": "También Add-ADGroupMember GG_TIC -Members (Get-ADUser -Filter ...)."}, {"id": 971, "t": "PS-6.1", "q": "¿Qué cmdlet exporta a CSV los usuarios deshabilitados del dominio?", "o": ["Get-ADUser -Filter * | Export-Csv -Disabled", "Search-ADAccount -AccountDisabled -UsersOnly | Export-Csv deshabilitados.csv -NoTypeInformation", "Export-ADUser -Disabled deshabilitados.csv", "Get-ADUser -Disabled | Out-Csv"], "a": 1, "e": "Search-ADAccount -AccountDisabled."}, {"id": 972, "t": "PS-6.1", "q": "¿Qué expresión devuelve la fecha de hace 30 días?", "o": ["(Get-Date).Days - 30", "Get-Date -30", "(Get-Date).AddDays(-30)", "Get-Date - 30"], "a": 2, "e": "AddDays con valor negativo."}, {"id": 973, "t": "PS-6.1", "q": "¿Qué hace [math]::Round($_.FreeSpace/1GB, 2)?", "o": ["Calcula el 2 % del espacio", "Redondea a 2 GB", "Devuelve el espacio en bytes", "Convierte el espacio libre a GB y lo redondea a 2 decimales"], "a": 3, "e": "Se usa dentro de propiedades calculadas."}, {"id": 974, "t": "PS-6.2", "q": "En Windows PowerShell 5.1, ¿qué cmdlet aplica una configuración DSC compilada?", "o": ["Start-DscConfiguration -Path C:\\DSC -Wait -Verbose", "Apply-Dsc C:\\DSC", "Invoke-DscConfiguration", "Set-DscConfiguration -Apply"], "a": 0, "e": "Test-DscConfiguration comprueba si se cumple."}, {"id": 975, "t": "PS-6.2", "q": "¿Qué herramienta analiza el código de un script para detectar malas prácticas?", "o": ["Pester", "Set-PSDebug", "PSScriptAnalyzer (Invoke-ScriptAnalyzer)", "Measure-Command"], "a": 2, "e": "Pester es para pruebas unitarias."}, {"id": 976, "t": "PS-6.2", "q": "¿Qué hace Set-PSDebug -Trace 1?", "o": ["Firma el script", "Muestra cada línea del script a medida que se ejecuta", "Activa el modo estricto", "Desactiva los errores"], "a": 1, "e": "Útil para depurar."}, {"id": 977, "t": "PS-6.2", "q": "¿Qué operador ternario es válido en PowerShell 7?", "o": ["if $a > 5 then 'mayor' else 'menor'", "$a -gt 5 ? 'mayor' : 'menor'", "iif($a -gt 5, 'mayor', 'menor')", "$a -gt 5 ?? 'mayor' : 'menor'"], "a": 1, "e": "El ternario ? : es novedad de PowerShell 7."}, {"id": 978, "t": "PS-6.2", "q": "¿Qué cmdlet mide el tiempo que tarda en ejecutarse un bloque de código?", "o": ["Start-Stopwatch", "Measure-Command", "Get-Timer", "Measure-Object"], "a": 1, "e": "Devuelve un TimeSpan."}, {"id": 979, "t": "PS-6.3", "q": "¿Qué cmdlet sustituye a net share para listar recursos compartidos?", "o": ["Get-SmbMapping", "Get-NetShare", "Get-Share", "Get-SmbShare"], "a": 3, "e": "Get-SmbMapping lista las unidades mapeadas en el cliente."}, {"id": 980, "t": "PS-6.3", "q": "¿Qué cmdlet sustituye a route print?", "o": ["Get-Route", "Show-Route", "Get-NetRoute", "Get-NetIPConfiguration -Routes"], "a": 2, "e": "New-NetRoute y Remove-NetRoute para añadir y quitar."}, {"id": 981, "t": "PS-6.3", "q": "¿Qué cmdlet sustituye a ipconfig /flushdns?", "o": ["Reset-DnsClient", "Clear-DnsClientCache", "Remove-DnsCache", "Clear-DnsServerCache"], "a": 1, "e": "Clear-DnsServerCache vacía la caché del rol DNS servidor."}, {"id": 982, "t": "PS-6.3", "q": "¿Qué cmdlet sustituye a whoami /groups para un usuario de dominio cualquiera?", "o": ["Get-LocalGroup alopez", "Get-ADPrincipalGroupMembership alopez", "whoami-ps /groups", "Get-ADGroupMember alopez"], "a": 1, "e": "Get-ADGroupMember obtiene los miembros de un grupo."}, {"id": 983, "t": "PS-6.3", "q": "¿Qué cmdlet sustituye a dism /online /enable-feature en Windows Server?", "o": ["Add-WindowsPackage", "Install-WindowsFeature", "Enable-ServerRole", "Set-WindowsFeature"], "a": 1, "e": "En Windows cliente se usa Enable-WindowsOptionalFeature."}, {"id": 984, "t": "PS-6.3", "q": "¿Qué cmdlet sustituye a shutdown /r?", "o": ["Reboot-Computer", "Restart-Computer", "Reset-Computer", "Stop-Computer -Restart"], "a": 1, "e": "Stop-Computer apaga."}, {"id": 985, "t": "PS-6.3", "q": "¿Qué cmdlet equivale a telnet servidor 443 para probar un puerto?", "o": ["Test-Connection servidor -Port 443", "Resolve-DnsName servidor -Port 443", "Test-NetConnection servidor -Port 443", "Invoke-Telnet servidor 443"], "a": 2, "e": "El cliente Telnet además no viene instalado por defecto."}, {"id": 986, "t": "PS-6.3", "q": "¿Qué cmdlet equivale a icacls para leer los permisos de una carpeta?", "o": ["Get-NTFSAccess", "Get-Permission", "Get-SmbShareAccess", "Get-Acl"], "a": 3, "e": "Get-SmbShareAccess muestra los permisos del recurso compartido, no NTFS."}, {"id": 987, "t": "WS-3.4", "q": "Supuesto: debes crear la cuenta de Ana López (alopez) en la OU TIC, que cambie la contraseña al iniciar sesión y quede activa. ¿Qué comando es correcto?", "o": ["New-ADUser -Name \"Ana López\" -SamAccountName alopez -Path \"OU=TIC,DC=age,DC=local\" -AccountPassword (Read-Host -AsSecureString) -ChangePasswordAtLogon $true -Enabled $true", "New-LocalUser -Name alopez -Password (Read-Host -AsSecureString) -Domain age.local", "dsadd user alopez -ou TIC -pwd Clave2026 -enabled", "New-ADUser alopez -OU TIC -Password \"Clave2026\" -Active"], "a": 0, "e": "New-LocalUser crea cuentas locales; los demás tienen parámetros inexistentes."}, {"id": 988, "t": "WS-3.4", "q": "Supuesto: un usuario llama porque su cuenta está bloqueada. ¿Qué secuencia es la adecuada?", "o": ["Restablecer la contraseña de krbtgt", "Reiniciar todos los controladores de dominio", "Comprobar con Get-ADUser usuario -Properties LockedOut, desbloquear con Unlock-ADAccount y buscar el origen en el evento 4740 del PDC", "Borrar la cuenta y crearla de nuevo"], "a": 2, "e": "Si no se encuentra el origen, la cuenta se volverá a bloquear."}, {"id": 989, "t": "WS-3.6", "q": "Supuesto: una GPO de fondo de escritorio vinculada a la OU Personal no se aplica a un usuario que está en esa OU. gpresult indica \"Denegado (seguridad)\". ¿Qué revisas?", "o": ["La zona horaria del DC", "Los registros MX del dominio", "El filtrado de seguridad y la delegación de la GPO (Leer y Aplicar directiva de grupo)", "El servidor DHCP"], "a": 2, "e": "El usuario o su grupo no tiene permiso para aplicar la GPO."}, {"id": 990, "t": "WS-4.2", "q": "Supuesto: los equipos de la planta 2 (VLAN 20) reciben IP 169.254.x.x; los de la planta 1, donde está el servidor DHCP, funcionan bien. ¿Qué falta probablemente?", "o": ["El agente de retransmisión DHCP (ip helper-address) en la interfaz de la VLAN 20", "Un registro MX", "Una zona inversa en DNS", "El rol IIS"], "a": 0, "e": "Las difusiones DHCP no atraviesan el router."}, {"id": 991, "t": "WS-4.2", "q": "Supuesto: el ámbito 192.168.20.0/24 está al 100 % de uso y llegan equipos nuevos. ¿Qué medida rápida y correcta tomarías?", "o": ["Crear un registro A para cada equipo", "Poner a todos los equipos IP 169.254", "Revisar Get-DhcpServerv4ScopeStatistics, reducir la duración de la concesión y ampliar el rango o la subred si es posible", "Desactivar el DHCP"], "a": 2, "e": "Con concesiones largas las IP de equipos que ya no están tardan en liberarse."}, {"id": 992, "t": "WS-4.1", "q": "Supuesto: los usuarios no resuelven el nombre de un socio externo, socio.es, cuyos DNS están en 10.1.1.1 a través de una VPN. ¿Qué configuras en tus DNS de AD?", "o": ["Un reenviador condicional para socio.es hacia 10.1.1.1", "Un reenviador general a 8.8.8.8", "Una zona inversa 10.in-addr.arpa", "Un registro MX hacia 10.1.1.1"], "a": 0, "e": "Solo las consultas de socio.es se envían a sus servidores."}, {"id": 993, "t": "WS-5.4", "q": "Supuesto: tras restaurar una VM antigua de un PC, el usuario no puede iniciar sesión con su cuenta de dominio y aparece un error de relación de confianza. ¿Qué haces?", "o": ["Iniciar sesión con una cuenta local y ejecutar Test-ComputerSecureChannel -Repair -Credential DOMINIO\\admin", "Restablecer la contraseña del usuario", "Desbloquear la cuenta del usuario", "Borrar la cuenta krbtgt"], "a": 0, "e": "La contraseña de la cuenta de equipo ya no coincide con la de AD."}, {"id": 994, "t": "WS-2.1", "q": "Supuesto: el grupo GG_Contabilidad debe poder leer, crear, modificar y borrar en \\\\srv01\\Conta, y Auditoría solo leer. ¿Qué configuración es la correcta?", "o": ["NTFS: GG_Contabilidad Escritura; GG_Auditoria Modificar", "Compartido: Todos Control total; NTFS: Todos Control total", "Compartido: GG_Contabilidad Leer; NTFS: GG_Contabilidad Modificar", "Compartido: Usuarios autenticados Cambiar; NTFS: GG_Contabilidad Modificar y GG_Auditoria Lectura y ejecución"], "a": 3, "e": "Con compartido Leer, Contabilidad no podría escribir por la red; Escritura no permite borrar."}, {"id": 995, "t": "WS-6.1", "q": "Supuesto: una auditoría detecta que todos los PC tienen la misma contraseña de administrador local. ¿Qué solución propones?", "o": ["Cambiar la contraseña manualmente una vez al año", "Añadir a todos los usuarios al grupo Administradores", "Implantar Windows LAPS mediante GPO", "Deshabilitar todas las cuentas de usuario"], "a": 2, "e": "LAPS genera y rota una contraseña distinta por equipo y la guarda en AD."}, {"id": 996, "t": "WS-6.1", "q": "Supuesto: debes permitir RDP a un servidor solo desde la red de administración 10.99.0.0/24. ¿Qué regla es la más adecuada?", "o": ["New-NetFirewallRule -DisplayName \"RDP\" -Direction Outbound -LocalPort 3389 -Action Allow", "New-NetFirewallRule -Direction Inbound -LocalPort 3389 -Action Allow -RemoteAddress Any", "New-NetFirewallRule -DisplayName \"RDP admin\" -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 10.99.0.0/24 -Action Allow", "Set-NetFirewallProfile -Enabled False"], "a": 2, "e": "-RemoteAddress limita el origen; además hay que deshabilitar las reglas genéricas de Escritorio remoto."}, {"id": 997, "t": "NET-6.4", "q": "Supuesto: un usuario con IP 10.0.5.20/24 y puerta de enlace 10.0.5.1 puede abrir la intranet por IP pero no por nombre. ipconfig muestra DNS 10.0.6.53, que no responde. ¿Cuál es el siguiente paso?", "o": ["Cambiar la máscara a /16", "Renovar la IP con ipconfig /renew únicamente", "Reemplazar el cable", "Comprobar con nslookup/Resolve-DnsName contra otro DNS y revisar el servicio DNS de 10.0.6.53"], "a": 3, "e": "La conectividad IP funciona; falla la resolución de nombres."}, {"id": 998, "t": "NET-2.2", "q": "Supuesto: tienes 172.16.0.0/16 y necesitas 200 subredes con el máximo de hosts posible. ¿Qué máscara usas?", "o": ["/24", "/23", "/25", "/22"], "a": 0, "e": "Hacen falta 8 bits de subred (2^8 = 256 ≥ 200): /16 + 8 = /24, con 254 hosts cada una."}, {"id": 999, "t": "NET-2.2", "q": "Supuesto: necesitas una subred para 500 equipos. ¿Qué máscara es la más ajustada?", "o": ["/23 (510 hosts)", "/25 (126 hosts)", "/22 (1022 hosts)", "/24 (254 hosts)"], "a": 0, "e": "2^9 − 2 = 510."}, {"id": 1000, "t": "NET-5.1", "q": "Supuesto: has creado la VLAN 30 en dos switches unidos por un troncal, pero los equipos de la VLAN 30 de un switch no ven a los del otro. ¿Qué revisas primero?", "o": ["El servidor DNS", "La licencia del switch", "Que la VLAN 30 esté permitida en el troncal (switchport trunk allowed vlan) y que el enlace sea troncal en ambos extremos", "La tabla de rutas del PC"], "a": 2, "e": "show interfaces trunk muestra qué VLAN están permitidas y activas."}, {"id": 1001, "t": "NET-6.1", "q": "Supuesto: el organismo publica una web y su base de datos. ¿Qué diseño es correcto?", "o": ["Servidor web (o proxy inverso/WAF) en la DMZ y base de datos en una red interna, con firewall permitiendo solo el puerto de la BD desde la web", "Base de datos en la DMZ y web en la LAN", "Ambos en la LAN de usuarios", "Ambos en la DMZ con todos los puertos abiertos"], "a": 0, "e": "Minimiza la exposición de los datos."}, {"id": 1002, "t": "NET-6.2", "q": "Supuesto: hay que conectar una sede remota con la central de forma cifrada y permanente usando Internet. ¿Qué tecnología eliges?", "o": ["Telnet", "AH en modo transporte", "VPN IPsec sitio a sitio en modo túnel (IKEv2 + ESP)", "PPTP"], "a": 2, "e": "AH no cifra y PPTP es inseguro."}, {"id": 1003, "t": "NET-4.1", "q": "Supuesto: necesitas saber qué proceso de Windows tiene abierto el puerto 8080. ¿Qué comandos usas?", "o": ["ipconfig /all | findstr 8080", "arp -a 8080", "nslookup 8080", "netstat -ano | findstr :8080 y después tasklist /FI \"PID eq <PID>\""], "a": 3, "e": "En PowerShell: Get-NetTCPConnection -LocalPort 8080 y Get-Process -Id."}, {"id": 1004, "t": "PS-5.1", "q": "Supuesto: debes reiniciar el servicio Spooler en 50 servidores listados en servidores.txt. ¿Qué comando es el adecuado?", "o": ["Restart-Service Spooler -ComputerName servidores.txt", "Get-Content servidores.txt | Restart-Computer", "Enter-PSSession (Get-Content servidores.txt)", "Invoke-Command -ComputerName (Get-Content servidores.txt) -ScriptBlock { Restart-Service Spooler }"], "a": 3, "e": "Enter-PSSession solo admite un equipo y Restart-Computer reiniciaría los servidores."}, {"id": 1005, "t": "PS-5.2", "q": "Supuesto: necesitas el número de serie y el modelo de 20 equipos remotos. ¿Qué usas?", "o": ["Get-CimInstance Win32_BIOS y Win32_ComputerSystem con -ComputerName o -CimSession", "Get-WmiObject en PowerShell 7", "wmic en Windows Server 2025 como método recomendado", "Get-HotFix"], "a": 0, "e": "Get-WmiObject no existe en PowerShell 7 y wmic está obsoleto."}, {"id": 1006, "t": "PS-6.1", "q": "Supuesto: debes generar un informe CSV con nombre, departamento y último inicio de sesión de todos los usuarios activos. ¿Qué comando es correcto?", "o": ["Get-ADUser -Filter \"Enabled -eq 'True'\" -Properties Department, LastLogonDate | Select-Object Name, Department, LastLogonDa m": "ps", "p": "Muestra la caché ARP/vecinos.", "s": "Get-NetNeighbor", "r": ["^get-netneighbor\\b"]}, {"t": "NET-4.2", "m": "ps", "p": "Cambia el perfil de red de la interfaz LAN a Privada.", "s": "Set-NetConnectionProfile -InterfaceAlias LAN -NetworkCategory Private", "r": ["^set-netconnectionprofile\\b", "-interfacealias\\s+[\"']?lan", "-networkcategory\\s+private"]}, {"t": "NET-4.3", "m": "linux", "p": "(Linux) Muestra las direcciones IP de todas las interfaces.", "s": "ip a", "r": ["^ip\\s+(a|addr|address)(\\s+show)?$"]}, {"t": "NET-4.3", "m": "linux", "p": "(Linux) Muestra los puertos TCP y UDP en escucha con su proceso.", "s": "ss -tulpn", "r": ["^ss\\s+-[tulpn]{5}$"]}, {"t": "NET-4.3", "m": "linux", "p": "(Linux) Muestra la tabla de rutas.", "s": "ip route", "r": ["^ip\\s+(r|route)(\\s+show)?$"]}, {"t": "NET-4.3", "m": "linux", "p": "(Linux) Envía 4 pings a 8.8.8.8.", "s": "ping -c 4 8.8.8.8", "r": ["^ping\\b", "-c\\s+4", "8\\.8\\.8\\.8"]}, {"t": "NET-4.3", "m": "linux", "p": "(Linux) Consulta los MX de age.es al servidor 8.8.8.8 con dig.", "s": "dig @8.8.8.8 age.es MX", "r": ["^dig\\b", "@8\\.8\\.8\\.8", "age\\.es", "\\bmx\\b"]}, {"t": "NET-4.3", "m": "linux", "p": "(Linux) Captura el tráfico DNS en eth0 sin resolver nombres.", "s": "tcpdump -i eth0 -n port 53", "r": ["^tcpdump\\b", "-i\\s+eth0", "-n\\b", "port\\s+53"]}, {"t": "NET-4.3", "m": "linux", "p": "(Linux) Descubre los hosts activos de 192.168.1.0/24 sin escanear puertos.", "s": "nmap -sn 192.168.1.0/24", "r": ["^nmap\\b", "-sn", "192\\.168\\.1\\.0/24"]}, {"t": "NET-4.4", "m": "cisco", "p": "(Cisco) Guarda la configuración en ejecución en la de arranque.", "s": "copy running-config startup-config", "r": ["^(copy\\s+run(ning-config)?\\s+start(up-config)?|wr(ite)?(\\s+mem(ory)?)?)$"]}, {"t": "NET-4.4", "m": "cisco", "p": "(Cisco) Muestra un resumen de las interfaces con su IP y estado.", "s": "show ip interface brief", "r": ["^sh(ow)?\\s+ip\\s+int(erface)?\\s+br(ief)?$"]}, {"t": "NET-4.4", "m": "cisc <script>
(function(){
"use strict";
/* ================= data ================= */
const MD = document.getElementById('md-src').textContent;
const QS = JSON.parse(document.getElementById('q-src').textContent);
const EX = JSON.parse(document.getElementById('ex-src').textContent);
const COURSES = {PS:'PowerShell', WS:'Windows Server', NET:'Redes'};
const KEY = 'tai-ws-ps-redes-v1';

/* ================= storage ================= */
let S = {read:{}, q:{}, star:{}, ex:{}, last:null, theme:null};
function load(){ try{ const r = localStorage.getItem(KEY); if(r){ S = Object.assign(S, JSON.parse(r)); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
load();

/* ================= theme ================= */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
applyTheme();
document.getElementById('themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
};

/* ================= markdown ================= */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m,c) => { codes.push(c); return '\u0000' + (codes.length-1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:)]|$)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (m,i) => '<code>' + esc(codes[+i]) + '</code>');
  return s;
}
function highlight(code){
  return code.split('\n').map(l => {
    if (/^\s*(#|::|!|REM\s)/.test(l) && !/^\s*#\{/.test(l)) return '<span class="cm">' + esc(l) + '</span>';
    const k = l.search(/\s(#|::|!)\s/);
    if (k >= 0) return esc(l.slice(0, k)) + '<span class="cm">' + esc(l.slice(k)) + '</span>';
    return esc(l);
  }).join('\n');
}
function splitCells(r){
  r = r.trim().replace(/^\|/, '').replace(/\|$/, '');
  const out = []; let cur = '', inCode = false;
  for (const ch of r){
    if (ch === '`') inCode = !inCode;
    if (ch === '|' && !inCode){ out.push(cur.trim()); cur = ''; } else cur += ch;
  }
  out.push(cur.trim()); return out;
}
function mdToHtml(src){
  const lines = src.split('\n'); let html = ''; let i = 0;
  while (i < lines.length){
    let l = lines[i];
    if (/^```/.test(l)){
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      html += '<pre><button class="copy">Copiar</button><code>' + highlight(code.join('\n')) + '</code></pre>'; continue;
    }
    if (/^---\s*$/.test(l)){ html += '<hr>'; i++; continue; }
    let h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h){ const n = Math.min(h[1].length+0,4); html += '<h'+n+'>'+inline(h[2])+'</h'+n+'>'; i++; continue; }
    if (/^\|/.test(l)){
      let rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = splitCells;
      let t = '<div class="tbl"><table><thead><tr>' + cells(rows[0]).map(c => '<th>'+inline(c)+'</th>').join('') + '</tr></thead><tbody>';
      rows.slice(2).forEach(r => { t += '<tr>' + cells(r).map(c => '<td>'+inline(c)+'</td>').join('') + '</tr>'; });
      html += t + '</tbody></table></div>'; continue;
    }
    if (/^>/.test(l)){
      let q = [];
      while (i < lines.length && /^>/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/,'')); i++; }
      const txt = q.join('\n'); let cls = '';
      if (txt.includes('⚠️')) cls = 'trap'; else if (txt.includes('💡')) cls = 'key'; else if (txt.includes('🏛️')) cls = 'age';
      html += '<blockquote class="'+cls+'">' + q.filter(x=>x.trim()).map(x => '<p>'+inline(x)+'</p>').join('') + '</blockquote>'; continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l); let items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let it = lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''); const indent = /^\s{2,}/.test(lines[i]); i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s*```/.test(lines[i])) { it += ' ' + lines[i].trim(); i++; }
        let extra = '';
        if (i < lines.length && /^\s+```/.test(lines[i])) {
          let code = []; i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i].replace(/^\s{2}/,'')); i++; }
          i++; extra = '<pre><button class="copy">Copiar</button><code>' + highlight(code.join('\n')) + '</code></pre>';
        }
        items.push({t:it, sub:indent, extra});
      }
      const tag = ordered ? 'ol' : 'ul';
      html += '<'+tag+'>' + items.map(x => '<li'+(x.sub?' style="margin-left:18px"':'')+'>'+inline(x.t)+x.extra+'</li>').join('') + '</'+tag+'>'; continue;
    }
    if (!l.trim()){ i++; continue; }
    let p = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#|```|\||>|---|\s*([-*]|\d+\.)\s)/.test(lines[i])) { p.push(lines[i]); i++; }
    html += '<p>' + inline(p.join(' ')) + '</p>';
  }
  return html;
}

/* ================= parse course structure ================= */
const intro = []; const topics = []; const tree = [];
(function parse(){
  const lines = MD.split('\n'); let course = null, level = null, topic = null, inCode = false;
  for (const l of lines){
    if (/^```/.test(l)) inCode = !inCode;
    if (!inCode){
      let m;
      if ((m = l.match(/^# (.+)$/)) && !/^# Curso TAI/.test(l)){
        const name = m[1].trim(); const code = Object.keys(COURSES).find(k => COURSES[k] === name) || name;
        course = {code, name, levels:[]}; tree.push(course); level = null; topic = null; continue;
      }
      if ((m = l.match(/^## (.+)$/)) && course){ level = {name:m[1].trim(), topics:[]}; course.levels.push(level); topic = null; continue; }
      if ((m = l.match(/^### ((PS|WS|NET)-\d+\.\d+) · (.+)$/))){
        topic = {id:m[1], title:m[3].trim(), course:course.code, level:level.name, md:''}; topics.push(topic); level.topics.push(topic); continue;
      }
    }
    if (topic) topic.md += l + '\n'; else if (!course) intro.push(l);
  }
  topics.forEach(t => { t.md = t.md.replace(/\n---\s*\n*$/, '\n'); });
})();
const topicById = Object.fromEntries(topics.map(t => [t.id, t]));
const qByTopic = {}; QS.forEach(q => (qByTopic[q.t] = qByTopic[q.t] || []).push(q));

/* ================= sidebar ================= */
const treeEl = document.getElementById('tree');
function coursePct(c){ const ts = topics.filter(t => t.course === c); return Math.round(100 * ts.filter(t => S.read[t.id]).length / ts.length); }
function renderTree(filter){
  filter = (filter || '').toLowerCase().trim();
  let h = '<button class="topic'+(current==='intro'?' active':'')+'" data-t="intro"><span class="dot"></span><span>Inicio y cómo usar este curso</span></button>';
  tree.forEach(c => {
    let ch = '';
    c.levels.forEach(lv => {
      const ts = lv.topics.filter(t => !filter || (t.id + ' ' + t.title + ' ' + t.md).toLowerCase().includes(filter));
      if (!ts.length) return;
      const open = filter || ts.some(t => t.id === current);
      ch += '<details class="lvl"'+(open?' open':'')+'><summary>'+esc(lv.name)+'</summary>' +
        ts.map(t => '<button class="topic'+(S.read[t.id]?' read':'')+(t.id===current?' active':'')+'" data-t="'+t.id+'"><span class="dot"></span><span><b>'+t.id+'</b> · '+esc(t.title)+'</span></button>').join('') + '</details>';
    });
    if (!ch) return;
    const open = filter || (topicById[current] && topicById[current].course === c.code);
    h += '<details class="course"'+(open?' open':'')+'><summary><span>'+esc(c.name)+'</span><span class="pct">'+coursePct(c.code)+'%</span></summary>' + ch + '</details>';
  });
  treeEl.innerHTML = h || '<p class="muted">Sin resultados</p>';
}
treeEl.addEventListener('click', e => {
  const b = e.target.closest('.topic'); if (!b) return;
  openTopic(b.dataset.t); document.getElementById('side').classList.remove('open');
});
document.getElementById('search').addEventListener('input', e => renderTree(e.target.value));
document.getElementById('menuBtn').onclick = e => { e.stopPropagation(); document.getElementById('side').classList.toggle('open'); };
document.addEventListener('click', e => { const sd = document.getElementById('side'); if (sd.classList.contains('open') && !sd.contains(e.target)) sd.classList.remove('open'); });

/* ================= views ================= */
const view = document.getElementById('view');
let current = S.last || 'intro';
let currentView = 'teoria';
function setTab(v){
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  window.scrollTo(0,0);
  ({teoria:renderTheory, test:renderTestSetup, consola:renderConsoleSetup, repaso:renderReview, progreso:renderProgress})[v]();
}
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.view); });

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
view.addEventListener('click', e => {
  const c = e.target.closest('.copy'); if (!c) return;
  const code = c.parentElement.querySelector('code').innerText;
  (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('Copiado'), () => toast('No se pudo copiar'));
});

/* ---------- theory ---------- */
function openTopic(id){ current = id; S.last = id; save(); renderTree(document.getElementById('search').value); setTab('teoria'); }
function renderTheory(){
  if (current === 'intro' || !topicById[current]){
    const counts = Object.keys(COURSES).map(c => '<div class="stat"><span class="muted">'+COURSES[c]+'</span><b>'+topics.filter(t=>t.course===c).length+' temas</b><span class="muted">'+QS.filter(q=>q.t.startsWith(c+'-')).length+' preguntas</span></div>').join('');
    view.innerHTML = '<div class="doc">' + mdToHtml(intro.join('\n')) + '</div>' +
      '<div class="grid">'+counts+'</div>' +
      '<div class="card"><h3 style="margin-top:0">Cómo usar esta web</h3><ul>' +
      '<li><b>Teoría</b>: elige un tema en el índice. Marca cada tema como estudiado para ver tu avance.</li>' +
      '<li><b>Test</b>: '+QS.length+' preguntas con explicación. Puedes filtrar por curso, nivel o tema, o hacer un simulacro con la penalización real (−1/3).</li>' +
      '<li><b>Consola</b>: '+EX.length+' ejercicios en los que escribes el comando (PowerShell, cmd, Linux y Cisco) y se corrige al momento.</li>' +
      '<li><b>Repaso</b>: tus fallos y las preguntas marcadas con ★ para volver a practicarlas.</li>' +
      '<li>El progreso se guarda en este navegador. En <b>Progreso</b> puedes exportarlo e importarlo.</li></ul>' +
      '<div class="row"><button class="btn primary" id="startBtn">Empezar por el primer tema</button></div></div>';
    document.getElementById('startBtn').onclick = () => openTopic(topics[0].id);
    return;
  }
  const t = topicById[current]; const idx = topics.indexOf(t);
