```

> ⚠️ Trampa: "La relación de confianza entre esta estación de trabajo y el dominio principal no se pudo establecer" → canal seguro roto (p. ej. al restaurar una VM antigua). Solución: `Test-ComputerSecureChannel -Repair` o `netdom resetpwd`, o sacar y volver a meter en el dominio.

## Nivel 4 — Servicios de infraestructura

### WS-4.1 · DNS en Windows Server

**Zonas**
| Tipo | Descripción |
|---|---|
| **Principal** (primaria) | Copia de lectura/escritura. En fichero `.dns` (`%windir%\System32\dns`) o **integrada en AD** |
| **Secundaria** | Copia de **solo lectura** obtenida por **transferencia de zona** (AXFR completa / IXFR incremental, **TCP 53**) |
| **Código auxiliar** (stub) | Solo registros **SOA, NS y A de los servidores** de la zona |
| **Integrada en AD** | Se replica con AD (multimaestro), permite **actualizaciones dinámicas seguras**. Ámbitos: todos los DNS del bosque (`ForestDnsZones`), del dominio (`DomainDnsZones`), todos los DC del dominio, o partición personalizada |

- **Búsqueda directa** (nombre → IP) y **búsqueda inversa** (IP → nombre, zona `x.y.z.in-addr.arpa`; IPv6 `ip6.arpa`).
- **Reenviadores** (forwarders): a dónde se envían las consultas que el servidor no resuelve. **Reenviadores condicionales**: para un dominio concreto (p. ej. otra organización). **Sugerencias de raíz** (root hints): los 13 servidores raíz (a.root-servers.net … m.root-servers.net).
- **Actualizaciones dinámicas**: Ninguna / No seguras y seguras / **Solo seguras** (solo zonas integradas en AD).
- **Envejecimiento y borrado** (aging/scavenging) de registros obsoletos: intervalos **sin actualización 7 días** + **actualización 7 días** por defecto. Hay que habilitarlo en la **zona** y en el **servidor**.
- **DNSSEC**: firma de zonas (RRSIG, DNSKEY, DS, NSEC/NSEC3). Firma con `Invoke-DnsServerZoneSign`.
- Registros SRV que crea un DC: `_ldap._tcp.dc._msdcs.age.local`, `_kerberos._tcp.age.local`, `_gc._tcp.age.local`. Se registran desde el servicio **Netlogon** (fichero `%SystemRoot%\System32\Config\netlogon.dns`). Si faltan: reiniciar **Netlogon** o `nltest /dsregdns`.

**Tipos de registro**
| Registro | Función |
|---|---|
| **A** / **AAAA** | Nombre → IPv4 / IPv6 |
| **CNAME** | Alias de otro nombre (no puede coexistir con otros registros del mismo nombre ni estar en el ápice de la zona) |
| **MX** | Servidor de correo (con **preferencia**: menor = más prioridad) |
| **NS** | Servidores autoritativos de la zona |
| **SOA** | Inicio de autoridad: servidor primario, responsable, **número de serie**, refresh, retry, expire, TTL mínimo |
| **PTR** | IP → nombre (zona inversa) |
| **SRV** | Servicio: `_servicio._protocolo.dominio` con prioridad, peso, **puerto** y destino |
| **TXT** | Texto (SPF, DKIM, DMARC, verificación de dominio) |
| **CAA** | Qué autoridades de certificación pueden emitir para el dominio |

```powershell
Install-WindowsFeature DNS -IncludeManagementTools
Add-DnsServerPrimaryZone -Name "age.local" -ReplicationScope "Domain" -DynamicUpdate Secure      # integrada en AD
Add-DnsServerPrimaryZone -Name "externo.es" -ZoneFile "externo.es.dns"                             # en fichero
Add-DnsServerPrimaryZone -NetworkId "192.168.10.0/24" -ReplicationScope "Forest"                  # zona inversa
Add-DnsServerSecondaryZone -Name "socio.es" -ZoneFile "socio.es.dns" -MasterServers 10.1.1.1
Add-DnsServerStubZone -Name "socio.es" -MasterServers 10.1.1.1 -ReplicationScope Forest
Add-DnsServerResourceRecordA -ZoneName "age.local" -Name "intranet" -IPv4Address 192.168.10.50 -CreatePtr
Add-DnsServerResourceRecordCName -ZoneName "age.local" -Name "www" -HostNameAlias "intranet.age.local"
Add-DnsServerResourceRecordMX -ZoneName "age.local" -Name "." -MailExchange "correo.age.local" -Preference 10
Add-DnsServerResourceRecord -ZoneName "age.local" -Name "srv" -Txt -DescriptiveText "v=spf1 mx -all"
Get-DnsServerResourceRecord -ZoneName "age.local" -RRType A
Remove-DnsServerResourceRecord -ZoneName "age.local" -Name "intranet" -RRType A -Force
Add-DnsServerForwarder -IPAddress 8.8.8.8, 1.1.1.1
Add-DnsServerConditionalForwarderZone -Name "socio.es" -MasterServers 10.1.1.1 -ReplicationScope Forest
Set-DnsServerScavenging -ScavengingState $true -ScavengingInterval 7.00:00:00 -ApplyOnAllZones
Clear-DnsServerCache ; Get-DnsServerZone ; Get-DnsServerStatistics
Get-DnsServerZone ; Export-DnsServerZone -Name age.local -FileName age.bak
```
Clásico: `dnscmd /zoneadd`, `dnscmd /recordadd age.local intranet A 192.168.10.50`, `dnscmd /clearcache`.

**Cliente DNS**: `ipconfig /displaydns`, `ipconfig /flushdns`, `ipconfig /registerdns`, `Clear-DnsClientCache`, `Get-DnsClientCache`, `Register-DnsClient`, `Resolve-DnsName age.local -Type SOA`, `nslookup -type=srv _ldap._tcp.dc._msdcs.age.local`. Orden de resolución en Windows: caché DNS (incluye fichero **hosts** `C:\Windows\System32\drivers\etc\hosts`) → servidor DNS → (LLMNR/NetBIOS si está habilitado).

> ⚠️ Trampa: una **zona secundaria no puede ser integrada en AD** (siempre es fichero); la de **código auxiliar** sí puede.

> ⚠️ Trampa: la transferencia de zona va por **TCP 53**; las consultas normales por **UDP 53** (y TCP si la respuesta es grande o con DNSSEC).

> ⚠️ Trampa: el registro **SOA** contiene el **número de serie**; si no se incrementa, los secundarios no transfieren los cambios.

### WS-4.2 · DHCP en Windows Server

**Proceso DORA** (UDP **67** servidor / **68** cliente):
1. **D**HCPDISCOVER (cliente → **difusión** 255.255.255.255, origen 0.0.0.0)
2. **O**FFER (servidor ofrece IP)
3. **R**EQUEST (cliente, también por difusión, para que el resto de servidores sepa cuál eligió)
4. **A**CK (servidor confirma). NAK = rechazo. DHCPDECLINE = el cliente detecta IP duplicada. DHCPRELEASE = liberación (`ipconfig /release`). DHCPINFORM = pide solo opciones.

- **Renovación**: al **50 %** de la concesión (T1) el cliente intenta renovar con su servidor (unicast); al **87,5 %** (T2) con cualquiera (difusión).
- Concesión por defecto en Windows Server: **8 días** (redes cableadas).
- Si no hay servidor: **APIPA 169.254.0.0/16** (si no hay configuración alternativa).
- **Autorización en AD**: en un dominio, un servidor DHCP de Windows debe estar **autorizado** en AD o no repartirá direcciones (evita servidores *rogue* Windows).
- **Agente de retransmisión** (relay, `ip helper-address` en Cisco): las difusiones no atraviesan routers; el relay reenvía al servidor DHCP de otra subred (el campo **giaddr** indica la subred del cliente).

**Elementos**
- **Ámbito** (scope): rango de IP de una subred. **Exclusiones** (IP del rango que no se reparten). **Reservas** (IP fija para una **MAC** concreta). **Superámbito** (varias subredes lógicas en la misma red física). Ámbito **multidifusión** (MADCAP).
- **Opciones** (por servidor, ámbito, clase o reserva; la más específica gana: reserva > ámbito > servidor):

| Opción | Significado |
|---|---|
| **003** | Enrutador (puerta de enlace) |
| **006** | Servidores DNS |
| **015** | Nombre de dominio DNS |
| 044 / 046 | Servidores WINS / tipo de nodo NetBIOS |
| 051 | Tiempo de concesión |
| **066** / **067** | Servidor de arranque (TFTP) / nombre del fichero de arranque (**PXE**) |
| 042 | Servidores NTP |
| 252 | WPAD (proxy) |

- **Conmutación por error DHCP** (failover, 2012+, solo IPv4, máximo 2 servidores): modo **Equilibrio de carga** (por defecto 50/50) o **Espera activa** (*hot standby*, reserva por defecto 5 %). **MCLT** por defecto **1 hora**. Antes se usaba la regla **80/20** (dividir el ámbito entre dos servidores).
- **Directivas DHCP** (2012+): asignar opciones o rangos según MAC, clase de proveedor, FQDN…
- **Filtros**: lista de permitidos/denegados por MAC.
- Protección de nombres y actualización dinámica DNS en nombre de los clientes.

```powershell
Install-WindowsFeature DHCP -IncludeManagementTools
Add-DhcpServerSecurityGroup ; Restart-Service DHCPServer           # crea grupos DHCP Administrators/Users
Add-DhcpServerInDC -DnsName dhcp01.age.local -IPAddress 192.168.10.5     # autorizar en AD
Get-DhcpServerInDC
Add-DhcpServerv4Scope -Name "LAN-Planta1" -StartRange 192.168.10.100 -EndRange 192.168.10.200 -SubnetMask 255.255.255.0 -LeaseDuration 8.00:00:00 -State Active
Add-DhcpServerv4ExclusionRange -ScopeId 192.168.10.0 -StartRange 192.168.10.100 -EndRange 192.168.10.110
Set-DhcpServerv4OptionValue -ScopeId 192.168.10.0 -Router 192.168.10.1 -DnsServer 192.168.10.10, 192.168.10.11 -DnsDomain age.local
Set-DhcpServerv4OptionValue -DnsServer 192.168.10.10 -DnsDomain age.local          # a nivel de servidor
Add-DhcpServerv4Reservation -ScopeId 192.168.10.0 -IPAddress 192.168.10.150 -ClientId "00-15-5D-01-02-03" -Name "Impresora-P1"
Get-DhcpServerv4Scope ; Get-DhcpServerv4Lease -ScopeId 192.168.10.0
Get-DhcpServerv4ScopeStatistics                                           # % de uso, libres
Add-DhcpServerv4Failover -Name "FO-P1" -PartnerServer dhcp02.age.local -ScopeId 192.168.10.0 -LoadBalancePercent 50 -SharedSecret "Secreto"
Export-DhcpServer -File C:\dhcp.xml -Leases ; Import-DhcpServer ; Backup-DhcpServer -Path C:\DhcpBackup
```
`netsh dhcp server ...` (clásico). En el cliente: `ipconfig /release`, `ipconfig /renew`, `ipconfig /all` (ver servidor DHCP y concesión).

**DHCPv6**: con estado (*stateful*, el servidor da la dirección) o sin estado (*stateless*: la dirección se obtiene por **SLAAC** y DHCPv6 solo da opciones como DNS). Lo decide el **RA** del router con los bits **M** (Managed) y **O** (Other). Puertos UDP **546** (cliente) y **547** (servidor).

> ⚠️ Trampa: **ClientId** de una reserva = la **dirección MAC** del cliente.

> ⚠️ Trampa: un cliente con **169.254.x.x** → no ha obtenido respuesta del DHCP (servidor caído, ámbito agotado, falta relay, cable/VLAN incorrecta, servidor no autorizado).

> ⚠️ Trampa: las difusiones DHCP **no atraviesan routers**; para atender varias subredes desde un servidor central hace falta **relay** (`ip helper-address`).

### WS-4.3 · IIS (servidor web)

- Rol `Web-Server`. Raíz por defecto **`C:\inetpub\wwwroot`**, logs en **`C:\inetpub\logs\LogFiles`** (formato W3C). Sitio por defecto *Default Web Site* en el puerto 80.
- **Sitio** = enlaces (*bindings*: protocolo + IP + puerto + nombre de host). Varios sitios en la misma IP/puerto se diferencian por **encabezado de host**; en HTTPS por **SNI**.
- **Grupo de aplicaciones** (application pool): proceso de trabajo **w3wp.exe** aislado. Identidad por defecto **ApplicationPoolIdentity** (cuenta virtual `IIS AppPool\NombreDelPool`). Reciclaje periódico (por defecto cada 1740 min = 29 h).
- Autenticación: Anónima (cuenta `IUSR`), Básica (en claro: solo con HTTPS), Windows (Kerberos/NTLM), Implícita, por certificado de cliente.
- Configuración en ficheros XML: `applicationHost.config` (`%windir%\System32\inetsrv\config`) y `web.config` en cada sitio.

```powershell
Install-WindowsFeature Web-Server -IncludeManagementTools
Import-Module WebAdministration
New-WebAppPool -Name PoolIntranet
New-Website -Name Intranet -Port 80 -HostHeader intranet.age.local -PhysicalPath D:\Web\Intranet -ApplicationPool PoolIntranet
New-WebBinding -Name Intranet -Protocol https -Port 443 -HostHeader intranet.age.local -SslFlags 1
Get-Website ; Start-Website Intranet ; Stop-Website Intranet
Restart-WebAppPool PoolIntranet
# Módulo moderno IISAdministration:
New-IISSite -Name Portal -BindingInformation "*:8080:" -PhysicalPath D:\Web\Portal
Get-IISSite
```
cmd: `iisreset` (reinicia IIS completo), `iisreset /stop`, `%windir%\system32\inetsrv\appcmd.exe list site`, `appcmd list apppool`.

> ⚠️ Trampa: el proceso de los sitios es **w3wp.exe**; el servicio que recibe HTTP en modo kernel es **HTTP.sys**; el servicio de publicación WWW es **W3SVC**.

### WS-4.4 · Otros servicios: certificados, WSUS, impresión, Escritorio Remoto, NPS

**AD CS (Servicios de certificados)**
- CA **empresarial** (integrada en AD, usa **plantillas** y autoinscripción por GPO) vs **independiente** (standalone, sin AD, aprobación manual).
- CA **raíz** vs **subordinada**. Buena práctica: **raíz independiente offline** + subordinada empresarial online (PKI de dos niveles).
- Revocación: **CRL** (lista de revocación completa y **delta**) y **OCSP** (Respondedor en línea, consulta individual). Punto de distribución **CDP** y acceso a información de entidad **AIA**.
- `certutil -verify -urlfetch cert.cer` (verificar cadena y revocación), `certutil -hashfile fichero SHA256`, `certutil -crl` (publicar CRL), `certutil -pulse` (forzar autoinscripción), `certreq`.

**WSUS** (Windows Server Update Services, rol `UpdateServices`)
- Puertos **8530** (HTTP) y **8531** (HTTPS). Base de datos WID o SQL Server.
- Clientes configurados por GPO: *Especificar la ubicación del servicio de actualizaciones de Microsoft en la intranet* → `http://wsus01:8530`. Agrupación en grupos de equipos (de servidor o del lado del cliente).
- Flujo: sincronizar → **aprobar** → los clientes instalan. `wsusutil.exe`; en cliente `UsoClient StartScan` / `Get-WindowsUpdateLog`. Microsoft anunció que WSUS está **obsoleto** (deprecated, sin nuevas funciones) aunque sigue disponible.

**Servicios de impresión**: `printmanagement.msc`, despliegue de impresoras por GPO, aislamiento de controladores. El servicio es la **cola de impresión (Spooler)**. Lección de seguridad: **PrintNightmare** (2021) → deshabilitar Spooler en servidores que no imprimen, sobre todo en **DC**.

**Servicios de Escritorio remoto (RDS)**
- RDP por **TCP/UDP 3389**. Sin RDS, un servidor admite **2 sesiones administrativas** simultáneas (sin CAL).
- Roles: **Host de sesión** (RD Session Host), **Agente de conexión** (Connection Broker), **Acceso web** (RD Web Access), **Puerta de enlace** (RD Gateway: RDP encapsulado en **HTTPS 443**), **Licencias** (RD Licensing, CAL por usuario o por dispositivo, periodo de gracia **120 días**), **Host de virtualización** (VDI).
- **NLA** (Network Level Authentication): autentica antes de crear la sesión. `mstsc /v:srv01 /admin` (sesión de consola/administración).
- `qwinsta` / `query user` (ver sesiones), `logoff <id>`, `rwinsta`.

**NPS** (Network Policy Server): **RADIUS** de Microsoft (UDP **1812** autenticación, **1813** contabilidad; antiguos 1645/1646). Para **802.1X** (cableado y Wi-Fi), VPN. Directivas de solicitud de conexión y de red.

**Acceso remoto (RRAS)**: VPN (IKEv2, SSTP; en 2025 PPTP/L2TP deshabilitados por defecto en nuevas instalaciones), NAT, enrutamiento, **DirectAccess** (obsoleto) y **Always On VPN** (sustituto).

> ⚠️ Trampa: **RD Gateway** usa **443**, no 3389.

> ⚠️ Trampa: CRL = lista completa periódica; **OCSP** = consulta en tiempo real del estado de **un** certificado.

## Nivel 5 — Virtualización, alta disponibilidad y monitorización

### WS-5.1 · Hyper-V

- Hipervisor de **tipo 1** (bare-metal). Requiere CPU de 64 bits con **SLAT** y virtualización por hardware (Intel VT-x / AMD-V) + DEP.
- Partición **primaria/padre** (el Windows de gestión) y particiones **secundarias/hijas** (VM).

**Generaciones de VM**
| | Generación 1 | **Generación 2** (por defecto en 2025) |
|---|---|---|
| Firmware | BIOS | **UEFI** con **Arranque seguro** |
| Disco de arranque | IDE (VHD/VHDX) | **SCSI** (VHDX) |
| Arranque PXE | Adaptador heredado | Adaptador sintético estándar |
| TPM virtual | No | Sí (necesario para Windows 11) |
| SO de 32 bits | Sí | No |

- La generación **no se puede cambiar** después de crear la VM.

**Conmutadores virtuales**
| Tipo | Comunica |
|---|---|
| **Externo** | VM ↔ host ↔ red física (vinculado a una NIC) |
| **Interno** | VM ↔ VM ↔ **host** (sin red física) |
| **Privado** | Solo VM ↔ VM (ni siquiera el host) |

**Discos**: VHDX de tamaño **fijo** (mejor rendimiento), **dinámico** (crece), **diferenciación** (hijo de un disco padre de solo lectura). Discos *pass-through* (físico directo).

**Puntos de control** (checkpoints)
- **Producción** (por defecto desde 2016): usan **VSS** dentro de la VM, consistentes con las aplicaciones (no guardan la memoria).
- **Estándar**: guardan el estado completo incluida la **memoria** (riesgo en DC y bases de datos).
- Ficheros **`.avhdx`**. No son copias de seguridad.

**Memoria**: estática o **dinámica** (memoria inicial, mínima, máxima, búfer). **Virtualización anidada**: `Set-VMProcessor -VMName X -ExposeVirtualizationExtensions $true`.

```powershell
Install-WindowsFeature Hyper-V -IncludeManagementTools -Restart
New-VMSwitch -Name "Externo" -NetAdapterName "Ethernet" -AllowManagementOS $true
New-VMSwitch -Name "LabInterno" -SwitchType Internal
New-VM -Name SRV-APP01 -Generation 2 -MemoryStartupBytes 4GB -NewVHDPath D:\VM\SRV-APP01.vhdx -NewVHDSizeBytes 80GB -SwitchName "Externo"
Set-VMMemory -VMName SRV-APP01 -DynamicMemoryEnabled $true -MinimumBytes 2GB -MaximumBytes 8GB
Set-VMProcessor -VMName SRV-APP01 -Count 4
Add-VMDvdDrive -VMName SRV-APP01 -Path D:\ISO\WS2025.iso
Start-VM SRV-APP01 ; Stop-VM SRV-APP01 ; Stop-VM SRV-APP01 -TurnOff      # apagado ordenado / "desenchufar"
Checkpoint-VM -Name SRV-APP01 -SnapshotName "Antes del parche"
Get-VMSnapshot SRV-APP01 ; Restore-VMSnapshot -Name "Antes del parche" -VMName SRV-APP01 -Confirm:$false
Export-VM -Name SRV-APP01 -Path E:\Export ; Import-VM -Path ...
Get-VM | Select-Object Name, State, CPUUsage, MemoryAssigned, Uptime
Enable-VMIntegrationService -VMName SRV-APP01 -Name "Guest Service Interface"
Move-VM -Name SRV-APP01 -DestinationHost HV02          # migración en vivo
Enable-VMReplication ...                               # réplica de Hyper-V (DR asíncrona)
```

- **Migración en vivo** (Live Migration): mover una VM encendida a otro host sin interrupción. **Migración de almacenamiento**: mover los discos en caliente.
- **Réplica de Hyper-V**: copia asíncrona de la VM a otro host/sitio (frecuencia 30 s, 5 min o 15 min) para **recuperación ante desastres**.
- **VM blindadas** (Shielded VMs) con **Host Guardian Service**: solo Datacenter.

> ⚠️ Trampa: **interno** permite comunicar con el **host**; **privado**, no.

> ⚠️ Trampa: no restaurar un **punto de control estándar** de un **controlador de dominio** en producción: provoca *USN rollback* (los DC modernos con VM-GenerationID lo detectan, pero sigue sin ser buena práctica).

### WS-5.2 · Clústeres y alta disponibilidad

- **Clúster de conmutación por error** (*Failover Clustering*): varios nodos (hasta **64**) que ejecutan **roles** (VM, servidor de archivos, SQL); si un nodo cae, el rol arranca en otro (alta disponibilidad, no balanceo).
- **Quórum** (evita *split-brain*): mayoría de votos. Testigos: **disco**, **recurso compartido de archivos** (FSW), **nube** (Azure Storage, *Cloud Witness*), USB (2019+). Con **quórum dinámico** el clúster ajusta los votos.
- **CSV** (Cluster Shared Volumes): volumen accesible por todos los nodos a la vez (`C:\ClusterStorage\Volume1`).
- **Clústeres de grupo de trabajo** (sin dominio) y en 2025 Hyper-V con migración en vivo en ellos.
- **NLB** (Network Load Balancing): balanceo para servicios sin estado (web); hoy se prefieren balanceadores externos.

```powershell
Install-WindowsFeature Failover-Clustering -IncludeManagementTools
Test-Cluster -Node NODO1, NODO2                           # validación (obligatoria para soporte)
New-Cluster -Name CLU01 -Node NODO1, NODO2 -StaticAddress 192.168.10.100
Set-ClusterQuorum -Cluster CLU01 -FileShareWitness \\srv\testigo
Set-ClusterQuorum -CloudWitness -AccountName cuenta -AccessKey clave
Get-ClusterNode ; Get-ClusterGroup ; Move-ClusterGroup -Name Rol1 -Node NODO2
Add-ClusterSharedVolume -Name "Cluster Disk 1"
```

**Conceptos de disponibilidad**: SLA 99,9 % ≈ 8,76 h de caída/año; 99,99 % ≈ 52,6 min/año; 99,999 % ≈ 5,26 min/año. **Alta disponibilidad** (HA, mismo sitio, automática) ≠ **recuperación ante desastres** (DR, otro sitio).

> ⚠️ Trampa: con número **par** de nodos hace falta un **testigo** para desempatar.

### WS-5.3 · Monitorización del rendimiento

**Monitor de rendimiento** (`perfmon.msc`): contadores en tiempo real, **Conjuntos de recopiladores de datos** (Data Collector Sets) e informes. **Monitor de confiabilidad**: `perfmon /rel`. **Monitor de recursos**: `resmon`.

**Contadores clave y umbrales orientativos**
| Recurso | Contador | Problema si… |
|---|---|---|
| CPU | `Processor(_Total)\% Processor Time` | > **80-85 %** sostenido |
| CPU | `System\Processor Queue Length` | > 2 por núcleo |
| Memoria | `Memory\Available MBytes` | < 10 % de la RAM |
| Memoria | `Memory\Pages/sec` | Alto y sostenido (paginación) |
| Disco | `PhysicalDisk\Avg. Disk sec/Read` (y Write) | > **20-25 ms** |
| Disco | `PhysicalDisk\Current Disk Queue Length` | > 2 por eje |
| Disco | `LogicalDisk\% Free Space` | < 10-15 % |
| Red | `Network Interface\Bytes Total/sec` | Cerca del ancho de banda |
| Red | `Network Interface\Output Queue Length` | > 2 |

```powershell
Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 2 -MaxSamples 5
Get-Counter -ListSet *Memory* ; Get-Counter '\Memory\Available MBytes' -ComputerName SRV01
Get-Process | Sort-Object CPU -Descending | Select-Object -First 10 Name, Id, CPU
Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 10
```
cmd: `typeperf "\Processor(_Total)\% Processor Time" -sc 5`, `logman` (recopiladores).

- **Línea base** (baseline): medir en situación normal para poder comparar cuando hay problemas.
- **Reenvío de eventos**: los equipos de origen envían eventos a un **recopilador** (suscripciones, `wecutil qc`, servicio WinRM). Registro "Eventos reenviados".
- SIEM y monitorización centralizada: SCOM (System Center Operations Manager), Azure Monitor, soluciones libres (Zabbix, Nagios, PRTG, Wazuh…).

> ⚠️ Trampa: CPU alta + `Pages/sec` alto + poca memoria disponible → el cuello de botella real es la **memoria** (paginación), no la CPU.

### WS-5.4 · Resolución de problemas (troubleshooting)

**Arranque y sistema**
```cmd
sfc /scannow                                       :: comprueba y repara ficheros protegidos del sistema
DISM /Online /Cleanup-Image /CheckHealth           :: comprobación rápida del almacén de componentes
DISM /Online /Cleanup-Image /ScanHealth            :: comprobación profunda
DISM /Online /Cleanup-Image /RestoreHealth         :: repara (antes de volver a lanzar sfc)
DISM /Online /Cleanup-Image /RestoreHealth /Source:WIM:D:\sources\install.wim:1 /LimitAccess
chkdsk C: /f                                       :: corrige errores del sistema de ficheros (/r además sectores defectuosos)
bcdedit /enum ; bcdedit /set {default} safeboot minimal    :: modo seguro
bootrec /fixmbr ; bootrec /fixboot ; bootrec /scanos ; bootrec /rebuildbcd   :: desde WinRE (MBR/BIOS)
bcdboot C:\Windows /s S: /f UEFI                   :: recrea ficheros de arranque en partición EFI
msconfig ; msinfo32
```
- Orden correcto para reparar el sistema: **DISM /RestoreHealth primero**, luego **sfc /scannow**.
- **WinRE** (entorno de recuperación), **Modo seguro**, **Última configuración buena conocida** (ya no existe en versiones modernas), **DSRM** en DC (F8 o `bcdedit /set safeboot dsrepair`).

**Metodología**: identificar el problema → establecer hipótesis → probar → plan de acción → implementar → verificar → documentar (CompTIA). En red, modelo **OSI de abajo arriba** (bottom-up).

**Casos típicos de supuesto práctico**
| Síntoma | Causa probable | Comprobación / solución |
|---|---|---|
| Usuario no puede iniciar sesión: "cuenta bloqueada" | Intentos fallidos (a menudo credenciales antiguas en un móvil o unidad mapeada) | `Search-ADAccount -LockedOut`; evento **4740** en el **PDC**; `Unlock-ADAccount` |
| "La hora difiere" / error Kerberos | Reloj desfasado > 5 min | `w32tm /query /status`, `w32tm /resync` |
| Equipo pierde la relación de confianza | Contraseña de cuenta de equipo desincronizada | `Test-ComputerSecureChannel -Repair` |
| No se aplica una GPO | Objeto en contenedor `CN=Users`, filtrado de seguridad, WMI, bloqueo de herencia, replicación SYSVOL | `gpresult /h`, `Get-GPInheritance` |
| Cliente no encuentra el dominio al unirse | DNS del cliente apunta a un DNS público | Poner como DNS un DC; `nltest /dsgetdc` |
| No se replica AD | DNS, firewall, hora, tombstone | `repadmin /replsummary`, `dcdiag` |
| Servidor lento | CPU, memoria, disco | `perfmon`, `Get-Counter`, `resmon` |
| Servicio no arranca | Dependencia, cuenta de servicio con contraseña caducada | `services.msc`, eventos 7000/7009/7034 |
| Se reinicia solo | Fallo de alimentación / BSOD / actualizaciones | Eventos **41**, **6008**, **1074**; volcado `C:\Windows\MEMORY.DMP` |

> ⚠️ Trampa: para recuperar `sfc` cuando dice que no puede reparar algunos ficheros, primero `DISM /Online /Cleanup-Image /RestoreHealth`.

## Nivel 6 — Seguridad y administración profesional en la AGE

### WS-6.1 · Bastionado (hardening) de Windows Server

**Principios**: mínimo privilegio, mínima funcionalidad (Server Core, solo roles necesarios), defensa en profundidad, segregación de funciones, parches al día.

**Modelo de niveles (tiering) / Enterprise Access Model**
- **Tier 0**: control de la identidad (DC, AD CS, Entra Connect, ADFS). **Tier 1**: servidores y aplicaciones. **Tier 2**: puestos de usuario.
- Una cuenta de un nivel **no inicia sesión** en niveles inferiores (un Domain Admin nunca en un PC de usuario). Se usan **PAW** (estaciones de trabajo de acceso privilegiado) y **cuentas separadas** (cuenta normal + cuenta admin).
- Grupo **Protected Users** para cuentas privilegiadas. Mínimo número de Domain Admins (idealmente vacío salvo emergencias).

**Windows LAPS** (integrado en Windows desde abril de 2023; el LAPS heredado está obsoleto)
- Gestiona y rota la contraseña del **administrador local** de cada equipo y la guarda en **AD** o **Microsoft Entra ID** (cifrada).
```powershell
Update-LapsADSchema                                                     # amplía el esquema (una vez)
Set-LapsADComputerSelfPermission -Identity "OU=Equipos,DC=age,DC=local" # el equipo puede escribir su contraseña
Set-LapsADReadPasswordPermission -Identity "OU=Equipos,DC=age,DC=local" -AllowedPrincipals "AGE\GG_Soporte"
# GPO: Plantillas administrativas > Sistema > LAPS (BackupDirectory = AD)
Invoke-LapsPolicyProcessing                                             # forzar en el equipo
Get-LapsADPassword -Identity PC-0001 -AsPlainText                       # leer la contraseña
Set-LapsADPasswordExpirationTime -Identity PC-0001                      # forzar rotación
Reset-LapsPassword                                                      # rotar en local
```

**Otras medidas**
- **Credential Guard** (aísla secretos LSA con VBS; por defecto en 2025 en hardware compatible), **LSA protection** (RunAsPPL).
- Deshabilitar **SMBv1** (desinstalado por defecto desde 2019): `Get-SmbServerConfiguration | Select EnableSMB1Protocol`; `Set-SmbServerConfiguration -EnableSMB1Protocol $false`; `Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol`. Exigir **firma SMB** y cifrado SMB 3 (`Set-SmbShare -Name X -EncryptData $true`).
- Restringir **NTLM** (preferir Kerberos), deshabilitar **LM** y NTLMv1, **LDAP signing** y **channel binding**, deshabilitar **LLMNR** y **NetBIOS sobre TCP/IP** (envenenamiento con herramientas tipo Responder), deshabilitar el **Spooler** en DC.
- **AppLocker** (reglas por editor, ruta o hash; servicio *Identidad de aplicación*) y **WDAC / App Control for Business** (control a nivel de kernel, más robusto).
- **Microsoft Defender Antivirus**: `Get-MpComputerStatus`, `Update-MpSignature`, `Start-MpScan -ScanType QuickScan` (o `FullScan`), `Set-MpPreference -DisableRealtimeMonitoring $false`, `Add-MpPreference -ExclusionPath D:\SQL`, `Get-MpThreatDetection`. **ASR** (reglas de reducción de la superficie de ataque).
- **BitLocker** (requiere TPM 1.2+/2.0 para modo transparente; característica `BitLocker` en servidor):
  ```powershell
  Enable-BitLocker -MountPoint C: -EncryptionMethod XtsAes256 -TpmProtector -UsedSpaceOnly
  Add-BitLockerKeyProtector -MountPoint C: -RecoveryPasswordProtector
  $kp = (Get-BitLockerVolume C:).KeyProtector | Where-Object KeyProtectorType -eq 'RecoveryPassword'
  Backup-BitLockerKeyProtector -MountPoint C: -KeyProtectorId $kp.KeyProtectorId                 # copia la clave de recuperación en AD
  Get-BitLockerVolume
  ```
  cmd: `manage-bde -status`, `manage-bde -on C: -RecoveryPassword`, `manage-bde -protectors -get C:`. Clave de recuperación de **48 dígitos**.
- **Firewall de Windows**: perfiles **Dominio**, **Privado** y **Público**.
  ```powershell
  New-NetFirewallRule -DisplayName "Permitir HTTPS" -Direction Inbound -Protocol TCP -LocalPort 443 -Action Allow -Profile Domain
  New-NetFirewallRule -DisplayName "Bloquear Telnet" -Direction Outbound -Protocol TCP -RemotePort 23 -Action Block
  Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction
  Set-NetFirewallProfile -Profile Public -DefaultInboundAction Block
  Enable-NetFirewallRule -DisplayGroup "Escritorio remoto"     # nombre localizado (en inglés "Remote Desktop")
  ```
  cmd: `netsh advfirewall show allprofiles`, `netsh advfirewall firewall add rule name="HTTPS" dir=in action=allow protocol=TCP localport=443`, `netsh advfirewall set allprofiles state on`.
- **Auditoría avanzada**: `auditpol /get /category:*` ; `auditpol /set /subcategory:"Inicio de sesión" /success:enable /failure:enable` (en español los nombres van traducidos; con GUID no dependes del idioma). Mejor configurarla por **GPO** (Configuración de directiva de auditoría avanzada).
- **Líneas base de seguridad** de Microsoft (Security Compliance Toolkit, **OSConfig** en 2025) y **guías CCN-STIC**.

> ⚠️ Trampa: **AppLocker** no es una barrera de seguridad sólida (se puede evadir); **WDAC/App Control** sí lo es según Microsoft.

> ⚠️ Trampa: la regla de firewall en Windows en español: grupo **"Escritorio remoto"**, no "Remote Desktop". Por eso en scripts se usa `-Group "@FirewallAPI.dll,-28752"`.

### WS-6.2 · Identidad híbrida y nube

- **Microsoft Entra ID** (antes **Azure AD**, renombrado en 2023): identidad en la nube (OAuth 2.0, OpenID Connect, SAML; no usa LDAP/Kerberos/GPO de forma nativa).
- **Microsoft Entra Connect Sync** / **Entra Cloud Sync**: sincronizan usuarios de AD local a Entra ID. Métodos: **sincronización de hash de contraseña (PHS)**, **autenticación de paso a través (PTA)** o **federación (AD FS)**.
- **Entra ID Domain Services**: dominio administrado (LDAP/Kerberos) en Azure.
- **Azure Arc**: gestionar servidores locales desde Azure (Hotpatch de 2025, inventario, actualizaciones, Defender for Cloud).
- **Intune**: gestión de dispositivos en la nube (MDM) como alternativa a GPO.
- Dispositivos: **unidos a Entra** (Entra joined), **unidos híbridos** (AD + Entra) o **registrados**.

> ⚠️ Trampa: Entra ID **no** es "AD en la nube": no tiene OU ni GPO ni LDAP de forma nativa.

### WS-6.3 · Marco AGE: ENS, CCN y buenas prácticas

- **Esquema Nacional de Seguridad (ENS)**: **Real Decreto 311/2022**, de 3 de mayo (sustituye al RD 3/2010). Obligatorio para el sector público y sus proveedores TIC.
  - **Categorías** del sistema: **BÁSICA**, **MEDIA**, **ALTA** (según el impacto en las dimensiones de seguridad).
  - **Dimensiones**: **Confidencialidad, Integridad, Trazabilidad, Autenticidad, Disponibilidad** (C-I-T-A-D).
  - **Medidas** (Anexo II) en tres marcos: **organizativo** (org), **operacional** (op: planificación, control de acceso, explotación, recursos externos, servicios en la nube, continuidad, monitorización) y **medidas de protección** (mp: instalaciones, personal, equipos, comunicaciones, soportes, aplicaciones, información, servicios).
  - Auditoría de conformidad: al menos cada **2 años** (categorías MEDIA y ALTA mediante auditoría formal; BÁSICA basta autoevaluación).
  - **Perfiles de cumplimiento específicos** (p. ej. para entidades locales, universidades).
- **Esquema Nacional de Interoperabilidad (ENI)**: RD 4/2010.
- **CCN** (Centro Criptológico Nacional, adscrito al **CNI**) y **CCN-CERT** (capacidad de respuesta a incidentes del sector público). Guías **CCN-STIC**: serie **800** sobre el ENS (p. ej. **CCN-STIC 804** guía de implantación de medidas), y series de bastionado de productos (Windows, Linux, redes…).
- **Herramientas del CCN-CERT** (frecuentes en test): **PILAR** (análisis y gestión de riesgos, metodología **MAGERIT**), **LUCÍA** (gestión de ciberincidentes), **INES** (informe del estado de seguridad / cumplimiento del ENS), **CARMEN** (detección de amenazas persistentes avanzadas en red), **microCLAUDIA** (vacunas contra ransomware en el puesto), **GLORIA** (gestión de eventos/SIEM), **REYES** (intercambio de información de ciberamenazas).
- **Red SARA**: red de comunicaciones que interconecta las Administraciones Públicas españolas (AGE, CCAA, EELL) y con la UE (red **TESTA**). Gestionada por la Secretaría General de Administración Digital.
- **INCIBE**: atiende a ciudadanos y empresas (no al sector público, que es CCN-CERT). Notificación de incidentes del sector público a través de **LUCÍA** / CCN-CERT.
- **Copia de seguridad, registro de actividad y gestión de configuración** son medidas del ENS que se traducen en la práctica en: backups verificados, logs centralizados con retención, inventario y control de cambios.

> ⚠️ Trampa: el ENS vigente es el **RD 311/2022**, no el 3/2010 (derogado).

> ⚠️ Trampa: las categorías ENS son **BÁSICA, MEDIA y ALTA** (no "baja"). Los niveles por dimensión son **bajo, medio, alto**.

# Redes

## Nivel 1 — Fundamentos

### NET-1.1 · Modelos OSI y TCP/IP

**Modelo OSI** (ISO 7498, 7 capas). Regla para recordarlo de abajo arriba: **F**ísica, **E**nlace, **R**ed, **T**ransporte, **S**esión, **P**resentación, **A**plicación.

| Capa | Nombre | PDU | Función | Ejemplos | Dispositivo |
|---|---|---|---|---|---|
| 7 | Aplicación | Datos | Servicios al usuario | HTTP, DNS, SMTP, FTP, SSH, SNMP, DHCP | — |
| 6 | Presentación | Datos | Formato, cifrado, compresión | TLS (parcialmente), ASCII, JPEG, MIME | — |
| 5 | Sesión | Datos | Diálogo, sincronización | NetBIOS, RPC, sesiones | — |
| 4 | Transporte | **Segmento** (TCP) / **Datagrama** (UDP) | Extremo a extremo, puertos, fiabilidad | TCP, UDP | Firewall L4 |
| 3 | Red | **Paquete** | Direccionamiento lógico, **enrutamiento** | IPv4, IPv6, ICMP, IPsec, OSPF | **Router**, switch L3 |
| 2 | Enlace de datos | **Trama** | Direccionamiento físico (**MAC**), detección de errores (**FCS/CRC**) | Ethernet 802.3, Wi-Fi 802.11, PPP, ARP*, VLAN 802.1Q, STP | **Switch**, puente, AP |
| 1 | Física | **Bits** | Señales, cables, conectores | RJ-45, fibra, 1000BASE-T | **Hub**, repetidor, módem |

- La capa 2 se divide en **LLC** (802.2, arriba) y **MAC** (abajo).
- *ARP* se sitúa entre capas 2 y 3 (resuelve IP → MAC).

**Modelo TCP/IP** (4 capas, RFC 1122): **Aplicación** (OSI 5-7), **Transporte** (4), **Internet** (3), **Acceso a la red / Enlace** (1-2). Algunos libros usan 5 capas (separando física y enlace).

- **Encapsulación**: al bajar cada capa añade su cabecera (la capa 2 añade también una cola: FCS). **Desencapsulación** al subir.
- Comunicación **entre pares**: cada capa se "habla" con la misma capa del otro extremo.

> ⚠️ Trampa: switch = capa **2** (MAC); router = capa **3** (IP); hub = capa **1** (repite bits a todos los puertos, un solo dominio de colisión).

> ⚠️ Trampa: **TLS** no encaja exactamente en OSI; en test suele aceptarse capa **6 (presentación)** o "entre transporte y aplicación". Mira bien las opciones.

> 💡 Clave: dominios — un **hub** = 1 dominio de colisión; un **switch** = 1 dominio de colisión **por puerto** y 1 de difusión (por VLAN); un **router** separa dominios de **difusión**.

### NET-1.2 · Medios de transmisión y cableado

**Par trenzado** (UTP sin apantallar, STP/FTP apantallado). Conector **RJ-45** (8P8C). Distancia máxima por segmento Ethernet: **100 m** (90 m enlace permanente + latiguillos).

| Categoría | Ancho de banda | Velocidad típica | Distancia |
|---|---|---|---|
| Cat 5e | 100 MHz | 1 Gbps (1000BASE-T) | 100 m |
| Cat 6 | 250 MHz | 1 Gbps (10 Gbps hasta ~55 m) | 100 m |
| Cat 6A | 500 MHz | **10 Gbps** | 100 m |
| Cat 7 / 7A | 600 / 1000 MHz | 10 Gbps | 100 m |
| Cat 8 | 2000 MHz | 25/40 Gbps | **30 m** (centros de datos) |

- Normas de crimpado **T568A** y **T568B** (TIA-568). Cable **directo** (mismo estándar en ambos extremos) y **cruzado** (A en un extremo, B en otro). Hoy casi todo tiene **Auto-MDIX**.
- T568B: blanco-naranja, naranja, blanco-verde, azul, blanco-azul, verde, blanco-marrón, marrón.
- 100BASE-TX usa 2 pares (1-2 y 3-6); 1000BASE-T usa los **4 pares**.

**Fibra óptica**: inmune a interferencias electromagnéticas.
- **Multimodo (MMF)**: núcleo 50/62,5 µm, fuente LED/VCSEL (850 nm), distancias cortas (cientos de metros). Tipos OM1-OM5 (cubierta OM3/OM4 aqua).
- **Monomodo (SMF)**: núcleo ~9 µm, láser (1310/1550 nm), **decenas de km**. Tipos OS1/OS2 (cubierta amarilla).
- Conectores: **LC** (pequeño, el más usado en SFP), **SC**, ST, MPO/MTP (multi-fibra). Transceptores **SFP** (1G), **SFP+** (10G), **SFP28** (25G), **QSFP+** (40G), **QSFP28** (100G).

**Nomenclatura Ethernet**: `10BASE-T` = 10 Mbps, banda base, par trenzado. 100BASE-TX (Fast Ethernet), 1000BASE-T (Gigabit sobre cobre), 1000BASE-SX (fibra multimodo), 1000BASE-LX (fibra larga distancia), 10GBASE-T, 10GBASE-SR (MMF corto), 10GBASE-LR (SMF 10 km).

**PoE** (alimentación por Ethernet):
| Norma | Nombre | Potencia en el PSE (switch) |
|---|---|---|
| 802.3af | PoE | 15,4 W |
| 802.3at | PoE+ | 30 W |
| 802.3bt | PoE++ (tipo 3 / tipo 4) | 60 W / 90 W |

**Cableado estructurado** (ISO/IEC 11801, TIA-568): cuarto de equipos, cableado vertical (troncal/backbone), cableado horizontal, rosetas, paneles de parcheo (patch panel), latiguillos.

> ⚠️ Trampa: **Cat 6A** es la que garantiza **10 Gbps a 100 m**; Cat 6 solo hasta ~55 m.

> ⚠️ Trampa: fibra **multimodo = corta distancia**; **monomodo = larga distancia** (aunque el núcleo sea más fino).

### NET-1.3 · Ethernet, direcciones MAC y switching básico

- **Ethernet** = IEEE **802.3**. Acceso al medio **CSMA/CD** (solo relevante en half-duplex; en full-duplex no hay colisiones). Wi-Fi usa **CSMA/CA** (evita colisiones).
- **Trama Ethernet II**: Preámbulo (7) + SFD (1) | **MAC destino (6)** | **MAC origen (6)** | **EtherType (2)** (0x0800 IPv4, **0x86DD IPv6**, **0x0806 ARP**, 0x8100 VLAN) | Datos **46-1500** | **FCS (4)** (CRC-32).
- Tamaño de trama: mínimo **64 bytes**, máximo **1518** (**1522** con etiqueta 802.1Q). **MTU** estándar = **1500 bytes** de carga. **Jumbo frames** ~9000 bytes.
- **Dirección MAC**: 48 bits (6 bytes) en hexadecimal (`00-15-5D-0A-1B-2C` o `00:15:5d:0a:1b:2c`). Los primeros 24 bits = **OUI** (fabricante). Bit menos significativo del primer byte: 0 unicast, 1 multicast. Difusión: **FF:FF:FF:FF:FF:FF**.
- **Funcionamiento del switch**: **aprende** la MAC origen y el puerto (tabla **CAM**, envejecimiento típico **300 s**), **reenvía** a un puerto si conoce la MAC destino, **inunda** (flooding) si es desconocida, difusión o multidifusión, y **filtra** si destino y origen están en el mismo puerto.
- Métodos de conmutación: **store-and-forward** (recibe la trama entera y comprueba FCS: el más habitual), **cut-through** (reenvía al leer la MAC destino, menor latencia), **fragment-free** (lee los primeros 64 bytes).
- **Dúplex**: half / full. Un **desajuste de dúplex** (duplex mismatch) provoca colisiones tardías, errores CRC y lentitud.

> ⚠️ Trampa: en la trama Ethernet la **MAC destino va antes** que la MAC origen.

> ⚠️ Trampa: el switch **no** aprende de la MAC destino, aprende de la **MAC origen**.

### NET-1.4 · Tipos de redes, topologías y redes inalámbricas

**Por alcance**: PAN (Bluetooth), **LAN**, **MAN**, **WAN**, WLAN, SAN (almacenamiento: Fibre Channel, iSCSI puerto **3260**).
**Topologías**: bus, anillo, **estrella** (la de Ethernet actual), estrella extendida/jerárquica, malla (completa o parcial), árbol. Diseño jerárquico de 3 capas: **núcleo** (core), **distribución**, **acceso**. En centros de datos: **spine-leaf**.

**Wi-Fi (IEEE 802.11)**
| Estándar | Wi-Fi | Banda | Velocidad máx. teórica |
|---|---|---|---|
| 802.11b | (1) | 2,4 GHz | 11 Mbps |
| 802.11a | (2) | 5 GHz | 54 Mbps |
| 802.11g | (3) | 2,4 GHz | 54 Mbps |
| 802.11n | **Wi-Fi 4** | 2,4 y 5 GHz | 600 Mbps (MIMO) |
| 802.11ac | **Wi-Fi 5** | **solo 5 GHz** | ~3,5-6,9 Gbps (MU-MIMO descendente) |
| 802.11ax | **Wi-Fi 6 / 6E** | 2,4 y 5 (6E añade **6 GHz**) | ~9,6 Gbps (OFDMA) |
| 802.11be | **Wi-Fi 7** | 2,4, 5 y 6 GHz | ~46 Gbps (canales de 320 MHz, MLO) |

- 2,4 GHz: en Europa canales 1-13; **no solapados: 1, 6, 11** (en Europa también 1, 5, 9, 13 con 20 MHz). Más alcance, más interferencias. 5 GHz: más canales y velocidad, menos alcance.
- **SSID** (nombre de la red), **BSSID** (MAC del AP), modos **infraestructura** y **ad hoc**. Controladora WLAN (WLC) para APs ligeros (protocolo CAPWAP).
- Seguridad: **WEP** (roto), **WPA** (TKIP, obsoleto), **WPA2** (AES-**CCMP**; personal con PSK o **Enterprise con 802.1X/RADIUS**), **WPA3** (personal con **SAE** — resistente a ataques de diccionario offline —, Enterprise con modo de 192 bits, **OWE** para redes abiertas cifradas). Wi-Fi 6E/7 en 6 GHz exige WPA3.
- **WPS** debe deshabilitarse (PIN vulnerable a fuerza bruta).

**Otras**: Bluetooth (802.15.1), Zigbee (802.15.4), **5G** (redes móviles), **SD-WAN** (WAN definida por software sobre varios enlaces), **MPLS** (conmutación por etiquetas en redes de operador, "capa 2,5").

> ⚠️ Trampa: **802.11ac (Wi-Fi 5) solo funciona en 5 GHz**.

> ⚠️ Trampa: **WPA3-Personal** sustituye PSK por **SAE** (Dragonfly); **WPA2-Enterprise** y **WPA3-Enterprise** usan **802.1X** con servidor **RADIUS**.

## Nivel 2 — Direccionamiento IP

### NET-2.1 · IPv4: clases, rangos especiales y cabecera

- Dirección de **32 bits** en 4 octetos decimales (notación decimal con puntos). Parte de **red** + parte de **host**, separadas por la **máscara** (`255.255.255.0` = `/24`).

**Clases (históricas, por el primer octeto)**
| Clase | Rango 1er octeto | Bits iniciales | Máscara por defecto | Uso |
|---|---|---|---|---|
| A | 1 – 126 | 0 | /8 | Redes grandes |
| B | 128 – 191 | 10 | /16 | Redes medianas |
| C | 192 – 223 | 110 | /24 | Redes pequeñas |
| D | 224 – 239 | 1110 | — | **Multidifusión** |
| E | 240 – 255 | 1111 | — | Experimental / reservada |

(127 es loopback, no se usa en la clase A.)

**Rangos especiales**
| Rango | Uso | RFC |
|---|---|---|
| **10.0.0.0/8** | Privada | 1918 |
| **172.16.0.0/12** (172.16.0.0 – **172.31**.255.255) | Privada | 1918 |
| **192.168.0.0/16** | Privada | 1918 |
| **127.0.0.0/8** | Loopback (127.0.0.1 = localhost) | 1122 |
| **169.254.0.0/16** | Enlace local / **APIPA** | 3927 |
| **100.64.0.0/10** | Espacio compartido **CGNAT** de operadores | 6598 |
| 0.0.0.0/8 | "Esta red" (0.0.0.0 = sin dirección / cualquier dirección / ruta por defecto 0.0.0.0/0) | |
| 255.255.255.255 | Difusión limitada | |
| 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24 | Documentación (TEST-NET) | 5737 |
| 198.18.0.0/15 | Pruebas de rendimiento | 2544 |
| 224.0.0.0/4 | Multidifusión (224.0.0.0/24 local: 224.0.0.1 todos los hosts, 224.0.0.2 todos los routers, 224.0.0.5/6 OSPF, 224.0.0.9 RIPv2, 224.0.0.10 EIGRP, 224.0.0.18 VRRP, 224.0.0.102 HSRPv2) | 5771 |

**Cabecera IPv4** (mínimo **20 bytes**, máximo 60): Versión (4), **IHL**, DSCP/ECN (antes ToS), Longitud total, Identificación, Flags (**DF** no fragmentar, **MF** más fragmentos), Desplazamiento de fragmento, **TTL**, **Protocolo** (**1 ICMP**, **6 TCP**, **17 UDP**, 2 IGMP, 47 GRE, **50 ESP**, **51 AH**, 89 OSPF), Suma de comprobación de cabecera, IP origen, IP destino, Opciones.

- **TTL**: cada router lo decrementa en 1; al llegar a 0 el paquete se descarta y se envía **ICMP Time Exceeded** (tipo 11) → base de **traceroute**. Valores iniciales típicos: Windows **128**, Linux **64**, equipos de red 255.

> ⚠️ Trampa: **172.32.0.0 NO es privada**. El rango privado de clase B va de **172.16** a **172.31**.

> ⚠️ Trampa: **169.254.x.x** no es privada RFC 1918: es **APIPA/enlace local** (no se enruta).

### NET-2.2 · Subnetting (subredes) y VLSM

**Fórmulas**
- Nº de **subredes** = 2^(bits prestados).
- Nº de **hosts útiles** por subred = 2^(bits de host) **− 2** (se restan la dirección de **red** y la de **difusión**).
- **Tamaño de bloque** (salto) = 256 − valor de la máscara en el octeto "interesante".

**Tabla de máscaras imprescindible**
| CIDR | Máscara | Hosts útiles | Bloque |
|---|---|---|---|
| /8 | 255.0.0.0 | 16.777.214 | |
| /16 | 255.255.0.0 | 65.534 | |
| /20 | 255.255.240.0 | 4.094 | 16 (3er octeto) |
| /21 | 255.255.248.0 | 2.046 | 8 (3er octeto) |
| /22 | 255.255.252.0 | 1.022 | 4 (3er octeto) |
| /23 | 255.255.254.0 | 510 | 2 (3er octeto) |
| **/24** | 255.255.255.0 | **254** | 256 |
| /25 | 255.255.255.128 | 126 | 128 |
| /26 | 255.255.255.192 | 62 | 64 |
| /27 | 255.255.255.224 | 30 | 32 |
| /28 | 255.255.255.240 | 14 | 16 |
| /29 | 255.255.255.248 | 6 | 8 |
| **/30** | 255.255.255.252 | **2** (enlaces punto a punto) | 4 |
| /31 | 255.255.255.254 | 2 (punto a punto, RFC 3021, sin red/difusión) | 2 |
| /32 | 255.255.255.255 | 1 (un solo host, loopbacks) | 1 |

**Método rápido (ejemplo)**: `192.168.10.77/27`
1. /27 → máscara 255.255.255.**224** → bloque = 256 − 224 = **32**.
2. Múltiplos de 32: 0, 32, **64**, 96… → 77 cae en el bloque que empieza en **64**.
3. **Red**: 192.168.10.**64** · **Difusión**: 192.168.10.**95** (siguiente red 96 − 1) · **Hosts**: .65 a .94 (**30** hosts).

**Ejemplo con 3er octeto**: `172.16.45.10/22` → máscara 255.255.**252**.0, bloque **4** en el 3er octeto: 44, 48… → red **172.16.44.0**, difusión **172.16.47.255**, hosts 172.16.44.1 – 172.16.47.254 (1.022 hosts).

**Ejemplo de diseño**: dividir 192.168.1.0/24 en 4 subredes iguales → se prestan 2 bits → **/26**: .0, .64, .128, .192 (62 hosts cada una).

**VLSM** (máscaras de longitud variable): asignar de **mayor a menor** necesidad. Ej. con 192.168.1.0/24 para 100, 50, 20 hosts y 2 enlaces punto a punto:
- 100 hosts → /25 (126): 192.168.1.0/25
- 50 → /26 (62): 192.168.1.128/26
- 20 → /27 (30): 192.168.1.192/27
- Enlaces → /30: 192.168.1.224/30, 192.168.1.228/30

**Superredes / sumarización** (CIDR): agrupar redes contiguas. 192.168.0.0/24 + 192.168.1.0/24 + 192.168.2.0/24 + 192.168.3.0/24 = **192.168.0.0/22**.

**¿Están dos IP en la misma subred?** Aplicar AND con la máscara: 10.1.1.130/25 y 10.1.1.100/25 → la primera está en 10.1.1.128, la segunda en 10.1.1.0 → **distintas** subredes (hace falta router).

> ⚠️ Trampa: "¿Cuántos hosts en un /26?" → **62**, no 64.

> ⚠️ Trampa: la **primera** IP del bloque es la de **red** y la **última** la de **difusión**: ninguna se asigna a hosts (salvo /31 y /32).

> 💡 Clave: memoriza la secuencia de valores de máscara: **128, 192, 224, 240, 248, 252, 254, 255**.

### NET-2.3 · IPv6

- **128 bits**, 8 grupos de 16 bits (hextetos) en hexadecimal separados por `:`. Ej. `2001:0db8:0000:0000:0000:ff00:0042:8329`.
- **Abreviación**: (1) quitar **ceros a la izquierda** de cada grupo; (2) sustituir **una sola** secuencia de grupos de ceros consecutivos por `::` → `2001:db8::ff00:42:8329`.
- Prefijo: `/64` para una subred LAN (64 bits de red + 64 de **identificador de interfaz**); a un sitio se le suele asignar un **/48** (65.536 subredes /64) o /56.
- **No hay difusión (broadcast)**: se usa **multidifusión**.

**Tipos de direcciones**
| Tipo | Prefijo | Equivalente IPv4 |
|---|---|---|
| **Unidifusión global** (GUA) | **2000::/3** (empiezan por 2 o 3) | Pública |
| **Enlace local** (link-local) | **fe80::/10** | 169.254 (APIPA) — pero **siempre existe** en cada interfaz IPv6 |
| **Local única** (ULA) | **fc00::/7** (en uso **fd00::/8**) | Privada RFC 1918 |
| **Multidifusión** | **ff00::/8** | 224/4 |
| **Loopback** | **::1/128** | 127.0.0.1 |
| No especificada | **::/128** | 0.0.0.0 |
| Ruta por defecto | **::/0** | 0.0.0.0/0 |
| Documentación | **2001:db8::/32** | TEST-NET |
| IPv4 mapeada | ::ffff:0:0/96 | |
| Site-local (obsoleta) | fec0::/10 | |

- Multidifusión conocida: **ff02::1** todos los nodos del enlace, **ff02::2** todos los routers, **ff02::1:ffXX:XXXX** nodo solicitado (usado por NDP), ff02::5/6 OSPFv3, ff02::1:2 servidores DHCPv6.
- **Anycast**: misma dirección en varios nodos; el paquete llega al más cercano.
- **Cabecera IPv6**: **40 bytes fijos**, sin checksum, **Next Header** (encadena cabeceras de extensión), **Hop Limit** (equivale al TTL), **Flow Label**. **Solo el origen fragmenta** (los routers no; usan PMTUD). MTU mínima **1280 bytes**.

**Autoconfiguración**
- **NDP** (Neighbor Discovery, sobre **ICMPv6**) sustituye a ARP: tipos **133 RS** (Router Solicitation), **134 RA** (Router Advertisement), **135 NS** (Neighbor Solicitation), **136 NA** (Neighbor Advertisement), **137 Redirect**. **DAD** (detección de direcciones duplicadas) con NS.
- **SLAAC**: el host toma el prefijo del **RA** y genera su identificador de interfaz (con **EUI-64** —MAC partida con `FFFE` en medio e invirtiendo el 7.º bit (U/L)— o aleatorio por privacidad, RFC 4941/7217).
- **DHCPv6** con estado o sin estado (flags **M** y **O** en el RA).
- Transición: **doble pila** (dual stack, lo recomendado), **túneles** (6in4, 6to4, Teredo, ISATAP — obsoletos), **traducción** (NAT64 + DNS64).

> ⚠️ Trampa: `::` solo puede aparecer **una vez** en una dirección (si no, sería ambigua). `2001:db8::1::2` es **inválida**.

> ⚠️ Trampa: IPv6 **no tiene broadcast** ni ARP. Lo que hacía ARP lo hace **NDP (ICMPv6)**.

> ⚠️ Trampa: la cabecera IPv6 (40 bytes) es **mayor** que la mínima de IPv4 (20 bytes) aunque sea más simple.

## Nivel 3 — Protocolos y servicios

### NET-3.1 · TCP, UDP y puertos

| | **TCP** | **UDP** |
|---|---|---|
| Conexión | Orientado a conexión (**3-way handshake**) | Sin conexión |
| Fiabilidad | Confirmaciones (ACK), retransmisión, orden (nº de secuencia) | No garantiza entrega ni orden |
| Control de flujo/congestión | Sí (ventana deslizante) | No |
| Cabecera | **20** bytes (mín.) | **8** bytes |
| Uso | HTTP(S), SMTP, SSH, FTP, SMB, RDP… | DNS (consultas), DHCP, TFTP, SNMP, NTP, syslog, VoIP/RTP, streaming, QUIC |

- **Saludo de tres vías**: **SYN** → **SYN-ACK** → **ACK**. Cierre: FIN → ACK → FIN → ACK (4 pasos) o **RST** (abrupto).
- **Flags TCP**: URG, ACK, PSH, RST, SYN, FIN (+ ECE, CWR).
- Estados (`netstat`): LISTEN (LISTENING en Windows), SYN_SENT, SYN_RECEIVED, ESTABLISHED, FIN_WAIT_1/2, CLOSE_WAIT, **TIME_WAIT**, LAST_ACK, CLOSED.
- **Socket** = IP + protocolo + puerto. Rangos de puertos (IANA): **0-1023 bien conocidos**, **1024-49151 registrados**, **49152-65535 dinámicos/efímeros** (rango por defecto de Windows desde Vista).
- **QUIC** (HTTP/3): sobre **UDP 443**, con TLS 1.3 integrado.

**Puertos que hay que saber de memoria**
| Puerto | Protocolo | | Puerto | Protocolo |
|---|---|---|---|---|
| 20/21 TCP | FTP (datos/control) | | 445 TCP | **SMB** / CIFS |
| 22 TCP | **SSH**, SFTP, SCP | | 465 TCP | SMTPS (SMTP sobre TLS implícito) |
| 23 TCP | Telnet | | 514 UDP | **Syslog** |
| 25 TCP | **SMTP** | | 587 TCP | **SMTP submission** (envío de clientes, STARTTLS) |
| 53 UDP/TCP | **DNS** | | 636 TCP | **LDAPS** |
| 67/68 UDP | **DHCP** (servidor/cliente) | | 853 TCP | DNS sobre TLS (DoT) |
| 69 UDP | TFTP | | 989/990 TCP | FTPS |
| 80 TCP | HTTP | | 993 TCP | **IMAPS** |
| 88 TCP/UDP | **Kerberos** | | 995 TCP | **POP3S** |
| 110 TCP | POP3 | | 1433 TCP | Microsoft SQL Server |
| 123 UDP | **NTP** | | 1521 TCP | Oracle |
| 135 TCP | RPC (Endpoint Mapper) | | 1812/1813 UDP | **RADIUS** |
| 137-139 | NetBIOS (nombres UDP 137, datagramas UDP 138, sesión TCP 139) | | 3268/3269 TCP | Catálogo global (LDAP/LDAPS) |
| 143 TCP | **IMAP** | | 3306 TCP | MySQL / MariaDB |
| 161/162 UDP | **SNMP** (consultas / traps) | | **3389** TCP/UDP | **RDP** |
| 179 TCP | **BGP** | | 5060/5061 | SIP / SIP-TLS |
| 389 TCP/UDP | **LDAP** | | 5432 TCP | PostgreSQL |
| **443** TCP/UDP | **HTTPS** (UDP: QUIC) | | **5985/5986** TCP | WinRM HTTP/HTTPS |
| 500 UDP | **IKE** (IPsec) | | 4500 UDP | IPsec **NAT-T** |
| 1194 UDP | OpenVPN | | 51820 UDP | WireGuard |
| 3260 TCP | iSCSI | | 8080 / 8443 | HTTP / HTTPS alternativos |
| 2049 | NFS | | 6443 TCP | API de Kubernetes |
| 9389 TCP | AD Web Services | | 1688 TCP | KMS |

> ⚠️ Trampa: DNS usa **UDP 53** para consultas y **TCP 53** para transferencias de zona y respuestas grandes.

> ⚠️ Trampa: **SMTP 25** es entre servidores; los clientes envían por **587** (submission) o **465** (SMTPS).

> ⚠️ Trampa: **SNMP traps** van al **162**; las consultas (get/set) al **161**.

### NET-3.2 · ARP, ICMP, NAT y protocolos de soporte

**ARP** (Address Resolution Protocol, RFC 826): IP → MAC dentro de la misma red. **Solicitud por difusión** ("¿quién tiene 192.168.1.1?") y **respuesta unicast**. Caché ARP (`arp -a`). **ARP gratuito**: anuncio de la propia IP (detectar duplicados, failover). **RARP** (obsoleto, MAC → IP). **Proxy ARP**.
- Para destinos de **otra red**, el equipo pide por ARP la MAC de su **puerta de enlace**, no la del destino final.

**ICMP** (protocolo IP 1): mensajes de control y error.
| Tipo | Significado |
|---|---|
| **0** | Echo Reply (respuesta de ping) |
| **3** | Destino inalcanzable (código 0 red, 1 host, 3 **puerto**, 4 fragmentación necesaria y DF activado → PMTUD) |
| 5 | Redirección |
| **8** | Echo Request (ping) |
| **11** | Tiempo excedido (TTL = 0 → traceroute) |

**NAT** (Network Address Translation, RFC 3022)
- **NAT estático** (1 a 1, p. ej. publicar un servidor), **NAT dinámico** (pool de IP públicas), **PAT / NAT sobrecarga / NAPT** (muchas IP privadas comparten **una pública** diferenciándose por **puerto**; lo que hace un router doméstico). **Port forwarding / DNAT** para publicar servicios.
- Terminología Cisco: **inside local** (IP privada del host interno), **inside global** (IP pública que lo representa), outside local, outside global.
- NAT rompe el modelo extremo a extremo y complica IPsec (solución **NAT-T**, UDP 4500).

**Otros protocolos de soporte**
- **DNS**: jerárquico (raíz `.` → TLD `.es` → dominio `age.es` → host). Consultas **recursivas** (cliente → resolvedor: "dame la respuesta") e **iterativas** (resolvedor → raíz/TLD: "dime a quién preguntar"). **TTL** de caché. Seguridad: **DNSSEC** (integridad/autenticidad), **DoH** (HTTPS 443), **DoT** (853).
- **DHCP**: ver WS-4.2 (DORA, UDP 67/68).
- **NTP**: UDP **123**. **Stratum** 0 (reloj de referencia: atómico/GPS), stratum 1 (servidor conectado a él), hasta 15; 16 = no sincronizado. SNTP es la versión simplificada.
- **SNMP**: gestión de red. **Gestor (NMS)** y **agentes**; **MIB** (base de información) con **OID**. Operaciones Get, GetNext, GetBulk (v2c), Set, **Trap**, Inform (v2c). Versiones: **v1** y **v2c** con **comunidades en texto claro** (por defecto *public* lectura, *private* escritura); **v3** con **autenticación** (usuarios, HMAC-SHA) y **cifrado** (AES) — modelo USM, niveles noAuthNoPriv, authNoPriv, **authPriv**.
- **Syslog** (RFC 5424): UDP **514** (TCP 514/6514 con TLS). Severidades **0 Emergencia, 1 Alerta, 2 Crítico, 3 Error, 4 Advertencia, 5 Aviso (notice), 6 Informativo, 7 Depuración** (cuanto **menor**, **más grave**).
- **LLDP** (802.1AB, estándar) y **CDP** (propietario Cisco): descubrimiento de vecinos en capa 2.

> ⚠️ Trampa: en syslog **0 es lo más grave** (emergencia) y **7 lo menos** (debug).

> ⚠️ Trampa: **SNMPv3** es la única versión con **cifrado**. v2c sigue usando comunidades en claro.

> ⚠️ Trampa: `ping` usa **ICMP**, no TCP ni UDP: por eso "ping funciona" no significa que el puerto del servicio esté abierto.

### NET-3.3 · Protocolos de aplicación: HTTP, TLS, correo y transferencia de ficheros

**HTTP**
- Métodos: **GET** (obtener), **POST** (enviar/crear), **PUT** (reemplazar), **PATCH** (modificar parcialmente), **DELETE**, **HEAD** (solo cabeceras), **OPTIONS** (métodos permitidos, CORS preflight), TRACE, CONNECT (túnel por proxy).
- Seguros (no modifican): GET, HEAD, OPTIONS. **Idempotentes**: GET, HEAD, PUT, DELETE, OPTIONS (**POST no**).
- Códigos de estado:
| Grupo | Ejemplos |
|---|---|
| 1xx Informativo | 100 Continue, 101 Switching Protocols |
| **2xx Éxito** | **200 OK**, **201 Created**, 204 No Content |
| **3xx Redirección** | **301 Moved Permanently**, **302 Found** (temporal), **304 Not Modified**, 307/308 |
| **4xx Error del cliente** | **400 Bad Request**, **401 Unauthorized** (falta autenticarse), **403 Forbidden** (autenticado pero sin permiso), **404 Not Found**, 405 Method Not Allowed, 408 Timeout, 429 Too Many Requests |
| **5xx Error del servidor** | **500 Internal Server Error**, **502 Bad Gateway** (el proxy recibió respuesta inválida del backend), **503 Service Unavailable**, **504 Gateway Timeout** |
- Versiones: HTTP/1.1 (conexiones persistentes, cabecera **Host** obligatoria), **HTTP/2** (binario, multiplexación, compresión de cabeceras HPACK, sobre TCP), **HTTP/3** (sobre **QUIC/UDP**).
- Cabeceras de seguridad: **HSTS** (`Strict-Transport-Security`), CSP, X-Frame-Options, X-Content-Type-Options.
- Proxy **directo** (forward, protege/controla a los clientes) vs **inverso** (reverse, delante de los servidores: balanceo, TLS offload, WAF).

**TLS** (sucesor de SSL; **SSL 2.0/3.0, TLS 1.0 y 1.1 están obsoletos**)
- **TLS 1.2** y **TLS 1.3** (RFC 8446). TLS 1.3: handshake de **1-RTT** (y 0-RTT), solo cifrados **AEAD** (AES-GCM, ChaCha20-Poly1305), **secreto perfecto hacia adelante obligatorio** (ECDHE), elimina RSA estático, RC4, SHA-1, CBC.
- Certificados **X.509**, cadena de confianza (raíz → intermedia → servidor). **SNI** permite varios certificados en la misma IP. Revocación CRL/OCSP (+ **OCSP stapling**). **mTLS** = autenticación mutua.

**Correo**
- **SMTP** (envío y entre servidores, 25/587/465), **POP3** (110/995: descarga y normalmente borra del servidor), **IMAP** (143/993: sincroniza, mantiene en servidor, carpetas).
- Componentes: **MUA** (cliente), **MSA** (recepción de envíos, 587), **MTA** (transporte entre servidores), **MDA** (entrega al buzón).
- Antisuplantación: **SPF** (registro TXT con IP autorizadas a enviar), **DKIM** (firma criptográfica, clave pública en DNS TXT), **DMARC** (política: none / quarantine / reject + informes; requiere alineación de SPF o DKIM). **STARTTLS** cifra una conexión iniciada en claro.
- **MIME** permite adjuntos y caracteres no ASCII. Webmail sobre HTTPS. Servidores: Exchange, Postfix, Sendmail…

**Transferencia de ficheros**
- **FTP** (21 control / 20 datos en modo **activo**; en modo **pasivo** el servidor abre un puerto alto y el cliente conecta: mejor tras NAT/firewall). En **claro**.
- **FTPS** = FTP + TLS (990 implícito o explícito con AUTH TLS). **SFTP** = subsistema de **SSH** (puerto **22**) — distinto protocolo. **SCP** sobre SSH. **TFTP** (UDP 69, sin autenticación: arranque PXE, firmware de equipos de red).
- **SMB** (445): compartición en Windows (SMB 3.x con cifrado). **NFS** (2049): compartición en Unix/Linux.

**Acceso remoto**: **SSH** (22, cifrado; claves públicas en `~/.ssh/authorized_keys`), **Telnet** (23, en claro, **no usar**), **RDP** (3389), VNC (5900).

> ⚠️ Trampa: **401** = no autenticado; **403** = autenticado pero **prohibido**.

> ⚠️ Trampa: **SFTP ≠ FTPS**: SFTP va sobre **SSH (22)**; FTPS es FTP sobre **TLS**.

> ⚠️ Trampa: **POST no es idempotente**; PUT y DELETE sí.

- Configuración persistente: **Netplan** (Ubuntu, `/etc/netplan/*.yaml` + `netplan apply`), **NetworkManager** (RHEL/Fedora, `nmcli`), `/etc/network/interfaces` (Debian clásico), systemd-networkd.
- Nombres de interfaces modernos (*predictable names*): `enp0s3`, `ens33`, `eno1`, `wlp2s0`.

> ⚠️ Trampa: `ifconfig`, `route`, `arp` y `netstat` pertenecen a **net-tools**, **obsoleto**; sus sustitutos son `ip a`, `ip route`, `ip neigh` y `ss` (paquete **iproute2**).

### NET-4.4 · Comandos de Cisco IOS (lo básico para el supuesto)

**Modos**: usuario `Router>` → `enable` → privilegiado `Router#` → `configure terminal` → configuración global `Router(config)#` → `interface g0/0` → `Router(config-if)#`. `exit` sube un nivel; `end` / Ctrl+Z vuelve a privilegiado.

```text
enable
configure terminal
hostname R1
enable secret Clave2026             ! contraseña de modo privilegiado (cifrada; prevalece sobre "enable password")
service password-encryption         ! cifra (débil, tipo 7) las contraseñas en claro de la config
banner motd # Acceso solo autorizado #
interface GigabitEthernet0/0
 description Enlace LAN
 ip address 192.168.1.1 255.255.255.0
 no shutdown                        ! las interfaces de router vienen apagadas
 exit
ip route 0.0.0.0 0.0.0.0 203.0.113.1     ! ruta por defecto
ip route 10.20.0.0 255.255.0.0 192.168.1.254
line vty 0 4
 transport input ssh                ! solo SSH
 login local
 exit
username admin privilege 15 secret OtraClave
ip domain-name age.local
crypto key generate rsa modulus 2048
ip ssh version 2
end
copy running-config startup-config   ! guardar (o "write memory" / "wr")
```

| `show arp` | Tabla ARP |
| `show cdp neighbors [detail]` / `show lldp neighbors` | Vecinos |

| `show version` | IOS, tiempo encendido, registro de configuración (0x2102) |
| `show ip protocols` / `show ip ospf neighbor` | Protocolos de enrutamiento |
| `show logging` | Log |

**Switch: VLAN y troncales**
```text

 name CONTABILIDAD
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 10
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 switchport trunk native vlan 99

```
