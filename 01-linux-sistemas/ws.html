ll 2.0?", "o": ["Porque consume mucha memoria", "Porque no admite remoting", "Porque no tiene Script Block Logging ni AMSI y se usaba para evadir controles", "Porque es incompatible con Windows Server"], "a": 2, "e": "Los atacantes forzaban powershell -Version 2 para evitar el registro. Microsoft lo ha retirado de Windows 11 24H2 y Windows Server 2025."}, {"id": 200, "t": "PS-5.3", "q": "¿Qué es AMSI?", "o": ["Un sistema de firma de scripts", "Un módulo para gestionar AD", "Una interfaz que permite al antimalware inspeccionar el contenido de los scripts antes de ejecutarlos", "El servicio de remoting"], "a": 2, "e": "Antimalware Scan Interface, usada por Defender y otros productos."}, {"id": 201, "t": "PS-5.3", "q": "¿Qué cmdlet firma digitalmente un script?", "o": ["Sign-Script", "Set-AuthenticodeSignature", "Add-Signature", "New-ScriptSignature"], "a": 1, "e": "Get-AuthenticodeSignature verifica la firma."}, {"id": 202, "t": "PS-6.1", "q": "¿Cómo se pasa un hashtable de parámetros $params a New-ADUser (splatting)?", "o": ["New-ADUser @params", "New-ADUser %params", "New-ADUser $params", "New-ADUser -Params $params"], "a": 0, "e": "El splatting usa @ delante del nombre de la variable."}, {"id": 203, "t": "PS-6.1", "q": "¿Qué problema tiene usar el acento grave (`) para continuar líneas?", "o": ["Solo funciona en ISE", "Si hay un espacio detrás del acento, la continuación se rompe", "No funciona en PowerShell 7", "Comenta la línea siguiente"], "a": 1, "e": "Por eso se prefiere el splatting para comandos largos."}, {"id": 204, "t": "PS-6.1", "q": "¿Qué expresión de TimeSpan representa 90 días en Search-ADAccount -TimeSpan?", "o": ["90d", "90:00:00", "0:90:00", "90.00:00:00"], "a": 3, "e": "Formato días.horas:minutos:segundos; 90:00:00 serían 90 horas."}, {"id": 205, "t": "PS-6.1", "q": "¿Qué comando borra (con simulación) los ficheros de C:\\Logs con más de 30 días?", "o": ["Get-ChildItem C:\\Logs -File -Recurse | Where-Object LastWriteTime -lt (Get-Date).AddDays(-30) | Remove-Item -WhatIf", "Remove-Item C:\\Logs -OlderThan 30 -WhatIf", "Clear-Content C:\\Logs -Days 30", "Get-ChildItem C:\\Logs | Where-Object Age -gt 30 | Remove-Item"], "a": 0, "e": "Se filtra por LastWriteTime menor que la fecha de hace 30 días."}, {"id": 206, "t": "PS-6.1", "q": "En un script de altas desde CSV con separador punto y coma, ¿qué parámetro hace falta en Import-Csv?", "o": ["-Separator ';'", "-Split ';'", "-UseCulture obligatoriamente", "-Delimiter ';'"], "a": 3, "e": "-Delimiter indica el separador (o -UseCulture para el de la configuración regional)."}, {"id": 207, "t": "PS-6.1", "q": "¿Qué propiedad de Test-NetConnection indica si el puerto TCP respondió?", "o": ["PortOpen", "Connected", "PingSucceeded", "TcpTestSucceeded"], "a": 3, "e": "PingSucceeded corresponde al ICMP; TcpTestSucceeded al puerto."}, {"id": 208, "t": "PS-6.2", "q": "¿Qué tipo de herramienta es DSC (Desired State Configuration)?", "o": ["Un sistema de copias de seguridad", "Gestión de configuración declarativa", "Un gestor de paquetes", "Un antivirus"], "a": 1, "e": "Se describe el estado deseado y el motor lo aplica y vigila."}, {"id": 209, "t": "PS-6.2", "q": "¿Qué genera la compilación de una configuración DSC v1?", "o": ["Un fichero .mof por nodo", "Un .psm1", "Un .xml de GPO", "Un .msi"], "a": 0, "e": "Start-DscConfiguration aplica los .mof."}, {"id": 210, "t": "PS-6.2", "q": "¿Qué módulo es el framework de pruebas unitarias de PowerShell?", "o": ["Pester", "Plaster", "PSReadLine", "PSScriptAnalyzer"], "a": 0, "e": "PSScriptAnalyzer hace análisis estático; Pester ejecuta pruebas (Describe/It/Should)."}, {"id": 211, "t": "PS-6.2", "q": "¿Qué hace Set-StrictMode -Version Latest?", "o": ["Genera errores ante malas prácticas como usar variables no inicializadas", "Obliga a firmar los scripts", "Impide la ejecución remota", "Desactiva los alias"], "a": 0, "e": "Ayuda a detectar errores de programación."}, {"id": 212, "t": "PS-6.2", "q": "¿En qué versión funcionan los operadores de cadena de pipeline && y ||?", "o": ["Solo en cmd", "Todas las versiones", "PowerShell 7 o posterior", "Windows PowerShell 5.1"], "a": 2, "e": "En 5.1 producen error de sintaxis."}, {"id": 213, "t": "PS-6.2", "q": "¿Qué operador de PowerShell 7 devuelve el valor de la izquierda si no es nulo y, si lo es, el de la derecha?", "o": ["-or", "||", "??", "?:"], "a": 2, "e": "Operador de fusión de nulos (null-coalescing)."}, {"id": 214, "t": "PS-6.2", "q": "¿Qué cmdlet de PowerShell 7 muestra información detallada del último error?", "o": ["Show-Error", "$Error.Detail", "Get-LastError", "Get-Error"], "a": 3, "e": "Get-Error fue novedad de PowerShell 7."}, {"id": 215, "t": "PS-6.2", "q": "¿Qué atributo permite que una función soporte -WhatIf y -Confirm?", "o": ["[Parameter(Confirm)]", "[SupportsWhatIf()]", "[CmdletBinding(SupportsShouldProcess)]", "[CmdletBinding(WhatIf)]"], "a": 2, "e": "Después se usa $PSCmdlet.ShouldProcess() dentro de la función."}, {"id": 216, "t": "PS-6.3", "q": "¿Qué cmdlet equivale a ipconfig /all?", "o": ["Get-IPAddress", "Get-NetAdapter -All", "Get-NetIPConfiguration (con -Detailed para más información)", "Show-IPConfig"], "a": 2, "e": "Get-NetIPConfiguration muestra interfaces, IP, puerta de enlace y DNS."}, {"id": 217, "t": "PS-6.3", "q": "¿Qué cmdlet equivale a gpupdate /force sobre un equipo remoto?", "o": ["Set-GPUpdate -Force PC01", "gpupdate -Remote PC01", "Invoke-GPUpdate -Computer PC01 -Force", "Update-GPO -Computer PC01"], "a": 2, "e": "Invoke-GPUpdate (módulo GroupPolicy) programa la actualización en el equipo remoto."}, {"id": 218, "t": "PS-6.3", "q": "¿Qué cmdlet sustituye a arp -a?", "o": ["Get-NetRoute", "Get-NetNeighbor", "Get-ArpCache", "Get-NetArp"], "a": 1, "e": "Get-NetNeighbor muestra la caché de vecinos IPv4 (ARP) e IPv6 (NDP)."}, {"id": 219, "t": "PS-6.3", "q": "¿Qué cmdlet equivale a netstat -ano para ver puertos en escucha?", "o": ["Get-NetTCPConnection -State Listen", "Get-NetStat -Listen", "Get-NetPort", "Test-NetConnection -Listen"], "a": 0, "e": "Incluye OwningProcess (PID)."}, {"id": 220, "t": "PS-6.3", "q": "¿Existe un cmdlet nativo que sustituya a sfc /scannow?", "o": ["Sí, Test-SystemFile", "Sí, Invoke-Sfc", "Sí, Repair-WindowsImage -Scan", "No; se sigue usando sfc (y DISM para el almacén de componentes)"], "a": 3, "e": "Repair-WindowsImage es el equivalente de DISM /Cleanup-Image, no de sfc."}, {"id": 221, "t": "WS-1.1", "q": "¿Cuántas máquinas virtuales Windows Server incluye una licencia Standard que cubre todos los núcleos del host?", "o": ["4", "2", "1", "Ilimitadas"], "a": 1, "e": "Standard da derecho a 2 OSE virtuales por cada licenciamiento completo de núcleos; Datacenter, ilimitadas."}, {"id": 222, "t": "WS-1.1", "q": "¿Qué edición de Windows Server permite máquinas virtuales ilimitadas y Storage Spaces Direct?", "o": ["Datacenter", "Standard", "Essentials", "Foundation"], "a": 0, "e": "Datacenter incluye VM ilimitadas, S2D, SDN y Shielded VMs."}, {"id": 223, "t": "WS-1.1", "q": "¿Cuál es el mínimo de núcleos que hay que licenciar por servidor en Windows Server?", "o": ["2 núcleos por procesador", "16 núcleos por servidor (y 8 por procesador)", "4 núcleos por servidor", "8 núcleos por servidor"], "a": 1, "e": "El licenciamiento por núcleos exige mínimo 8 por CPU física y 16 por servidor."}, {"id": 224, "t": "WS-1.1", "q": "¿Cuál es la opción de instalación por defecto de Windows Server?", "o": ["Nano Server", "Minimal Server Interface", "Experiencia de escritorio", "Server Core"], "a": 3, "e": "El asistente propone Server Core por defecto (menos superficie de ataque)."}, {"id": 225, "t": "WS-1.1", "q": "Desde Windows Server 2016, ¿se puede convertir una instalación Server Core en Experiencia de escritorio?", "o": ["Sí, desde sconfig", "Sí, con Install-WindowsFeature Server-Gui-Shell", "Sí, reiniciando en modo seguro", "No, hay que reinstalar"], "a": 3, "e": "En 2012/2012 R2 era posible; desde 2016 la elección es definitiva."}, {"id": 226, "t": "WS-1.1", "q": "¿En qué forma existe hoy Nano Server?", "o": ["Ya no existe en ninguna forma", "Solo como imagen base de contenedor", "Como opción de instalación de máquina física", "Como edición de Windows Server Essentials"], "a": 1, "e": "Desde la versión 1709 Nano Server solo se distribuye como imagen de contenedor."}, {"id": 227, "t": "WS-1.1", "q": "¿Cuánto soporte ofrece el canal LTSC de Windows Server?", "o": ["5 años en total", "5 años de soporte estándar y 5 de soporte extendido", "3 años en total", "18 meses"], "a": 1, "e": "Long-Term Servicing Channel: 10 años en total."}, {"id": 228, "t": "WS-1.1", "q": "¿Qué novedad de Windows Server 2025 permite aplicar parches de seguridad sin reiniciar (con Azure Arc)?", "o": ["Delta Patch", "Live Update", "Cluster-Aware Updating", "Hotpatch"], "a": 3, "e": "Hotpatch, en Standard/Datacenter, requiere conexión con Azure Arc."}, {"id": 229, "t": "WS-1.1", "q": "En Windows Server 2025, ¿qué ocurre por defecto con la firma SMB en las conexiones salientes del cliente?", "o": ["Solo se exige con SMBv1", "Solo se exige con SYSVOL y NETLOGON", "Es obligatoria (requerida) en todas", "Está deshabilitada"], "a": 2, "e": "En versiones anteriores solo era obligatoria hacia SYSVOL y NETLOGON de los DC."}, {"id": 230, "t": "WS-1.1", "q": "¿Qué protocolos VPN no acepta por defecto una instalación nueva de RRAS en Windows Server 2025?", "o": ["PPTP y L2TP", "IPsec y WireGuard", "SSTP y OpenVPN", "IKEv2 y SSTP"], "a": 0, "e": "SSTP e IKEv2 siguen activos; PPTP y L2TP deben habilitarse explícitamente."}, {"id": 231, "t": "WS-1.1", "q": "¿Desde qué versión se puede actualizar in situ directamente a Windows Server 2025?", "o": ["Desde Windows Server 2008 R2", "Desde Windows Server 2012 R2 o posterior", "No admite actualización in situ", "Solo desde Windows Server 2022"], "a": 1, "e": "Permite saltos de hasta 4 versiones (2012 R2, 2016, 2019, 2022)."}, {"id": 232, "t": "WS-1.1", "q": "¿Qué elemento de seguridad viene activado por defecto en Windows Server 2025 en hardware compatible?", "o": ["Credential Guard", "BitLocker en todos los volúmenes", "AppLocker", "SMBv1"], "a": 0, "e": "Credential Guard aísla los secretos LSA mediante VBS."}, {"id": 233, "t": "WS-1.1", "q": "¿Qué dos herramientas vienen instaladas por defecto en Windows Server 2025 que antes no lo estaban?", "o": ["SMBv1 y PowerShell 2.0", "OpenSSH Server y WinGet", "Telnet Server y FTP", "Internet Explorer y WordPad"], "a": 1, "e": "Según Microsoft Learn, sshd y el gestor de paquetes WinGet se instalan por defecto."}, {"id": 234, "t": "WS-1.1", "q": "Además de la licencia del servidor, ¿qué necesita cada usuario o dispositivo que accede a Windows Server?", "o": ["Una CAL (Client Access License)", "Una licencia Datacenter", "Nada más", "Una suscripción a Azure obligatoria"], "a": 0, "e": "Las CAL de usuario o dispositivo; para Escritorio remoto, además RDS CAL."}, {"id": 235, "t": "WS-1.2", "q": "¿Qué consola abre dsa.msc?", "o": ["Sitios y servicios de Active Directory", "Administración de directivas de grupo", "Usuarios y equipos de Active Directory", "Dominios y confianzas"], "a": 2, "e": "dssite.msc = Sitios y servicios; gpmc.msc = GPO; domain.msc = Dominios y confianzas."}, {"id": 236, "t": "WS-1.2", "q": "¿Qué consola se usa para administrar las GPO del dominio?", "o": ["rsop.msc", "secpol.msc", "gpmc.msc", "gpedit.msc"], "a": 2, "e": "gpedit.msc edita la directiva local del equipo."}, {"id": 237, "t": "WS-1.2", "q": "¿Qué herramienta de texto permite configurar un Server Core (nombre, dominio, red, RDP, actualizaciones)?", "o": ["msconfig", "sconfig", "servermanagercmd", "netsh config"], "a": 1, "e": "Desde 2022 sconfig está escrito en PowerShell y se inicia automáticamente."}, {"id": 238, "t": "WS-1.2", "q": "¿Qué es Windows Admin Center?", "o": ["La nueva versión de Server Manager para escritorio", "Un servicio de Azure obligatorio", "Una herramienta de línea de comandos", "Una consola de administración web (HTTPS) para servidores, clústeres y Hyper-V"], "a": 3, "e": "Se instala como pasarela y se accede desde el navegador; también está integrado en Azure Arc."}, {"id": 239, "t": "WS-1.2", "q": "¿Qué consola abre wf.msc?", "o": ["Administrador de flujos de trabajo", "Asistente de WSUS", "Firewall de Windows Defender con seguridad avanzada", "Servicios web"], "a": 2, "e": "Permite reglas de entrada/salida, IPsec y supervisión."}, {"id": 240, "t": "WS-1.2", "q": "¿Qué abre ncpa.cpl?", "o": ["Panel de control de impresoras", "Programas y características", "Propiedades del sistema", "Conexiones de red"], "a": 3, "e": "sysdm.cpl propiedades del sistema; appwiz.cpl programas."}, {"id": 241, "t": "WS-1.2", "q": "¿Qué consola permite gestionar la papelera de reciclaje de AD y las directivas de contraseña específicas con interfaz gráfica?", "o": ["Centro de administración de Active Directory (dsac.exe)", "adsiedit.msc", "dsa.msc", "gpmc.msc"], "a": 0, "e": "ADAC se basa en PowerShell e incluye Papelera y PSO."}, {"id": 242, "t": "WS-1.2", "q": "¿Qué consola abre dssite.msc?", "o": ["DNS", "Dominios y confianzas de AD", "Sitios y servicios de Active Directory", "DFS"], "a": 2, "e": "Gestiona sitios, subredes, vínculos de sitio y replicación."}, {"id": 243, "t": "WS-1.2", "q": "¿Qué son las RSAT?", "o": ["Herramientas de administración remota del servidor que se instalan en un equipo cliente", "Un tipo de licencia", "Un rol de servidor", "Las réplicas de solo lectura de AD"], "a": 0, "e": "Remote Server Administration Tools: consolas y módulos para gestionar servidores desde un PC."}, {"id": 244, "t": "WS-1.2", "q": "¿Qué consola gestiona los certificados del equipo local?", "o": ["certmgr.msc", "certsrv.msc", "certlm.msc", "certutil.msc"], "a": 2, "e": "certmgr.msc es el almacén del usuario y certsrv.msc la consola de la entidad de certificación."}, {"id": 245, "t": "WS-1.3", "q": "¿Qué cmdlet instala un rol en Windows Server?", "o": ["Install-Role", "Install-WindowsFeature", "Add-WindowsCapability", "Enable-WindowsOptionalFeature"], "a": 1, "e": "Install-WindowsFeature (módulo ServerManager) solo existe en Windows Server."}, {"id": 246, "t": "WS-1.3", "q": "¿Qué parámetro de Install-WindowsFeature añade consolas y módulos de administración?", "o": ["-IncludeManagementTools", "-Management", "-IncludeAllSubFeature", "-WithTools"], "a": 0, "e": "Sin él se instala el rol sin herramientas."}, {"id": 247, "t": "WS-1.3", "q": "¿Qué hace Uninstall-WindowsFeature -Remove?", "o": ["Borra la configuración pero deja el rol", "Solo deshabilita el rol", "Elimina el servidor del dominio", "Desinstala y además elimina los binarios del disco (Features on Demand)"], "a": 3, "e": "Después habrá que indicar -Source para reinstalarlo."}, {"id": 248, "t": "WS-1.3", "q": "¿Cuál es el nombre del rol de controlador de dominio para Install-WindowsFeature?", "o": ["ADDS-Role", "AD-Domain-Services", "ActiveDirectory", "DomainController"], "a": 1, "e": "Después de instalar el rol hay que promover con Install-ADDSForest u otro cmdlet ADDSDeployment."}, {"id": 249, "t": "WS-1.3", "q": "¿Qué nombre tiene el rol de IIS en Install-WindowsFeature?", "o": ["Web-Server", "WebServer-Role", "IIS", "IIS-WebServer"], "a": 0, "e": "IIS-WebServer es el nombre de característica en DISM/Windows cliente."}, {"id": 250, "t": "WS-1.3", "q": "¿Cómo se habilita una característica en Windows 11 (no servidor) desde PowerShell?", "o": ["Set-WindowsFeature <nombre> -Enabled", "Add-WindowsFeature <nombre>", "Install-WindowsFeature <nombre>", "Enable-WindowsOptionalFeature -Online -FeatureName <nombre>"], "a": 3, "e": "Install-WindowsFeature solo existe en Windows Server."}, {"id": 251, "t": "WS-1.3", "q": "¿Qué es una \"característica\" (feature) frente a un \"rol\"?", "o": ["Un rol de pago", "Un rol instalado en otro servidor", "Un servicio de Azure", "Una funcionalidad de apoyo (p. ej. clúster, backup, BitLocker), no la función principal del servidor"], "a": 3, "e": "Roles = función principal (DNS, DHCP, AD DS…); características = complementos."}, {"id": 252, "t": "WS-1.3", "q": "¿Qué nombre de característica corresponde a WSUS?", "o": ["UpdateServer", "WSUS-Role", "WindowsUpdate", "UpdateServices"], "a": 3, "e": "UpdateServices incluye subcaracterísticas como UpdateServices-WidDB o UpdateServices-DB."}, {"id": 253, "t": "WS-1.3", "q": "¿Qué rol proporciona RADIUS en Windows Server?", "o": ["WDS", "ADCS", "RemoteAccess", "NPAS (Servidor de directivas de redes)"], "a": 3, "e": "Network Policy and Access Services incluye NPS."}, {"id": 254, "t": "WS-1.3", "q": "¿Qué parámetro de Install-WindowsFeature indica una ruta alternativa a los binarios (por ejemplo para .NET 3.5)?", "o": ["-Path", "-Source", "-Media", "-From"], "a": 1, "e": "Ej.: -Source D:\\sources\\sxs."}, {"id": 255, "t": "WS-1.4", "q": "¿Qué servidor DNS debe configurar un servidor que va a ser controlador de dominio?", "o": ["El DNS del router doméstico", "Su propia IP o la de otro DC con DNS del dominio", "Ninguno", "8.8.8.8"], "a": 1, "e": "Necesita resolver los registros SRV del dominio, que solo están en los DNS de AD."}, {"id": 256, "t": "WS-1.4", "q": "¿Qué cmdlet asigna una IP estática con puerta de enlace?", "o": ["New-NetIPConfiguration -IP 192.168.10.10/24", "Set-NetIPAddress -InterfaceAlias Ethernet -IPAddress 192.168.10.10 -Gateway 192.168.10.1", "Set-IPAddress Ethernet 192.168.10.10 255.255.255.0", "New-NetIPAddress -InterfaceAlias Ethernet -IPAddress 192.168.10.10 -PrefixLength 24 -DefaultGateway 192.168.10.1"], "a": 3, "e": "New-NetIPAddress con -PrefixLength (no máscara) y -DefaultGateway."}, {"id": 257, "t": "WS-1.4", "q": "¿Qué cmdlet configura los servidores DNS de una interfaz?", "o": ["Set-NetDns", "Set-DnsServerAddress", "Add-DnsServerForwarder", "Set-DnsClientServerAddress"], "a": 3, "e": "Add-DnsServerForwarder configura reenviadores del rol DNS servidor, no el cliente."}, {"id": 258, "t": "WS-1.4", "q": "¿Qué puerto usa el servicio de activación KMS?", "o": ["1433 TCP", "8530 TCP", "3389 TCP", "1688 TCP"], "a": 3, "e": "Key Management Service escucha en 1688."}, {"id": 259, "t": "WS-1.4", "q": "¿Qué comando muestra información detallada de la licencia de Windows?", "o": ["winver /lic", "slmgr /ato", "slmgr /ipk", "slmgr /dlv"], "a": 3, "e": "/ipk instala clave, /ato activa, /dli información básica, /dlv detallada, /xpr fecha de expiración."}, {"id": 260, "t": "WS-1.4", "q": "¿Qué cmdlet cambia el nombre del equipo y reinicia?", "o": ["Rename-Computer -NewName SRV01 -Restart", "Rename-Item $env:COMPUTERNAME SRV01", "netdom rename SRV01", "Set-ComputerName SRV01 -Reboot"], "a": 0, "e": "Rename-Computer; en dominio puede requerir -DomainCredential."}, {"id": 261, "t": "WS-1.4", "q": "¿Qué grupo de reglas de firewall habilita el Escritorio remoto independientemente del idioma?", "o": ["Enable-NetFirewallRule -Group \"@FirewallAPI.dll,-28752\"", "Enable-NetFirewallRule -Port 3389", "Set-NetFirewallProfile -RDP Enabled", "Enable-NetFirewallRule -DisplayGroup \"Remote Desktop\" en cualquier idioma"], "a": 0, "e": "DisplayGroup está traducido (\"Escritorio remoto\" en español); el recurso indirecto no depende del idioma."}, {"id": 262, "t": "WS-1.4", "q": "¿Cuál es el orden habitual de la configuración inicial de un servidor?", "o": ["Dominio, nombre, roles, IP", "Nombre, IP fija y DNS, hora, actualizaciones, unión al dominio, roles", "Actualizaciones, roles, nombre, IP, dominio", "Roles, nombre, dominio, IP"], "a": 1, "e": "Cambiar el nombre después de unir al dominio o instalar roles complica la configuración (y en un DC no se debe)."}, {"id": 263, "t": "WS-1.4", "q": "¿Cuál es el umbral mínimo para que KMS active equipos con Windows Server?", "o": ["10 servidores", "5 servidores (25 si son clientes Windows)", "1 servidor", "50 equipos"], "a": 1, "e": "KMS necesita un recuento mínimo de activación."}, {"id": 264, "t": "WS-2.1", "q": "Un usuario tiene permiso NTFS Modificar y permiso de recurso compartido Leer. Accediendo por la red, ¿qué permiso efectivo tiene?", "o": ["Modificar", "Control total", "Leer", "Ninguno"], "a": 2, "e": "Por red se aplica el más restrictivo entre NTFS y compartido."}, {"id": 265, "t": "WS-2.1", "q": "Ese mismo usuario inicia sesión localmente en el servidor. ¿Qué permiso efectivo tiene sobre la carpeta?", "o": ["Leer", "Ninguno", "Modificar", "Control total"], "a": 2, "e": "En local solo se aplican los permisos NTFS."}, {"id": 266, "t": "WS-2.1", "q": "¿Qué permiso NTFS estándar permite crear y modificar ficheros pero NO eliminarlos?", "o": ["Escritura", "Modificar", "Control total", "Lectura y ejecución"], "a": 0, "e": "Modificar incluye eliminar; Escritura no."}, {"id": 267, "t": "WS-2.1", "q": "¿Qué permiso NTFS permite cambiar los permisos de una carpeta?", "o": ["Modificar", "Control total", "Escritura", "Lectura y ejecución"], "a": 1, "e": "Solo Control total incluye Cambiar permisos y Tomar posesión."}, {"id": 268, "t": "WS-2.1", "q": "Un usuario tiene Permitir explícito Leer en una carpeta y Denegar Leer heredado de la carpeta padre. ¿Qué ocurre?", "o": ["Depende del orden de los grupos", "No puede leer: denegar siempre gana", "Puede leer: el permitir explícito prevalece sobre el denegar heredado", "Da un error de ACL"], "a": 2, "e": "Orden: denegar explícito > permitir explícito > denegar heredado > permitir heredado."}, {"id": 269, "t": "WS-2.1", "q": "Mueves una carpeta dentro del mismo volumen NTFS. ¿Qué pasa con sus permisos explícitos?", "o": ["Pasan a Todos: Control total", "Hereda los del destino", "Se pierden todos", "Se conservan"], "a": 3, "e": "Mover en el mismo volumen solo cambia la referencia; copiar o mover a otro volumen hereda del destino."}, {"id": 270, "t": "WS-2.1", "q": "Copias un fichero a otra carpeta del mismo volumen. ¿Qué permisos tendrá?", "o": ["Ninguno", "Los heredados de la carpeta destino", "Solo los del propietario", "Los mismos que tenía"], "a": 1, "e": "Copiar crea un fichero nuevo que hereda del destino."}, {"id": 271, "t": "WS-2.1", "q": "¿Qué significan (OI)(CI) en icacls?", "o": ["Herencia a objetos (ficheros) y contenedores (subcarpetas)", "Objetos ocultos y contenedores ocultos", "Owner Inherit y Change Inherit", "Solo lectura y solo carpeta"], "a": 0, "e": "(OI) object inherit, (CI) container inherit, (IO) inherit only, (NP) no propagar."}, {"id": 272, "t": "WS-2.1", "q": "¿Qué comando concede Modificar heredable al grupo GG_Conta en D:\\Datos?", "o": ["cacls D:\\Datos /grant GG_Conta=M /inherit", "icacls D:\\Datos /permit \"GG_Conta:M\"", "icacls D:\\Datos /add GG_Conta Modify", "icacls D:\\Datos /grant \"AGE\\GG_Conta:(OI)(CI)M\""], "a": 3, "e": "Sintaxis icacls ruta /grant usuario:(herencia)permiso."}, {"id": 273, "t": "WS-2.1", "q": "¿Qué hace icacls D:\\Datos /inheritance:d?", "o": ["Borra todos los permisos", "Deshabilita la herencia eliminando los heredados", "Habilita la herencia", "Deshabilita la herencia copiando los permisos heredados como explícitos"], "a": 3, "e": ":d desactivar y copiar; :r desactivar y quitar heredados; :e activar."}, {"id": 274, "t": "WS-2.1", "q": "¿Qué recurso compartido administrativo apunta a C:\\Windows?", "o": ["SYSVOL", "ADMIN$", "IPC$", "C$"], "a": 1, "e": "IPC$ se usa para comunicación entre procesos (canalizaciones con nombre)."}, {"id": 275, "t": "WS-2.1", "q": "¿Qué recursos compartidos tiene siempre un controlador de dominio además de los administrativos?", "o": ["NETLOGON y SYSVOL", "USERS y PROFILES", "DFS y DFSR", "PRINT$ y FAX$"], "a": 0, "e": "SYSVOL contiene las GPO y scripts; NETLOGON los scripts de inicio de sesión."}, {"id": 276, "t": "WS-2.1", "q": "¿Qué es la enumeración basada en el acceso (ABE)?", "o": ["Un método de replicación", "Un tipo de cifrado SMB", "La auditoría de acceso a ficheros", "Que los usuarios solo vean en un recurso compartido las carpetas a las que tienen permiso"], "a": 3, "e": "Se activa con -FolderEnumerationMode AccessBased en New-SmbShare/Set-SmbShare."}, {"id": 277, "t": "WS-2.1", "q": "¿Qué modelo de asignación de permisos recomienda Microsoft en un dominio?", "o": ["Asignar los permisos directamente a cada usuario", "Usar solo grupos universales", "AGDLP: cuentas en grupos Globales, estos en grupos de Dominio Local, y permisos al Dominio Local", "Dar permisos al grupo Todos"], "a": 2, "e": "En multidominio se añaden grupos universales (AGUDLP)."}, {"id": 278, "t": "WS-2.1", "q": "¿Qué cmdlet crea un recurso compartido SMB?", "o": ["Add-SmbShare", "net share -create", "New-SmbShare", "New-Share"], "a": 2, "e": "New-SmbShare -Name -Path -FullAccess -ChangeAccess -ReadAccess."}, {"id": 279, "t": "WS-2.1", "q": "¿Qué cmdlet muestra los ficheros abiertos por usuarios en un servidor de archivos?", "o": ["Get-SmbOpenFile", "net use /files", "Get-OpenFile", "Get-SmbSession -Files"], "a": 0, "e": "Se pueden cerrar con Close-SmbOpenFile. En cmd: net file / openfiles."}, {"id": 280, "t": "WS-2.1", "q": "¿Cuáles son los permisos de recurso compartido disponibles?", "o": ["Propietario, Editor, Lector", "Control total, Modificar, Lectura y ejecución, Lectura, Escritura", "Control total, Cambiar y Leer", "Leer y Escribir"], "a": 2, "e": "Los permisos NTFS son los más granulares."}, {"id": 281, "t": "WS-2.2", "q": "¿Cuál es el tamaño máximo de disco que admite el estilo de partición MBR?", "o": ["256 TB", "16 TB", "2 TB", "4 TB"], "a": 2, "e": "Para discos mayores se necesita GPT."}, {"id": 282, "t": "WS-2.2", "q": "¿Cuántas particiones admite GPT en Windows?", "o": ["64", "256", "4", "128"], "a": 3, "e": "MBR admite 4 primarias (o 3 + extendida)."}, {"id": 283, "t": "WS-2.2", "q": "¿Qué sistema de archivos NO puede usarse como volumen de arranque del sistema?", "o": ["ReFS", "NTFS", "Ninguno de los anteriores", "FAT32 (partición EFI)"], "a": 0, "e": "ReFS no admite arrancar Windows; se usa para datos, Hyper-V, backups."}, {"id": 284, "t": "WS-2.2", "q": "¿Qué característica NO tiene ReFS respecto a NTFS?", "o": ["Clonación de bloques", "Sumas de comprobación de integridad", "Soporte para volúmenes grandes", "Cifrado EFS y cuotas de disco NTFS"], "a": 3, "e": "ReFS no soporta EFS, compresión NTFS clásica ni cuotas de disco NTFS."}, {"id": 285, "t": "WS-2.2", "q": "¿Cuál es el tamaño máximo de un fichero en FAT32?", "o": ["16 TB", "32 GB", "2 GB", "4 GB (menos 1 byte)"], "a": 3, "e": "32 GB es el límite que impone Windows al formatear volúmenes FAT32, no el de fichero."}, {"id": 286, "t": "WS-2.2", "q": "¿Cuál es el tamaño máximo de un disco virtual VHDX?", "o": ["256 TB", "64 TB", "16 TB", "2 TB"], "a": 1, "e": "VHD está limitado a 2 TB."}, {"id": 287, "t": "WS-2.2", "q": "En Storage Spaces, ¿cuántos discos mínimos necesita un espejo triple (three-way mirror)?", "o": ["3", "7", "5", "2"], "a": 2, "e": "Espejo doble 2, espejo triple 5, paridad 3, paridad doble 7."}, {"id": 288, "t": "WS-2.2", "q": "¿Qué resiliencia de Storage Spaces no ofrece tolerancia a fallos?", "o": ["Espejo", "Simple", "Paridad doble", "Paridad"], "a": 1, "e": "Simple equivale a RAID 0 (bandas)."}, {"id": 289, "t": "WS-2.2", "q": "¿Qué RAID ofrece doble paridad y tolera el fallo de dos discos con un mínimo de 4?", "o": ["RAID 10", "RAID 6", "RAID 5", "RAID 1"], "a": 1, "e": "RAID 5 tolera 1 (mín. 3); RAID 10 puede tolerar 1 por espejo (mín. 4)."}, {"id": 290, "t": "WS-2.2", "q": "¿Qué es Storage Spaces Direct (S2D)?", "o": ["La conexión directa de un disco a una VM", "Almacenamiento definido por software que agrupa los discos locales de los nodos de un clúster (Datacenter)", "Un servicio de backup en la nube", "Un tipo de RAID por hardware"], "a": 1, "e": "Base de las soluciones hiperconvergentes."}, {"id": 291, "t": "WS-2.2", "q": "¿Qué tipo de aprovisionamiento hace que un disco virtual solo ocupe espacio a medida que se escribe?", "o": ["Grueso (thick)", "Fijo (fixed)", "Fino (thin)", "Dinámico obligatorio"], "a": 2, "e": "Thin crece bajo demanda; fixed reserva todo al crearse."}, {"id": 292, "t": "WS-2.2", "q": "¿Qué tecnología sustituye a los discos dinámicos de Windows para RAID por software?", "o": ["Storage Spaces (Espacios de almacenamiento)", "iSCSI", "VSS", "DFS"], "a": 0, "e": "Los discos dinámicos están obsoletos."}, {"id": 293, "t": "WS-2.3", "q": "¿Qué diferencia hay entre DFS Namespaces y DFS Replication?", "o": ["Son el mismo servicio", "DFSN replica y DFSR da nombres", "DFSN da una ruta lógica única a carpetas de varios servidores; DFSR replica el contenido entre ellos", "DFSR solo funciona con FAT32"], "a": 2, "e": "Suelen usarse juntos."}, {"id": 294, "t": "WS-2.3", "q": "¿Qué tecnología replica SYSVOL en dominios con nivel funcional 2008 o superior?", "o": ["Robocopy", "FRS", "Storage Replica", "DFSR"], "a": 3, "e": "FRS está obsoleto y no se admite en DC modernos."}, {"id": 295, "t": "WS-2.3", "q": "¿Qué tipo de cuota de FSRM impide superar el límite?", "o": ["Flexible (soft)", "Rígida (hard)", "Informativa", "NTFS"], "a": 1, "e": "La flexible solo avisa y registra."}, {"id": 296, "t": "WS-2.3", "q": "¿Qué función de FSRM impide guardar ficheros .mp3 en una carpeta?", "o": ["Cuota rígida", "Filtrado de archivos (file screening)", "Clasificación de archivos", "Desduplicación"], "a": 1, "e": "El filtrado puede ser activo (bloquea) o pasivo (solo avisa)."}, {"id": 297, "t": "WS-2.3", "q": "¿A qué nivel se aplican las cuotas de FSRM?", "o": ["Por unidad organizativa", "Por grupo de AD", "Por carpeta", "Por usuario y volumen"], "a": 2, "e": "Las cuotas NTFS clásicas son por usuario (propietario) y volumen."}, {"id": 298, "t": "WS-2.3", "q": "¿Qué comando muestra el estado de los escritores VSS (útil cuando falla una copia)?", "o": ["vssadmin list writers", "diskshadow status", "wbadmin get writers", "vssadmin list shadows"], "a": 0, "e": "list shadows muestra las instantáneas existentes."}, {"id": 299, "t": "WS-2.3", "q": "¿Por qué la replicación DFS no sustituye a una copia de seguridad?", "o": ["Porque solo replica de noche", "Porque los borrados y daños también se replican", "Porque es muy lenta", "Porque no replica ficheros grandes"], "a": 1, "e": "Replicar no es versionar: hace falta backup."}, {"id": 300, "t": "WS-2.3", "q": "¿Qué rol/característica elimina bloques duplicados en un volumen de datos?", "o": ["Compresión NTFS", "Storage Replica", "Desduplicación de datos (FS-Data-Deduplication)", "VSS"], "a": 2, "e": "Ahorra mucho espacio en servidores de archivos, VDI y backups."}, {"id": 301, "t": "WS-2.3", "q": "¿Qué tipo de espacio de nombres DFS ofrece alta disponibilidad y se almacena en AD?", "o": ["Independiente (\\\\servidor\\raíz)", "Replicado", "Basado en dominio (\\\\dominio\\raíz)", "Local"], "a": 2, "e": "El independiente depende de un único servidor (o clúster)."}, {"id": 302, "t": "WS-2.4", "q": "¿Qué comando realiza una copia del estado del sistema con Windows Server Backup?", "o": ["ntbackup systemstate E:", "wbadmin start systemstatebackup -backupTarget:E:", "wbadmin backup state E:", "wbadmin start backup -systemstate"], "a": 1, "e": "ntbackup desapareció en 2008."}, {"id": 303, "t": "WS-2.4", "q": "¿Qué incluye el estado del sistema (System State) de un controlador de dominio?", "o": ["Solo los perfiles de usuario", "Solo el registro", "La base de datos de AD (NTDS.dit), SYSVOL, el registro y los archivos de arranque, entre otros", "Todos los volúmenes de datos"], "a": 2, "e": "También incluye COM+ y, si los tiene, ADCS, clúster o IIS."}, {"id": 304, "t": "WS-2.4", "q": "Con copias completas el domingo e incrementales de lunes a viernes, el jueves falla el disco. ¿Qué hay que restaurar?", "o": ["La completa y solo la incremental del miércoles", "Solo la incremental del miércoles", "Solo la completa", "La completa del domingo y las incrementales de lunes, martes y miércoles"], "a": 3, "e": "Cada incremental contiene los cambios desde la copia anterior: hacen falta todas."}, {"id": 305, "t": "WS-2.4", "q": "Con completa el domingo y diferenciales diarias, el jueves falla el disco. ¿Qué se restaura?", "o": ["Solo la diferencial del miércoles", "La completa y todas las diferenciales", "La completa del domingo y la diferencial del miércoles", "La completa y la diferencial del lunes"], "a": 2, "e": "La diferencial acumula todos los cambios desde la última completa."}, {"id": 306, "t": "WS-2.4", "q": "¿Qué tipo de copia NO borra el bit de archivo?", "o": ["Diferencial", "Incremental", "Completa", "Todas lo borran"], "a": 0, "e": "Por eso cada diferencial crece hasta la siguiente completa."}, {"id": 307, "t": "WS-2.4", "q": "¿Qué expresa el RPO?", "o": ["El tiempo máximo para recuperar el servicio", "El porcentaje de disponibilidad", "La cantidad máxima de datos (en tiempo) que se puede perder", "El número de copias necesarias"], "a": 2, "e": "RTO es el tiempo para restaurar el servicio."}, {"id": 308, "t": "WS-2.4", "q": "¿Qué establece la regla 3-2-1 de copias de seguridad?", "o": ["3 copias diarias, 2 semanales, 1 mensual", "3 días de retención, 2 semanas, 1 año", "3 copias, en 2 soportes distintos, 1 fuera de las instalaciones", "3 servidores, 2 discos, 1 cinta"], "a": 2, "e": "La versión moderna 3-2-1-1-0 añade una copia inmutable/offline y 0 errores."}, {"id": 309, "t": "WS-2.4", "q": "¿Qué tipo de restauración de AD hace que los objetos restaurados prevalezcan sobre los del resto de DC?", "o": ["Incremental", "No autoritativa", "Autoritativa", "Diferencial"], "a": 2, "e": "Se marca con ntdsutil (authoritative restore) desde DSRM."}, {"id": 310, "t": "WS-2.4", "q": "¿En qué modo hay que arrancar un DC para restaurar el estado del sistema?", "o": ["Modo de depuración", "DSRM (Modo de restauración de servicios de directorio)", "Modo de recuperación de WinRE sin más", "Modo seguro con funciones de red"], "a": 1, "e": "Se entra con la contraseña DSRM (administrador local del DC)."}, {"id": 311, "t": "WS-2.4", "q": "¿Qué parámetro de wbadmin incluye todos los volúmenes críticos para una recuperación completa (bare metal)?", "o": ["-include:*", "-full", "-systemState", "-allCritical"], "a": 3, "e": "Incluye los volúmenes necesarios para restaurar el sistema operativo."}, {"id": 312, "t": "WS-3.1", "q": "¿Cuál es el límite de seguridad en Active Directory?", "o": ["El dominio", "El bosque", "La unidad organizativa", "El sitio"], "a": 1, "e": "El dominio es límite de replicación y administración; el bosque, de seguridad."}, {"id": 313, "t": "WS-3.1", "q": "¿Qué protocolo usa AD DS para la autenticación por defecto?", "o": ["Kerberos", "LDAP", "RADIUS", "NTLM"], "a": 0, "e": "NTLM se mantiene por compatibilidad; LDAP es el protocolo de acceso al directorio."}, {"id": 314, "t": "WS-3.1", "q": "¿Qué servicio es imprescindible para que los clientes localicen los controladores de dominio?", "o": ["DNS (registros SRV)", "NTP", "WINS", "DHCP"], "a": 0, "e": "Los clientes buscan _ldap._tcp.dc._msdcs.dominio."}, {"id": 315, "t": "WS-3.1", "q": "¿Se puede vincular una GPO al contenedor CN=Users?", "o": ["Sí, como a cualquier OU", "Solo si se activa el modo avanzado", "Solo desde PowerShell", "No, porque es un contenedor y no una unidad organizativa"], "a": 3, "e": "Users, Computers y Builtin son contenedores; solo sitios, dominios y OU admiten vínculos de GPO."}, {"id": 316, "t": "WS-3.1", "q": "¿Qué puertos usa el catálogo global?", "o": ["445 y 139", "389 y 636", "88 y 464", "3268 (LDAP) y 3269 (LDAPS)"], "a": 3, "e": "389/636 son LDAP/LDAPS normales."}, {"id": 317, "t": "WS-3.1", "q": "¿Qué diferencia de reloj tolera Kerberos por defecto?", "o": ["5 minutos", "30 segundos", "15 minutos", "1 minuto"], "a": 0, "e": "Si el desfase supera el máximo, la autenticación falla."}, {"id": 318, "t": "WS-3.1", "q": "¿Qué DC es la fuente de hora de todo el bosque?", "o": ["El DC con más antigüedad", "El maestro de esquema", "Cualquier catálogo global", "El emulador de PDC del dominio raíz del bosque"], "a": 3, "e": "Debe sincronizarse con una fuente externa fiable (en España, por ejemplo, el ROA)."}, {"id": 319, "t": "WS-3.1", "q": "¿Qué contiene el fichero NTDS.dit?", "o": ["Los registros DNS de ficheros", "La base de datos de Active Directory", "Los logs de seguridad", "Las GPO"], "a": 1, "e": "Se encuentra por defecto en C:\\Windows\\NTDS."}, {"id": 320, "t": "WS-3.1", "q": "¿Qué es un RODC?", "o": ["Un DC con todos los roles FSMO", "Un controlador de dominio de solo lectura, pensado para sucursales sin seguridad física", "Un servidor DNS secundario", "Un DC para Linux"], "a": 1, "e": "No almacena contraseñas salvo las permitidas por su Password Replication Policy."}, {"id": 321, "t": "WS-3.1", "q": "¿Cuál es el intervalo de replicación intersitio por defecto de un vínculo de sitio?", "o": ["60 minutos", "15 minutos", "24 horas", "180 minutos"], "a": 3, "e": "Se puede reducir hasta 15 minutos."}, {"id": 322, "t": "WS-3.1", "q": "¿Cuántos caracteres admite como máximo el sAMAccountName de un usuario?", "o": ["64", "15", "20", "256"], "a": 2, "e": "Nombre de inicio de sesión anterior a Windows 2000. Los nombres NetBIOS de equipo admiten 15."}, {"id": 323, "t": "WS-3.1", "q": "¿Qué puerto usan los Servicios web de AD (ADWS), necesarios para el módulo PowerShell de AD?", "o": ["9389", "8080", "5985", "389"], "a": 0, "e": "Los cmdlets de ActiveDirectory hablan con ADWS en TCP 9389."}, {"id": 324, "t": "WS-3.1", "q": "¿Qué particiones de directorio son comunes a todo el bosque?", "o": ["Esquema y Configuración", "Dominio y Configuración", "Dominio y Aplicación", "Solo Esquema"], "a": 0, "e": "La partición de dominio es propia de cada dominio."}, {"id": 325, "t": "WS-3.1", "q": "¿Qué es el DN de un objeto?", "o": ["Su nombre distintivo completo, como CN=Ana,OU=TIC,DC=age,DC=local", "Su dirección de correo", "Su nombre de inicio de sesión", "Su identificador numérico"], "a": 0, "e": "Distinguished Name: ruta LDAP completa del objeto."}, {"id": 326, "t": "WS-3.1", "q": "¿Qué comando muestra los tickets Kerberos en caché del usuario?", "o": ["kerbtray /show", "nltest /kerberos", "klist", "whoami /tickets"], "a": 2, "e": "klist purge los borra."}, {"id": 327, "t": "WS-3.1", "q": "Un equipo tiene el reloj 10 minutos adelantado respecto al DC. ¿Qué problema tendrá?", "o": ["Ninguno", "No obtendrá IP por DHCP", "No resolverá nombres DNS", "Fallará la autenticación Kerberos"], "a": 3, "e": "La tolerancia de Kerberos es de 5 minutos por defecto."}, {"id": 328, "t": "WS-3.2", "q": "¿Cuántos roles FSMO hay en un bosque con un solo dominio?", "o": ["5", "3", "7", "2"], "a": 0, "e": "2 de bosque + 3 de dominio."}, {"id": 329, "t": "WS-3.2", "q": "¿Cuántos roles FSMO hay en un bosque con 3 dominios?", "o": ["11", "5", "9", "15"], "a": 0, "e": "2 de bosque + 3 por dominio × 3 = 11."}, {"id": 330, "t": "WS-3.2", "q": "¿Qué roles FSMO son únicos a nivel de bosque?", "o": ["Emulador de PDC y maestro de esquema", "Maestro de infraestructura y maestro RID", "Maestro de esquema y maestro de nomenclatura de dominios", "Emulador de PDC y maestro RID"], "a": 2, "e": "Los otros tres existen en cada dominio."}, {"id": 331, "t": "WS-3.2", "q": "¿Qué rol FSMO reparte bloques de identificadores relativos a los DC?", "o": ["Maestro de infraestructura", "Emulador de PDC", "Maestro RID", "Maestro de nomenclatura de dominios"], "a": 2, "e": "Cada DC recibe bloques de 500 RID para crear SID."}, {"id": 332, "t": "WS-3.2", "q": "¿Qué rol FSMO procesa los bloqueos de cuenta y los cambios de contraseña de forma prioritaria?", "o": ["Maestro de esquema", "Maestro RID", "Emulador de PDC", "Maestro de infraestructura"], "a": 2, "e": "También es la fuente de hora del dominio y el DC por defecto para editar GPO."}, {"id": 333, "t": "WS-3.2", "q": "Para instalar Exchange hay que extender el esquema. ¿Qué rol debe estar disponible?", "o": ["Maestro de esquema", "Maestro de nomenclatura de dominios", "Emulador de PDC", "Maestro de infraestructura"], "a": 0, "e": "Solo el maestro de esquema puede modificarlo."}, {"id": 334, "t": "WS-3.2", "q": "¿Qué comando muestra los cinco titulares FSMO?", "o": ["nltest /fsmo", "netdom query fsmo", "dcdiag /fsmo", "repadmin /fsmo"], "a": 1, "e": "También con Get-ADForest y Get-ADDomain."}, {"id": 335, "t": "WS-3.2", "q": "El DC que tenía el rol de maestro RID ha muerto y no se puede recuperar. ¿Qué se hace?", "o": ["Apropiarse (seize) del rol en otro DC y no volver a conectar el DC antiguo", "Reinstalar el bosque", "Esperar a que se reasigne solo", "Transferir el rol normalmente"], "a": 0, "e": "Move-ADDirectoryServerOperationMasterRole ... -Force o ntdsutil seize."}, {"id": 336, "t": "WS-3.2", "q": "¿Qué parámetro de Move-ADDirectoryServerOperationMasterRole realiza una apropiación (seize)?", "o": ["-Seize", "-Confirm:$false", "-Override", "-Force"], "a": 3, "e": "Sin -Force intenta una transferencia ordenada."}, {"id": 337, "t": "WS-3.2", "q": "¿Existe un nivel funcional de dominio \"Windows Server 2022\"?", "o": ["Sí, pero solo para bosques", "Sí, con valor 8", "No; tras Windows Server 2016 el siguiente nivel es Windows Server 2025", "Sí, es el nivel actual por defecto"], "a": 2, "e": "Los DC 2019 y 2022 funcionan en nivel 2016."}, {"id": 338, "t": "WS-3.2", "q": "¿Qué valor numérico tiene el nivel funcional Windows Server 2025?", "o": ["10", "9", "7", "8"], "a": 0, "e": "7 corresponde a Windows Server 2016 (WinThreshold)."}, {"id": 339, "t": "WS-3.2", "q": "¿Qué nombre usa Install-ADDSForest para el nivel funcional de Windows Server 2016?", "o": ["Win2016", "WinThreshold", "Windows2016", "Threshold2016"], "a": 1, "e": "Valores: Win2008, Win2008R2, Win2012, Win2012R2, WinThreshold (7)."}, {"id": 340, "t": "WS-3.2", "q": "¿Qué requisito tiene el nuevo formato de base de datos de AD con páginas de 32 KB?", "o": ["Basta con un DC 2025", "Nivel funcional Windows Server 2025 y que todos los DC del bosque lo soporten", "Requiere ReFS", "Solo requiere nivel 2016"], "a": 1, "e": "El cambio es a nivel de bosque e irreversible."}, {"id": 341, "t": "WS-3.2", "q": "¿Por qué el maestro de infraestructura no debería estar en un catálogo global en un entorno multidominio (salvo que todos los DC sean GC)?", "o": ["Porque el GC ya tiene referencias de todos los objetos y el maestro de infraestructura no detectaría referencias obsoletas", "Porque el GC es de solo lectura", "Porque está prohibido por licencia", "Porque consume mucha CPU"], "a": 0, "e": "Si todos los DC son GC (o hay un único dominio), da igual."}, {"id": 342, "t": "WS-3.3", "q": "¿Qué cmdlet crea un nuevo bosque de Active Directory?", "o": ["Install-ADDSDomain", "Install-ADDSDomainController", "Install-ADDSForest", "New-ADForest"], "a": 2, "e": "Install-ADDSDomainController añade un DC a un dominio existente; Install-ADDSDomain crea un dominio nuevo en un bosque existente."}, {"id": 343, "t": "WS-3.3", "q": "¿Qué parámetro de Install-ADDSDomainController crea un RODC?", "o": ["-ReadOnlyReplica", "-Replica Read", "-RODC", "-ReadOnly"], "a": 0, "e": "Se suele acompañar de -SiteName."}, {"id": 344, "t": "WS-3.3", "q": "¿Cuál es la ubicación predeterminada de SYSVOL?", "o": ["C:\\SYSVOL", "%PROGRAMDATA%\\SYSVOL", "%SYSTEMROOT%\\SYSVOL", "%SYSTEMROOT%\\NTDS"], "a": 2, "e": "NTDS.dit y sus logs van en %SYSTEMROOT%\\NTDS."}, {"id": 345, "t": "WS-3.3", "q": "¿Para qué sirve la contraseña -SafeModeAdministratorPassword?", "o": ["Para el administrador local usado en el modo DSRM del controlador de dominio", "Para el administrador del dominio", "Para la cuenta krbtgt", "Para el modo seguro de los clientes"], "a": 0, "e": "Se cambia con ntdsutil \"set dsrm password\"."}, {"id": 346, "t": "WS-3.3", "q": "¿Qué roles FSMO tiene el primer DC de un bosque nuevo?", "o": ["Los cinco", "Solo emulador de PDC", "Solo los de bosque", "Ninguno hasta que se asignen"], "a": 0, "e": "Además es catálogo global."}, {"id": 347, "t": "WS-3.3", "q": "¿Qué estado tiene dcpromo en Windows Server moderno?", "o": ["Es el método recomendado", "Obsoleto: la promoción se hace desde Server Manager o con los cmdlets ADDSDeployment", "Fue sustituido por sconfig", "Se usa solo en Server Core"], "a": 1, "e": "Desde 2012 dcpromo solo funciona con un fichero de respuestas."}, {"id": 348, "t": "WS-3.3", "q": "¿Qué técnica permite promover un DC en una sucursal sin replicar toda la base de datos por la WAN?", "o": ["DFSR", "RODC Cloning", "Storage Replica", "IFM (Install From Media)"], "a": 3, "e": "Se crea un soporte con ntdsutil ifm en otro DC y se usa en la promoción."}, {"id": 349, "t": "WS-3.3", "q": "¿Qué cmdlet degrada (quita el rol de DC a) un controlador de dominio?", "o": ["Uninstall-ADDSDomainController", "Uninstall-WindowsFeature AD-Domain-Services sin más", "dcpromo /remove", "Remove-ADDomainController"], "a": 0, "e": "Hay que degradar antes de desinstalar el rol."}, {"id": 350, "t": "WS-3.3", "q": "¿Qué cmdlet crea un dominio hijo en un bosque existente?", "o": ["New-ADDomain madrid", "Install-ADDSForest -Child madrid.age.local", "Install-ADDSDomain -NewDomainName madrid -ParentDomainName age.local -DomainType ChildDomain", "Install-ADDSDomainController -NewDomain madrid"], "a": 2, "e": "-DomainType ChildDomain o TreeDomain."}, {"id": 351, "t": "WS-3.3", "q": "¿Qué cmdlet comprueba los requisitos previos antes de crear un bosque?", "o": ["dcdiag /prereq", "Test-ADDSForestInstallation", "Get-ADDSForestPrereq", "Test-ADForest"], "a": 1, "e": "Existen también Test-ADDSDomainControllerInstallation y similares."}, {"id": 352, "t": "WS-3.4", "q": "¿Qué parámetro de Get-ADUser hace falta para ver propiedades como Department o LastLogonDate?", "o": ["-All", "-Detailed", "-Expand", "-Properties"], "a": 3, "e": "Por defecto solo devuelve un conjunto reducido de propiedades."}, {"id": 353, "t": "WS-3.4", "q": "¿Qué cmdlet desbloquea una cuenta de usuario de AD?", "o": ["Set-ADUser -Unlock", "Unlock-ADAccount", "Reset-ADAccount", "Enable-ADAccount"], "a": 1, "e": "Enable-ADAccount habilita una cuenta deshabilitada, no bloqueada."}, {"id": 354, "t": "WS-3.4", "q": "¿Qué cmdlet lista todas las cuentas bloqueadas del dominio?", "o": ["Search-ADAccount -LockedOut", "Get-ADUser -LockedOut", "Get-ADUser -Filter \"Locked -eq True\"", "Find-ADLocked"], "a": 0, "e": "Search-ADAccount admite -LockedOut, -AccountDisabled, -AccountInactive, -PasswordExpired…"}, {"id": 355, "t": "WS-3.4", "q": "¿Qué comando restablece la contraseña de alopez?", "o": ["Reset-ADPassword alopez \"Nuev@2026\"", "net user alopez Nuev@2026", "Set-ADUser alopez -Password \"Nuev@2026\"", "Set-ADAccountPassword alopez -Reset -NewPassword (ConvertTo-SecureString \"Nuev@2026\" -AsPlainText -Force)"], "a": 3, "e": "-Reset para restablecer sin conocer la anterior; la contraseña como SecureString."}, {"id": 356, "t": "WS-3.4", "q": "¿Qué cmdlet obtiene todos los grupos a los que pertenece un usuario?", "o": ["Get-ADMemberOf", "Get-ADPrincipalGroupMembership", "Get-ADGroupMember", "Get-ADUser -Groups"], "a": 1, "e": "Get-ADGroupMember hace lo contrario: miembros de un grupo."}, {"id": 357, "t": "WS-3.4", "q": "¿Qué parámetro de Get-ADGroupMember incluye miembros de grupos anidados?", "o": ["-All", "-Nested", "-Deep", "-Recursive"], "a": 3, "e": "Devuelve los usuarios finales de todos los niveles."}, {"id": 358, "t": "WS-3.4", "q": "¿Qué ámbito de grupo puede contener usuarios de cualquier dominio del bosque y se replica en el catálogo global?", "o": ["Universal", "Dominio local", "Local", "Global"], "a": 0, "e": "Los globales solo contienen miembros de su propio dominio."}, {"id": 359, "t": "WS-3.4", "q": "Según AGDLP, ¿a qué tipo de grupo se asignan los permisos sobre un recurso?", "o": ["Global", "Directamente a los usuarios", "Universal", "Dominio local"], "a": 3, "e": "Cuentas → Globales → Dominio local → Permisos."}, {"id": 360, "t": "WS-3.4", "q": "¿Qué tipo de grupo no tiene SID y solo sirve para listas de correo?", "o": ["Distribución", "Dominio local", "Universal", "Seguridad"], "a": 0, "e": "Los de seguridad pueden usarse para permisos y también para correo."}, {"id": 361, "t": "WS-3.4", "q": "¿Qué hace dsquery user -inactive 4?", "o": ["Busca usuarios inactivos durante 4 días", "Busca usuarios inactivos durante 4 semanas", "Busca usuarios con 4 intentos fallidos", "Busca 4 usuarios inactivos"], "a": 1, "e": "-inactive cuenta semanas; -stalepwd cuenta días."}, {"id": 362, "t": "WS-3.4", "q": "¿Qué herramienta permite crear, modificar y borrar objetos de AD a partir de un fichero?", "o": ["dsget", "csvde", "netdom", "ldifde"], "a": 3, "e": "csvde solo importa (crea) y exporta."}, {"id": 363, "t": "WS-3.4", "q": "¿Qué atributo de último inicio de sesión se replica entre todos los DC?", "o": ["logonCount", "badPasswordTime", "lastLogonTimestamp", "lastLogon"], "a": 2, "e": "lastLogon es local de cada DC; lastLogonTimestamp se replica con un retraso de hasta unos 14 días."}, {"id": 364, "t": "WS-3.4", "q": "¿Qué propiedad tienen por defecto las OU creadas con New-ADOrganizationalUnit?", "o": ["Tienen herencia de GPO bloqueada", "Están ocultas", "Están protegidas contra eliminación accidental", "Son de solo lectura"], "a": 2, "e": "-ProtectedFromAccidentalDeletion es $true por defecto."}, {"id": 365, "t": "WS-3.4", "q": "¿Qué grupo existe solo en el dominio raíz del bosque y tiene control total sobre todo el bosque?", "o": ["Account Operators", "Administrators", "Enterprise Admins", "Domain Admins"], "a": 2, "e": "También Schema Admins existe solo en el dominio raíz."}, {"id": 366, "t": "WS-3.4", "q": "¿Qué grupo especial impide NTLM, la delegación y el cifrado RC4/DES para sus miembros?", "o": ["Account Operators", "Protected Users", "Domain Admins", "Server Operators"], "a": 1, "e": "Pensado para cuentas privilegiadas; además limita el TGT a 4 horas."}, {"id": 367, "t": "WS-3.4", "q": "¿Qué comando muestra los grupos y privilegios del usuario que ha iniciado sesión?", "o": ["gpresult /user", "whoami /all", "net user /me", "klist /groups"], "a": 1, "e": "whoami /groups, /priv, /upn muestran partes concretas."}, {"id": 368, "t": "WS-3.4", "q": "¿Qué cmdlet mueve un usuario a otra OU?", "o": ["Move-ADObject", "Move-ADUser", "Set-ADUser -Path", "Set-ADObject -OU"], "a": 0, "e": "Move-ADObject -Identity <DN> -TargetPath <DN de la OU>."}, {"id": 369, "t": "WS-3.4", "q": "¿Qué sintaxis de filtro es correcta para Get-ADUser -Filter?", "o": ["\"Department == TIC\"", "\"(department=TIC)\"", "\"WHERE Department = 'TIC'\"", "\"Department -eq 'TIC'\""], "a": 3, "e": "La sintaxis LDAP \"(department=TIC)\" va con -LDAPFilter."}, {"id": 370, "t": "WS-3.4", "q": "¿Qué tarea permite el asistente \"Delegar control\" de una OU?", "o": ["Crear una GPO automáticamente", "Dar a un grupo permisos concretos (p. ej. restablecer contraseñas) solo sobre esa OU", "Hacer que la OU sea de solo lectura", "Mover la OU a otro dominio"], "a": 1, "e": "Es la base de la administración delegada sin hacer a nadie Domain Admin."}, {"id": 371, "t": "WS-3.5", "q": "¿Dónde se define la directiva de contraseñas por defecto de las cuentas de dominio?", "o": ["En la GPO de cada OU", "En una GPO vinculada al dominio (normalmente Default Domain Policy)", "En el registro de cada DC", "En la Default Domain Controllers Policy"], "a": 1, "e": "Las GPO de contraseñas vinculadas a OU solo afectan a cuentas locales de los equipos."}, {"id": 372, "t": "WS-3.5", "q": "¿A qué objetos se pueden aplicar las directivas de contraseña específicas (PSO)?", "o": ["A equipos", "A unidades organizativas", "A usuarios y a grupos globales de seguridad", "A sitios"], "a": 2, "e": "No se aplican a OU; se usan grupos \"sombra\"."}, {"id": 373, "t": "WS-3.5", "q": "Si a un usuario le aplican dos PSO con precedencias 10 y 20, ¿cuál gana?", "o": ["La más reciente", "La más restrictiva", "La de precedencia 10", "La de precedencia 20"], "a": 2, "e": "Gana el valor de precedencia más bajo (y la aplicada directamente al usuario gana a las de grupos)."}, {"id": 374, "t": "WS-3.5", "q": "¿Qué cmdlet muestra la directiva de contraseña que se aplica efectivamente a un usuario?", "o": ["Get-ADUserResultantPasswordPolicy", "gpresult /password", "Get-ADDefaultDomainPasswordPolicy", "Get-ADFineGrainedPasswordPolicy"], "a": 0, "e": "Devuelve la PSO efectiva (o nada si se aplica la del dominio)."}, {"id": 375, "t": "WS-3.5", "q": "¿Qué se necesita en el dominio antes de crear una gMSA?", "o": ["Nivel funcional 2025", "El grupo Protected Users", "Un certificado de CA", "Una clave raíz KDS (Add-KdsRootKey)"], "a": 3, "e": "En producción hay que esperar 10 horas a que replique."}, {"id": 376, "t": "WS-3.5", "q": "¿Cómo se indica una gMSA al configurar la cuenta de un servicio?", "o": ["LocalSystem", "DOMINIO\\nombre con su contraseña", "DOMINIO\\nombre$ con la contraseña vacía", "nombre@dominio con la contraseña de Domain Admin"], "a": 2, "e": "La contraseña la gestiona AD."}, {"id": 377, "t": "WS-3.5", "q": "¿Qué ventaja tiene una gMSA frente a una sMSA?", "o": ["Tiene permisos de Domain Admin", "No necesita AD", "Su contraseña nunca cambia", "Puede usarse en varios servidores a la vez"], "a": 3, "e": "La sMSA está limitada a un único equipo."}, {"id": 378, "t": "WS-3.5", "q": "¿Qué novedad de Windows Server 2025 permite migrar cuentas de servicio tradicionales a cuentas administradas?", "o": ["dMSA (Delegated Managed Service Accounts)", "Protected Service Accounts", "gMSA v2", "LAPS para servicios"], "a": 0, "e": "Deshabilita la contraseña original y usa claves gestionadas."}, {"id": 379, "t": "WS-3.5", "q": "¿Qué afirmación sobre la Papelera de reciclaje de AD es correcta?", "o": ["Recupera los objetos sin sus pertenencias a grupos", "Una vez habilitada no se puede deshabilitar", "Solo recupera usuarios, no grupos", "Está habilitada por defecto en todos los bosques"], "a": 1, "e": "Requiere nivel funcional 2008 R2 y conserva todos los atributos."}, {"id": 380, "t": "WS-3.5", "q": "¿Qué cmdlet restaura un objeto borrado con la Papelera de reciclaje habilitada?", "o": ["Restore-ADUser", "Restore-ADObject (tras localizarlo con Get-ADObject -IncludeDeletedObjects)", "Undo-ADDelete", "Get-ADUser -Deleted | Enable-ADAccount"], "a": 1, "e": "Get-ADObject -Filter ... -IncludeDeletedObjects | Restore-ADObject."}, {"id": 381, "t": "WS-3.5", "q": "¿Cuál es la vida útil por defecto de los objetos eliminados (tombstone lifetime) en bosques modernos?", "o": ["180 días", "60 días", "365 días", "30 días"], "a": 0, "e": "60 días era el valor en bosques creados antes de 2003 SP1."}, {"id": 382, "t": "WS-3.5", "q": "¿Qué cmdlet habilita la Papelera de reciclaje de AD?", "o": ["Enable-ADOptionalFeature 'Recycle Bin Feature' -Scope ForestOrConfigurationSet -Target 'age.local'", "Install-WindowsFeature AD-RecycleBin", "Set-ADForest -RecycleBin $true", "Enable-ADRecycleBin"], "a": 0, "e": "Es una característica opcional del bosque."}, {"id": 383, "t": "WS-3.6", "q": "¿Cuál es el orden de aplicación de las GPO?", "o": ["Local, Sitio, Dominio, Unidad organizativa", "Sitio, Local, Dominio, OU", "OU, Dominio, Sitio, Local", "Dominio, Sitio, OU, Local"], "a": 0, "e": "LSDOU: en caso de conflicto gana la última aplicada (la OU más cercana al objeto)."}, {"id": 384, "t": "WS-3.6", "q": "Una GPO del dominio y otra de la OU configuran el mismo ajuste con valores distintos, sin opciones especiales. ¿Cuál se aplica?", "o": ["La de la OU", "Ninguna", "La creada más recientemente", "La del dominio"], "a": 0, "e": "La que se aplica después (OU) sobrescribe."}, {"id": 385, "t": "WS-3.6", "q": "La GPO del dominio está marcada como Exigida y la OU tiene Bloquear herencia. ¿Qué ocurre?", "o": ["Da un error de procesamiento", "La GPO del dominio se aplica igualmente y prevalece", "No se aplica por el bloqueo", "Se aplica solo la parte de usuario"], "a": 1, "e": "Exigido (Enforced) ignora el bloqueo de herencia y no puede ser sobrescrita por GPO inferiores."}, {"id": 386, "t": "WS-3.6", "q": "¿Cada cuánto se actualizan las directivas en los equipos miembros del dominio?", "o": ["Cada 24 horas", "Solo al reiniciar", "Cada 90 minutos con un desfase aleatorio de hasta 30 minutos", "Cada 5 minutos"], "a": 2, "e": "Los controladores de dominio cada 5 minutos."}, {"id": 387, "t": "WS-3.6", "q": "¿Qué comando muestra un informe HTML de las GPO aplicadas a un equipo y usuario?", "o": ["gpresult /h informe.html", "gpupdate /report informe.html", "rsop /export informe.html", "gpresult /html"], "a": 0, "e": "gpresult /r da un resumen en texto."}, {"id": 388, "t": "WS-3.6", "q": "¿Qué comando fuerza la reaplicación de todas las directivas?", "o": ["gpupdate /reset", "gpupdate /all", "gpresult /force", "gpupdate /force"], "a": 3, "e": "Sin /force solo aplica las que han cambiado."}, {"id": 389, "t": "WS-3.6", "q": "¿Qué permisos debe tener un grupo en el filtrado de seguridad para que se le aplique una GPO?", "o": ["Leer y Aplicar directiva de grupo", "Control total", "Solo Leer", "Modificar"], "a": 0, "e": "Por defecto los tienen los Usuarios autenticados."}, {"id": 390, "t": "WS-3.6", "q": "¿Para qué sirve el procesamiento de bucle invertido (loopback)?", "o": ["Para aplicar la configuración de usuario según la OU en la que está el equipo", "Para aplicar la GPO dos veces", "Para replicar GPO entre dominios", "Para deshacer una GPO"], "a": 0, "e": "Típico en aulas, kioscos y servidores de Escritorio remoto. Modos Combinar o Reemplazar."}, {"id": 391, "t": "WS-3.6", "q": "¿Qué filtro WMI aplica una GPO solo a equipos cliente (no servidores ni DC)?", "o": ["SELECT * FROM Win32_OperatingSystem WHERE ProductType = 3", "SELECT * FROM Win32_ComputerSystem WHERE DomainRole = 5", "SELECT * FROM Win32_OperatingSystem WHERE ProductType = 2", "SELECT * FROM Win32_OperatingSystem WHERE ProductType = 1"], "a": 3, "e": "1 estación de trabajo, 2 controlador de dominio, 3 servidor miembro."}, {"id": 392, "t": "WS-3.6", "q": "¿Dónde se ubica el almacén central de plantillas administrativas (ADMX)?", "o": ["\\\\dominio\\SYSVOL\\dominio\\Policies\\PolicyDefinitions", "C:\\Windows\\PolicyDefinitions de cada DC solamente", "\\\\dominio\\NETLOGON\\ADMX", "En el registro HKLM\\Software\\Policies"], "a": 0, "e": "Se crea copiando la carpeta PolicyDefinitions con sus .admx y carpetas de idioma (.adml)."}, {"id": 393, "t": "WS-3.6", "q": "¿En qué dos ubicaciones se almacena una GPO de dominio?", "o": ["NTDS.dit y el registro del DC", "El contenedor GPC en AD y la plantilla GPT en SYSVOL", "El registro de cada cliente y NETLOGON", "SYSVOL y la Papelera de reciclaje"], "a": 1, "e": "El GPC tiene versión y atributos; el GPT los ficheros (Registry.pol, scripts…)."}, {"id": 394, "t": "WS-3.6", "q": "¿Qué configuraciones de GPO solo se aplican al iniciar el equipo o la sesión, no en la actualización en segundo plano?", "o": ["La instalación de software y la redirección de carpetas", "Los ajustes del firewall", "Las plantillas administrativas", "Las directivas de seguridad"], "a": 0, "e": "Por eso a veces gpupdate pide cerrar sesión o reiniciar."}, {"id": 395, "t": "WS-3.6", "q": "¿Qué cmdlet vincula una GPO a una OU?", "o": ["Add-GPLink", "New-GPLink", "New-GPO -Link", "Set-GPO -Target"], "a": 1, "e": "New-GPLink -Name \"GPO\" -Target \"OU=...,DC=...\"."}, {"id": 396, "t": "WS-3.6", "q": "¿Qué cmdlet bloquea la herencia de GPO en una OU?", "o": ["Set-GPInheritance -Target \"OU=Lab,DC=age,DC=local\" -IsBlocked Yes", "Set-ADOrganizationalUnit -BlockGPO $true", "Set-GPLink -Block Yes", "Block-GPInheritance \"OU=Lab\""], "a": 0, "e": "Get-GPInheritance muestra la herencia y las GPO efectivas."}, {"id": 397, "t": "WS-3.6", "q": "¿Qué cmdlet realiza una copia de seguridad de todas las GPO?", "o": ["Export-GPO -All", "Copy-GPO -All -Backup", "Save-GPO -All", "Backup-GPO -All -Path \\\\srv\\backups\\gpo"], "a": 3, "e": "Restore-GPO las restaura; Import-GPO importa la configuración en otra GPO."}, {"id": 398, "t": "WS-3.6", "q": "¿Qué GPO define por defecto la directiva de contraseñas y bloqueo de cuentas del dominio?", "o": ["Default Domain Controllers Policy", "Default Domain Policy", "Default User Policy", "Local Group Policy"], "a": 1, "e": "La de controladores de dominio define derechos de usuario y auditoría de los DC."}, {"id": 399, "t": "WS-3.6", "q": "¿Qué diferencia hay entre directivas y preferencias de GPO?", "o": ["Las preferencias requieren reiniciar siempre", "Las preferencias solo se aplican a equipos", "Son lo mismo", "Las preferencias configuran ajustes que el usuario puede cambiar y admiten segmentación por elemento"], "a": 3, "e": "Las directivas se escriben en ramas Policies y se imponen; las preferencias (mapear unidades, impresoras…) son más flexibles."}, {"id": 400, "t": "WS-3.6", "q": "Tras la actualización MS16-072, ¿qué hay que añadir cuando se quita \"Usuarios autenticados\" del filtrado de seguridad de una GPO de usuario?", "o": ["Permiso de Leer a Equipos del dominio (o Usuarios autenticados) en la delegación", "El grupo Domain Admins", "Permiso de Control total al usuario", "Un filtro WMI"], "a": 0, "e": "Las GPO de usuario se leen ahora con el contexto del equipo."}, {"id": 401, "t": "WS-3.6", "q": "Un usuario está en el contenedor CN=Users y no le llega la GPO vinculada a la OU \"Personal\". ¿Por qué?", "o": ["Porque falta gpupdate en el DC", "Porque las GPO solo se aplican a equipos", "Porque las GPO de una OU solo afectan a los objetos que están en esa OU (o sus hijas)", "Porque CN=Users bloquea todas las GPO, incluidas las del dominio"], "a": 2, "e": "Hay que mover el usuario a la OU (las GPO del dominio y del sitio sí le llegan)."}, {"id": 402, "t": "WS-3.6", "q": "¿Qué cmdlet fuerza la actualización de directivas en un equipo remoto sin retraso aleatorio?", "o": ["Invoke-Command gpupdate -Now", "Update-GP -Computer PC-0001", "Invoke-GPUpdate -Computer PC-0001 -Force -RandomDelayInMinutes 0", "gpupdate /target:PC-0001"], "a": 2, "e": "Invoke-GPUpdate crea una tarea programada en el equipo remoto."}, {"id": 403, "t": "WS-3.7", "q": "Si el dominio A confía en el dominio B, ¿quién puede acceder a los recursos de quién?", "o": ["Ninguno sin una confianza inversa", "Ambos en los dos sentidos", "Los usuarios de B pueden acceder a recursos de A", "Los usuarios de A pueden acceder a recursos de B"], "a": 2, "e": "La dirección de la confianza es contraria a la del acceso."}, {"id": 404, "t": "WS-3.7", "q": "¿Qué tipo de confianza se crea automáticamente al añadir un dominio hijo?", "o": ["Padre-hijo, bidireccional y transitiva", "Externa, unidireccional", "De acceso directo", "De bosque, no transitiva"], "a": 0, "e": "Las de raíz de árbol también son automáticas, bidireccionales y transitivas."}, {"id": 405, "t": "WS-3.7", "q": "¿Qué confianza es no transitiva y se usa con un dominio de otro bosque?", "o": ["De bosque", "Raíz de árbol", "Padre-hijo", "Externa"], "a": 3, "e": "La de bosque es transitiva entre los dominios de ambos bosques."}, {"id": 406, "t": "WS-3.7", "q": "¿Para qué se crea una confianza de acceso directo (shortcut)?", "o": ["Para conectar con un reino Kerberos de Linux", "Para sustituir a DNS", "Para acelerar la autenticación entre dominios alejados del mismo bosque", "Para conectar dos bosques"], "a": 2, "e": "Evita recorrer toda la ruta de confianzas."}, {"id": 407, "t": "WS-3.7", "q": "¿Qué componente genera automáticamente la topología de replicación dentro de un sitio?", "o": ["ISTG manual", "DFSR", "KCC (Knowledge Consistency Checker)", "DNS"], "a": 2, "e": "Crea un anillo con un máximo de 3 saltos entre DC."}, {"id": 408, "t": "WS-3.7", "q": "¿Qué comando muestra un resumen del estado de replicación de todos los DC?", "o": ["dcdiag /repl", "repadmin /queue", "netdom /replication", "repadmin /replsummary"], "a": 3, "e": "/showrepl detalla la replicación de un DC concreto."}, {"id": 409, "t": "WS-3.7", "q": "¿Qué comando fuerza la replicación de todas las particiones con todos los socios?", "o": ["repadmin /replicate /all", "dcdiag /sync", "repadmin /syncall /AdeP", "gpupdate /replicate"], "a": 2, "e": "A = todas las particiones, d = DN en mensajes, e = toda la empresa (entre sitios), P = push."}, {"id": 410, "t": "WS-3.7", "q": "¿Qué herramienta realiza un diagnóstico completo de un controlador de dominio?", "o": ["repadmin", "dcdiag", "nltest", "netdom"], "a": 1, "e": "dcdiag /v para detalle; /test:dns para pruebas DNS."}, {"id": 411, "t": "WS-3.7", "q": "¿Qué comando indica qué controlador de dominio está atendiendo a un equipo?", "o": ["nltest /dsgetdc:age.local", "echo %USERDOMAIN%", "nltest /dclist:age.local", "netdom query dc"], "a": 0, "e": "/dclist lista todos los DC; /dsgetdc devuelve el localizado por el DC Locator."}, {"id": 412, "t": "WS-3.7", "q": "Un PC muestra \"La relación de confianza entre esta estación de trabajo y el dominio principal no se pudo establecer\". ¿Qué comando lo repara sin sacarlo del dominio?", "o": ["gpupdate /force", "ipconfig /registerdns", "Test-ComputerSecureChannel -Repair -Credential AGE\\admin", "klist purge"], "a": 2, "e": "También Reset-ComputerMachinePassword o netdom resetpwd."}, {"id": 413, "t": "WS-3.7", "q": "¿Qué objeto de Sitios y servicios asocia rangos IP con un sitio?", "o": ["Puente de vínculos de sitio", "Subred", "Vínculo de sitio", "Servidor cabeza de puente"], "a": 1, "e": "Los clientes se asignan a un sitio según la subred de su IP."}, {"id": 414, "t": "WS-3.7", "q": "¿Qué comando verifica el canal seguro entre un equipo y su dominio?", "o": ["nltest /dsgetdc", "nltest /sc_verify:age.local", "dcdiag /securechannel", "repadmin /showrepl"], "a": 1, "e": "/sc_reset restablece el canal seguro."}, {"id": 415, "t": "WS-4.1", "q": "¿Qué tipo de zona DNS contiene solo los registros SOA, NS y A de los servidores autoritativos?", "o": ["Zona secundaria", "Zona de código auxiliar (stub)", "Zona principal", "Zona inversa"], "a": 1, "e": "Sirve para saber a qué servidores preguntar por esa zona."}, {"id": 416, "t": "WS-4.1", "q": "¿Puede una zona secundaria estar integrada en Active Directory?", "o": ["Sí, si es de búsqueda inversa", "Solo en Windows Server 2025", "Sí, siempre", "No, siempre se almacena en fichero"], "a": 3, "e": "Las principales y las de código auxiliar sí pueden integrarse en AD."}, {"id": 417, "t": "WS-4.1", "q": "¿Qué ventaja tienen las zonas integradas en AD?", "o": ["Se replican por FTP", "Replicación multimaestro con AD y actualizaciones dinámicas seguras", "No necesitan DNS", "Son de solo lectura"], "a": 1, "e": "Además no requieren transferencias de zona entre DC."}, {"id": 418, "t": "WS-4.1", "q": "¿Qué protocolo y puerto usa una transferencia de zona DNS?", "o": ["TCP 853", "UDP 5353", "UDP 53", "TCP 53"], "a": 3, "e": "Las consultas normales usan UDP 53."}, {"id": 419, "t": "WS-4.1", "q": "¿Qué registro DNS indica el servidor de correo de un dominio?", "o": ["PTR", "MX", "SRV", "CNAME"], "a": 1, "e": "Lleva un valor de preferencia: menor número = mayor prioridad."}, {"id": 420, "t": "WS-4.1", "q": "¿Qué registro DNS resuelve una IP en un nombre?", "o": ["PTR", "A", "CNAME", "AAAA"], "a": 0, "e": "Está en zonas de búsqueda inversa (in-addr.arpa / ip6.arpa)."}, {"id": 421, "t": "WS-4.1", "q": "¿Qué registro contiene el número de serie de la zona?", "o": ["TXT", "SRV", "SOA", "NS"], "a": 2, "e": "Si no aumenta, los servidores secundarios no transfieren los cambios."}, {"id": 422, "t": "WS-4.1", "q": "¿Qué registro SRV buscan los clientes para localizar un controlador de dominio?", "o": ["_ldap._tcp.dc._msdcs.<dominio>", "_gc._msdcs.<dominio>", "_dc._ad.<dominio>", "_kerberos._udp.<dominio>.local"], "a": 0, "e": "También existen _kerberos._tcp y _gc._tcp."}, {"id": 423, "t": "WS-4.1", "q": "Faltan los registros SRV de un DC en el DNS. ¿Qué se hace?", "o": ["ipconfig /flushdns en el cliente", "Reiniciar el servicio DHCP", "Ejecutar gpupdate /force", "Reiniciar el servicio Netlogon (o nltest /dsregdns)"], "a": 3, "e": "Netlogon registra los registros que figuran en netlogon.dns."}, {"id": 424, "t": "WS-4.1", "q": "¿Qué es un reenviador condicional?", "o": ["Un servidor DNS secundario", "Un reenviador que se usa solo para consultas de un dominio concreto", "Un reenviador que solo funciona de día", "Un registro CNAME condicional"], "a": 1, "e": "Útil para resolver dominios de otra organización o de un bosque de confianza."}, {"id": 425, "t": "WS-4.1", "q": "¿Qué cmdlet crea un registro A con su PTR asociado?", "o": ["dnscmd /addptr intranet 192.168.10.50", "Add-DnsServerResourceRecordA -ZoneName age.local -Name intranet -IPv4Address 192.168.10.50 -CreatePtr", "Add-DnsRecord -Type A -Name intranet -IP 192.168.10.50 -Ptr", "New-DnsServerRecord A intranet 192.168.10.50"], "a": 1, "e": "-CreatePtr crea el registro inverso si existe la zona inversa."}, {"id": 426, "t": "WS-4.1", "q": "¿Qué cmdlet crea una zona principal integrada en AD replicada a todos los DNS del dominio?", "o": ["New-DnsZone age.local -AD", "Add-DnsServerSecondaryZone -Name age.local -ReplicationScope Domain", "Add-DnsServerPrimaryZone -Name age.local -ZoneFile age.local.dns", "Add-DnsServerPrimaryZone -Name age.local -ReplicationScope Domain"], "a": 3, "e": "Con -ZoneFile se crearía una zona en fichero."}, {"id": 427, "t": "WS-4.1", "q": "¿Qué valores por defecto tienen los intervalos de envejecimiento (aging) de registros DNS?", "o": ["1 día y 1 día", "7 días sin actualización y 7 días de actualización", "24 horas y 7 días", "30 días y 30 días"], "a": 1, "e": "El borrado (scavenging) debe habilitarse en el servidor y en la zona."}, {"id": 428, "t": "WS-4.1", "q": "¿Qué tipo de actualización dinámica solo está disponible en zonas integradas en AD?", "o": ["Solo seguras", "Ninguna", "Manuales", "No seguras y seguras"], "a": 0, "e": "Solo los equipos autenticados pueden registrar o modificar sus registros."}, {"id": 429, "t": "WS-4.1", "q": "¿Qué restricción tiene un registro CNAME?", "o": ["No puede tener TTL", "Solo existe en zonas inversas", "Solo puede apuntar a una IP", "No puede coexistir con otros registros del mismo nombre ni usarse en el ápice de la zona"], "a": 3, "e": "El CNAME apunta a otro nombre, no a una IP."}, {"id": 430, "t": "WS-4.1", "q": "¿Qué registro DNS se usa para publicar SPF, DKIM y DMARC?", "o": ["MX", "PTR", "SRV", "TXT"], "a": 3, "e": "Se publican como cadenas de texto."}, {"id": 431, "t": "WS-4.1", "q": "¿Qué cmdlet vacía la caché de un servidor DNS?", "o": ["Clear-DnsServerCache", "Clear-DnsClientCache", "ipconfig /flushdns", "dnscmd /flush"], "a": 0, "e": "Clear-DnsClientCache e ipconfig /flushdns vacían la caché del cliente."}, {"id": 432, "t": "WS-4.1", "q": "¿Qué cmdlet añade los servidores 8.8.8.8 y 1.1.1.1 como reenviadores en un servidor DNS?", "o": ["Add-DnsServerRootHint 8.8.8.8", "Add-DnsServerConditionalForwarderZone 8.8.8.8", "Add-DnsServerForwarder -IPAddress 8.8.8.8, 1.1.1.1", "Set-DnsClientServerAddress -ServerAddresses 8.8.8.8, 1.1.1.1"], "a": 2, "e": "Set-DnsClientServerAddress configura la tarjeta del cliente."}, {"id": 433, "t": "WS-4.1", "q": "¿Qué registro DNS indica qué autoridades de certificación pueden emitir certificados para el dominio?", "o": ["CAA", "DS", "TLSA", "CERT"], "a": 0, "e": "Certification Authority Authorization."}, {"id": 434, "t": "WS-4.2", "q": "¿Cuál es el orden de los mensajes del proceso DHCP?", "o": ["Offer, Discover, Ack, Request", "Discover, Request, Offer, Ack", "Request, Offer, Discover, Ack", "Discover, Offer, Request, Ack"], "a": 3, "e": "DORA."}, {"id": 435, "t": "WS-4.2", "q": "¿Qué puertos usa DHCP para IPv4?", "o": ["UDP 546 y 547", "UDP 67 (servidor) y UDP 68 (cliente)", "TCP 67 y TCP 68", "UDP 53 y 67"], "a": 1, "e": "546/547 son los de DHCPv6."}, {"id": 436, "t": "WS-4.2", "q": "¿Cuándo intenta un cliente DHCP renovar su concesión con el servidor que se la dio?", "o": ["Al 100 %", "Al 25 %", "Al 50 % del tiempo de concesión", "Al 87,5 %"], "a": 2, "e": "Al 87,5 % (T2) lo intenta con cualquier servidor por difusión."}, {"id": 437, "t": "WS-4.2", "q": "¿Cuál es la duración de concesión por defecto de un ámbito DHCP de Windows Server para redes cableadas?", "o": ["1 día", "24 horas", "8 días", "30 días"], "a": 2, "e": "Se puede cambiar con -LeaseDuration."}, {"id": 438, "t": "WS-4.2", "q": "¿Qué hay que hacer con un servidor DHCP de Windows en un dominio para que empiece a repartir direcciones?", "o": ["Registrarlo en DNS como MX", "Autorizarlo en Active Directory", "Instalar WINS", "Añadirlo a Domain Admins"], "a": 1, "e": "Add-DhcpServerInDC; evita servidores DHCP Windows no autorizados."}, {"id": 439, "t": "WS-4.2", "q": "¿Qué opción DHCP indica la puerta de enlace predeterminada?", "o": ["044 Servidores WINS", "006 Servidores DNS", "003 Enrutador", "015 Nombre de dominio DNS"], "a": 2, "e": "006 DNS, 015 sufijo DNS, 044 WINS."}, {"id": 440, "t": "WS-4.2", "q": "¿Qué opciones DHCP se usan para el arranque PXE?", "o": ["003 y 006", "066 (servidor de arranque) y 067 (fichero de arranque)", "051 y 058", "252 y 253"], "a": 1, "e": "Indican el servidor TFTP y el nombre del fichero de arranque."}, {"id": 441, "t": "WS-4.2", "q": "¿Qué parámetro identifica al cliente en una reserva DHCP de Windows?", "o": ["-SID", "-HostName", "-ClientId con la dirección MAC", "-UserName"], "a": 2, "e": "Add-DhcpServerv4Reservation -ScopeId -IPAddress -ClientId."}, {"id": 442, "t": "WS-4.2", "q": "Un ordenador tiene la IP 169.254.23.4. ¿Qué indica?", "o": ["Que el DNS ha fallado", "Que no ha recibido respuesta de ningún servidor DHCP (APIPA)", "Que tiene una IP pública", "Que está en la DMZ"], "a": 1, "e": "Posibles causas: servidor caído, ámbito agotado, falta de relay, VLAN o cable incorrecto."}, {"id": 443, "t": "WS-4.2", "q": "¿Por qué hace falta un agente de retransmisión DHCP cuando el servidor está en otra subred?", "o": ["Porque el servidor no puede responder en unicast", "Porque las difusiones DHCP no atraviesan los routers", "Porque DHCP necesita Kerberos", "Porque DHCP usa TCP"], "a": 1, "e": "En Cisco: ip helper-address en la interfaz de la subred de los clientes."}, {"id": 444, "t": "WS-4.2", "q": "¿Qué campo del paquete DHCP reenviado por un relay indica la subred de origen del cliente?", "o": ["giaddr", "ciaddr", "chaddr", "yiaddr"], "a": 0, "e": "giaddr (gateway IP address) permite al servidor elegir el ámbito adecuado."}, {"id": 445, "t": "WS-4.2", "q": "¿Cuántos servidores pueden participar en una relación de conmutación por error DHCP de Windows?", "o": ["1", "Ilimitados", "4", "2"], "a": 3, "e": "Modos equilibrio de carga o espera activa; solo IPv4."}, {"id": 446, "t": "WS-4.2", "q": "¿Cuál es el porcentaje de reparto por defecto en el modo de equilibrio de carga de la conmutación por error DHCP?", "o": ["100 %/0 %", "50 %/50 %", "80 %/20 %", "70 %/30 %"], "a": 1, "e": "La regla 80/20 era el método antiguo con ámbitos divididos."}, {"id": 447, "t": "WS-4.2", "q": "¿Qué es una exclusión en un ámbito DHCP?", "o": ["Una lista de MAC bloqueadas", "Una IP reservada para una MAC", "Una subred que no se enruta", "Un rango de direcciones del ámbito que el servidor no repartirá"], "a": 3, "e": "Se usa para IP estáticas dentro del rango (servidores, impresoras)."}, {"id": 448, "t": "WS-4.2", "q": "Si una opción DNS se define a nivel de servidor y otra distinta a nivel de ámbito, ¿cuál recibe el cliente?", "o": ["La del servidor", "Ambas concatenadas", "La del ámbito (la más específica)", "Ninguna"], "a": 2, "e": "Prioridad: reserva > ámbito > servidor."}, {"id": 449, "t": "WS-4.2", "q": "En DHCPv6, ¿qué indica el bit M (Managed) del anuncio de router (RA)?", "o": ["Que se deshabilita IPv6", "Que la dirección se obtiene por DHCPv6 con estado", "Que el router es el servidor DNS", "Que se debe usar SLAAC únicamente"], "a": 1, "e": "El bit O (Other) indica que se obtienen solo otras opciones (DNS) por DHCPv6."}, {"id": 450, "t": "WS-4.2", "q": "¿Qué cmdlet muestra el porcentaje de uso de los ámbitos DHCP?", "o": ["Get-DhcpServerv4Lease -Stats", "Get-DhcpStatistics", "Get-DhcpServerv4Scope -Usage", "Get-DhcpServerv4ScopeStatistics"], "a": 3, "e": "Muestra direcciones libres, en uso y porcentaje."}, {"id": 451, "t": "WS-4.2", "q": "¿Qué mensaje DHCP envía un cliente que detecta que la IP ofrecida ya está en uso?", "o": ["DHCPINFORM", "DHCPNAK", "DHCPRELEASE", "DHCPDECLINE"], "a": 3, "e": "NAK lo envía el servidor para rechazar una solicitud."}, {"id": 452, "t": "WS-4.3", "q": "¿Cuál es la carpeta raíz por defecto del sitio web de IIS?", "o": ["C:\\Program Files\\IIS\\root", "C:\\IIS\\www", "C:\\Windows\\System32\\inetsrv", "C:\\inetpub\\wwwroot"], "a": 3, "e": "Los logs están en C:\\inetpub\\logs\\LogFiles."}, {"id": 453, "t": "WS-4.3", "q": "¿Qué proceso ejecuta los grupos de aplicaciones de IIS?", "o": ["w3wp.exe", "inetinfo.exe", "iisexpress.exe", "httpd.exe"], "a": 0, "e": "Cada grupo de aplicaciones tiene uno o varios w3wp.exe."}, {"id": 454, "t": "WS-4.3", "q": "¿Qué identidad usa por defecto un grupo de aplicaciones de IIS?", "o": ["NetworkService", "Administrator", "ApplicationPoolIdentity", "LocalSystem"], "a": 2, "e": "Es una cuenta virtual IIS AppPool\\NombreDelPool."}, {"id": 455, "t": "WS-4.3", "q": "¿Qué permite alojar varios sitios en la misma IP y el mismo puerto 80?", "o": ["El encabezado de host (host header)", "Usar distintos grupos de aplicaciones", "Usar IPv6 obligatoriamente", "Cambiar el MTU"], "a": 0, "e": "En HTTPS la extensión SNI permite lo mismo con certificados distintos."}, {"id": 456, "t": "WS-4.3", "q": "¿Qué comando reinicia completamente IIS?", "o": ["appcmd restart", "Restart-Service IISAdmin", "iisreset", "net stop iis"], "a": 2, "e": "iisreset /stop y /start también existen."}, {"id": 457, "t": "WS-4.3", "q": "¿Qué fichero contiene la configuración global de IIS?", "o": ["iis.ini", "web.config de la raíz", "applicationHost.config", "machine.config"], "a": 2, "e": "Está en %windir%\\System32\\inetsrv\\config; web.config es por sitio/aplicación."}, {"id": 458, "t": "WS-4.3", "q": "¿Qué método de autenticación de IIS envía las credenciales codificadas en Base64 (no cifradas)?", "o": ["Por certificado", "Básica", "Windows", "Implícita"], "a": 1, "e": "Solo debe usarse con HTTPS."}, {"id": 459, "t": "WS-4.3", "q": "¿Qué cuenta usa por defecto la autenticación anónima de IIS?", "o": ["NetworkService", "Guest", "IIS_IUSRS", "IUSR"], "a": 3, "e": "IIS_IUSRS es el grupo de identidades de los grupos de aplicaciones."}, {"id": 460, "t": "WS-4.3", "q": "¿Cada cuánto se recicla por defecto un grupo de aplicaciones de IIS?", "o": ["Cada 24 horas exactas", "Cada hora", "Nunca", "Cada 1740 minutos (29 horas)"], "a": 3, "e": "El valor de 29 horas evita que coincida siempre a la misma hora."}, {"id": 461, "t": "WS-4.4", "q": "¿Qué arquitectura de PKI se recomienda en Windows Server?", "o": ["CA raíz en cada controlador de dominio", "Una única CA raíz empresarial online", "CA raíz independiente offline y CA subordinada empresarial online", "Solo certificados autofirmados"], "a": 2, "e": "Proteger la raíz desconectada reduce el impacto de un compromiso."}, {"id": 462, "t": "WS-4.4", "q": "¿Qué tipo de CA usa plantillas de certificado e inscripción automática por GPO?", "o": ["Raíz offline", "Independiente", "Empresarial", "De confianza externa"], "a": 2, "e": "La empresarial está integrada en AD."}, {"id": 463, "t": "WS-4.4", "q": "¿Qué diferencia hay entre CRL y OCSP?", "o": ["OCSP es una lista y CRL un servicio web", "CRL solo existe en Linux", "Son lo mismo", "La CRL es una lista completa publicada periódicamente; OCSP consulta en línea el estado de un certificado concreto"], "a": 3, "e": "Las CRL delta publican solo los cambios desde la última completa."}, {"id": 464, "t": "WS-4.4", "q": "¿Qué puerto HTTP usa WSUS por defecto en Windows Server 2012 y posteriores?", "o": ["8080", "8530", "443", "80"], "a": 1, "e": "8531 para HTTPS."}, {"id": 465, "t": "WS-4.4", "q": "¿Cómo se indica a los clientes que usen el servidor WSUS?", "o": ["Con una opción DHCP 252", "Con una GPO \"Especificar la ubicación del servicio de actualizaciones de Microsoft en la intranet\"", "Instalando el agente WSUS manualmente en cada equipo", "Configurando el DNS"], "a": 1, "e": "Se indica la URL, por ejemplo http://wsus01:8530."}, {"id": 466, "t": "WS-4.4", "q": "¿Qué estado tiene WSUS según Microsoft?", "o": ["Eliminado de Windows Server 2025",
