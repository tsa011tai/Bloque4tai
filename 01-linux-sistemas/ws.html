function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function levelOf(t){ return t.split('-')[1].split('.')[0]; }
function filterQs(c, lv, tp, mode){
  return QS.filter(q => {
    if (c !== 'all' && !q.t.startsWith(c + '-')) return false;
    if (lv !== 'all' && levelOf(q.t) !== lv) return false;
    if (tp !== 'all' && q.t !== tp) return false;
    const s = S.q[q.id];
    if (mode === 'new' && s) return false;
    if (mode === 'fail' && !(s && s.last === 0)) return false;
    if (mode === 'star' && !S.star[q.id]) return false;
    return true;
  });
}

function startQuiz(list, opts){

          (t?' <a href="#" id="goT">Ver teoría de '+q.t+'</a>':'')+'</div>';

      } else {

      }
    }

      (wrong.length?'<h3>Revisión de fallos</h3>'+wrong.map(x => '<div class="review-item"><div class="muted" style="font-size:13px">'+x.q.t+'</div><b>'+inline(x.q.q)+'</b><div>Tu respuesta: <span style="color:var(--ko)">'+inline(x.q.o[x.a])+'</span></div><div>Correcta: <span style="color:var(--ok)">'+inline(x.q.o[x.q.a])+'</span></div><div class="muted">'+inline(x.q.e)+'</div></div>').join(''):'');
    document.getElementById('again').onclick = () => setTab('test');
    const r = document.getElementById('redo'); if (r) r.onclick = () => startQuiz(wrong.map(x => x.q), {title:'Repetir fallos', practice:true});
  }

function startConsole(list, topicId){
  currentView = 'consola';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'consola'));
  let i = 0, tries = 0, hist = [], hpos = 0, okCount = 0;
  view.innerHTML = '<div class="qhead"><h2 class="view" style="margin:0">Consola'+(topicId?' · '+topicId:'')+'</h2><span class="pill" id="cnt"></span></div>' +
    '<div class="term" id="term"><div id="out"></div><div class="inrow"><span class="prompt" id="pr"></span><input id="cin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escribe el comando"></div></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="hint">Pista</button><button class="btn" id="sol">Ver solución</button><button class="btn" id="skip">Saltar</button><button class="btn ghost" id="back">Volver</button></div>';
  const out = document.getElementById('out'), cin = document.getElementById('cin'), term = document.getElementById('term');
  function ln(txt, cls){ const d = document.createElement('div'); d.className = 'ln ' + (cls||''); d.textContent = txt; out.appendChild(d); term.scrollTop = term.scrollHeight; }
  function task(){
    if (i >= list.length){ ln('— Fin. Has acertado ' + okCount + ' de ' + list.length + '. —', 'okc'); cin.disabled = true; document.getElementById('cnt').textContent = list.length + ' / ' + list.length; return; }
    const x = list[i]; tries = 0;
    document.getElementById('cnt').textContent = (i+1) + ' / ' + list.length;
    document.getElementById('pr').textContent = PROMPTS[x.m] || PROMPTS.ps;
    ln('');
    ln('[' + x.t + ' · ' + ({ps:'PowerShell',cmd:'cmd',linux:'Linux',cisco:'Cisco IOS'})[x.m] + '] ' + x.p, 'task');
    cin.focus();
  }
  function hint(){ const x = list[i]; if (!x) return; const s = x.s; const first = s.split(/\s+/)[0]; ln('Pista: empieza por «' + first + '» y tiene ' + s.split(/\s+/).length + ' palabras.', 'dim'); }
  function solution(){ const x = list[i]; if (!x) return; ln('Solución: ' + x.s, 'sol'); }
  function next(){ i++; task(); }
  cin.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp'){ if (hist.length){ hpos = Math.max(0, hpos - 1); cin.value = hist[hpos]; } e.preventDefault(); return; }
    if (e.key === 'ArrowDown'){ if (hist.length){ hpos = Math.min(hist.length, hpos + 1); cin.value = hist[hpos] || ''; } e.preventDefault(); return; }
    if (e.key !== 'Enter') return;
    const v = cin.value; cin.value = ''; if (!v.trim()) return;
    hist.push(v); hpos = hist.length;
    const x = list[i]; ln((PROMPTS[x ? x.m : 'ps']) + v);
    const c = norm(v);
    if (c === 'pista' || c === 'hint'){ hint(); return; }
    if (c === 'solucion' || c === 'solución'){ solution(); return; }
    if (c === 'saltar' || c === 'siguiente'){ solution(); next(); return; }
    if (c === 'cls' || c === 'clear' || c === 'clear-host'){ out.innerHTML = ''; task(); return; }
    if (!x) return;
    if (checkEx(x, v)){
      okCount++; const k = EX.indexOf(x); S.ex[k] = (S.ex[k]||0) + 1; save();
      ln('✔ Correcto' + (norm(x.s) !== c ? '  (forma de referencia: ' + x.s + ')' : ''), 'okc'); setTimeout(next, 450);
    } else {

    }
  });
  document.getElementById('hint').onclick = () => { hint(); cin.focus(); };
  document.getElementById('sol').onclick = () => { solution(); cin.focus(); };

}

    '<div class="card"><h3 style="margin-top:0">Copia de seguridad del progreso</h3><p class="muted">El progreso vive en este navegador. Exporta un fichero para pasarlo a otro equipo.</p><div class="row"><button class="btn" id="exp">Exportar progreso</button><label class="btn">Importar progreso<input type="file" id="imp" accept="application/json" class="hidden"></label><button class="btn" id="rst" style="color:var(--ko)">Borrar todo el progreso</button></div></div>';
  document.getElementById('exp').onclick = () => { const b = new Blob([JSON.stringify(S)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'progreso-tai-windows-redes.json'; a.click(); };
  document.getElementById('imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { S = Object.assign({read:{},q:{},star:{},ex:{}}, JSON.parse(t)); save(); toast('Progreso importado'); renderTree(); renderProgress(); } catch(err){ toast('Fichero no válido'); } }); };
  document.getElementById('rst').onclick = () => { if (confirm('¿Seguro que quieres borrar todo el progreso?')) { S = {read:{}, q:{}, star:{}, ex:{}, last:null, theme:S.theme}; save(); renderTree(); renderProgress(); } };
}

/* ================= init ================= */
renderTree();
setTab('teoria');
})();
</script>
</body>
</html>
