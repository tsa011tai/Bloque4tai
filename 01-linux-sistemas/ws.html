## Nivel 5 — Administración de redes de área local

### NET-5.1 · VLAN, troncales y enrutamiento entre VLAN

- **VLAN** (802.1Q): segmenta un switch en varios **dominios de difusión** lógicos. Ventajas: seguridad, rendimiento (menos difusión), gestión.
- **Etiqueta 802.1Q**: **4 bytes** insertados en la trama (TPID 0x8100 + PCP 3 bits de prioridad 802.1p + DEI 1 bit + **VID de 12 bits**). VLAN válidas **1-4094** (0 y 4095 reservadas). Rango normal 1-1005, extendido 1006-4094.
- Puerto de **acceso** (una VLAN, tramas sin etiqueta: equipos finales) vs puerto **troncal** (varias VLAN etiquetadas: entre switches, hacia routers/hipervisores).
- **VLAN nativa**: viaja **sin etiqueta** por el troncal (por defecto VLAN 1). Debe coincidir en ambos extremos. Buena práctica: cambiarla a una VLAN sin uso.
- **ISL**: encapsulación propietaria de Cisco, **obsoleta**. **DTP**: negociación automática de troncales (Cisco) → deshabilitar (`switchport nonegotiate`).
- **VTP** (Cisco): propagar VLAN entre switches (modos servidor, cliente, transparente). Riesgo de borrar VLAN de toda la red.
- **Enrutamiento entre VLAN**: router con una interfaz por VLAN (antiguo), **router-on-a-stick** (subinterfaces sobre un troncal), o **switch multicapa (L3)** con **SVI** (`interface vlan 10` + `ip routing`) — el método más escalable.
- **VLAN de voz**, VLAN de gestión, **VLAN privadas** (PVLAN: aislar puertos dentro de una misma VLAN).

> ⚠️ Trampa: equipos de VLAN distintas **no se comunican** sin un dispositivo de **capa 3** aunque estén en el mismo switch.

> ⚠️ Trampa: el ID de VLAN tiene **12 bits** → 4096 valores, **4094 utilizables**.

### NET-5.2 · STP, agregación de enlaces y alta disponibilidad de capa 2/3

**STP — Spanning Tree Protocol (IEEE 802.1D)**: evita **bucles** de capa 2 (tormentas de difusión, inestabilidad de la tabla MAC) bloqueando enlaces redundantes.
1. Se elige el **puente raíz**: el de **menor Bridge ID** = prioridad (**32768** por defecto, múltiplos de 4096) + MAC (desempata la **menor MAC**).
2. Cada switch no raíz elige su **puerto raíz** (menor coste hacia la raíz).
3. En cada segmento se elige un **puerto designado**; el resto se **bloquea**.
- Mensajes **BPDU** (cada 2 s). Costes (revisados): 10 Mbps = 100, 100 Mbps = 19, 1 Gbps = 4, 10 Gbps = 2.
- Estados 802.1D: **Bloqueo** (blocking, 20 s max age) → **Escucha** (listening, 15 s) → **Aprendizaje** (learning, 15 s) → **Envío** (forwarding); + Deshabilitado. Convergencia ~**30-50 s**.
- **RSTP (802.1w)**: convergencia en ~segundos; estados **descarte** (discarding), aprendizaje, envío; roles raíz, designado, **alternativo**, **respaldo**.
- **MSTP (802.1s)**: varias instancias STP para grupos de VLAN. Cisco: PVST+ / Rapid PVST+ (una instancia por VLAN).
- Protecciones: **PortFast** (puertos de equipos finales pasan directamente a forwarding), **BPDU Guard** (desactiva el puerto si recibe BPDU), Root Guard, Loop Guard.

**Agregación de enlaces** (EtherChannel / port-channel / bonding / *teaming*): varios enlaces físicos como uno lógico (más ancho de banda + redundancia). Estándar **LACP (802.3ad, hoy 802.1AX)**, modos *active*/*passive*. Cisco propietario: **PAgP** (*desirable*/*auto*). En Windows Server: **NIC Teaming** (LBFO, `New-NetLbfoTeam`) o **SET** (Switch Embedded Teaming) para Hyper-V.

**Redundancia de puerta de enlace (FHRP)**: IP virtual compartida por varios routers.
| Protocolo | Tipo | Activo |
|---|---|---|
| **HSRP** | Cisco | 1 activo + 1 en espera |
| **VRRP** | Estándar (RFC 5798) | 1 maestro + respaldos |
| **GLBP** | Cisco | Balanceo entre varios |

> ⚠️ Trampa: en STP gana el **menor** Bridge ID (menor prioridad; en empate, **menor MAC**), no el mayor.

> ⚠️ Trampa: **PortFast** se pone en puertos de **acceso** con equipos finales, **nunca** entre switches.

### NET-5.3 · Enrutamiento

- Un router decide por la **coincidencia de prefijo más larga** (*longest prefix match*): para 10.1.1.5, una ruta 10.1.1.0/24 gana a 10.0.0.0/8 aunque la /8 tenga mejor métrica.
- Si hay varias fuentes para el **mismo prefijo**, gana la de menor **distancia administrativa** (AD, fiabilidad de la fuente). A igualdad de protocolo, la menor **métrica**.

**Distancias administrativas (Cisco)**
| Origen | AD |
|---|---|
| Conectada | **0** |
| Estática | **1** |
| eBGP | 20 |
| EIGRP interno | 90 |
| **OSPF** | **110** |
| IS-IS | 115 |
| **RIP** | **120** |
| EIGRP externo | 170 |
| iBGP | 200 |
| Desconocida | 255 (no se usa) |

**Protocolos de enrutamiento**
| | Tipo | Métrica | Notas |
|---|---|---|---|
| **RIP v2** | Vector distancia, IGP | **Saltos** (máx. **15**; 16 = inalcanzable) | Actualizaciones cada 30 s, multicast 224.0.0.9, UDP 520. RIPng para IPv6 |
| **OSPF** v2/v3 | **Estado de enlace**, IGP, estándar | **Coste** (= ancho de banda de referencia / ancho de banda; referencia por defecto 100 Mbps) | Algoritmo **Dijkstra (SPF)**, **áreas** (área **0** = backbone, todas conectan a ella), LSA, DR/BDR en redes multiacceso, multicast 224.0.0.5/6, protocolo IP 89. OSPFv3 para IPv6 |
| **EIGRP** | Vector distancia avanzado ("híbrido"), Cisco (publicado RFC 7868) | Compuesta (ancho de banda + retardo) | Algoritmo **DUAL**, sucesor y sucesor factible |
| **IS-IS** | Estado de enlace | Coste | Operadores |
| **BGP** v4 | **Vector de ruta**, **EGP** | Atributos (AS_PATH…) | Entre **sistemas autónomos** (Internet), **TCP 179** |

- **Ruta estática**: configurada a mano (sin consumo de recursos, no se adapta). **Ruta flotante**: estática con AD mayor que la dinámica, como respaldo.
- **Ruta por defecto** (*gateway of last resort*): `0.0.0.0/0` (IPv4) o `::/0` (IPv6).
- **IGP** (dentro de un AS: RIP, OSPF, EIGRP, IS-IS) vs **EGP** (entre AS: BGP).

> ⚠️ Trampa: OSPF **no** tiene límite de saltos (eso es RIP, 15). OSPF usa **coste** basado en ancho de banda.

> ⚠️ Trampa: ante dos rutas a destinos que se solapan, primero se mira el **prefijo más largo**; la distancia administrativa solo desempata rutas **al mismo prefijo** de distintos orígenes.

### NET-5.4 · Seguridad en la LAN y control de acceso

| Ataque | Cómo funciona | Mitigación |
|---|---|---|
| **Desbordamiento de tabla MAC** (MAC flooding) | Llenar la CAM con MAC falsas → el switch inunda como un hub | **Port security** (máximo de MAC por puerto, `sticky`, acciones *shutdown/restrict/protect*) |
| **Suplantación ARP** (ARP spoofing/poisoning) | Respuestas ARP falsas → MITM | **DAI** (Dynamic ARP Inspection, apoyada en DHCP snooping), entradas estáticas |
| **DHCP falso** (rogue DHCP) / agotamiento (*starvation*) | Servidor DHCP no autorizado o agotar el pool | **DHCP snooping** (puertos de confianza *trusted* solo hacia el servidor legítimo) |
| **Salto de VLAN** (VLAN hopping) | Negociar troncal (DTP) o **doble etiquetado** usando la VLAN nativa | Desactivar DTP (`switchport mode access`, `nonegotiate`), cambiar la **VLAN nativa** a una sin uso, no usar VLAN 1 |
| Suplantación de IP | IP origen falsa | **IP Source Guard**, uRPF, ACL |
| Ataques a STP | Anunciarse como raíz | **BPDU Guard**, **Root Guard** |
| Envenenamiento LLMNR/NBT-NS | Responder a resoluciones de nombres locales | Deshabilitar LLMNR y NetBIOS |

**802.1X** (control de acceso a la red basado en puerto):
- **Suplicante** (cliente) ↔ **Autenticador** (switch o AP) ↔ **Servidor de autenticación** (**RADIUS**, p. ej. NPS).
- Entre suplicante y autenticador **EAPOL**; entre autenticador y servidor **RADIUS**.
- Métodos EAP: **EAP-TLS** (certificados en cliente y servidor: el más seguro), **PEAP** (MSCHAPv2 dentro de un túnel TLS; certificado solo en servidor), EAP-TTLS, EAP-FAST. Si el dispositivo no soporta 802.1X: **MAB** (MAC Authentication Bypass).
- **NAC** (Network Access Control): comprobar el estado del equipo (parches, antivirus) antes de dar acceso.

**AAA**: Autenticación, Autorización y Contabilidad (Accounting). **RADIUS** (UDP 1812/1813, cifra solo la contraseña, combina autenticación y autorización) vs **TACACS+** (Cisco, **TCP 49**, cifra **todo** el paquete, separa A-A-A: preferido para administrar equipos de red).

**ACL** (listas de control de acceso, Cisco): **estándar** (números 1-99 y 1300-1999, filtran solo por **IP origen** → colocar **cerca del destino**) y **extendidas** (100-199 y 2000-2699, origen, destino, protocolo y puerto → colocar **cerca del origen**). Se evalúan de arriba abajo, primera coincidencia; al final hay un **deny any implícito**. Máscara **comodín** (wildcard): inversa de la máscara (`0.0.0.255` para un /24).

> ⚠️ Trampa: en 802.1X el **switch es el autenticador**, no el servidor de autenticación (que es el RADIUS).

> ⚠️ Trampa: toda ACL termina con un **deny implícito**: una ACL con solo líneas `deny` bloquea **todo**.

> ⚠️ Trampa: **TACACS+ usa TCP 49 y cifra todo**; **RADIUS usa UDP y solo cifra la contraseña**.

## Nivel 6 — Seguridad perimetral, monitorización y diagnóstico profesional

### NET-6.1 · Seguridad perimetral: cortafuegos, DMZ, IDS/IPS y proxies

**Cortafuegos (firewall)**
| Tipo | Capa | Características |
|---|---|---|
| Filtrado de paquetes (sin estado) | 3-4 | Reglas por IP, protocolo, puerto. Cada paquete aislado (ACL) |
| **Con estado** (stateful, SPI) | 3-4 | Mantiene **tabla de conexiones**: permite automáticamente el tráfico de vuelta |
| Pasarela de aplicación / proxy | 7 | Entiende el protocolo de aplicación |
| **NGFW** (nueva generación) | 3-7 | Stateful + identificación de **aplicaciones** y usuarios, **IPS** integrado, inspección **TLS**, filtrado URL, antimalware |
| **WAF** (Web Application Firewall) | 7 | Protege aplicaciones **web** (inyección SQL, XSS, OWASP Top 10) |

- Política por defecto recomendada: **denegar todo** y permitir solo lo necesario (lista blanca).
- **DMZ** (zona desmilitarizada): red intermedia para servidores **accesibles desde Internet** (web, correo, DNS público, proxy inverso). Arquitecturas: un firewall con 3 interfaces (*three-legged*) o **dos firewalls** (*back-to-back*, idealmente de fabricantes distintos). Desde la DMZ **no** se debe iniciar tráfico libre hacia la LAN interna.
- **Bastión** (*bastion host*): equipo expuesto y bastionado. **Jump server / salto**: punto único de acceso administrativo.

**IDS / IPS**
- **IDS** (detección): **pasivo**, analiza una copia del tráfico (puerto **SPAN**/mirror o TAP) y **alerta**.
- **IPS** (prevención): **en línea** (*inline*), puede **bloquear**.
- Detección por **firmas** (conocidos, pocos falsos positivos) o por **anomalías/comportamiento** (desconocidos, más falsos positivos). **NIDS** (red) vs **HIDS** (host). Ejemplos: Snort, Suricata, Zeek.
- **Falso positivo**: alerta sin ataque real. **Falso negativo**: ataque no detectado (el más peligroso).

**Proxies**: **directo/forward** (los clientes salen a Internet a través de él: filtrado, caché, registro; p. ej. Squid, puerto típico 3128/8080) y **inverso/reverse** (delante de los servidores: publicación, balanceo, terminación TLS; p. ej. Nginx, HAProxy). Configuración de clientes por **PAC**/WPAD o GPO, o proxy **transparente**.

**Otros**: **balanceadores de carga** (algoritmos round-robin, menos conexiones, hash IP; capa 4 o 7), **honeypots**, **SIEM** (correlación de eventos), **SOC**, **DLP** (prevención de fuga de datos), **segmentación y microsegmentación**, modelo **Zero Trust** ("nunca confiar, verificar siempre"; NIST SP 800-207), **SASE/ZTNA**.

> ⚠️ Trampa: **IDS** detecta y avisa (fuera de línea); **IPS** se coloca **en línea** y bloquea.

> ⚠️ Trampa: el servidor web público va en la **DMZ**, no en la LAN interna; la base de datos que usa, en una zona interna protegida.

### NET-6.2 · VPN e IPsec

- **VPN de sitio a sitio** (entre sedes, normalmente router/firewall a router/firewall) y **VPN de acceso remoto** (usuario a la red corporativa con un cliente).
- **IPsec** (capa 3), conjunto de protocolos:
  - **AH** (Authentication Header, protocolo IP **51**): integridad y autenticación, **sin cifrado**; incompatible con NAT.
  - **ESP** (Encapsulating Security Payload, protocolo IP **50**): **cifrado** + integridad + autenticación.
  - **IKE** (Internet Key Exchange) **v1/v2**: negociación de claves y SA, **UDP 500**; **NAT-T**: **UDP 4500**. IKEv1 tiene fase 1 (modo principal/agresivo) y fase 2 (modo rápido); IKEv2 es más simple y robusto (MOBIKE para móviles).
  - **SA** (asociación de seguridad), **Diffie-Hellman** para acordar claves, PSK o certificados para autenticar.
  - Modos: **Transporte** (cifra solo la carga; extremo a extremo entre hosts) y **Túnel** (encapsula el **paquete IP completo** en uno nuevo; entre pasarelas, el habitual en sitio a sitio).
- **VPN SSL/TLS**: sobre HTTPS 443, atraviesa casi cualquier firewall; clientes o portal web (OpenVPN usa TLS propio sobre UDP/TCP 1194). **SSTP** (Microsoft, sobre HTTPS 443).
- **WireGuard**: moderno, ligero, UDP (51820 por defecto), criptografía fija (ChaCha20, Curve25519).
- Obsoletos/inseguros: **PPTP** (TCP 1723 + GRE: roto); **L2TP** sin IPsec no cifra (L2TP/IPsec sí: UDP 1701 dentro de IPsec).
- **Split tunneling**: solo el tráfico corporativo va por la VPN (el resto directo a Internet). Más rendimiento, menos control.
- **GRE** (protocolo 47): túnel sin cifrado (se combina con IPsec).

> ⚠️ Trampa: **AH no cifra**. El que cifra es **ESP**.

> ⚠️ Trampa: **modo túnel** cifra y encapsula el paquete **entero** (incluida la cabecera IP original); **modo transporte**, solo la carga.

### NET-6.3 · Monitorización y análisis de tráfico

- **SNMP** (consultas a contadores de interfaces, CPU…), **NetFlow/IPFIX/sFlow** (estadísticas de flujos: quién habla con quién y cuánto), **syslog** centralizado, **SIEM**.
- Herramientas: **Nagios**, **Zabbix**, **PRTG**, **Cacti**, LibreNMS, Grafana + Prometheus; *Wireshark*, *tcpdump*; Microsoft **Network Monitor** (obsoleto) → `pktmon` y `netsh trace` en Windows.
- **Puerto espejo (SPAN)** o **TAP** para capturar el tráfico de un switch (un switch no envía todo el tráfico a todos los puertos).

**Wireshark**
- **Filtros de captura** (sintaxis **BPF**, antes de capturar): `host 10.0.0.5`, `net 192.168.1.0/24`, `port 53`, `tcp port 443`, `host 10.0.0.5 and not port 22`.
- **Filtros de visualización** (después de capturar, sintaxis Wireshark): `ip.addr == 10.0.0.5`, `ip.src == 10.0.0.5`, `tcp.port == 443`, `dns`, `http.request`, `tcp.flags.syn == 1 && tcp.flags.ack == 0`, `tcp.analysis.retransmission`, `arp`, `icmp`, `!(arp or dns)`, `http.response.code == 404`, `tls.handshake.type == 1` (Client Hello).
- *Follow TCP Stream* para reconstruir una conversación. *Statistics → Conversations / Protocol Hierarchy*.

**Rendimiento de red**: **ancho de banda** (capacidad), **throughput** (real), **latencia** (retardo; RTT ida y vuelta), **jitter** (variación de la latencia; crítico en VoIP: < 30 ms), **pérdida de paquetes**. Herramientas: `iperf3` (ancho de banda entre dos equipos), `ping`, `mtr`, `pathping`.
- **QoS**: clasificación y marcado (**DSCP** en capa 3 — EF = 46 para voz —; **CoS/802.1p** en capa 2), colas, *policing* y *shaping*.

> ⚠️ Trampa: `ip.addr == x` es un filtro de **visualización**; en el filtro de **captura** se escribe `host x`.

### NET-6.4 · Diagnóstico profesional de red (metodología y casos)

**Metodología**: OSI **de abajo arriba** (físico → enlace → red → transporte → aplicación), de **arriba abajo**, o **divide y vencerás** (empezar por capa 3 con un ping). Documentar siempre.

**Secuencia clásica en un puesto Windows sin red**
1. `ipconfig /all` → ¿tiene IP? ¿169.254.x.x (falla DHCP)? ¿máscara y puerta de enlace correctas? ¿DNS correcto?
2. `ping 127.0.0.1` → pila TCP/IP local.
3. `ping <su propia IP>` → interfaz.
4. `ping <puerta de enlace>` → red local (capa 2/3 local).
5. `ping <IP externa>` (p. ej. 8.8.8.8) → enrutamiento/salida.
6. `ping <nombre>` / `nslookup <nombre>` → DNS.
7. `Test-NetConnection <servidor> -Port <puerto>` → el servicio concreto / firewall.

**Tabla de diagnóstico**
| Síntoma | Causa más probable |
|---|---|
| IP **169.254.x.x** | No llega al **DHCP** (servidor caído, ámbito agotado, falta relay, VLAN o cable mal) |
| Hace ping a IP pero **no a nombres** | **DNS** (servidor DNS mal configurado o caído) |
| Llega a equipos de **su red** pero no a otras | **Puerta de enlace** errónea/ausente o falta ruta |
| Llega a otras redes pero **no a una concreta** | Ruta específica, ACL o firewall intermedio |
| **Ping funciona** pero la aplicación no | **Puerto** cerrado / firewall / servicio parado (ping es ICMP) |
| Ping **no responde** pero el servicio funciona | **ICMP bloqueado** por firewall (habitual en Windows y en Internet) |
| Conflicto de direcciones IP | IP estática duplicada dentro del rango DHCP (excluirla del ámbito) |
| Red **lenta** con errores CRC/colisiones tardías | **Desajuste de dúplex**, cable dañado, interferencias |
| Tormenta de difusión, switches al 100 % | **Bucle** de capa 2 (STP deshabilitado o mal configurado) |
| Funciona por IP pero falla HTTPS por nombre | Certificado (nombre no coincide, caducado, CA no confiable) o SNI |
| Las páginas grandes se cuelgan, las pequeñas no | Problema de **MTU** (fragmentación con DF, PMTUD bloqueado por ICMP filtrado) |
| Un equipo nuevo no se puede unir al dominio | DNS apunta a un DNS externo, no a un DC |
| Wi-Fi conectado sin Internet | DHCP/DNS/portal cautivo/puerta de enlace |
| Solo falla de vez en cuando con un servidor | IP duplicada (ARP cambiante: `arp -a` muestra MAC distinta) |

**Ejemplos de preguntas tipo supuesto**
- *Un usuario tiene IP 192.168.1.130/25 y puerta de enlace 192.168.1.1. No sale de su red.* → La puerta de enlace está en **otra subred** (192.168.1.0/25 vs 192.168.1.128/25).
- *¿Qué comando muestra qué proceso tiene abierto el puerto 3389?* → `netstat -ano | findstr :3389` (y `tasklist /FI "PID eq N"`) o `Get-NetTCPConnection -LocalPort 3389`.
- *¿Qué se usa para comprobar si un servidor acepta conexiones en el 443 desde PowerShell?* → `Test-NetConnection srv -Port 443`.

### NET-6.5 · Redes en la AGE y tendencias actuales

- **Red SARA** (Sistemas de Aplicaciones y Redes para las Administraciones): **intranet de las Administraciones Públicas** españolas. Conecta ministerios, CCAA, entidades locales (a través de las CCAA) y organismos; conexión con la red europea **TESTA** (sTESTA / TESTA-ng). Ofrece servicios comunes (Cl@ve, @firma, Notific@, SIR, etc.). Gestionada por la **Secretaría General de Administración Digital (SGAD)**.
- **Esquema Nacional de Seguridad (RD 311/2022)**: medidas de **protección de las comunicaciones** (mp.com: perímetro seguro, protección de la confidencialidad, autenticidad e integridad, **segregación de redes**, medios alternativos), **control de acceso** (op.acc) y **monitorización del sistema** (op.mon: detección de intrusión, sistema de métricas, vigilancia).
- **CCN-CERT** coordina la respuesta a incidentes en el sector público; herramienta **CARMEN** (detección de APT en el tráfico de red) y **LUCÍA** (gestión de incidentes). **CCN-STIC** con guías de bastionado de equipos de red y de configuración segura.
- **RedIRIS**: red académica y de investigación (no es la red de la AGE).
- **IPv6 en la AGE**: el sector público español tiene planes de adopción de IPv6 (doble pila en servicios públicos).
- **Tendencias**: **SDN** (control centralizado separado del plano de datos, OpenFlow), **NFV** (funciones de red virtualizadas), **SD-WAN**, **SASE** (SD-WAN + seguridad en la nube), **Zero Trust / ZTNA**, **Wi-Fi 6E/7**, **5G**, **IoT**, automatización de red (**Ansible**, NETCONF/YANG, APIs REST), **IPv6-only** con NAT64, **post-cuántica** (algoritmos de cifrado resistentes; TLS híbrido ML-KEM).

> 🏛️ AGE: en un supuesto práctico, cualquier diseño de red de un organismo debe contemplar **segmentación** (VLAN por función: usuarios, servidores, gestión, voz, invitados), **DMZ** para servicios publicados, **firewall** entre zonas, **acceso remoto por VPN** con **doble factor** y **registro centralizado** de eventos, porque lo exige el ENS.

<script type="application/json" id="q-src">[{"id": 1, "t": "PS-1.1", "q": "¿Cuál es el ejecutable de PowerShell 7?", "o": ["ps7.exe", "powershell_ise.exe", "powershell.exe", "pwsh.exe"], "a": 3, "e": "PowerShell 7 se ejecuta con pwsh.exe; powershell.exe es Windows PowerShell 5.1."}, {"id": 2, "t": "PS-1.1", "q": "¿Sobre qué plataforma .NET se ejecuta Windows PowerShell 5.1?", "o": [".NET Framework 4.x", ".NET Core 3.1", ".NET 10", ".NET 8"], "a": 0, "e": "Windows PowerShell 5.1 usa .NET Framework; PowerShell 6/7 usan .NET (Core/moderno)."}, {"id": 3, "t": "PS-1.1", "q": "¿Qué versión de PowerShell es la LTS actual (publicada en marzo de 2026) y sobre qué .NET se basa?", "o": ["PowerShell 7.6, sobre .NET 10", "PowerShell 7.5, sobre .NET 9", "PowerShell 7.4, sobre .NET 8", "PowerShell 8.0, sobre .NET 10"], "a": 0, "e": "PowerShell 7.6 LTS se publicó el 18-mar-2026 y está construida sobre .NET 10 (LTS)."}, {"id": 4, "t": "PS-1.1", "q": "¿Qué comando muestra de forma fiable la versión del motor de PowerShell?", "o": ["Get-Version", "Get-Host", "$PSVersionTable.PSVersion", "$Host.Version"], "a": 2, "e": "$Host/Get-Host informan de la versión del host (la consola), no del motor. Get-Version no existe."}, {"id": 5, "t": "PS-1.1", "q": "¿Qué valor devuelve $PSVersionTable.PSEdition en Windows PowerShell 5.1?", "o": ["Windows", "Classic", "Core", "Desktop"], "a": 3, "e": "5.1 devuelve Desktop; PowerShell 6 y 7 devuelven Core."}, {"id": 6, "t": "PS-1.1", "q": "Al instalar PowerShell 7 en un Windows Server 2025, ¿qué ocurre con Windows PowerShell 5.1?", "o": ["Se actualiza y pasa a llamarse PowerShell 7", "Se desinstala automáticamente", "Sigue instalado y ambas versiones conviven", "Queda deshabilitado hasta reiniciar"], "a": 2, "e": "Son instalaciones side-by-side: 5.1 es componente del sistema y no se reemplaza."}, {"id": 7, "t": "PS-1.1", "q": "¿Qué afirmación sobre PowerShell 7 es correcta?", "o": ["Ya no admite scripts .ps1", "Solo funciona en Windows Server", "Es multiplataforma (Windows, Linux y macOS) y de código abierto", "Viene preinstalado en Windows Server 2025 y reemplaza a la 5.1"], "a": 2, "e": "PowerShell 7 es open source y multiplataforma; en Windows hay que instalarlo aparte."}, {"id": 8, "t": "PS-1.1", "q": "¿Cuál de estas versiones de PowerShell 7 deja de tener soporte el 10 de noviembre de 2026?", "o": ["PowerShell 7.4 LTS (y también la 7.5)", "PowerShell 7.7", "PowerShell 7.6 LTS", "Windows PowerShell 5.1"], "a": 0, "e": "Según Microsoft, 7.4 y 7.5 terminan soporte el 10-nov-2026; 7.6 LTS llega hasta noviembre de 2028."}, {"id": 9, "t": "PS-1.2", "q": "¿Qué estructura siguen los nombres de cmdlet?", "o": ["Sustantivo-Verbo", "Verbo-Sustantivo (en singular)", "Verbo_Objeto en minúsculas", "Prefijo-Verbo-Sustantivo obligatorio"], "a": 1, "e": "Los cmdlets siguen el patrón Verbo-Sustantivo con el sustantivo en singular, p. ej. Get-Service."}, {"id": 10, "t": "PS-1.2", "q": "¿Qué comando lista los verbos aprobados de PowerShell?", "o": ["Show-Verb", "Get-Command -Verb", "Get-Verb", "Get-Help about_Verbs"], "a": 2, "e": "Get-Verb devuelve la lista de verbos aprobados y su grupo."}, {"id": 11, "t": "PS-1.2", "q": "¿Qué parámetro de Get-Help muestra únicamente los ejemplos?", "o": ["-Online", "-Examples", "-Detailed", "-Full"], "a": 1, "e": "-Examples muestra solo ejemplos; -Detailed añade parámetros; -Full lo muestra todo."}, {"id": 12, "t": "PS-1.2", "q": "¿Qué cmdlet descarga e instala los archivos de ayuda actualizados?", "o": ["Install-Help", "Save-Help", "Update-Help", "Get-Help -Update"], "a": 2, "e": "Update-Help descarga la ayuda; Save-Help la guarda para equipos sin Internet."}, {"id": 13, "t": "PS-1.2", "q": "Ejecutas Get-Help Get-Service en un servidor recién instalado y solo ves la sintaxis. ¿Por qué?", "o": ["Porque la ayuda completa no viene instalada y hay que ejecutar Update-Help", "Porque hay que usar man en lugar de Get-Help", "Porque Get-Service no tiene ayuda", "Porque falta ejecutar como administrador Get-Service"], "a": 0, "e": "Windows no incluye la ayuda completa; sin Update-Help solo se muestra la ayuda autogenerada."}, {"id": 14, "t": "PS-1.2", "q": "¿Cómo se denomina un parámetro que no lleva valor, como -Recurse o -Force?", "o": ["Parámetro común", "Parámetro dinámico obligatorio", "Parámetro posicional", "Parámetro switch (modificador)"], "a": 3, "e": "Los switch se activan solo por estar presentes; se pueden desactivar con -Recurse:$false."}, {"id": 15, "t": "PS-1.2", "q": "¿Qué comando encuentra todos los comandos del módulo ActiveDirectory?", "o": ["Find-Command ActiveDirectory", "Get-Help ActiveDirectory", "Get-Module ActiveDirectory -Commands", "Get-Command -Module ActiveDirectory"], "a": 3, "e": "Get-Command -Module filtra por módulo. Find-Command busca en la galería, no en local."}, {"id": 16, "t": "PS-1.2", "q": "¿Qué tipo de comando devuelve Get-Command ipconfig?", "o": ["Application", "Cmdlet", "Function", "Alias"], "a": 0, "e": "ipconfig.exe es un ejecutable externo, que PowerShell clasifica como Application."}, {"id": 17, "t": "PS-1.2", "q": "¿Qué tres cmdlets forman la base para descubrir y aprender PowerShell?", "o": ["Get-Command, Get-Help y Get-Member", "Get-Process, Get-Service y Get-Item", "Get-Alias, Get-Verb y Get-Module", "Show-Command, Out-GridView y Get-History"], "a": 0, "e": "Get-Command (qué hay), Get-Help (cómo se usa) y Get-Member (qué contiene el objeto)."}, {"id": 18, "t": "PS-1.3", "q": "¿A qué cmdlet corresponde el alias gci?", "o": ["Get-Content", "Get-Command", "Get-CimInstance", "Get-ChildItem"], "a": 3, "e": "gci, dir y ls son alias de Get-ChildItem. Get-Content es gc."}, {"id": 19, "t": "PS-1.3", "q": "¿Cuál es el alias de Where-Object?", "o": ["filter", "wo", "?", "%"], "a": 2, "e": "? y where son alias de Where-Object; % y foreach lo son de ForEach-Object."}, {"id": 20, "t": "PS-1.3", "q": "¿Qué cmdlet se ejecuta al escribir % en un pipeline?", "o": ["Measure-Object", "ForEach-Object", "Where-Object", "Select-Object"], "a": 1, "e": "% es alias de ForEach-Object."}, {"id": 21, "t": "PS-1.3", "q": "En PowerShell para Windows ejecutas ls -la y obtienes un error. ¿Por qué?", "o": ["ls no existe en Windows", "Hay que ejecutarlo como administrador", "ls es alias de Get-ChildItem, que no tiene un parámetro -la", "Falta importar el módulo Linux"], "a": 2, "e": "Los alias solo cambian el nombre del cmdlet; las opciones de Linux no existen. Se usaría Get-ChildItem -Force."}, {"id": 22, "t": "PS-1.3", "q": "En Windows PowerShell 5.1, ¿qué se ejecuta al escribir curl https://www.age.es?", "o": ["Invoke-WebRequest, porque curl es un alias", "El programa curl.exe de Windows", "Invoke-RestMethod", "Nada, da error"], "a": 0, "e": "En 5.1, curl y wget son alias de Invoke-WebRequest; para el curl real hay que escribir curl.exe."}, {"id": 23, "t": "PS-1.3", "q": "¿Qué comando muestra todos los alias de Get-ChildItem?", "o": ["Get-Alias -Definition Get-ChildItem", "Get-Alias -Name Get-ChildItem", "Get-Command Get-ChildItem -Alias", "Get-Help Get-ChildItem -Alias"], "a": 0, "e": "-Definition busca alias por el comando al que apuntan."}, {"id": 24, "t": "PS-1.3", "q": "¿Qué limitación tienen los alias en PowerShell?", "o": ["No pueden incluir parámetros; para eso hay que usar una función", "Solo pueden tener una letra", "Se guardan siempre de forma permanente en el registro", "No funcionan en scripts"], "a": 0, "e": "Un alias solo es otro nombre del comando; para fijar parámetros se crea una función. Además solo duran la sesión salvo que se añadan al perfil."}, {"id": 25, "t": "PS-1.3", "q": "¿A qué cmdlet equivale el comando cmd findstr?", "o": ["Find-Item", "Select-String", "Where-Object", "Search-String"], "a": 1, "e": "Select-String (alias sls) busca texto/regex en cadenas y ficheros."}, {"id": 26, "t": "PS-1.3", "q": "¿Qué cmdlet es el equivalente de tasklist?", "o": ["Get-ScheduledTask", "Get-Process", "Get-Service", "Get-Task"], "a": 1, "e": "tasklist lista procesos: Get-Process. Get-ScheduledTask es para tareas programadas."}, {"id": 27, "t": "PS-1.4", "q": "¿Cuál es la directiva de ejecución por defecto en Windows Server?", "o": ["Unrestricted", "Restricted", "AllSigned", "RemoteSigned"], "a": 3, "e": "Desde Windows Server 2012 R2 el valor predeterminado en servidores es RemoteSigned; en clientes Windows es Restricted."}, {"id": 28, "t": "PS-1.4", "q": "¿Cuál es la directiva de ejecución por defecto en Windows 10/11 (cliente)?", "o": ["Bypass", "Restricted", "RemoteSigned", "Undefined"], "a": 1, "e": "Restricted no permite ejecutar scripts; es el valor predeterminado en clientes Windows."}, {"id": 29, "t": "PS-1.4", "q": "Con la directiva RemoteSigned, ¿qué scripts pueden ejecutarse sin firma?", "o": ["Los creados localmente (no marcados como descargados de Internet)", "Ninguno", "Solo los descargados de Internet", "Todos, sin excepción"], "a": 0, "e": "RemoteSigned exige firma a los descargados (Mark of the Web); los locales se ejecutan sin firma."}, {"id": 30, "t": "PS-1.4", "q": "¿Qué ámbito de la directiva de ejecución tiene mayor precedencia?", "o": ["MachinePolicy (definido por GPO de equipo)", "LocalMachine", "CurrentUser", "Process"], "a": 0, "e": "Orden: MachinePolicy, UserPolicy, Process, CurrentUser, LocalMachine."}, {"id": 31, "t": "PS-1.4", "q": "¿Qué comando cambia la directiva solo para la ventana actual de PowerShell?", "o": ["Set-ExecutionPolicy Bypass -Scope CurrentUser", "Set-ExecutionPolicy Bypass -Scope Process", "Set-ExecutionPolicy Bypass -Scope LocalMachine", "Set-ExecutionPolicy Bypass -Temporary"], "a": 1, "e": "El ámbito Process afecta solo a la sesión actual y desaparece al cerrarla."}, {"id": 32, "t": "PS-1.4", "q": "¿Qué cmdlet quita la marca de \"descargado de Internet\" de un script?", "o": ["Unblock-File", "Clear-Zone", "Set-ExecutionPolicy Unrestricted", "Remove-ItemProperty"], "a": 0, "e": "Unblock-File elimina el flujo alternativo Zone.Identifier."}, {"id": 33, "t": "PS-1.4", "q": "¿Cómo se denomina el flujo alternativo NTFS que marca un fichero como descargado?", "o": ["Mark.Web", "$DATA.Download", "Internet.Origin", "Zone.Identifier"], "a": 3, "e": "El Mark of the Web se guarda en el flujo alternativo Zone.Identifier."}, {"id": 34, "t": "PS-1.4", "q": "Tienes script.ps1 en la carpeta actual y escribes script.ps1. ¿Qué pasa?", "o": ["Se abre en el Bloc de notas", "Se ejecuta normalmente", "No se ejecuta: hay que escribir .\\script.ps1", "Se ejecuta solo si la directiva es Bypass"], "a": 2, "e": "Por seguridad PowerShell no busca comandos en el directorio actual; hay que indicar la ruta .\\script.ps1."}, {"id": 35, "t": "PS-1.4", "q": "¿Qué afirmación sobre la directiva de ejecución es correcta?", "o": ["Solo se aplica a Linux", "Impide totalmente que un atacante ejecute código PowerShell", "No es una barrera de seguridad; evita ejecuciones accidentales", "Solo puede cambiarse por GPO"], "a": 2, "e": "Microsoft indica que no es un límite de seguridad: puede saltarse, por ejemplo con -ExecutionPolicy Bypass."}, {"id": 36, "t": "PS-1.4", "q": "¿Qué comando muestra la directiva de ejecución de todos los ámbitos?", "o": ["Get-ExecutionPolicy -Scope *", "Get-ExecutionPolicy -List", "Get-ExecutionPolicy -All", "Show-ExecutionPolicy"], "a": 1, "e": "-List devuelve cada ámbito con su valor."}, {"id": 37, "t": "PS-1.4", "q": "¿Cuál es la directiva de ejecución en PowerShell 7 sobre Linux?", "o": ["Unrestricted, y no se puede cambiar", "AllSigned", "RemoteSigned", "Restricted"], "a": 0, "e": "En plataformas no Windows la directiva es Unrestricted y Set-ExecutionPolicy no tiene efecto."}, {"id": 38, "t": "PS-1.5", "q": "¿Qué parámetro de Get-ChildItem muestra los ficheros ocultos y de sistema?", "o": ["-All", "-Force", "-Recurse", "-Hidden"], "a": 1, "e": "-Force incluye elementos ocultos y de sistema (también existe -Hidden, que muestra SOLO los ocultos)."}, {"id": 39, "t": "PS-1.5", "q": "¿Qué comando muestra las 20 últimas líneas de un log?", "o": ["Get-Content C:\\log.txt -First 20", "Get-Content C:\\log.txt -Last 20", "Select-String C:\\log.txt -Tail 20", "Get-Content C:\\log.txt -Tail 20"], "a": 3, "e": "-Tail devuelve las últimas líneas; -TotalCount (alias -First/-Head) las primeras."}, {"id": 40, "t": "PS-1.5", "q": "¿Qué equivale a tail -f de Linux en PowerShell?", "o": ["Get-Content fichero.log -Follow", "Get-Content fichero.log -Stream", "Watch-Content fichero.log", "Get-Content fichero.log -Wait"], "a": 3, "e": "-Wait mantiene el fichero abierto y muestra las líneas nuevas."}, {"id": 41, "t": "PS-1.5", "q": "¿Qué devuelve Get-Content por defecto sobre un fichero de texto?", "o": ["Un array de bytes", "Un objeto FileInfo", "Un array de cadenas, una por línea", "Un único string con todo el contenido"], "a": 2, "e": "Para obtener un único string se usa -Raw."}, {"id": 42, "t": "PS-1.5", "q": "¿Qué cmdlet añade texto al final de un fichero sin borrar su contenido?", "o": ["Add-Content", "Set-Content", "New-Item", "Out-File"], "a": 0, "e": "Set-Content y Out-File (sin -Append) sobrescriben."}, {"id": 43, "t": "PS-1.5", "q": "¿Qué comando crea una carpeta llamada Informes en C:\\Datos?", "o": ["Add-Item C:\\Datos\\Informes -Directory", "New-Directory C:\\Datos\\Informes", "New-Item -Path C:\\Datos -Name Informes -ItemType Directory", "New-Item -Path C:\\Datos\\Informes -Type Folder -Create"], "a": 2, "e": "New-Item con -ItemType Directory (también funcionan mkdir/md como función)."}, {"id": 44, "t": "PS-1.5", "q": "¿Qué cmdlet devuelve True o False según exista una ruta?", "o": ["Get-Item -Exists", "Test-Path", "Resolve-Path", "Find-Path"], "a": 1, "e": "Test-Path devuelve un booleano; Get-Item da error si no existe."}, {"id": 45, "t": "PS-1.5", "q": "¿Qué parámetro simula un cambio mostrando lo que haría sin hacerlo?", "o": ["-Simulate", "-WhatIf", "-Test", "-Confirm"], "a": 1, "e": "-WhatIf es un parámetro común de riesgo; -Confirm pide confirmación antes de cada acción."}, {"id": 46, "t": "PS-1.5", "q": "¿Qué diferencia hay entre -Filter y -Include en Get-ChildItem?", "o": ["-Filter solo funciona en el registro", "Son idénticos", "-Filter lo aplica el proveedor y es más rápido; -Include lo aplica PowerShell después", "-Include admite expresiones regulares y -Filter no"], "a": 2, "e": "-Filter se resuelve en origen (más eficiente); -Include/-Exclude filtran en PowerShell."}, {"id": 47, "t": "PS-1.5", "q": "¿Qué comando cmd equivale a Select-String -Pattern ERROR -Path *.log?", "o": ["grep ERROR *.log", "type *.log | more ERROR", "findstr \"ERROR\" *.log", "find ERROR *.log -r"], "a": 2, "e": "findstr es el buscador de texto de cmd; grep no existe en cmd."}, {"id": 48, "t": "PS-2.1", "q": "¿Qué resultado produce 'Hola $nombre' con comillas simples si $nombre = \"Ana\"?", "o": ["Un error de sintaxis", "Hola $nombre", "Hola Ana", "Hola"], "a": 1, "e": "Las comillas simples son literales: no expanden variables."}, {"id": 49, "t": "PS-2.1", "q": "¿Cuál es el carácter de escape en PowerShell?", "o": ["El acento circunflejo (^)", "El acento grave (`)", "La almohadilla (#)", "La barra invertida (\\)"], "a": 1, "e": "PowerShell usa el backtick: `n es salto de línea. ^ es el escape de cmd y \\ el de bash."}, {"id": 50, "t": "PS-2.1", "q": "¿Cuál es la variable automática que contiene el objeto actual del pipeline?", "o": ["$input", "$obj", "$this", "$_ (o $PSItem)"], "a": 3, "e": "$_ y su sinónimo $PSItem representan el objeto actual en Where-Object, ForEach-Object, etc."}, {"id": 51, "t": "PS-2.1", "q": "¿Qué variable contiene el código de salida del último programa externo ejecutado?", "o": ["$EXITCODE", "$Error[0]", "$?", "$LASTEXITCODE"], "a": 3, "e": "$? indica éxito/fracaso (booleano); $LASTEXITCODE guarda el código numérico de un .exe."}, {"id": 52, "t": "PS-2.1", "q": "¿Qué operador compara si dos valores son iguales?", "o": ["==", "=", "-is", "-eq"], "a": 3, "e": "= es asignación; -eq comparación. -is compara tipos."}, {"id": 53, "t": "PS-2.1", "q": "¿Qué devuelve \"Windows\" -contains \"Win\"?", "o": ["False", "True", "Un error", "Win"], "a": 0, "e": "-contains comprueba si una colección contiene un elemento exacto; no busca subcadenas."}, {"id": 54, "t": "PS-2.1", "q": "¿Qué operador usa expresiones regulares?", "o": ["-contains", "-match", "-like", "-eq"], "a": 1, "e": "-match usa regex y rellena $Matches; -like usa comodines * y ?."}, {"id": 55, "t": "PS-2.1", "q": "¿Qué hace \"abc\" -ceq \"ABC\"?", "o": ["Convierte ambos a mayúsculas", "Devuelve False porque la comparación distingue mayúsculas", "Devuelve True", "Da un error de sintaxis"], "a": 1, "e": "El prefijo c hace la comparación sensible a mayúsculas; -eq por defecto no lo es."}, {"id": 56, "t": "PS-2.1", "q": "¿Qué escribe 'Get-Process > procesos.txt' en PowerShell?", "o": ["Abre procesos.txt", "Redirige la salida al fichero procesos.txt", "Da un error porque > no existe", "Compara si Get-Process es mayor que procesos.txt"], "a": 1, "e": "> es redirección (como Out-File). Para comparar se usa -gt."}, {"id": 57, "t": "PS-2.1", "q": "¿Cómo se crea una tabla hash (hashtable)?", "o": ["@{ Nombre = \"Ana\"; Dpto = \"TIC\" }", "@( Nombre = \"Ana\"; Dpto = \"TIC\" )", "[ Nombre: \"Ana\", Dpto: \"TIC\" ]", "{ \"Nombre\" => \"Ana\" }"], "a": 0, "e": "@{} crea hashtables; @() crea arrays."}, {"id": 58, "t": "PS-2.1", "q": "¿Qué índice devuelve el último elemento de un array $lista?", "o": ["$lista[$lista.Count]", "$lista[-1]", "$lista.Last", "$lista[0]"], "a": 1, "e": "Los índices negativos cuentan desde el final; $lista[$lista.Count] estaría fuera de rango."}, {"id": 59, "t": "PS-2.1", "q": "¿Qué valor tiene 1GB en PowerShell?", "o": ["El texto \"1GB\"", "1000000000", "1024", "1073741824"], "a": 3, "e": "Los sufijos KB, MB, GB, TB son potencias de 1024: 1GB = 1024^3."}, {"id": 60, "t": "PS-2.1", "q": "¿Qué expresión es la forma recomendada de comprobar si $x es nulo?", "o": ["$x -eq $null", "$x == null", "$x -is $null", "$null -eq $x"], "a": 3, "e": "Con $null a la izquierda se evita que, si $x es un array, se filtren elementos en lugar de devolver un booleano."}, {"id": 61, "t": "PS-2.1", "q": "¿Qué operador comprueba si un valor está dentro de una colección, poniendo la colección a la derecha?", "o": ["-contains", "-like", "-match", "-in"], "a": 3, "e": "2 -in @(1,2,3) devuelve True; con -contains la colección va a la izquierda."}, {"id": 62, "t": "PS-2.1", "q": "¿Qué devuelve \"{0:N2}\" -f 3.14159 (con cultura es-ES)?", "o": ["3.14159", "3,14", "3", "{0:N2}"], "a": 1, "e": "El operador -f aplica formato .NET; N2 = número con 2 decimales y separador de la cultura actual."}, {"id": 63, "t": "PS-2.2", "q": "¿Qué pasa por el pipeline de PowerShell?", "o": ["Texto plano, como en cmd", "Objetos .NET completos", "Ficheros temporales", "Solo cadenas"], "a": 1, "e": "A diferencia de bash/cmd, el pipeline transmite objetos con propiedades y métodos."}, {"id": 64, "t": "PS-2.2", "q": "¿Qué cmdlet muestra el tipo, las propiedades y los métodos de un objeto?", "o": ["Get-Object", "Get-Member", "Get-Property", "Get-Type"], "a": 1, "e": "Get-Member (alias gm) muestra TypeName y miembros."}, {"id": 65, "t": "PS-2.2", "q": "¿Qué formas existen de enlazar la entrada del pipeline a un parámetro?", "o": ["ByObject y ByText", "ByName y ByPosition", "ByValue y ByPropertyName", "ByRef y ByVal"], "a": 2, "e": "ByValue pasa el objeto entero; ByPropertyName enlaza por nombre de propiedad igual al parámetro."}, {"id": 66, "t": "PS-2.2", "q": "Al hacer Import-Csv usuarios.csv | New-ADUser, ¿cómo se asignan las columnas a los parámetros?", "o": ["Por nombre de propiedad (ByPropertyName): cada columna con el mismo nombre que un parámetro", "No funciona: hay que usar ForEach-Object obligatoriamente", "Por posición de las columnas", "Por orden alfabético"], "a": 0, "e": "Si las cabeceras coinciden con nombres de parámetros (Name, SamAccountName…) se enlazan ByPropertyName."}, {"id": 67, "t": "PS-2.2", "q": "¿Por qué falla Get-Process | Format-Table | Export-Csv procesos.csv?", "o": ["Porque falta -NoTypeInformation", "Porque Export-Csv no admite pipeline", "Porque Format-Table devuelve objetos de formato, no los datos originales", "Porque Format-Table solo funciona con servicios"], "a": 2, "e": "Los Format-* deben ir siempre al final del pipeline."}, {"id": 68, "t": "PS-2.2", "q": "¿Qué hace la expresión (Get-Date).AddDays(-30)?", "o": ["Devuelve el número 30", "Resta 30 días al reloj del sistema", "Llama al método AddDays del objeto fecha y devuelve la fecha de hace 30 días", "Da error porque Get-Date no tiene métodos"], "a": 2, "e": "Los paréntesis ejecutan el cmdlet y sobre el objeto resultante se invoca el método."}, {"id": 69, "t": "PS-2.2", "q": "¿Dónde se puede consultar si un parámetro acepta entrada del pipeline?", "o": ["En Get-Help <cmdlet> -Full (\"Accept pipeline input?\")", "En Get-Command -Pipeline", "En $PSVersionTable", "En Get-Member"], "a": 0, "e": "La ayuda completa indica para cada parámetro si acepta pipeline ByValue o ByPropertyName."}, {"id": 70, "t": "PS-2.2", "q": "¿Qué es { Get-Service } en PowerShell?", "o": ["Un bloque de script (scriptblock)", "Una subexpresión", "Un hashtable", "Un array"], "a": 0, "e": "Las llaves delimitan bloques de código que se ejecutan más tarde (Where-Object, Invoke-Command…)."}, {"id": 71, "t": "PS-2.2", "q": "¿Qué hace $( ) dentro de una cadena con comillas dobles?", "o": ["Escapa caracteres", "Crea un array", "Evalúa una subexpresión e inserta su resultado", "Comenta el contenido"], "a": 2, "e": "\"Total: $($lista.Count)\" inserta el valor calculado."}, {"id": 72, "t": "PS-2.3", "q": "¿Qué cmdlet filtra objetos (filas) según una condición?", "o": ["Sort-Object", "Where-Object", "Select-Object", "Group-Object"], "a": 1, "e": "Where-Object filtra filas; Select-Object elige propiedades (columnas) o número de objetos."}, {"id": 73, "t": "PS-2.3", "q": "¿Qué comando muestra los 10 procesos que más CPU consumen?", "o": ["Get-Process | Select-Object -First 10 | Sort-Object CPU", "Get-Process | Where-Object CPU -First 10", "Get-Process | Sort-Object CPU -Descending | Select-Object -First 10", "Get-Process -Top 10 -CPU"], "a": 2, "e": "Primero se ordena descendente y después se toman los 10 primeros."}, {"id": 74, "t": "PS-2.3", "q": "¿Qué diferencia hay entre Select-Object Name y Select-Object -ExpandProperty Name?", "o": ["La primera da error si hay valores repetidos", "La segunda ordena los resultados", "La primera devuelve objetos con una propiedad Name; la segunda devuelve directamente los valores (strings)", "Ninguna"], "a": 2, "e": "-ExpandProperty extrae el valor, útil para pasar listas simples a otros cmdlets."}, {"id": 75, "t": "PS-2.3", "q": "¿Cuál es la sintaxis simplificada válida (PowerShell 3+) para filtrar servicios en ejecución?", "o": ["Get-Service | Where-Object Status -eq Running", "Get-Service | Where-Object Status = Running", "Get-Service | Where Status == \"Running\"", "Get-Service -Where Running"], "a": 0, "e": "La sintaxis simplificada omite las llaves y $_ para comparaciones sencillas."}, {"id": 76, "t": "PS-2.3", "q": "¿Qué cmdlet suma el tamaño de todos los ficheros de una carpeta?", "o": ["Get-ChildItem -File | Sum-Object Length", "Get-ChildItem -File | Measure-Object -Property Length -Sum", "Get-ChildItem -File | Measure-Object", "Get-ChildItem -File | Group-Object Length"], "a": 1, "e": "Measure-Object sin -Sum solo cuenta; con -Property Length -Sum suma tamaños."}, {"id": 77, "t": "PS-2.3", "q": "¿Qué principio de rendimiento se conoce como \"filter left\"?", "o": ["Usar siempre Format-Table antes de filtrar", "Filtrar solo en la parte izquierda de la pantalla", "Poner Where-Object siempre al final", "Filtrar lo antes posible, preferiblemente en el propio cmdlet de origen"], "a": 3, "e": "Ej.: Get-ADUser -Filter ... en lugar de traer todos los usuarios y luego usar Where-Object."}, {"id": 78, "t": "PS-2.3", "q": "¿Qué cmdlet agrupa servicios por su estado y muestra cuántos hay en cada grupo?", "o": ["Sort-Object Status -Count", "Group-Object Status", "Select-Object Status -Unique", "Measure-Object Status"], "a": 1, "e": "Group-Object devuelve grupos con Count, Name y Group."}, {"id": 79, "t": "PS-2.3", "q": "¿Para qué sirve @{Name='MB'; Expression={ $_.WorkingSet64 / 1MB }} en Select-Object?", "o": ["Para definir un alias", "Para crear un filtro", "Para ordenar por memoria", "Para crear una propiedad calculada"], "a": 3, "e": "Las propiedades calculadas añaden columnas con nombre y expresión propias."}, {"id": 80, "t": "PS-2.3", "q": "¿Qué cmdlet compara el contenido de dos ficheros mostrando las diferencias con <= y =>?", "o": ["Compare-Object", "Select-String -Compare", "Measure-Object", "Diff-Object"], "a": 0, "e": "Compare-Object (alias diff/compare) indica con => los que solo están en la diferencia y <= los de la referencia."}, {"id": 81, "t": "PS-2.3", "q": "¿Qué hace Select-Object -Unique?", "o": ["Ordena alfabéticamente", "Elimina duplicados", "Cuenta los distintos", "Selecciona el primer elemento"], "a": 1, "e": "-Unique devuelve solo valores distintos (distinguiendo mayúsculas)."}, {"id": 82, "t": "PS-2.4", "q": "¿Qué parámetro evita la línea #TYPE al exportar a CSV en Windows PowerShell 5.1?", "o": ["-NoClobber", "-Raw", "-NoHeader", "-NoTypeInformation"], "a": 3, "e": "En 5.1 Export-Csv añade #TYPE por defecto; desde PowerShell 6 ya no."}, {"id": 83, "t": "PS-2.4", "q": "¿Qué codificación usa por defecto Out-File (o >) en Windows PowerShell 5.1?", "o": ["UTF-8 sin BOM", "ASCII", "UTF-16LE (Unicode)", "ISO-8859-1"], "a": 2, "e": "En PowerShell 7 la codificación por defecto pasó a ser UTF-8 sin BOM."}, {"id": 84, "t": "PS-2.4", "q": "¿Cuál es la profundidad por defecto de ConvertTo-Json?", "o": ["10", "Ilimitada", "1", "2"], "a": 3, "e": "Con -Depth se aumenta; si no, los objetos más anidados se convierten a texto."}, {"id": 85, "t": "PS-2.4", "q": "¿Qué cmdlet convierte cada fila de un CSV en un objeto?", "o": ["Read-Csv", "Get-Content", "ConvertFrom-String", "Import-Csv"], "a": 3, "e": "Import-Csv crea objetos con propiedades igual a las cabeceras."}, {"id": 86, "t": "PS-2.4", "q": "¿Qué cmdlet abre una ventana gráfica interactiva con los resultados?", "o": ["Out-Host", "Out-GridView", "Show-Table", "Format-Window"], "a": 1, "e": "Out-GridView muestra una tabla filtrable (solo en Windows con GUI)."}, {"id": 87, "t": "PS-2.4", "q": "¿Qué hace 2>&1?", "o": ["Compara dos valores", "Redirige el flujo de errores (2) al de salida (1)", "Escribe dos veces el resultado", "Envía la salida al fichero 1"], "a": 1, "e": "2 es el flujo de error y 1 la salida estándar."}, {"id": 88, "t": "PS-2.4", "q": "¿Por qué Write-Host no es la mejor opción para devolver datos en un script?", "o": ["Porque borra la pantalla", "Escribe en pantalla y su salida no pasa por el pipeline como Write-Output", "Porque no existe en PowerShell 7", "Porque solo admite números"], "a": 1, "e": "Write-Host va al host (flujo Information); para devolver objetos se usa Write-Output o simplemente dejar el valor."}, {"id": 89, "t": "PS-2.4", "q": "¿Qué par de cmdlets serializa y recupera objetos completos conservando tipos?", "o": ["ConvertTo-Html y ConvertFrom-Html", "Out-File y Get-Content", "Export-Csv e Import-Csv", "Export-Clixml e Import-Clixml"], "a": 3, "e": "Clixml guarda el objeto con sus propiedades y tipos en XML."}, {"id": 90, "t": "PS-2.4", "q": "¿Qué cmdlet descarta la salida de un comando?", "o": ["Clear-Output", "Remove-Output", "Out-Null", "Out-Void"], "a": 2, "e": "Out-Null (o asignar a $null / [void]) suprime la salida."}, {"id": 91, "t": "PS-2.4", "q": "¿Qué número tiene el flujo Verbose en PowerShell?", "o": ["2", "3", "6", "4"], "a": 3, "e": "Flujos: 1 Output, 2 Error, 3 Warning, 4 Verbose, 5 Debug, 6 Information."}, {"id": 92, "t": "PS-3.1", "q": "¿Qué cmdlet cambia el tipo de inicio de un servicio a Deshabilitado?", "o": ["Stop-Service -Name Spooler -Disable", "Disable-Service -Name Spooler", "Set-Service -Name Spooler -StartupType Disabled", "Set-Service -Name Spooler -Status Disabled"], "a": 2, "e": "-StartupType admite Automatic, Manual, Disabled (y otros); -Status cambia el estado actual."}, {"id": 93, "t": "PS-3.1", "q": "¿Qué sintaxis de sc es correcta para deshabilitar el servicio Spooler?", "o": ["sc config Spooler start= disabled", "sc set Spooler disabled", "sc config Spooler start=disabled", "sc config Spooler -start disabled"], "a": 0, "e": "sc exige un espacio DESPUÉS del signo igual: start= disabled."}, {"id": 94, "t": "PS-3.1", "q": "En PowerShell 7, ¿cómo consultas un servicio de un equipo remoto?", "o": ["Get-RemoteService SRV01 Spooler", "Get-Service \\\\SRV01\\Spooler", "Get-Service -ComputerName SRV01 -Name Spooler", "Invoke-Command -ComputerName SRV01 -ScriptBlock { Get-Service Spooler }"], "a": 3, "e": "PowerShell 7 eliminó -ComputerName de Get-Service; se usa remoting."}, {"id": 95, "t": "PS-3.1", "q": "¿Qué parámetro necesita Stop-Service para detener un servicio con servicios dependientes en ejecución?", "o": ["-Force", "-Confirm", "-Dependent", "-Recurse"], "a": 0, "e": "Sin -Force falla si hay dependientes activos."}, {"id": 96, "t": "PS-3.1", "q": "¿Cómo se inicia PowerShell con privilegios de administrador desde otra consola?", "o": ["Start-Process powershell -Admin", "Start-Process powershell -Verb RunAs", "Start-Process powershell -Elevated", "runas powershell /admin"], "a": 1, "e": "-Verb RunAs solicita elevación (UAC)."}, {"id": 97, "t": "PS-3.1", "q": "¿Qué comando de cmd termina forzosamente el proceso con PID 4321?", "o": ["taskkill /PID 4321 /F", "tasklist /kill 4321", "sc stop 4321", "kill -9 4321"], "a": 0, "e": "taskkill /PID … /F; por nombre: taskkill /IM notepad.exe /F."}, {"id": 98, "t": "PS-3.1", "q": "¿Qué clase CIM permite ver la cuenta con la que se ejecuta un servicio (StartName)?", "o": ["Win32_Service", "Win32_ServiceAccount", "Win32_Process", "Win32_ComputerSystem"], "a": 0, "e": "Get-Service no muestra la cuenta; Win32_Service tiene StartName y PathName."}, {"id": 99, "t": "PS-3.1", "q": "¿Qué parámetro de Get-Process muestra el usuario propietario de cada proceso (requiere elevación)?", "o": ["-ShowUser", "-User", "-Owner", "-IncludeUserName"], "a": 3, "e": "Get-Process -IncludeUserName añade la columna UserName."}, {"id": 100, "t": "PS-3.1", "q": "¿Qué hace Start-Process msiexec.exe -ArgumentList \"/i app.msi /qn\" -Wait?", "o": ["Instala app.msi en segundo plano sin esperar", "Muestra la ayuda de msiexec", "Desinstala app.msi", "Instala app.msi en modo silencioso y espera a que termine"], "a": 3, "e": "/i instala, /qn sin interfaz, -Wait espera al proceso."}, {"id": 101, "t": "PS-3.1", "q": "¿Qué cmdlet muestra los servicios configurados como automáticos que están detenidos?", "o": ["Get-Service -StartType Automatic -Stopped", "Get-Service | Where-Object StartType -eq Automatic | Where-Object Status -ne Running", "Get-Service -Filter \"Automatic and Stopped\"", "Get-Service | Where-Object Status -eq Automatic"], "a": 1, "e": "Se filtra por StartType y por Status."}, {"id": 102, "t": "PS-3.2", "q": "¿Qué PSDrives del registro existen por defecto?", "o": ["HKLM: y HKCU:", "REG: y REGISTRY:", "HKLM:, HKCU:, HKCR:, HKU: y HKCC:", "Solo HKLM:"], "a": 0, "e": "HKCR, HKU y HKCC no tienen unidad por defecto; se accede con Registry::HKEY_USERS o creando una con New-PSDrive."}, {"id": 103, "t": "PS-3.2", "q": "En el proveedor del registro, ¿cómo se leen los valores de una clave?", "o": ["Con Get-Item -Value", "Con Get-ChildItem", "Con Get-Content", "Con Get-ItemProperty"], "a": 3, "e": "Las claves son elementos (Get-ChildItem/New-Item); los valores son propiedades (Get-/Set-/New-ItemProperty)."}, {"id": 104, "t": "PS-3.2", "q": "¿Qué comando crea un valor DWORD llamado Version con valor 1 en HKCU:\\Software\\MiApp?", "o": ["Add-Content HKCU:\\Software\\MiApp Version=1", "New-ItemProperty -Path HKCU:\\Software\\MiApp -Name Version -Value 1 -PropertyType DWord", "Set-Item HKCU:\\Software\\MiApp -Name Version -Type DWORD 1", "New-Item -Path HKCU:\\Software\\MiApp\\Version -Value 1"], "a": 1, "e": "New-ItemProperty con -PropertyType (String, ExpandString, Binary, DWord, MultiString, QWord)."}, {"id": 105, "t": "PS-3.2", "q": "¿Qué valor del registro hay que poner a 0 para habilitar el Escritorio remoto?", "o": ["EnableRDP en HKLM:\\SOFTWARE\\Microsoft\\RDP", "fAllowRDP en HKCU:\\Control Panel", "RDPEnabled en HKLM:\\SYSTEM\\Setup", "fDenyTSConnections en HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server"], "a": 3, "e": "fDenyTSConnections = 1 deniega; 0 permite."}, {"id": 106, "t": "PS-3.2", "q": "¿Qué unidad PS da acceso al almacén de certificados?", "o": ["PKI:", "CA:", "Certs:", "Cert:"], "a": 3, "e": "Ej.: Get-ChildItem Cert:\\LocalMachine\\My."}, {"id": 107, "t": "PS-3.2", "q": "¿Cómo se listan las variables de entorno en PowerShell?", "o": ["Get-ChildItem Env:", "Get-Environment", "Get-Variable -Environment", "set"], "a": 0, "e": "El proveedor Environment expone la unidad Env:. En cmd se usa set."}, {"id": 108, "t": "PS-3.2", "q": "¿Qué comando de cmd añade un valor DWORD al registro?", "o": ["regedit /add HKLM\\Software\\MiApp Activo 1", "reg new HKLM\\Software\\MiApp /dword Activo 1", "reg set HKLM\\Software\\MiApp Activo=1", "reg add HKLM\\Software\\MiApp /v Activo /t REG_DWORD /d 1 /f"], "a": 3, "e": "reg add con /v nombre, /t tipo, /d dato y /f para forzar."}, {"id": 109, "t": "PS-3.2", "q": "¿Qué cmdlet mapea \\\\srv01\\datos como unidad Z: persistente visible en el Explorador?", "o": ["New-PSDrive -Name Z -PSProvider FileSystem -Root \\\\srv01\\datos -Persist", "Set-Location Z:\\\\srv01\\datos", "New-PSDrive -Name Z: -Path \\\\srv01\\datos -Permanent", "Mount-Drive Z \\\\srv01\\datos"], "a": 0, "e": "-Persist crea una unidad de red de Windows (solo con letra de unidad y proveedor FileSystem)."}, {"id": 110, "t": "PS-3.3", "q": "¿Qué tipo de dato exige el parámetro -Password de New-LocalUser?", "o": ["PSCredential", "String", "SecureString", "Byte[]"], "a": 2, "e": "Se obtiene con Read-Host -AsSecureString o ConvertTo-SecureString."}, {"id": 111, "t": "PS-3.3", "q": "En un Windows en español, ¿qué comando añade al usuario soporte al grupo de administradores locales?", "o": ["net group Administradores soporte /add", "Add-ADGroupMember -Identity \"Administradores\" -Members soporte", "Add-LocalGroupMember -Group \"Administradores\" -Member soporte", "Add-LocalGroupMember -Group \"Administrators\" -Member soporte"], "a": 2, "e": "El nombre del grupo está localizado; para independizarse del idioma, usar el SID S-1-5-32-544."}, {"id": 112, "t": "PS-3.3", "q": "¿Qué SID corresponde al grupo local Administradores?", "o": ["S-1-5-21-…-500", "S-1-5-32-545", "S-1-5-18", "S-1-5-32-544"], "a": 3, "e": "544 Administradores, 545 Usuarios; S-1-5-18 es LocalSystem; RID 500 es la cuenta Administrador integrada."}, {"id": 113, "t": "PS-3.3", "q": "¿Qué RID tiene la cuenta integrada de Administrador?", "o": ["501", "1000", "500", "512"], "a": 2, "e": "500 Administrador, 501 Invitado, 512 Domain Admins; las cuentas creadas empiezan normalmente en 1000 (o 1100 en dominio)."}, {"id": 114, "t": "PS-3.3", "q": "¿Qué comando de cmd deshabilita el usuario local soporte?", "o": ["net localgroup soporte /disabled", "net user soporte /disable", "net user soporte /delete", "net user soporte /active:no"], "a": 3, "e": "/active:no deshabilita; /delete elimina."}, {"id": 115, "t": "PS-3.3", "q": "¿Qué consola gestiona usuarios y grupos locales?", "o": ["lusrmgr.msc", "usrmgr.cpl", "dsa.msc", "gpedit.msc"], "a": 0, "e": "dsa.msc es Usuarios y equipos de Active Directory (cuentas de dominio)."}, {"id": 116, "t": "PS-3.3", "q": "¿Qué cmdlet hace que la contraseña de un usuario local no caduque?", "o": ["Set-LocalUser -Name soporte -PasswordExpires $false", "net user soporte /expires:never", "Set-LocalUser -Name soporte -PasswordNeverExpires $true", "Set-ADUser soporte -PasswordNeverExpires $true"], "a": 2, "e": "Para cuentas locales es Set-LocalUser; net user /expires:never afecta a la caducidad de la CUENTA, no de la contraseña."}, {"id": 117, "t": "PS-3.3", "q": "¿Qué RID tiene el grupo Domain Admins?", "o": ["519", "512", "518", "500"], "a": 1, "e": "512 Domain Admins, 518 Schema Admins, 519 Enterprise Admins."}, {"id": 118, "t": "PS-3.4", "q": "¿Qué comando inicializa el disco 1 con estilo de partición GPT?", "o": ["Initialize-Disk -Number 1 -PartitionStyle GPT", "Set-Disk -Number 1 -PartitionStyle GPT", "New-Disk -Number 1 -Style GPT", "Format-Disk -Number 1 -GPT"], "a": 0, "e": "Initialize-Disk prepara un disco RAW con MBR o GPT."}, {"id": 119, "t": "PS-3.4", "q": "¿Qué cmdlet crea una partición usando todo el espacio y le asigna la letra E?", "o": ["New-Volume -Disk 1 -Max -Letter E", "Format-Volume -DiskNumber 1 -DriveLetter E -Full", "Add-Partition -Disk 1 -Size Max -Letter E", "New-Partition -DiskNumber 1 -UseMaximumSize -DriveLetter E"], "a": 3, "e": "New-Partition con -UseMaximumSize y -DriveLetter (o -AssignDriveLetter)."}, {"id": 120, "t": "PS-3.4", "q": "¿Qué valor de DriveType identifica un disco local fijo en Win32_LogicalDisk?", "o": ["4", "3", "5", "2"], "a": 1, "e": "2 extraíble, 3 local fijo, 4 red, 5 CD-ROM."}, {"id": 121, "t": "PS-3.4", "q": "En Windows PowerShell 5.1, ¿qué cmdlet une un equipo al dominio y lo reinicia?", "o": ["New-ADComputer -Join -Restart", "Add-Computer -DomainName age.local -Credential AGE\\admin -Restart", "Set-Computer -Domain age.local", "Join-Domain -Name age.local -Restart"], "a": 1, "e": "Add-Computer une; Remove-Computer saca del dominio; New-ADComputer solo crea la cuenta en AD. Add-Computer no existe en PowerShell 7."}, {"id": 122, "t": "PS-3.4", "q": "¿Qué cmdlet muestra las actualizaciones (KB) instaladas?", "o": ["Get-HotFix", "Get-WindowsUpdate", "Get-Patch", "Get-Update -Installed"], "a": 0, "e": "Get-HotFix consulta Win32_QuickFixEngineering. Get-WindowsUpdate no es nativo (módulo de terceros PSWindowsUpdate)."}, {"id": 123, "t": "PS-3.4", "q": "¿Cuál es el identificador de zona horaria de Windows para Madrid (UTC+01:00)?", "o": ["Romance Standard Time", "Spain Standard Time", "W. Europe Standard Time", "Central European Standard Time"], "a": 0, "e": "\"Romance Standard Time\" corresponde a Bruselas, Copenhague, Madrid, París."}, {"id": 124, "t": "PS-3.4", "q": "¿Qué orden de diskpart convierte un disco vacío a GPT?", "o": ["create gpt", "set gpt", "convert gpt", "format gpt"], "a": 2, "e": "Previamente hay que seleccionar el disco (select disk N) y, si tiene datos, limpiarlo (clean)."}, {"id": 125, "t": "PS-3.4", "q": "¿Qué hace shutdown /a?", "o": ["Cancela un apagado programado", "Cierra la sesión", "Apaga inmediatamente", "Reinicia en modo avanzado"], "a": 0, "e": "/a aborta; /s apaga; /r reinicia; /t segundos de espera."}, {"id": 126, "t": "PS-3.4", "q": "¿Qué cmdlet muestra los tamaños mínimo y máximo a los que se puede redimensionar una partición?", "o": ["Get-PartitionSupportedSize", "Get-Partition -Sizes", "Resize-Partition -WhatIf", "Get-Volume -SupportedSize"], "a": 0, "e": "Devuelve SizeMin y SizeMax para Resize-Partition."}, {"id": 127, "t": "PS-3.5", "q": "¿Qué cmdlet sustituye a Get-EventLog y funciona en PowerShell 7?", "o": ["Read-EventLog", "Get-EventLog -New", "Get-WinEvent", "Get-Event"], "a": 2, "e": "Get-EventLog no existe en PowerShell 7 y solo lee registros clásicos."}, {"id": 128, "t": "PS-3.5", "q": "¿Qué Event ID indica un inicio de sesión fallido?", "o": ["4740", "4625", "4634", "4624"], "a": 1, "e": "4624 correcto, 4625 fallido, 4740 bloqueo, 4634 cierre de sesión."}, {"id": 129, "t": "PS-3.5", "q": "¿Qué Event ID indica que una cuenta de usuario ha sido bloqueada?", "o": ["4740", "4767", "4771", "4725"], "a": 0, "e": "4767 es desbloqueo; 4725 deshabilitada; 4771 fallo de preautenticación Kerberos."}, {"id": 130, "t": "PS-3.5", "q": "¿En qué controlador de dominio se busca el evento 4740 para todo el dominio?", "o": ["En el maestro de esquema", "En cualquier catálogo global", "En el maestro RID", "En el que tiene el rol de emulador de PDC"], "a": 3, "e": "Los bloqueos se procesan de forma urgente en el PDC emulador."}, {"id": 131, "t": "PS-3.5", "q": "¿Qué evento indica que se ha borrado el registro de auditoría de seguridad?", "o": ["104", "6005", "4624", "1102"], "a": 3, "e": "1102 en el registro Security (104 es el borrado de otros registros en System)."}, {"id": 132, "t": "PS-3.5", "q": "¿Qué evento del registro Sistema indica un apagado inesperado anterior?", "o": ["6005", "7036", "6008", "6006"], "a": 2, "e": "6005/6006 inicio/parada del servicio de registro de eventos; 7036 cambio de estado de un servicio."}, {"id": 133, "t": "PS-3.5", "q": "En un evento 4624, ¿qué tipo de inicio de sesión (Logon Type) corresponde a Escritorio remoto?", "o": ["2", "5", "3", "10"], "a": 3, "e": "2 interactivo, 3 red, 5 servicio, 10 RemoteInteractive (RDP)."}, {"id": 134, "t": "PS-3.5", "q": "¿Cuál es la forma más eficiente de obtener los eventos 4625 del último día?", "o": ["Get-WinEvent -LogName Security | Where-Object Id -eq 4625", "Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625; StartTime=(Get-Date).AddDays(-1)}", "Get-WinEvent -Id 4625 -Last 1d", "Get-EventLog Security | Select-Object -First 4625"], "a": 1, "e": "-FilterHashtable filtra en el origen; Where-Object descarga todos los eventos y luego filtra."}, {"id": 135, "t": "PS-3.5", "q": "¿Qué valor de Level corresponde a los eventos de Error en -FilterHashtable?", "o": ["3", "2", "1", "4"], "a": 1, "e": "1 Crítico, 2 Error, 3 Advertencia, 4 Información."}, {"id": 136, "t": "PS-3.5", "q": "¿Qué Event ID registra que un usuario ha sido añadido a un grupo de seguridad global?", "o": ["4732", "4756", "4720", "4728"], "a": 3, "e": "4728 global, 4732 local de dominio/local, 4756 universal; 4720 es creación de usuario."}, {"id": 137, "t": "PS-3.5", "q": "¿Qué comando de cmd consulta eventos del registro System en texto?", "o": ["wevtutil qe System /c:5 /f:text /rd:true", "logman query System", "eventvwr /query System", "evtquery System -5"], "a": 0, "e": "wevtutil qe (query-events); /rd:true en orden inverso (más recientes primero)."}, {"id": 138, "t": "PS-3.5", "q": "¿Qué Event ID del registro Sistema indica que un proceso o usuario inició un apagado o reinicio?", "o": ["41", "7034", "1074", "6008"], "a": 2, "e": "41 Kernel-Power: reinicio sin apagado limpio; 1074 registra quién/qué inició el apagado."}, {"id": 139, "t": "PS-4.1", "q": "¿Qué diferencia hay entre do { } while (cond) y do { } until (cond)?", "o": ["while repite mientras cond sea verdadera; until repite hasta que cond sea verdadera", "until no se ejecuta nunca si la condición es falsa al inicio", "while no ejecuta el bloque si la condición es falsa al inicio", "Son idénticos"], "a": 0, "e": "Ambos ejecutan el bloque al menos una vez."}, {"id": 140, "t": "PS-4.1", "q": "En un switch sin break, si un valor coincide con dos condiciones, ¿qué ocurre?", "o": ["Da error de ambigüedad", "Se ejecutan ambas ramas", "Solo se ejecuta la primera", "Solo se ejecuta la última"], "a": 1, "e": "switch en PowerShell evalúa todas las condiciones salvo que se use break."}, {"id": 141, "t": "PS-4.1", "q": "¿Qué parámetro de switch permite usar comodines como 'srv*'?", "o": ["-Like", "-Regex", "-Wildcard", "-Match"], "a": 2, "e": "-Wildcard usa comodines; -Regex usa expresiones regulares."}, {"id": 142, "t": "PS-4.1", "q": "¿Qué ventaja tiene ForEach-Object frente a la sentencia foreach?", "o": ["Procesa los objetos en streaming, uno a uno, usando menos memoria", "Permite usar break dentro", "Es siempre más rápido", "No necesita llaves"], "a": 0, "e": "La sentencia foreach carga toda la colección y suele ser más rápida pero usa más memoria."}, {"id": 143, "t": "PS-4.1", "q": "¿Qué palabra clave salta a la siguiente iteración del bucle?", "o": ["break", "continue", "skip", "next"], "a": 1, "e": "break sale del bucle; continue pasa a la siguiente vuelta."}, {"id": 144, "t": "PS-4.1", "q": "¿Cuál es la sintaxis correcta de un bucle for en PowerShell?", "o": ["for i in 0..9 { $i }", "for ($i = 0; $i -lt 10; $i++) { $i }", "for ($i = 0 to 10) { $i }", "for ($i = 0; $i < 10; $i++) { $i }"], "a": 1, "e": "< es redirección en PowerShell; se usa -lt."}, {"id": 145, "t": "PS-4.2", "q": "¿Qué atributo convierte una función en \"función avanzada\" con -Verbose, -ErrorAction, etc.?", "o": ["[OutputType()]", "[AdvancedFunction()]", "[CmdletBinding()]", "[Parameter()]"], "a": 2, "e": "[CmdletBinding()] añade los parámetros comunes."}, {"id": 146, "t": "PS-4.2", "q": "¿Cómo se llama correctamente a la función MiFuncion con los argumentos 1 y 2?", "o": ["MiFuncion(1 2)", "call MiFuncion 1,2", "MiFuncion(1, 2)", "MiFuncion 1 2"], "a": 3, "e": "MiFuncion(1,2) pasa un único array de dos elementos como primer argumento."}, {"id": 147, "t": "PS-4.2", "q": "¿Qué atributo restringe un parámetro a una lista de valores permitidos?", "o": ["[ValidatePattern('C','D','E')]", "[ValidateSet('C','D','E')]", "[ValidateRange('C','E')]", "[AllowedValues('C','D','E')]"], "a": 1, "e": "ValidateSet limita a valores fijos (y habilita el autocompletado con Tab)."}, {"id": 148, "t": "PS-4.2", "q": "En una función avanzada, ¿qué bloque se ejecuta una vez por cada objeto recibido del pipeline?", "o": ["foreach", "process", "end", "begin"], "a": 1, "e": "begin se ejecuta una vez al principio, end al final, process por cada objeto."}, {"id": 149, "t": "PS-4.2", "q": "¿Qué hace . .\\funciones.ps1 (dot sourcing)?", "o": ["Abre el script en el editor", "Firma el script", "Ejecuta el script en el ámbito actual, de modo que sus funciones y variables quedan disponibles", "Ejecuta el script en segundo plano"], "a": 2, "e": "Sin el punto, el script se ejecuta en su propio ámbito y sus definiciones desaparecen al terminar."}, {"id": 150, "t": "PS-4.2", "q": "¿Qué variable contiene la ruta del script de perfil de PowerShell?", "o": ["$PSHOME", "$HOME\\profile", "$PROFILE", "$env:PSProfile"], "a": 2, "e": "$PROFILE apunta al perfil del usuario actual en el host actual."}, {"id": 151, "t": "PS-4.2", "q": "¿Qué palabra clave de la ayuda basada en comentarios define un ejemplo?", "o": [".EXAMPLE", ".USAGE", ".SAMPLE", ".DEMO"], "a": 0, "e": "Comment-based help usa .SYNOPSIS, .DESCRIPTION, .PARAMETER, .EXAMPLE, .NOTES…"}, {"id": 152, "t": "PS-4.2", "q": "¿Qué modificador de ámbito permite usar una variable local dentro de Invoke-Command o ForEach-Object -Parallel?", "o": ["$remote:", "$script:", "$global:", "$using:"], "a": 3, "e": "$using:variable pasa el valor local al bloque remoto o paralelo."}, {"id": 153, "t": "PS-4.3", "q": "¿Por qué un try/catch no captura el error de Get-ChildItem C:\\noexiste?", "o": ["Porque Get-ChildItem nunca genera errores", "Porque catch solo funciona con throw", "Porque es un error no terminal; hay que añadir -ErrorAction Stop", "Porque falta el bloque finally"], "a": 2, "e": "try/catch solo captura errores terminales."}, {"id": 154, "t": "PS-4.3", "q": "¿Qué bloque se ejecuta siempre, haya error o no?", "o": ["finally", "catch", "end", "trap"], "a": 0, "e": "finally se ejecuta al final tanto si hay excepción como si no."}, {"id": 155, "t": "PS-4.3", "q": "¿Qué valor de -ErrorAction oculta el error pero lo sigue guardando en $Error?", "o": ["Ignore", "Inquire", "SilentlyContinue", "Stop"], "a": 2, "e": "Ignore tampoco lo guarda en $Error."}, {"id": 156, "t": "PS-4.3", "q": "¿Qué genera un error terminal?", "o": ["Write-Verbose \"mensaje\"", "Write-Warning \"mensaje\"", "Write-Error \"mensaje\"", "throw \"mensaje\""], "a": 3, "e": "throw genera excepción terminal; Write-Error, por defecto, no terminal."}, {"id": 157, "t": "PS-4.3", "q": "¿Cómo se comprueba si un ejecutable externo (.exe) ha terminado correctamente?", "o": ["Con try/catch", "Revisando $LASTEXITCODE (0 = correcto)", "Con Get-Error -Exe", "Con $Error.Count"], "a": 1, "e": "Los programas externos no lanzan excepciones de PowerShell."}, {"id": 158, "t": "PS-4.3", "q": "¿Qué hace $ErrorActionPreference = 'Stop' al principio de un script?", "o": ["Convierte por defecto todos los errores no terminales en terminales", "Oculta todos los errores", "Impide ejecutar el script", "Detiene el script inmediatamente"], "a": 0, "e": "Cambia el valor por defecto de -ErrorAction para toda la sesión/ámbito."}, {"id": 159, "t": "PS-4.3", "q": "¿Qué cmdlet muestra un mensaje solo cuando se ejecuta la función con -Verbose?", "o": ["Write-Verbose", "Write-Information", "Write-Debug", "Write-Host"], "a": 0, "e": "Write-Verbose escribe en el flujo 4, visible con -Verbose o $VerbosePreference."}, {"id": 160, "t": "PS-4.4", "q": "¿Qué extensión tiene un módulo de script de PowerShell?", "o": [".psd1", ".psm1", ".ps1", ".pssc"], "a": 1, "e": ".psm1 módulo, .psd1 manifiesto, .ps1 script, .pssc configuración de sesión JEA."}, {"id": 161, "t": "PS-4.4", "q": "¿Qué variable de entorno indica dónde busca PowerShell los módulos?", "o": ["$env:PSHOME", "$env:PSModulePath", "$env:ModulesDir", "$env:PATH"], "a": 1, "e": "Contiene las rutas de usuario, de todos los usuarios y del sistema."}, {"id": 162, "t": "PS-4.4", "q": "¿Qué cmdlet instala un módulo de la PowerShell Gallery solo para el usuario actual?", "o": ["Install-Module -Name Pester -Scope CurrentUser", "Get-Module Pester -Install", "Import-Module Pester -Scope CurrentUser", "Add-Module Pester -User"], "a": 0, "e": "Import-Module carga uno ya instalado; Install-Module lo descarga."}, {"id": 163, "t": "PS-4.4", "q": "¿Qué cmdlet de PSResourceGet (incluido desde PowerShell 7.4) instala recursos?", "o": ["Install-Package", "Get-PSResource -Install", "Install-PSResource", "Add-PSResource"], "a": 2, "e": "PSResourceGet es el sucesor de PowerShellGet."}, {"id": 164, "t": "PS-4.4", "q": "¿Qué hay que instalar en un servidor miembro para usar Get-ADUser?", "o": ["Nada, viene siempre instalado", "RSAT con el módulo de AD (Install-WindowsFeature RSAT-AD-PowerShell)", "PowerShell 7", "El rol AD-Domain-Services completo obligatoriamente"], "a": 1, "e": "El módulo ActiveDirectory forma parte de RSAT; no hace falta promover el servidor a DC."}, {"id": 165, "t": "PS-4.4", "q": "¿Qué cmdlet lista los módulos instalados aunque no estén cargados?", "o": ["Get-Module -ListAvailable", "Get-InstalledModule -Loaded", "Get-Module", "Find-Module"], "a": 0, "e": "Sin -ListAvailable, Get-Module solo muestra los cargados en la sesión. Find-Module busca en la galería."}, {"id": 166, "t": "PS-4.4", "q": "¿Cómo aparece por defecto el repositorio PSGallery en Get-PSRepository?", "o": ["Blocked", "Disabled", "Trusted", "Untrusted"], "a": 3, "e": "Por eso Install-Module pide confirmación salvo que se marque como de confianza."}, {"id": 167, "t": "PS-4.5", "q": "¿Qué parámetro evita que Receive-Job borre los resultados tras leerlos?", "o": ["-Persist", "-Keep", "-Save", "-NoClear"], "a": 1, "e": "Sin -Keep los resultados se vacían al recibirlos."}, {"id": 168, "t": "PS-4.5", "q": "¿En qué versión está disponible ForEach-Object -Parallel?", "o": ["Solo en PowerShell ISE", "Windows PowerShell 5.1", "PowerShell 7 o posterior", "Desde PowerShell 3.0"], "a": 2, "e": "Fue una novedad de PowerShell 7.0."}, {"id": 169, "t": "PS-4.5", "q": "¿Cuál es el valor por defecto de -ThrottleLimit en ForEach-Object -Parallel?", "o": ["Ilimitado", "5", "10", "32"], "a": 1, "e": "5 hilos simultáneos (Invoke-Command usa 32 por defecto)."}, {"id": 170, "t": "PS-4.5", "q": "¿Qué cmdlet crea el desencadenador de una tarea programada diaria a las 2:00?", "o": ["New-ScheduledTaskTrigger -Daily -At 2am", "New-JobTrigger -Every 24h", "New-ScheduledTaskAction -Daily -At 2am", "Register-ScheduledTask -Daily 2am"], "a": 0, "e": "Action = qué ejecutar; Trigger = cuándo; Register-ScheduledTask lo registra."}, {"id": 171, "t": "PS-4.5", "q": "¿Qué comando de cmd crea una tarea diaria a las 02:00 como SYSTEM?", "o": ["schtasks /add Backup C:\\backup.bat daily 02:00", "schtasks /create /tn \"Backup\" /tr \"C:\\backup.bat\" /sc daily /st 02:00 /ru SYSTEM", "at 02:00 C:\\backup.bat /every:daily", "taskschd /create Backup daily"], "a": 1, "e": "at está obsoleto; schtasks /create con /sc (frecuencia) y /st (hora)."}, {"id": 172, "t": "PS-4.5", "q": "¿Qué cmdlet obtiene los resultados de un trabajo en segundo plano?", "o": ["Receive-Job", "Get-Job -Output", "Read-Job", "Wait-Job"], "a": 0, "e": "Get-Job lista trabajos; Wait-Job espera; Receive-Job devuelve la salida."}, {"id": 173, "t": "PS-5.1", "q": "¿Qué puertos usa WinRM por defecto?", "o": ["80 y 443", "3389 y 3390", "5985 (HTTP) y 5986 (HTTPS)", "445 y 139"], "a": 2, "e": "WS-Management de Windows escucha en 5985/5986."}, {"id": 174, "t": "PS-5.1", "q": "¿Qué cmdlet abre una sesión interactiva 1 a 1 con un equipo remoto?", "o": ["Enter-PSSession", "New-CimSession", "Connect-PSSession -Interactive", "Invoke-Command"], "a": 0, "e": "Invoke-Command es para ejecutar en uno o muchos equipos de forma no interactiva."}, {"id": 175, "t": "PS-5.1", "q": "¿Cuántos equipos procesa Invoke-Command en paralelo por defecto?", "o": ["64", "5", "32", "1"], "a": 2, "e": "-ThrottleLimit por defecto es 32."}, {"id": 176, "t": "PS-5.1", "q": "¿Qué afirmación sobre el remoting de PowerShell en Windows Server 2012 y posteriores es correcta?", "o": ["No existe; solo hay SSH", "Solo funciona con HTTPS", "Está habilitado por defecto", "Está deshabilitado y requiere Enable-PSRemoting"], "a": 2, "e": "En servidores está activo por defecto; en clientes hay que ejecutar Enable-PSRemoting."}, {"id": 177, "t": "PS-5.1", "q": "En un dominio, aunque WinRM use el puerto 5985 (HTTP), ¿cómo se protege el tráfico?", "o": ["Se cifra con NTLMv1", "Viaja en claro", "Va cifrado con Kerberos", "Se cifra con TLS automáticamente"], "a": 2, "e": "La autenticación Kerberos/Negotiate cifra el contenido aunque el transporte sea HTTP."}, {"id": 178, "t": "PS-5.1", "q": "¿Qué configuración se necesita para hacer remoting a un equipo fuera del dominio usando su IP con HTTP?", "o": ["Añadirlo a TrustedHosts (WSMan:\\localhost\\Client\\TrustedHosts)", "Abrir el puerto 3389", "Añadirlo al grupo Domain Admins", "Usar Enter-PSSession -Kerberos"], "a": 0, "e": "Por IP no se puede usar Kerberos; con NTLM hay que confiar en el host o usar HTTPS."}, {"id": 179, "t": "PS-5.1", "q": "¿Qué es el problema del \"doble salto\" (second hop)?", "o": ["No se puede abrir más de dos sesiones remotas", "PowerShell 7 no puede conectar con 5.1", "Desde una sesión remota no se pueden usar tus credenciales para acceder a un tercer equipo", "WinRM solo admite dos saltos de router"], "a": 2, "e": "Las credenciales no se delegan por defecto; la solución recomendada es la delegación restringida basada en recursos."}, {"id": 180, "t": "PS-5.1", "q": "¿Qué cmdlet comprueba que el servicio WinRM de un equipo responde?", "o": ["Test-PSRemoting SRV01", "Test-WSMan -ComputerName SRV01", "Get-Service WinRM -ComputerName SRV01", "Test-Connection SRV01 -WinRM"], "a": 1, "e": "Test-WSMan envía una petición identify al servicio WS-Management."}, {"id": 181, "t": "PS-5.1", "q": "¿Qué parámetro de Enter-PSSession usa SSH en lugar de WinRM en PowerShell 7?", "o": ["-Transport SSH", "-HostName", "-ComputerName", "-SSH"], "a": 1, "e": "-HostName (con -UserName) usa SSH; -ComputerName usa WinRM."}, {"id": 182, "t": "PS-5.1", "q": "¿Qué propiedad añade Invoke-Command a los objetos devueltos?", "o": ["PSComputerName", "SourceName", "MachineName", "RemoteHost"], "a": 0, "e": "Los objetos deserializados incluyen PSComputerName para saber de qué equipo vienen."}, {"id": 183, "t": "PS-5.1", "q": "¿Qué característica tienen los objetos que devuelve Invoke-Command?", "o": ["Son idénticos a los locales", "Solo contienen el nombre del equipo", "Están deserializados: conservan propiedades pero no la mayoría de métodos", "Son texto plano"], "a": 2, "e": "Se serializan en XML para viajar por la red."}, {"id": 184, "t": "PS-5.1", "q": "¿Qué comando clásico configura rápidamente WinRM?", "o": ["wsman setup", "netsh winrm enable", "sc start winrm /config", "winrm quickconfig"], "a": 3, "e": "winrm quickconfig crea el listener y la regla de firewall (equivalente clásico de Enable-PSRemoting)."}, {"id": 185, "t": "PS-5.2", "q": "¿Qué cmdlet sustituye a Get-WmiObject y está disponible en PowerShell 7?", "o": ["Invoke-WmiMethod", "Get-WmiInstance", "Get-CimInstance", "Get-CimObject"], "a": 2, "e": "Get-WmiObject (DCOM) se eliminó en PowerShell 7."}, {"id": 186, "t": "PS-5.2", "q": "¿Qué protocolo usa por defecto Get-CimInstance para equipos remotos?", "o": ["RPC sobre HTTP", "WS-Management (WinRM)", "SMB", "DCOM"], "a": 1, "e": "Se puede forzar DCOM con New-CimSessionOption -Protocol Dcom."}, {"id": 187, "t": "PS-5.2", "q": "¿Qué clase CIM contiene el número de serie del equipo?", "o": ["Win32_Processor", "Win32_ComputerSystem", "Win32_BIOS", "Win32_OperatingSystem"], "a": 2, "e": "Win32_BIOS.SerialNumber."}, {"id": 188, "t": "PS-5.2", "q": "¿Qué propiedad de Win32_OperatingSystem indica cuándo arrancó el equipo?", "o": ["Uptime", "BootTime", "LastBootUpTime", "InstallDate"], "a": 2, "e": "LastBootUpTime da la fecha del último arranque."}, {"id": 189, "t": "PS-5.2", "q": "¿Por qué no se recomienda usar Win32_Product para inventariar software?", "o": ["Porque requiere PowerShell 2.0", "Porque es lenta y provoca una validación/reparación de cada producto MSI", "Porque no existe", "Porque solo muestra software de Microsoft"], "a": 1, "e": "Mejor leer las claves Uninstall del registro."}, {"id": 190, "t": "PS-5.2", "q": "¿Cómo se llama el lenguaje de consultas de WMI?", "o": ["LDAP", "WQL", "WMIQL", "SQL"], "a": 1, "e": "WMI Query Language, similar a SQL."}, {"id": 191, "t": "PS-5.2", "q": "¿Qué estado tiene la herramienta wmic en las versiones recientes de Windows?", "o": ["Obsoleta y en proceso de eliminación", "Es la herramienta recomendada", "Se ha integrado en PowerShell 7", "Solo funciona en Linux"], "a": 0, "e": "Microsoft la declaró en desuso; se debe usar PowerShell (CIM)."}, {"id": 192, "t": "PS-5.2", "q": "¿De qué estándar es WMI la implementación de Microsoft?", "o": ["CIM (Common Information Model) de la DMTF", "WBEM de Cisco", "SNMP del IETF", "LDAP de la ITU"], "a": 0, "e": "WMI implementa CIM/WBEM, estándares de la DMTF."}, {"id": 193, "t": "PS-5.3", "q": "¿Qué Event ID registra el contenido de los bloques de script ejecutados (Script Block Logging)?", "o": ["4104", "4688", "4103", "400"], "a": 0, "e": "4104 en Microsoft-Windows-PowerShell/Operational; 4103 es Module Logging."}, {"id": 194, "t": "PS-5.3", "q": "¿Qué cmdlet guarda en un fichero todo lo que ocurre en la sesión?", "o": ["Export-Console", "Start-Transcript", "Start-Log", "Out-File -Session"], "a": 1, "e": "Start-Transcript/Stop-Transcript; la transcripción también puede forzarse por GPO."}, {"id": 195, "t": "PS-5.3", "q": "¿Qué es JEA (Just Enough Administration)?", "o": ["Un tipo de licencia de PowerShell", "Una política de ejecución", "Puntos de conexión remotos restringidos que permiten a usuarios no administradores ejecutar solo ciertos comandos", "Un antivirus integrado"], "a": 2, "e": "Usa ficheros .psrc (capacidades de rol) y .pssc (configuración de sesión) con cuentas virtuales."}, {"id": 196, "t": "PS-5.3", "q": "¿Qué extensión tiene un fichero de capacidad de rol de JEA?", "o": [".psrc", ".psd1", ".pssc", ".psm1"], "a": 0, "e": ".psrc define qué cmdlets se permiten; .pssc define la configuración de sesión."}, {"id": 197, "t": "PS-5.3", "q": "¿Qué modo de lenguaje impone AppLocker/WDAC para limitar PowerShell?", "o": ["RestrictedLanguage", "FullLanguage", "ConstrainedLanguage", "SafeLanguage"], "a": 2, "e": "ConstrainedLanguage restringe tipos .NET, COM y llamadas a API."}, {"id": 198, "t": "PS-5.3", "q": "¿Qué cmdlet pide al usuario un nombre y contraseña y devuelve un objeto PSCredential?", "o": ["Get-Credential", "Read-Host -Credential", "ConvertTo-SecureString", "New-Credential"], "a": 0, "e": "Get-Credential abre un cuadro de diálogo o pide en consola."}, {"id": 199, "t": "PS-5.3", "q": "¿Por qué debe eliminarse PowerShe
