 "Obsoleto (deprecated): sigue disponible pero sin nuevas funciones", "Recién lanzado", "Sustituido por SCCM obligatoriamente"], "a": 1, "e": "Microsoft recomienda soluciones en la nube (Intune, Azure Update Manager) a largo plazo."}, {"id": 467, "t": "WS-4.4", "q": "¿Cuántas sesiones administrativas de Escritorio remoto admite un servidor sin el rol RDS?", "o": ["10", "1", "Ilimitadas con CAL", "2"], "a": 3, "e": "Para más usuarios hay que instalar RD Session Host y RDS CAL."}, {"id": 468, "t": "WS-4.4", "q": "¿Qué puerto usa la Puerta de enlace de Escritorio remoto (RD Gateway)?", "o": ["80", "3389", "443 (HTTPS)", "3391 exclusivamente"], "a": 2, "e": "Encapsula RDP en HTTPS para atravesar firewalls."}, {"id": 469, "t": "WS-4.4", "q": "¿Cuál es el periodo de gracia de licencias de RDS?", "o": ["90 días", "180 días", "120 días", "30 días"], "a": 2, "e": "Después hace falta un servidor de licencias con CAL de RDS."}, {"id": 470, "t": "WS-4.4", "q": "¿Qué rol de RDS reparte y reconecta sesiones entre varios hosts de sesión?", "o": ["Agente de conexión (Connection Broker)", "Puerta de enlace", "Licencias", "Acceso web"], "a": 0, "e": "Equilibra la carga y permite reconectar a sesiones desconectadas."}, {"id": 471, "t": "WS-4.4", "q": "¿Qué es NLA en Escritorio remoto?", "o": ["Autenticación a nivel de red, que exige autenticarse antes de crear la sesión", "Una VPN", "Un balanceador de carga", "Un tipo de licencia"], "a": 0, "e": "Reduce el consumo de recursos y la exposición a ataques."}, {"id": 472, "t": "WS-4.4", "q": "¿Qué puertos usa RADIUS (NPS) actualmente?", "o": ["TCP 49", "UDP 1645 y 1646 exclusivamente", "UDP 1812 (autenticación) y 1813 (contabilidad)", "TCP 389"], "a": 2, "e": "1645/1646 son los puertos antiguos; TCP 49 es TACACS+."}, {"id": 473, "t": "WS-4.4", "q": "¿Qué vulnerabilidad de 2021 motivó deshabilitar el servicio Spooler en los controladores de dominio?", "o": ["PrintNightmare", "Zerologon", "EternalBlue", "Log4Shell"], "a": 0, "e": "El Spooler permitía ejecución remota de código."}, {"id": 474, "t": "WS-4.4", "q": "¿Qué comando muestra las sesiones de usuarios en un servidor de Escritorio remoto?", "o": ["query user (o qwinsta)", "netstat -sessions", "whoami /sessions", "net session"], "a": 0, "e": "logoff <id> cierra una sesión."}, {"id": 475, "t": "WS-4.4", "q": "¿Qué tecnología sustituye a DirectAccess para conexión remota corporativa?", "o": ["SMB over QUIC", "Always On VPN", "PPTP", "RD Gateway"], "a": 1, "e": "DirectAccess está obsoleto."}, {"id": 476, "t": "WS-4.4", "q": "¿Qué comando de certutil comprueba la cadena y la revocación de un certificado descargando las URL?", "o": ["certutil -crl", "certutil -verify -urlfetch cert.cer", "certutil -pulse", "certutil -hashfile cert.cer"], "a": 1, "e": "-crl publica la CRL; -hashfile calcula un hash; -pulse fuerza la autoinscripción."}, {"id": 477, "t": "WS-5.1", "q": "¿Qué tipo de hipervisor es Hyper-V?", "o": ["Tipo 1 (bare-metal)", "Emulador", "Contenedor", "Tipo 2 (alojado)"], "a": 0, "e": "Se ejecuta directamente sobre el hardware; el Windows de gestión es la partición primaria."}, {"id": 478, "t": "WS-5.1", "q": "¿Qué requisito de CPU es obligatorio para Hyper-V en Windows Server moderno?", "o": ["Más de 8 núcleos", "Arquitectura ARM", "Virtualización por hardware y SLAT", "Hyper-Threading"], "a": 2, "e": "Intel VT-x con EPT o AMD-V con RVI, y DEP."}, {"id": 479, "t": "WS-5.1", "q": "¿Qué característica tiene una VM de generación 2?", "o": ["No admite VHDX", "Soporte de SO de 32 bits", "Firmware UEFI con arranque seguro y arranque desde disco SCSI", "Firmware BIOS e IDE"], "a": 2, "e": "En Windows Server 2025 es la opción por defecto."}, {"id": 480, "t": "WS-5.1", "q": "¿Se puede cambiar la generación de una VM después de crearla?", "o": ["No", "Sí, desde la configuración", "Solo de 2 a 1", "Sí, con Set-VM -Generation 2"], "a": 0, "e": "Hay que crear una nueva VM (o convertir el disco con herramientas externas)."}, {"id": 481, "t": "WS-5.1", "q": "¿Qué tipo de conmutador virtual comunica las VM entre sí y con el host, pero no con la red física?", "o": ["Externo", "Interno", "Privado", "NAT obligatorio"], "a": 1, "e": "El privado solo comunica VM entre sí (ni siquiera con el host)."}, {"id": 482, "t": "WS-5.1", "q": "¿Qué tipo de conmutador virtual se vincula a una tarjeta de red física?", "o": ["Externo", "Interno", "Aislado", "Privado"], "a": 0, "e": "Con -AllowManagementOS $true el host comparte la NIC."}, {"id": 483, "t": "WS-5.1", "q": "¿Qué tipo de punto de control es el predeterminado desde Windows Server 2016?", "o": ["Estándar (guarda la memoria)", "Incremental", "Diferencial", "Producción (usa VSS dentro de la VM)"], "a": 3, "e": "Los de producción son coherentes con las aplicaciones."}, {"id": 484, "t": "WS-5.1", "q": "¿Qué extensión tienen los discos de diferencias que crea un punto de control de Hyper-V?", "o": [".avhdx", ".vsv", ".vhdx", ".vmcx"], "a": 0, "e": ".vmcx es la configuración de la VM; .vmrs el estado de ejecución."}, {"id": 485, "t": "WS-5.1", "q": "¿Qué cmdlet apaga una VM de golpe, como desenchufarla?", "o": ["Stop-VM -Name SRV01 -Save", "Suspend-VM -Name SRV01", "Stop-VM -Name SRV01", "Stop-VM -Name SRV01 -TurnOff"], "a": 3, "e": "Stop-VM sin parámetros solicita un apagado ordenado al SO invitado."}, {"id": 486, "t": "WS-5.1", "q": "¿Qué comando habilita la virtualización anidada en una VM?", "o": ["Set-VMMemory -Nested", "Set-VMProcessor -VMName X -ExposeVirtualizationExtensions $true", "Set-VM -Nested $true", "Enable-VMNesting X"], "a": 1, "e": "La VM debe estar apagada."}, {"id": 487, "t": "WS-5.1", "q": "¿Qué funcionalidad de Hyper-V copia de forma asíncrona una VM a otro host para recuperación ante desastres?", "o": ["Memoria dinámica", "Migración en vivo", "Punto de control de producción", "Réplica de Hyper-V"], "a": 3, "e": "Frecuencias de replicación de 30 s, 5 min o 15 min."}, {"id": 488, "t": "WS-5.1", "q": "¿Qué funcionalidad mueve una VM encendida a otro host sin interrupción?", "o": ["Réplica de Hyper-V", "Punto de control", "Exportar e importar", "Migración en vivo (Live Migration)"], "a": 3, "e": "Move-VM; puede ser con o sin almacenamiento compartido."}, {"id": 489, "t": "WS-5.1", "q": "¿Qué tipo de disco virtual ofrece el mejor rendimiento y reserva todo el espacio al crearse?", "o": ["De diferenciación", "Pass-through de solo lectura", "De tamaño fijo", "Dinámico"], "a": 2, "e": "El dinámico crece a medida que se escriben datos."}, {"id": 490, "t": "WS-5.1", "q": "¿Por qué no se recomienda restaurar puntos de control estándar en un controlador de dominio de producción?", "o": ["Porque cambia el SID del dominio", "Porque borra el dominio", "Por el riesgo de reversión de USN (USN rollback) e inconsistencias de replicación", "Porque Hyper-V no lo permite"], "a": 2, "e": "Los DC modernos detectan el VM-GenerationID, pero sigue siendo mala práctica."}, {"id": 491, "t": "WS-5.1", "q": "¿Qué cmdlet crea un punto de control de una VM?", "o": ["Snapshot-VM SRV01", "New-VMCheckpoint SRV01", "Checkpoint-VM -Name SRV01 -SnapshotName \"Antes\"", "Save-VM SRV01 -Checkpoint"], "a": 2, "e": "Restore-VMSnapshot lo restaura; Get-VMSnapshot los lista."}, {"id": 492, "t": "WS-5.1", "q": "¿Qué tecnología de Hyper-V solo está disponible en Datacenter y protege las VM incluso frente a los administradores del host?", "o": ["VM blindadas (Shielded VMs) con Host Guardian Service", "Conmutador privado", "Réplica", "Memoria dinámica"], "a": 0, "e": "Usan vTPM y BitLocker dentro de la VM."}, {"id": 493, "t": "WS-5.2", "q": "¿Para qué sirve el quórum de un clúster de conmutación por error?", "o": ["Para evitar que dos partes del clúster funcionen a la vez de forma independiente (split-brain)", "Para cifrar el almacenamiento", "Para balancear la carga", "Para licenciar los nodos"], "a": 0, "e": "El clúster sigue activo mientras tenga la mayoría de votos."}, {"id": 494, "t": "WS-5.2", "q": "¿Qué tipo de testigo de quórum usa una cuenta de almacenamiento de Azure?", "o": ["Testigo de disco", "Testigo USB", "Testigo de recurso compartido", "Testigo en la nube (Cloud Witness)"], "a": 3, "e": "Útil en clústeres multisitio."}, {"id": 495, "t": "WS-5.2", "q": "¿Qué cmdlet valida la configuración antes de crear un clúster?", "o": ["Test-Cluster", "New-Cluster -WhatIf", "Test-ClusterNode", "Validate-Cluster"], "a": 0, "e": "La validación es necesaria para que la configuración tenga soporte."}, {"id": 496, "t": "WS-5.2", "q": "¿Qué son los CSV en un clúster de Windows?", "o": ["Copias de seguridad del clúster", "Ficheros de valores separados por comas", "Conmutadores virtuales", "Volúmenes compartidos de clúster accesibles por todos los nodos a la vez"], "a": 3, "e": "Montados en C:\\ClusterStorage\\VolumeN."}, {"id": 497, "t": "WS-5.2", "q": "¿Cuántos nodos admite como máximo un clúster de conmutación por error de Windows Server?", "o": ["32", "16", "8", "64"], "a": 3, "e": "Hasta 64 nodos y 8000 VM por clúster."}, {"id": 498, "t": "WS-5.2", "q": "¿Cuánto tiempo de caída anual permite un SLA del 99,99 %?", "o": ["Unas 8,76 horas", "Unos 52,6 minutos", "Unos 5,26 minutos", "1 día"], "a": 1, "e": "99,9 % ≈ 8,76 h; 99,999 % ≈ 5,26 min."}, {"id": 499, "t": "WS-5.2", "q": "¿Qué diferencia hay entre alta disponibilidad (HA) y recuperación ante desastres (DR)?", "o": ["Son sinónimos", "HA usa cintas y DR discos", "DR es siempre más rápida", "HA mantiene el servicio ante fallos locales de forma automática; DR recupera el servicio en otro sitio tras un desastre"], "a": 3, "e": "Clúster = HA; réplica a otro CPD = DR."}, {"id": 500, "t": "WS-5.2", "q": "En un clúster de 4 nodos, ¿por qué se configura un testigo?", "o": ["Porque es obligatorio por licencia", "Para replicar AD", "Para almacenar las VM", "Para tener un voto extra que desempate y tolerar la caída de 2 nodos"], "a": 3, "e": "Con número par de votos un empate dejaría el clúster sin quórum."}, {"id": 501, "t": "WS-5.3", "q": "¿Qué contador de rendimiento indica falta de memoria física?", "o": ["Processor\\% Processor Time alto", "Memory\\Available MBytes bajo y Memory\\Pages/sec alto", "LogicalDisk\\% Free Space bajo", "Network Interface\\Bytes Total/sec alto"], "a": 1, "e": "Mucha paginación con poca memoria libre = cuello de botella en RAM."}, {"id": 502, "t": "WS-5.3", "q": "¿A partir de qué latencia media de lectura de disco se considera que hay problemas?", "o": ["Más de 1 ms siempre", "Más de 1 segundo", "Más de 200 ms", "Más de 20-25 ms (Avg. Disk sec/Read > 0,020-0,025)"], "a": 3, "e": "En SSD/NVMe se esperan valores muy inferiores."}, {"id": 503, "t": "WS-5.3", "q": "¿Qué cmdlet obtiene muestras de un contador de rendimiento?", "o": ["Get-Performance -CPU", "Measure-Counter CPU", "Get-WmiObject PerfCounter", "Get-Counter '\\Processor(_Total)\\% Processor Time' -SampleInterval 2 -MaxSamples 5"], "a": 3, "e": "typeperf es la alternativa en cmd."}, {"id": 504, "t": "WS-5.3", "q": "¿Qué comando abre el Monitor de confiabilidad?", "o": ["resmon", "perfmon /res", "perfmon /rel", "reliab.msc"], "a": 2, "e": "Muestra un historial de fallos e instalaciones."}, {"id": 505, "t": "WS-5.3", "q": "¿Qué es una línea base (baseline) de rendimiento?", "o": ["El primer contador de la lista", "Mediciones en condiciones normales para comparar cuando aparezcan problemas", "La configuración por defecto del servidor", "El rendimiento máximo teórico del hardware"], "a": 1, "e": "Sin línea base es difícil saber si un valor es anormal."}, {"id": 506, "t": "WS-5.3", "q": "¿Qué herramienta muestra en tiempo real qué procesos usan CPU, disco, red y memoria con detalle?", "o": ["Visor de eventos", "Administrador del servidor", "Monitor de recursos (resmon)", "msinfo32"], "a": 2, "e": "Permite ver qué ficheros y puertos usa cada proceso."}, {"id": 507, "t": "WS-5.3", "q": "¿Qué se configura con wecutil qc?", "o": ["Las cuotas de disco", "La calidad de servicio", "El servicio recopilador de eventos para el reenvío de eventos", "Los contadores de rendimiento"], "a": 2, "e": "Windows Event Collector; los eventos llegan al registro Eventos reenviados."}, {"id": 508, "t": "WS-5.3", "q": "¿Qué contador indica cuántos hilos esperan para usar la CPU?", "o": ["Memory\\Committed Bytes", "Process\\Thread Count", "Processor\\% Idle Time", "System\\Processor Queue Length"], "a": 3, "e": "Un valor sostenido mayor que 2 por núcleo indica saturación."}, {"id": 509, "t": "WS-5.4", "q": "¿En qué orden se ejecutan DISM y SFC para reparar un sistema dañado?", "o": ["Primero sfc y luego chkdsk", "Primero DISM /Online /Cleanup-Image /RestoreHealth y después sfc /scannow", "Solo sfc /scannow", "Primero chkdsk /f y luego DISM /Online /Enable-Feature"], "a": 1, "e": "SFC usa el almacén de componentes, que DISM repara."}, {"id": 510, "t": "WS-5.4", "q": "¿Qué hace sfc /scannow?", "o": ["Comprueba y repara los ficheros protegidos del sistema", "Comprueba el disco en busca de sectores defectuosos", "Desfragmenta el disco", "Busca malware"], "a": 0, "e": "chkdsk revisa el sistema de ficheros y el disco."}, {"id": 511, "t": "WS-5.4", "q": "¿Qué parámetro de chkdsk busca sectores defectuosos y recupera información legible?", "o": ["/x", "/f", "/scan", "/r"], "a": 3, "e": "/f corrige errores del sistema de ficheros; /r implica /f."}, {"id": 512, "t": "WS-5.4", "q": "¿Qué comando de WinRE reconstruye el almacén de configuración de arranque (BCD)?", "o": ["bootrec /fixmbr", "bcdedit /rebuild", "bootrec /rebuildbcd", "sfc /bcd"], "a": 2, "e": "/fixmbr reescribe el MBR, /fixboot el sector de arranque."}, {"id": 513, "t": "WS-5.4", "q": "¿Qué comando recrea los ficheros de arranque en la partición EFI de un sistema UEFI?", "o": ["bootrec /fixmbr", "bootsect /nt60 C:", "diskpart active", "bcdboot C:\\Windows /s S: /f UEFI"], "a": 3, "e": "bootrec /fixmbr solo tiene sentido en discos MBR/BIOS."}, {"id": 514, "t": "WS-5.4", "q": "Un usuario se bloquea constantemente aunque escribe bien su contraseña. ¿Causa más probable?", "o": ["La GPO de fondo de escritorio", "El DNS no resuelve", "Credenciales antiguas guardadas en otro dispositivo, servicio o unidad mapeada que siguen intentando autenticarse", "El DHCP está caído"], "a": 2, "e": "Se rastrea con el evento 4740 en el PDC (campo Caller Computer Name)."}, {"id": 515, "t": "WS-5.4", "q": "¿Qué comando muestra el estado de sincronización horaria de Windows?", "o": ["ntpq -p", "time /query", "w32tm /query /status", "net time /status"], "a": 2, "e": "w32tm /resync fuerza la resincronización."}, {"id": 516, "t": "WS-5.4", "q": "Un servicio no arranca tras cambiar la contraseña de la cuenta con la que se ejecuta. ¿Qué ha pasado?", "o": ["El servicio se ha desinstalado", "Hay que desfragmentar el disco", "El servicio sigue guardando la contraseña antigua: hay que actualizarla en sus propiedades (o usar una gMSA)", "El servidor necesita una CAL nueva"], "a": 2, "e": "Es una razón para usar cuentas administradas."}, {"id": 517, "t": "WS-5.4", "q": "¿Qué metodología de diagnóstico de red empieza por la capa física?", "o": ["Divide y vencerás", "De arriba abajo (top-down)", "Seguir el camino", "De abajo arriba (bottom-up)"], "a": 3, "e": "Física → enlace → red → transporte → aplicación."}, {"id": 518, "t": "WS-5.4", "q": "Un equipo nuevo no encuentra el dominio al intentar unirse. Tiene configurado 8.8.8.8 como DNS. ¿Solución?", "o": ["Instalar WINS", "Configurar como DNS un controlador de dominio", "Cambiar la máscara", "Abrir el puerto 3389"], "a": 1, "e": "Los registros del dominio solo están en los DNS internos."}, {"id": 519, "t": "WS-5.4", "q": "¿Dónde se guarda por defecto el volcado completo de memoria tras una pantalla azul?", "o": ["C:\\crash.log", "C:\\Windows\\Minidump\\full.dmp", "C:\\Windows\\MEMORY.DMP", "C:\\Windows\\Logs\\BSOD.txt"], "a": 2, "e": "Los minivolcados van a C:\\Windows\\Minidump."}, {"id": 520, "t": "WS-5.4", "q": "¿Qué comando pone el sistema para arrancar en modo seguro mínimo en el próximo inicio?", "o": ["shutdown /r /safe", "msconfig /safe", "bcdedit /set {default} safeboot minimal", "bootrec /safemode"], "a": 2, "e": "Para volver: bcdedit /deletevalue {default} safeboot."}, {"id": 521, "t": "WS-6.1", "q": "En el modelo de niveles (tiering) de Microsoft, ¿qué contiene el Tier 0?", "o": ["Los puestos de usuario", "Los dispositivos móviles", "Los sistemas que controlan la identidad: controladores de dominio, AD CS, sincronización con Entra ID", "Los servidores de aplicaciones"], "a": 2, "e": "Tier 1 servidores y aplicaciones; Tier 2 puestos de trabajo."}, {"id": 522, "t": "WS-6.1", "q": "¿Qué regla fundamental establece el modelo de niveles?", "o": ["Todos los administradores usan la misma cuenta", "Los DC pueden navegar por Internet", "Los usuarios Tier 2 administran el Tier 0", "Una cuenta privilegiada de un nivel superior no debe iniciar sesión en equipos de un nivel inferior"], "a": 3, "e": "Evita el robo de credenciales privilegiadas en equipos expuestos."}, {"id": 523, "t": "WS-6.1", "q": "¿Qué hace Windows LAPS?", "o": ["Cifra los discos", "Gestiona y rota automáticamente la contraseña del administrador local de cada equipo y la guarda en AD o Entra ID", "Bloquea los puertos USB", "Gestiona las licencias"], "a": 1, "e": "Evita tener la misma contraseña de administrador local en todos los equipos."}, {"id": 524, "t": "WS-6.1", "q": "¿Qué cmdlet lee la contraseña LAPS de un equipo en claro?", "o": ["Get-LapsPassword PC-0001", "Get-ADComputer PC-0001 -Properties ms-Mcs-AdmPwd", "Read-LapsPassword PC-0001", "Get-LapsADPassword -Identity PC-0001 -AsPlainText"], "a": 3, "e": "ms-Mcs-AdmPwd es el atributo del LAPS heredado."}, {"id": 525, "t": "WS-6.1", "q": "¿Qué cmdlet amplía el esquema de AD para Windows LAPS?", "o": ["Install-LapsSchema", "Update-AdmPwdADSchema", "Update-LapsADSchema", "Set-LapsADSchema"], "a": 2, "e": "Update-AdmPwdADSchema era del LAPS heredado."}, {"id": 526, "t": "WS-6.1", "q": "¿Qué cmdlet da permiso a los equipos de una OU para escribir su propia contraseña LAPS en AD?", "o": ["Set-LapsADReadPasswordPermission", "Set-LapsADComputerSelfPermission", "Set-LapsADResetPasswordPermission", "Grant-LapsPermission"], "a": 1, "e": "ReadPasswordPermission es para los grupos que podrán leerla."}, {"id": 527, "t": "WS-6.1", "q": "¿Cómo se comprueba si SMBv1 está habilitado en un servidor?", "o": ["netstat -smb1", "Get-Service SMB1", "Get-SmbServerConfiguration | Select-Object EnableSMB1Protocol", "Get-SmbShare -Version 1"], "a": 2, "e": "Para deshabilitarlo: Set-SmbServerConfiguration -EnableSMB1Protocol $false."}, {"id": 528, "t": "WS-6.1", "q": "¿Qué cmdlet habilita BitLocker en C: con protector TPM y cifrado XTS-AES 256?", "o": ["manage-bde -enable C: -tpm", "Set-BitLocker C: -On", "Enable-BitLocker -MountPoint C: -EncryptionMethod XtsAes256 -TpmProtector", "Start-BitLocker C: -AES256"], "a": 2, "e": "En cmd: manage-bde -on C:."}, {"id": 529, "t": "WS-6.1", "q": "¿Cuántos dígitos tiene una clave de recuperación de BitLocker?", "o": ["24", "32", "64", "48"], "a": 3, "e": "8 grupos de 6 dígitos."}, {"id": 530, "t": "WS-6.1", "q": "¿Qué cmdlet inicia un análisis rápido con Microsoft Defender?", "o": ["Update-MpSignature -Scan", "Invoke-DefenderScan -Quick", "Start-Scan -Defender", "Start-MpScan -ScanType QuickScan"], "a": 3, "e": "Update-MpSignature actualiza firmas; Get-MpComputerStatus muestra el estado."}, {"id": 531, "t": "WS-6.1", "q": "¿Qué perfiles tiene el firewall de Windows?", "o": ["Trabajo, Casa y Otro", "Entrada, Salida y Tránsito", "Interno, Externo y DMZ", "Dominio, Privado y Público"], "a": 3, "e": "Se aplica el perfil según la red detectada (NLA)."}, {"id": 532, "t": "WS-6.1", "q": "¿Qué cmdlet crea una regla de entrada que permite TCP 443 solo en el perfil Dominio?", "o": ["netsh firewall add allowedport 443", "New-NetFirewallRule -DisplayName \"HTTPS\" -Direction Inbound -Protocol TCP -LocalPort 443 -Action Allow -Profile Domain", "Set-NetFirewallRule -Inbound 443 -Allow", "Add-FirewallRule -Port 443 -Allow -Domain"], "a": 1, "e": "netsh firewall está obsoleto; se usa netsh advfirewall o los cmdlets NetSecurity."}, {"id": 533, "t": "WS-6.1", "q": "¿Qué comando muestra la configuración actual de la directiva de auditoría avanzada?", "o": ["wevtutil gl Security", "auditpol /get /category:*", "gpresult /audit", "secedit /audit"], "a": 1, "e": "Mejor configurarla mediante GPO de auditoría avanzada."}, {"id": 534, "t": "WS-6.1", "q": "Según Microsoft, ¿qué tecnología de control de aplicaciones constituye una barrera de seguridad más robusta?", "o": ["WDAC / App Control for Business", "Directivas de restricción de software (SRP)", "AppLocker", "Control de cuentas de usuario"], "a": 0, "e": "AppLocker es útil como defensa en profundidad, pero puede evadirse."}, {"id": 535, "t": "WS-6.1", "q": "¿Por qué se recomienda deshabilitar LLMNR y NetBIOS sobre TCP/IP?", "o": ["Porque permiten ataques de envenenamiento de resolución de nombres para capturar credenciales", "Porque son incompatibles con IPv6", "Porque consumen mucho ancho de banda", "Porque impiden usar DNS"], "a": 0, "e": "Herramientas como Responder suplantan respuestas y capturan hashes NTLM."}, {"id": 536, "t": "WS-6.1", "q": "¿Desde cuándo está Windows LAPS integrado en Windows?", "o": ["No está integrado, se descarga aparte", "Solo en Windows Server 2025", "Desde Windows Server 2008", "Desde las actualizaciones de abril de 2023"], "a": 3, "e": "El LAPS heredado (MSI) está obsoleto."}, {"id": 537, "t": "WS-6.1", "q": "¿Qué cmdlet añade una exclusión de ruta en Microsoft Defender?", "o": ["Add-DefenderExclusion D:\\SQL", "Add-MpPreference -ExclusionPath D:\\SQL", "New-MpExclusion D:\\SQL", "Set-MpPreference -Exclude D:\\SQL"], "a": 1, "e": "Set-MpPreference -ExclusionPath reemplazaría toda la lista."}, {"id": 538, "t": "WS-6.2", "q": "¿Qué es Microsoft Entra ID?", "o": ["El nuevo nombre de Azure Active Directory, servicio de identidad en la nube", "Un rol de Windows Server 2025", "La nueva versión de AD DS local", "Un antivirus"], "a": 0, "e": "Fue renombrado en 2023."}, {"id": 539, "t": "WS-6.2", "q": "¿Qué protocolos usa principalmente Entra ID?", "o": ["OAuth 2.0, OpenID Connect y SAML", "NTLM y SMB", "RADIUS y TACACS+", "LDAP y Kerberos exclusivamente"], "a": 0, "e": "No tiene OU ni GPO de forma nativa."}, {"id": 540, "t": "WS-6.2", "q": "¿Qué herramienta sincroniza usuarios de AD local con Entra ID?", "o": ["DFSR", "Microsoft Entra Connect (Sync) o Entra Cloud Sync", "repadmin", "ADMT"], "a": 1, "e": "Métodos: sincronización de hash, autenticación de paso a través o federación."}, {"id": 541, "t": "WS-6.2", "q": "¿Qué servicio permite gestionar servidores locales desde Azure y es necesario para Hotpatch en Windows Server 2025?", "o": ["Intune", "Azure Arc", "Entra Connect", "Azure Bastion"], "a": 1, "e": "Proporciona inventario, actualizaciones y seguridad."}, {"id": 542, "t": "WS-6.2", "q": "¿Qué método de autenticación híbrida valida las contraseñas contra el AD local mediante agentes, sin guardar hashes en la nube?", "o": ["Sincronización de hash de contraseñas (PHS)", "Autenticación de paso a través (PTA)", "Kerberos en la nube", "LAPS"], "a": 1, "e": "PHS sí sincroniza un hash del hash de la contraseña."}, {"id": 543, "t": "WS-6.3", "q": "¿Qué Real Decreto regula actualmente el Esquema Nacional de Seguridad?", "o": ["Real Decreto 4/2010", "Real Decreto 311/2022", "Real Decreto 3/2010", "Real Decreto 203/2021"], "a": 1, "e": "El RD 3/2010 fue derogado; el RD 4/2010 regula el ENI."}, {"id": 544, "t": "WS-6.3", "q": "¿Cuáles son las categorías de seguridad de un sistema según el ENS?", "o": ["1, 2 y 3", "BÁSICA, MEDIA y ALTA", "BAJA, MEDIA y ALTA", "PÚBLICA, RESERVADA y SECRETA"], "a": 1, "e": "Los niveles de cada dimensión son bajo, medio y alto."}, {"id": 545, "t": "WS-6.3", "q": "¿Cuáles son las dimensiones de seguridad del ENS?", "o": ["Prevención, Detección y Respuesta", "Confidencialidad, Integridad, Trazabilidad, Autenticidad y Disponibilidad", "Seguridad, Privacidad y Legalidad", "Confidencialidad, Integridad y Disponibilidad únicamente"], "a": 1, "e": "Se recuerdan como C-I-T-A-D."}, {"id": 546, "t": "WS-6.3", "q": "¿Con qué periodicidad mínima hay que auditar la conformidad con el ENS?", "o": ["Solo al crear el sistema", "Cada 5 años", "Cada 2 años", "Cada año"], "a": 2, "e": "Los sistemas de categoría BÁSICA pueden usar autoevaluación."}, {"id": 547, "t": "WS-6.3", "q": "¿Qué herramienta del CCN-CERT se usa para el análisis y gestión de riesgos según MAGERIT?", "o": ["LUCÍA", "INES", "PILAR", "CARMEN"], "a": 2, "e": "LUCÍA gestiona incidentes; CARMEN detecta APT; INES informa del estado del ENS."}, {"id": 548, "t": "WS-6.3", "q": "¿Qué herramienta del CCN-CERT se usa para la gestión y notificación de ciberincidentes?", "o": ["REYES", "PILAR", "GLORIA", "LUCÍA"], "a": 3, "e": "Es la herramienta de ticketing de incidentes del sector público."}, {"id": 549, "t": "WS-6.3", "q": "¿Qué herramienta del CCN-CERT proporciona \"vacunas\" contra el ransomware en los puestos?", "o": ["PILAR", "microCLAUDIA", "INES", "CARMEN"], "a": 1, "e": "Despliega vacunas que impiden la ejecución de familias de ransomware."}, {"id": 550, "t": "WS-6.3", "q": "¿Qué serie de guías CCN-STIC está dedicada al Esquema Nacional de Seguridad?", "o": ["Serie 100", "Serie 800", "Serie 900", "Serie 400"], "a": 1, "e": "Por ejemplo la CCN-STIC 804 sobre implantación de medidas."}, {"id": 551, "t": "WS-6.3", "q": "¿Qué organismo coordina la respuesta a incidentes de ciberseguridad del sector público español?", "o": ["AEPD", "INCIBE-CERT", "CCN-CERT", "Policía Nacional"], "a": 2, "e": "INCIBE atiende a ciudadanos y empresas privadas."}, {"id": 552, "t": "WS-6.3", "q": "¿Qué es la Red SARA?", "o": ["Un antivirus del CCN", "La red académica de investigación", "El sistema de nóminas de la AGE", "La red de comunicaciones que interconecta las Administraciones Públicas españolas"], "a": 3, "e": "Conecta AGE, CCAA y entidades locales y enlaza con la red europea TESTA. La académica es RedIRIS."}, {"id": 553, "t": "WS-6.3", "q": "¿En qué marcos se organizan las medidas de seguridad del ENS?", "o": ["Preventivo, correctivo y detectivo", "Físico, lógico y legal", "Organizativo, operacional y medidas de protección", "Básico, medio y alto"], "a": 2, "e": "Anexo II del RD 311/2022."}, {"id": 554, "t": "WS-6.3", "q": "¿Qué Real Decreto regula el Esquema Nacional de Interoperabilidad?", "o": ["RD 3/2010", "RD 1720/2007", "RD 311/2022", "RD 4/2010"], "a": 3, "e": "El ENS es el RD 311/2022."}, {"id": 555, "t": "NET-1.1", "q": "¿En qué capa del modelo OSI trabaja un router?", "o": ["Capa 2 (enlace)", "Capa 3 (red)", "Capa 4 (transporte)", "Capa 1 (física)"], "a": 1, "e": "El router enruta paquetes según la dirección IP."}, {"id": 556, "t": "NET-1.1", "q": "¿En qué capa OSI trabaja un switch tradicional?", "o": ["Capa 1", "Capa 3", "Capa 7", "Capa 2 (enlace de datos)"], "a": 3, "e": "Conmuta tramas según la dirección MAC. Los switches multicapa también enrutan (capa 3)."}, {"id": 557, "t": "NET-1.1", "q": "¿Cómo se llama la PDU de la capa de enlace de datos?", "o": ["Segmento", "Trama", "Bit", "Paquete"], "a": 1, "e": "Física: bits; enlace: trama; red: paquete; transporte: segmento (TCP) o datagrama (UDP)."}, {"id": 558, "t": "NET-1.1", "q": "¿Cómo se llama la PDU de TCP en la capa de transporte?", "o": ["Segmento", "Trama", "Paquete", "Celda"], "a": 0, "e": "En UDP se suele llamar datagrama."}, {"id": 559, "t": "NET-1.1", "q": "¿Qué capa OSI se encarga del cifrado, la compresión y el formato de los datos?", "o": ["Sesión (5)", "Presentación (6)", "Aplicación (7)", "Transporte (4)"], "a": 1, "e": "La sesión gestiona el diálogo entre aplicaciones."}, {"id": 560, "t": "NET-1.1", "q": "¿Cuántas capas tiene el modelo TCP/IP según RFC 1122?", "o": ["7", "4", "5", "3"], "a": 1, "e": "Aplicación, Transporte, Internet y Acceso a la red (enlace)."}, {"id": 561, "t": "NET-1.1", "q": "¿A qué capas OSI corresponde la capa de aplicación del modelo TCP/IP?", "o": ["Transporte y aplicación", "Aplicación, presentación y sesión (5, 6 y 7)", "Solo la 7", "Red y transporte"], "a": 1, "e": "TCP/IP agrupa las tres capas superiores de OSI."}, {"id": 562, "t": "NET-1.1", "q": "¿Qué dispositivo crea un único dominio de colisión para todos sus puertos?", "o": ["Router", "Puente de capa 3", "Hub", "Switch"], "a": 2, "e": "El hub repite los bits por todos los puertos."}, {"id": 563, "t": "NET-1.1", "q": "¿Qué dispositivo separa dominios de difusión?", "o": ["Hub", "Switch sin VLAN", "Repetidor", "Router"], "a": 3, "e": "Los routers no reenvían difusiones; las VLAN también separan dominios de difusión."}, {"id": 564, "t": "NET-1.1", "q": "¿Qué añade la capa de enlace al final de la trama?", "o": ["El FCS (secuencia de comprobación de trama, CRC)", "La dirección IP de destino", "El número de puerto", "El TTL"], "a": 0, "e": "Permite detectar errores de transmisión."}, {"id": 565, "t": "NET-1.1", "q": "¿En qué subcapas se divide la capa de enlace de datos según IEEE?", "o": ["IP y ARP", "TCP y UDP", "LLC y MAC", "PHY y PMD"], "a": 2, "e": "LLC (802.2) en la parte superior y MAC en la inferior."}, {"id": 566, "t": "NET-1.1", "q": "¿En qué capa OSI se sitúan los protocolos HTTP, DNS y SMTP?", "o": ["Transporte (4)", "Sesión (5)", "Red (3)", "Aplicación (7)"], "a": 3, "e": "Son protocolos de aplicación."}, {"id": 567, "t": "NET-1.1", "q": "¿En qué capa OSI trabaja ICMP?", "o": ["Enlace (2)", "Aplicación (7)", "Red (3)", "Transporte (4)"], "a": 2, "e": "ICMP viaja directamente sobre IP (protocolo 1), sin TCP ni UDP."}, {"id": 568, "t": "NET-1.2", "q": "¿Cuál es la distancia máxima de un segmento Ethernet sobre par trenzado?", "o": ["100 metros", "185 metros", "500 metros", "2 kilómetros"], "a": 0, "e": "90 m de enlace permanente + latiguillos."}, {"id": 569, "t": "NET-1.2", "q": "¿Qué categoría de cable garantiza 10 Gbps a 100 metros?", "o": ["Cat 6", "Cat 6A", "Cat 5", "Cat 5e"], "a": 1, "e": "Cat 6 alcanza 10 Gbps solo hasta unos 55 m."}, {"id": 570, "t": "NET-1.2", "q": "¿Qué conector usa el par trenzado Ethernet?", "o": ["RJ-45 (8P8C)", "LC", "BNC", "RJ-11"], "a": 0, "e": "RJ-11 es telefónico; LC es de fibra; BNC de coaxial."}, {"id": 571, "t": "NET-1.2", "q": "¿Qué tipo de fibra se usa para largas distancias (decenas de kilómetros)?", "o": ["Monomodo", "Plástica", "Multimodo", "Coaxial"], "a": 0, "e": "La monomodo tiene un núcleo de unos 9 µm y usa láser."}, {"id": 572, "t": "NET-1.2", "q": "¿Qué color de cubierta suele tener la fibra monomodo OS2?", "o": ["Naranja", "Aqua", "Negro", "Amarillo"], "a": 3, "e": "OM1/OM2 naranja, OM3/OM4 aqua, OM5 verde lima."}, {"id": 573, "t": "NET-1.2", "q": "¿Cuántos pares usa 1000BASE-T?", "o": ["2 pares", "3 pares", "Los 4 pares", "1 par"], "a": 2, "e": "100BASE-TX usaba 2 pares."}, {"id": 574, "t": "NET-1.2", "q": "¿Qué potencia ofrece el PSE con PoE+ (802.3at)?", "o": ["60 W", "90 W", "15,4 W", "30 W"], "a": 3, "e": "802.3af 15,4 W; 802.3bt hasta 60/90 W."}, {"id": 575, "t": "NET-1.2", "q": "¿Qué es un cable cruzado?", "o": ["Un cable de fibra con conectores distintos", "Un cable con T568B en ambos extremos", "Un cable con norma T568A en un extremo y T568B en el otro", "Un cable coaxial"], "a": 2, "e": "Hoy casi no se necesita gracias a Auto-MDIX."}, {"id": 576, "t": "NET-1.2", "q": "¿Qué transceptor se usa típicamente para 10 Gbps?", "o": ["SFP", "GBIC de 100 Mbps", "QSFP28", "SFP+"], "a": 3, "e": "SFP 1G, SFP+ 10G, SFP28 25G, QSFP+ 40G, QSFP28 100G."}, {"id": 577, "t": "NET-1.2", "q": "¿Qué significa \"BASE\" en 1000BASE-T?", "o": ["Velocidad base mínima", "Transmisión en banda base", "Topología en estrella", "Cable base de cobre"], "a": 1, "e": "1000 Mbps, banda base, par trenzado (T)."}, {"id": 578, "t": "NET-1.2", "q": "¿Qué ventaja principal tiene la fibra frente al cobre?", "o": ["Inmunidad a interferencias electromagnéticas y mayor distancia", "Transporta alimentación PoE", "Es más fácil de crimpar", "Es más barata"], "a": 0, "e": "La fibra no conduce electricidad."}, {"id": 579, "t": "NET-1.2", "q": "¿Qué distancia máxima tiene el cableado Cat 8?", "o": ["300 metros", "55 metros", "100 metros", "30 metros"], "a": 3, "e": "Diseñado para centros de datos a 25/40 Gbps."}, {"id": 580, "t": "NET-1.3", "q": "¿Cuántos bits tiene una dirección MAC?", "o": ["128", "32", "48", "64"], "a": 2, "e": "6 bytes; los primeros 24 bits son el OUI del fabricante."}, {"id": 581, "t": "NET-1.3", "q": "¿Qué es el OUI de una MAC?", "o": ["El bit de multidifusión", "Los últimos 24 bits", "La dirección de difusión", "Los primeros 24 bits, que identifican al fabricante"], "a": 3, "e": "Organizationally Unique Identifier, asignado por el IEEE."}, {"id": 582, "t": "NET-1.3", "q": "¿Cuál es la dirección MAC de difusión?", "o": ["00:00:00:00:00:00", "255.255.255.255", "FF:FF:FF:FF:FF:FF", "01:00:5E:00:00:00"], "a": 2, "e": "255.255.255.255 es la difusión IPv4."}, {"id": 583, "t": "NET-1.3", "q": "¿Cuál es el MTU estándar de Ethernet?", "o": ["1518 bytes", "9000 bytes", "1500 bytes", "576 bytes"], "a": 2, "e": "1518 es el tamaño máximo de la trama; las jumbo frames rondan 9000."}, {"id": 584, "t": "NET-1.3", "q": "¿Cuál es el tamaño mínimo de una trama Ethernet?", "o": ["1500 bytes", "64 bytes", "128 bytes", "46 bytes"], "a": 1, "e": "La carga mínima es de 46 bytes; se rellena si es menor."}, {"id": 585, "t": "NET-1.3", "q": "¿Qué valor de EtherType indica IPv6?", "o": ["0x0806", "0x8100", "0x86DD", "0x0800"], "a": 2, "e": "0x0800 IPv4, 0x0806 ARP, 0x8100 etiqueta VLAN."}, {"id": 586, "t": "NET-1.3", "q": "¿Qué orden siguen las direcciones en una trama Ethernet?", "o": ["Primero la MAC de origen y después la de destino", "Solo lleva la MAC de destino", "Primero la IP y después la MAC", "Primero la MAC de destino y después la de origen"], "a": 3, "e": "Así el switch puede decidir antes el reenvío."}, {"id": 587, "t": "NET-1.3", "q": "¿De qué dirección aprende un switch para construir su tabla MAC?", "o": ["De la MAC de destino", "Del DNS", "De la MAC de origen de las tramas recibidas", "De la IP de origen"], "a": 2, "e": "Asocia la MAC de origen con el puerto por el que llegó."}, {"id": 588, "t": "NET-1.3", "q": "¿Qué hace un switch con una trama cuyo destino no está en su tabla MAC?", "o": ["La descarta", "La inunda por todos los puertos de la VLAN excepto el de entrada", "La envía al router", "La devuelve al origen"], "a": 1, "e": "Se llama flooding de unidifusión desconocida."}, {"id": 589, "t": "NET-1.3", "q": "¿Qué método de conmutación recibe la trama completa y comprueba el FCS antes de reenviarla?", "o": ["Fragment-free", "Flooding", "Cut-through", "Store-and-forward"], "a": 3, "e": "Cut-through reenvía al leer la MAC destino; fragment-free lee los primeros 64 bytes."}, {"id": 590, "t": "NET-1.3", "q": "¿Qué método de acceso al medio usa Wi-Fi?", "o": ["CSMA/CD", "TDMA", "CSMA/CA", "Token passing"], "a": 2, "e": "Ethernet half-duplex usa CSMA/CD."}, {"id": 591, "t": "NET-1.3", "q": "Un enlace muestra colisiones tardías y errores CRC. ¿Causa más probable?", "o": ["DNS mal configurado", "DHCP agotado", "Desajuste de dúplex entre los extremos", "Máscara incorrecta"], "a": 2, "e": "Un extremo en half y otro en full dúplex."}, {"id": 592, "t": "NET-1.4", "q": "¿Qué estándar Wi-Fi funciona solo en la banda de 5 GHz?", "o": ["802.11ax (Wi-Fi 6)", "802.11g", "802.11ac (Wi-Fi 5)", "802.11n (Wi-Fi 4)"], "a": 2, "e": "802.11n y ax trabajan en 2,4 y 5 GHz."}, {"id": 593, "t": "NET-1.4", "q": "¿Qué denominación comercial tiene 802.11ax?", "o": ["Wi-Fi 7", "Wi-Fi 5", "Wi-Fi 4", "Wi-Fi 6 (6E si usa 6 GHz)"], "a": 3, "e": "Wi-Fi 7 es 802.11be."}, {"id": 594, "t": "NET-1.4", "q": "¿Qué banda añade Wi-Fi 6E?", "o": ["3,5 GHz", "6 GHz", "900 MHz", "60 GHz"], "a": 1, "e": "Wi-Fi 6E y Wi-Fi 7 usan 6 GHz y requieren WPA3 en ella."}, {"id": 595, "t": "NET-1.4", "q": "¿Qué método sustituye a la clave precompartida (PSK) en WPA3-Personal?", "o": ["EAP-TLS", "WEP", "SAE (Simultaneous Authentication of Equals)", "TKIP"], "a": 2, "e": "SAE resiste ataques de diccionario offline."}, {"id": 596, "t": "NET-1.4", "q": "¿Qué cifrado usa WPA2?", "o": ["AES-CCMP", "DES", "TKIP obligatoriamente", "RC4"], "a": 0, "e": "TKIP y RC4 se asocian a WPA/WEP, obsoletos."}, {"id": 597, "t": "NET-1.4", "q": "¿Qué se necesita para WPA2/WPA3-Enterprise?", "o": ["802.1X con un servidor RADIUS", "Un servidor DHCP", "WPS habilitado", "Solo una clave compartida"], "a": 0, "e": "Cada usuario se autentica con sus propias credenciales o certificado."}, {"id": 598, "t": "NET-1.4", "q": "¿Qué canales de 2,4 GHz no se solapan en la configuración clásica?", "o": ["1, 7 y 13", "1, 6 y 11", "1, 2 y 3", "2, 4 y 6"], "a": 1, "e": "En Europa también 1, 5, 9 y 13 con canales de 20 MHz."}, {"id": 599, "t": "NET-1.4", "q": "¿Por qué se debe deshabilitar WPS?", "o": ["Porque reduce la velocidad", "Porque su PIN es vulnerable a ataques de fuerza bruta", "Porque impide usar 5 GHz", "Porque solo funciona con WEP"], "a": 1, "e": "Un atacante puede recuperar la clave Wi-Fi."}, {"id": 600, "t": "NET-1.4", "q": "¿Qué es el BSSID?", "o": ["El canal", "La dirección MAC del punto de acceso para una red concreta", "El nombre de la red Wi-Fi", "La contraseña de la red"], "a": 1, "e": "El SSID es el nombre visible de la red."}, {"id": 601, "t": "NET-1.4", "q": "¿Qué topología física usa Ethernet moderna?", "o": ["Estrella (o estrella extendida)", "Malla completa", "Bus", "Anillo"], "a": 0, "e": "Todos los equipos se conectan a un switch central."}, {"id": 602, "t": "NET-1.4", "q": "¿Qué capas tiene el diseño jerárquico clásico de red de campus?", "o": ["Física, lógica y virtual", "Núcleo, distribución y acceso", "Spine, leaf y edge", "Interna, DMZ y externa"], "a": 1, "e": "Spine-leaf es la arquitectura habitual en centros de datos."}, {"id": 603, "t": "NET-1.4", "q": "¿Qué puerto usa iSCSI?", "o": ["TCP 2049", "TCP 445", "TCP 3260", "UDP 3260"], "a": 2, "e": "2049 es NFS; 445 SMB."}, {"id": 604, "t": "NET-1.4", "q": "¿Qué protocolo usan las controladoras WLAN para gestionar los puntos de acceso ligeros?", "o": ["LLDP", "CAPWAP", "STP", "VRRP"], "a": 1, "e": "Control And Provisioning of Wireless Access Points."}, {"id": 605, "t": "NET-1.4", "q": "¿Qué método de WPA3 cifra redes abiertas (sin contraseña) como las de invitados?", "o": ["OWE (Opportunistic Wireless Encryption)", "TKIP", "WPS", "SAE"], "a": 0, "e": "También llamado Enhanced Open."}, {"id": 606, "t": "NET-2.1", "q": "¿Cuál de estas direcciones es privada según RFC 1918?", "o": ["172.20.5.1", "100.64.0.1", "172.32.0.1", "169.254.10.1"], "a": 0, "e": "El rango privado es 172.16.0.0 – 172.31.255.255."}, {"id": 607, "t": "NET-2.1", "q": "¿Qué rango está reservado para APIPA (enlace local IPv4)?", "o": ["127.0.0.0/8", "169.254.0.0/16", "10.0.0.0/8", "192.0.2.0/24"], "a": 1, "e": "Lo asigna el propio equipo cuando no obtiene respuesta DHCP."}, {"id": 608, "t": "NET-2.1", "q": "¿Qué rango se usa para CGNAT de operadores (espacio compartido)?", "o": ["100.64.0.0/10", "172.16.0.0/12", "240.0.0.0/4", "198.18.0.0/15"], "a": 0, "e": "RFC 6598."}, {"id": 609, "t": "NET-2.1", "q": "¿A qué clase pertenece la dirección 191.50.3.4?", "o": ["Clase A", "Clase C", "Clase D", "Clase B"], "a": 3, "e": "Clase B: primer octeto de 128 a 191."}, {"id": 610, "t": "NET-2.1", "q": "¿Qué rango de primer octeto corresponde a la multidifusión (clase D)?", "o": ["192 – 223", "224 – 239", "240 – 255", "128 – 191"], "a": 1, "e": "240-255 es la clase E (experimental)."}, {"id": 611, "t": "NET-2.1", "q": "¿Cuál es la máscara por defecto de una red de clase C?", "o": ["255.255.255.252", "255.255.255.0", "255.255.0.0", "255.0.0.0"], "a": 1, "e": "/24."}, {"id": 612, "t": "NET-2.1", "q": "¿Qué tamaño mínimo tiene la cabecera IPv4?", "o": ["20 bytes", "40 bytes", "60 bytes", "8 bytes"], "a": 0, "e": "Máximo 60 con opciones. La de IPv6 es fija de 40 bytes."}, {"id": 613, "t": "NET-2.1", "q": "¿Qué número de protocolo IP corresponde a TCP?", "o": ["50", "6", "17", "1"], "a": 1, "e": "1 ICMP, 6 TCP, 17 UDP, 50 ESP, 51 AH, 89 OSPF."}, {"id": 614, "t": "NET-2.1", "q": "¿Qué ocurre cuando el TTL de un paquete llega a 0 en un router?", "o": ["Se fragmenta", "Se reenvía al destino igualmente", "El router lo descarta y envía un ICMP Time Exceeded al origen", "Se devuelve al origen intacto"], "a": 2, "e": "traceroute aprovecha este comportamiento."}, {"id": 615, "t": "NET-2.1", "q": "¿Qué TTL inicial suelen usar los sistemas Windows?", "o": ["255", "128", "64", "32"], "a": 1, "e": "Linux suele usar 64 y los equipos de red 255."}, {"id": 616, "t": "NET-2.1", "q": "¿Qué rangos de direcciones están reservados para documentación?", "o": ["127.0.0.0/8", "224.0.0.0/24", "192.0.2.0/24, 198.51.100.0/24 y 203.0.113.0/24", "10.0.0.0/8"], "a": 2, "e": "RFC 5737 (TEST-NET-1, 2 y 3)."}, {"id": 617, "t": "NET-2.1", "q": "¿Qué indica el flag DF en la cabecera IPv4?", "o": ["Que el paquete no debe fragmentarse", "Que es un paquete de difusión", "Que tiene prioridad alta", "Que es el último fragmento"], "a": 0, "e": "Si hace falta fragmentar, el router lo descarta y envía ICMP tipo 3 código 4."}, {"id": 618, "t": "NET-2.1", "q": "¿A qué dirección multidifusión envía OSPF sus mensajes a todos los routers OSPF?", "o": ["224.0.0.9", "224.0.0.10", "224.0.0.5", "224.0.0.1"], "a": 2, "e": "224.0.0.6 para DR/BDR; 224.0.0.9 RIPv2; 224.0.0.10 EIGRP."}, {"id": 619, "t": "NET-2.1", "q": "¿Qué representa la dirección 0.0.0.0/0 en una tabla de rutas?", "o": ["La ruta por defecto", "La difusión limitada", "La dirección de loopback", "Una red privada"], "a": 0, "e": "Coincide con cualquier destino si no hay otra ruta más específica."}, {"id": 620, "t": "NET-2.2", "q": "¿Cuántos hosts útiles tiene una subred /26?", "o": ["62", "126", "64", "30"], "a": 0, "e": "2^6 − 2 = 62."}, {"id": 621, "t": "NET-2.2", "q": "¿Qué máscara decimal corresponde a /27?", "o": ["255.255.255.240", "255.255.255.192", "255.255.255.248", "255.255.255.224"], "a": 3, "e": "3 bits de subred en el último octeto: 128+64+32 = 224."}, {"id": 622, "t": "NET-2.2", "q": "¿Cuál es la dirección de red de 192.168.10.77/27?", "o": ["192.168.10.72", "192.168.10.0", "192.168.10.64", "192.168.10.32"], "a": 2, "e": "Bloque de 32: 0, 32, 64, 96… el 77 cae en el bloque del 64."}, {"id": 623, "t": "NET-2.2", "q": "¿Cuál es la dirección de difusión de 192.168.10.77/27?", "o": ["192.168.10.255", "192.168.10.95", "192.168.10.127", "192.168.10.94"], "a": 1, "e": "La siguiente red empieza en .96, así que la difusión es .95."}, {"id": 624, "t": "NET-2.2", "q": "¿Cuántos hosts útiles tiene un /30?", "o": ["2", "0", "6", "4"], "a": 0, "e": "Se usa en enlaces punto a punto."}, {"id": 625, "t": "NET-2.2", "q": "¿Cuál es la dirección de red de 172.16.45.10/22?", "o": ["172.16.32.0", "172.16.40.0", "172.16.45.0", "172.16.44.0"], "a": 3, "e": "Bloque de 4 en el tercer octeto: 40, 44, 48… el 45 está en el 44."}, {"id": 626, "t": "NET-2.2", "q": "¿Cuántos hosts útiles tiene un /22?", "o": ["1022", "1024", "510", "2046"], "a": 0, "e": "2^10 − 2."}, {"id": 627, "t": "NET-2.2", "q": "Quieres dividir 192.168.1.0/24 en 4 subredes iguales. ¿Qué máscara usas?", "o": ["/28", "/25", "/26", "/27"], "a": 2, "e": "2 bits prestados → 4 subredes de 62 hosts."}, {"id": 628, "t": "NET-2.2", "q": "Necesitas al menos 50 hosts en una subred. ¿Cuál es la máscara más ajustada?", "o": ["/27", "/26", "/24", "/25"], "a": 1, "e": "/27 da 30 hosts (insuficiente); /26 da 62."}, {"id": 629, "t": "NET-2.2", "q": "¿Qué red resume 192.168.0.0/24, 192.168.1.0/24, 192.168.2.0/24 y 192.168.3.0/24?", "o": ["192.168.0.0/23", "192.168.0.0/22", "192.168.0.0/21", "192.168.0.0/16"], "a": 1, "e": "Cuatro /24 contiguos alineados forman un /22."}, {"id": 630, "t": "NET-2.2", "q": "¿Están 10.1.1.130/25 y 10.1.1.100/25 en la misma subred?", "o": ["Sí, ambas en 10.1.1.0/25", "Depende de la puerta de enlace", "Sí, ambas en 10.1.1.128/25", "No: una está en 10.1.1.128/25 y la otra en 10.1.1.0/25"], "a": 3, "e": "El /25 divide el último octeto en 0-127 y 128-255."}, {"id": 631, "t": "NET-2.2", "q": "¿Qué característica tiene una subred /31 según RFC 3021?", "o": ["No se puede usar nunca", "Tiene 1 host útil", "Se usa en enlaces punto a punto con 2 direcciones utilizables y sin red ni difusión", "Equivale a un /30"], "a": 2, "e": "Ahorra direcciones en enlaces entre routers."}, {"id": 632, "t": "NET-2.2", "q": "¿Qué es VLSM?", "o": ["Una técnica de NAT", "Una VLAN con varias máscaras", "Un protocolo de enrutamiento", "Usar máscaras de distinta longitud para ajustar cada subred a sus necesidades"], "a": 3, "e": "Se asignan primero las subredes más grandes."}, {"id": 633, "t": "NET-2.2", "q": "¿Cuál es el tamaño de bloque (salto) de una máscara 255.255.255.240?", "o": ["16", "8", "32", "240"], "a": 0, "e": "256 − 240 = 16."}, {"id": 634, "t": "NET-2.2", "q": "Un host tiene 192.168.1.130/25 y puerta de enlace 192.168.1.1. ¿Qué problema hay?", "o": ["La puerta de enlace está en otra subred (192.168.1.0/25), por lo que no puede alcanzarla", "La IP es de difusión", "La máscara debe ser /24 obligatoriamente", "Ninguno"], "a": 0, "e": "El host está en 192.168.1.128/25; la puerta de enlace debe estar en ese rango (.129-.254)."}, {"id": 635, "t": "NET-2.2", "q": "¿Cuál es la primera IP utilizable de la subred 10.0.8.0/21?", "o": ["10.0.8.0", "10.0.0.1", "10.0.9.1", "10.0.8.1"], "a": 3, "e": "/21 → bloque de 8 en el tercer octeto: red 10.0.8.0, difusión 10.0.15.255."}, {"id": 636, "t": "NET-2.2", "q": "¿Cuál es la dirección de difusión de 10.0.8.0/21?", "o": ["10.0.255.255", "10.0.8.255", "10.0.16.255", "10.0.15.255"], "a": 3, "e": "La siguiente red es 10.0.16.0."}, {"id": 637, "t": "NET-2.2", "q": "¿Cuántas subredes /27 caben en un /24?", "o": ["4", "8", "16", "32"], "a": 1, "e": "2^(27−24) = 8."}, {"id": 638, "t": "NET-2.2", "q": "¿Qué máscara wildcard (comodín) corresponde a un /24?", "o": ["255.255.255.0", "0.0.255.255", "255.0.0.0", "0.0.0.255"], "a": 3, "e": "Es la inversa de la máscara; se usa en ACL y OSPF de Cisco."}, {"id": 639, "t": "NET-2.3", "q": "¿Cuántos bits tiene una dirección IPv6?", "o": ["32", "256", "128", "64"], "a": 2, "e": "8 grupos de 16 bits en hexadecimal."}, {"id": 640, "t": "NET-2.3", "q": "¿Cuál es la forma abreviada correcta de 2001:0db8:0000:0000:0000:0000:0000:0001?", "o": ["2001:db8::0::1", "2001:db8:0:0::0:1::", "21:db8::1", "2001:db8::1"], "a": 3, "e": "Se quitan los ceros a la izquierda y una única secuencia de grupos de ceros se sustituye por ::."}, {"id": 641, "t": "NET-2.3", "q": "¿Por qué 2001:db8::1::2 es una dirección IPv6 inválida?", "o": ["Porque :: solo puede aparecer una vez", "Porque le faltan los ceros a la izquierda", "Porque 2001 no es válido", "Porque no puede terminar en 2"], "a": 0, "e": "Con dos :: no se sabría cuántos ceros representa cada uno."}, {"id": 642, "t": "NET-2.3", "q": "¿Qué prefijo tienen las direcciones IPv6 de enlace local?", "o": ["2000::/3", "fc00::/7", "fe80::/10", "ff00::/8"], "a": 2, "e": "Existen siempre en cada interfaz con IPv6."}, {"id": 643, "t": "NET-2.3", "q": "¿Qué prefijo identifica a las direcciones IPv6 locales únicas (equivalentes a las privadas)?", "o": ["2001:db8::/32", "::1/128", "fc00::/7 (en la práctica fd00::/8)", "fe80::/10"], "a": 2, "e": "ULA, RFC 4193."}, {"id": 644, "t": "NET-2.3", "q": "¿Cuál es la dirección de loopback en IPv6?", "o": ["::1", "fe80::1", "127::1", "::"], "a": 0, "e": ":: es la dirección no especificada."}, {"id": 645, "t": "NET-2.3", "q": "¿Qué tipo de comunicación NO existe en IPv6?", "o": ["Unidifusión", "Anycast", "Difusión (broadcast)", "Multidifusión"], "a": 2, "e": "Se sustituye por multidifusión (por ejemplo ff02::1)."}, {"id": 646, "t": "NET-2.3", "q": "¿Qué protocolo sustituye a ARP en IPv6?", "o": ["NDP (Neighbor Discovery) sobre ICMPv6", "DHCPv6", "RARP", "IGMP"], "a": 0, "e": "Usa mensajes Neighbor Solicitation (135) y Neighbor Advertisement (136)."}, {"id": 647, "t": "NET-2.3", "q": "¿Qué tipo de mensaje ICMPv6 es el anuncio de router (RA)?", "o": ["135", "134", "133", "136"], "a": 1, "e": "133 RS, 134 RA, 135 NS, 136 NA, 137 Redirect."}, {"id": 648, "t": "NET-2.3", "q": "¿Qué tamaño tiene la cabecera IPv6 básica?", "o": ["64 bytes", "40 bytes fijos", "Entre 20 y 60 bytes", "20 bytes"], "a": 1, "e": "No lleva checksum; las opciones van en cabeceras de extensión."}, {"id": 649, "t": "NET-2.3", "q": "¿Qué campo de la cabecera IPv6 equivale al TTL de IPv4?", "o": ["Traffic Class", "Next Header", "Flow Label", "Hop Limit"], "a": 3, "e": "Se decrementa en cada salto."}, {"id": 650, "t": "NET-2.3", "q": "¿Quién puede fragmentar paquetes en IPv6?", "o": ["Solo el destino", "Solo el origen", "Cualquier router", "Nadie, IPv6 no admite fragmentación"], "a": 1, "e": "Los routers no fragmentan; se usa Path MTU Discovery. MTU mínima 1280."}, {"id": 651, "t": "NET-2.3", "q": "¿Qué prefijo se usa normalmente para una subred LAN IPv6?", "o": ["/96", "/128", "/48", "/64"], "a": 3, "e": "SLAAC necesita 64 bits de identificador de interfaz."}, {"id": 652, "t": "NET-2.3", "q": "¿Cómo se genera el identificador de interfaz con EUI-64?", "o": ["Se genera aleatoriamente siempre", "Se repite la MAC dos veces", "Se parte la MAC en dos, se inserta FFFE en medio y se invierte el 7.º bit", "Se usa la IP v4 en hexadecimal"], "a": 2, "e": "Hoy se suelen usar identificadores aleatorios por privacidad."}, {"id": 653, "t": "NET-2.3", "q": "¿Qué dirección multidifusión IPv6 representa a todos los nodos del enlace local?", "o": ["ff02::1", "ff05::1", "ff02::2", "ff02::1:2"], "a": 0, "e": "ff02::2 son todos los routers; ff02::1:2 los servidores/relays DHCPv6."}, {"id": 654, "t": "NET-2.3", "q": "¿Qué mecanismo de transición recomienda la buena práctica para convivir IPv4 e IPv6?", "o": ["ISATAP", "Teredo", "Doble pila (dual stack)", "6to4"], "a": 2, "e": "Teredo, ISATAP y 6to4 están obsoletos o desaconsejados."}, {"id": 655, "t": "NET-2.3", "q": "¿Qué prefijo IPv6 está reservado para documentación?", "o": ["::ffff:0:0/96", "2002::/16", "2001:db8::/32", "fe80::/10"], "a": 2, "e": "Equivale a los TEST-NET de IPv4."}, {"id": 656, "t": "NET-2.3", "q": "¿Qué técnica permite a clientes solo IPv6 acceder a servidores solo IPv4?", "o": ["Anycast", "SLAAC", "NAT64 con DNS64", "Doble pila"], "a": 2, "e": "DNS64 sintetiza registros AAAA y NAT64 traduce el tráfico."}, {"id": 657, "t": "NET-3.1", "q": "¿Cuál es el orden del saludo de tres vías de TCP?", "o": ["ACK, SYN, SYN-ACK", "SYN, ACK, FIN", "SYN, SYN, ACK", "SYN, SYN-ACK, ACK"], "a": 3, "e": "El cierre ordenado usa FIN/ACK."}, {"id": 658, "t": "NET-3.1", "q": "¿Qué tamaño mínimo tiene la cabecera TCP?", "o": ["20 bytes", "8 bytes", "40 bytes", "12 bytes"], "a": 0, "e": "La de UDP tiene 8 bytes."}, {"id": 659, "t": "NET-3.1", "q": "¿Qué protocolo de transporte usa DHCP?", "o": ["ICMP", "SCTP", "UDP", "TCP"], "a": 2, "e": "UDP 67/68."}, {"id": 660, "t": "NET-3.1", "q": "¿Qué rango de puertos son los \"bien conocidos\"?", "o": ["1024 – 49151", "49152 – 65535", "0 – 65535", "0 – 1023"], "a": 3, "e": "1024-49151 registrados; 49152-65535 dinámicos."}, {"id": 661, "t": "NET-3.1", "q": "¿Qué rango de puertos efímeros usa Windows por defecto desde Vista?", "o": ["32768 – 60999", "1024 – 5000", "1024 – 65535", "49152 – 65535"], "a": 3, "e": "32768-60999 es el rango típico de Linux."}, {"id": 662, "t": "NET-3.1", "q": "¿Qué flag TCP termina una conexión de forma abrupta?", "o": ["PSH", "FIN", "RST", "URG"], "a": 2, "e": "FIN cierra de forma ordenada."}, {"id": 663, "t": "NET-3.1", "q": "¿Qué estado TCP mantiene el lado que cerró primero la conexión durante un tiempo tras el cierre?", "o": ["CLOSE_WAIT", "SYN_SENT", "LISTEN", "TIME_WAIT"], "a": 3, "e": "CLOSE_WAIT es el del lado que recibió el FIN y aún no ha cerrado."}, {"id": 664, "t": "NET-3.1", "q": "¿Qué puerto usa SSH?", "o": ["23", "2222", "22", "21"], "a": 2, "e": "23 es Telnet; 21 FTP control."}, {"id": 665, "t": "NET-3.1", "q": "¿Qué puerto usa SMB moderno directamente sobre TCP?", "o": ["135", "137", "139", "445"], "a": 3, "e": "139 es SMB sobre NetBIOS; 135 RPC."}, {"id": 666, "t": "NET-3.1", "q": "¿Qué puerto usa RDP?", "o": ["3389", "5900", "443", "3390"], "a": 0, "e": "5900 es VNC."}, {"id": 667, "t": "NET-3.1", "q": "¿Qué puerto usa LDAPS?", "o": ["3269", "636", "389", "3268"], "a": 1, "e": "389 LDAP, 3268/3269 catálogo global."}, {"id": 668, "t": "NET-3.1", "q": "¿Qué puerto usa IMAP sobre TLS?", "o": ["995", "143", "993", "465"], "a": 2, "e": "995 es POP3S y 465 SMTPS."}, {"id": 669, "t": "NET-3.1", "q": "¿Qué puerto usan los clientes de correo para enviar mensajes al servidor con STARTTLS (submission)?", "o": ["110", "25", "587", "143"], "a": 2, "e": "25 se usa entre servidores (MTA a MTA)."}, {"id": 670, "t": "NET-3.1", "q": "¿Qué puertos usa SNMP?", "o": ["UDP 514", "TCP 161 y 162", "UDP 161 para consultas y UDP 162 para traps", "UDP 162 para consultas y 161 para traps"], "a": 2, "e": "514 es syslog."}, {"id": 671, "t": "NET-3.1", "q": "¿Qué puerto usa NTP?", "o": ["UDP 514", "TCP 123", "UDP 69", "UDP 123"], "a": 3, "e": "69 es TFTP."}, {"id": 672, "t": "NET-3.1", "q": "¿Qué puerto usa BGP?", "o": ["IP 89", "TCP 179", "UDP 179", "TCP 520"], "a": 1, "e": "RIP usa UDP 520; OSPF va directo sobre IP (protocolo 89)."}, {"id": 673, "t": "NET-3.1", "q": "¿Sobre qué protocolo de transporte funciona QUIC (HTTP/3)?", "o": ["TCP 80", "TCP 443", "SCTP", "UDP 443"], "a": 3, "e": "Integra TLS 1.3."}, {"id": 674, "t": "NET-3.1", "q": "¿Qué puerto usa Microsoft SQL Server por defecto?", "o": ["1433", "1521", "5432", "3306"], "a": 0, "e": "1521 Oracle, 3306 MySQL, 5432 PostgreSQL."}, {"id": 675, "t": "NET-3.1", "q": "¿Qué servicio usa el puerto TCP 53 además del UDP 53?", "o": ["NTP", "DHCP", "DNS (transferencias de zona y respuestas grandes)", "TFTP"], "a": 2, "e": "Las consultas normales van por UDP."}, {"id": 676, "t": "NET-3.1", "q": "¿Qué es un socket?", "o": ["La combinación de dirección IP, protocolo y puerto", "Un tipo de cable", "Un servidor DNS", "Una dirección MAC"], "a": 0, "e": "Identifica un extremo de una comunicación."}, {"id": 677, "t": "NET-3.1", "q": "¿Qué protocolo garantiza la entrega ordenada de los datos?", "o": ["UDP", "TCP", "ICMP", "IP"], "a": 1, "e": "Usa números de secuencia, ACK y retransmisiones."}, {"id": 678, "t": "NET-3.1", "q": "¿Qué puerto usa la API de Kubernetes por defecto?", "o": ["10250", "2379", "8080", "6443"], "a": 3, "e": "2379 es etcd y 10250 el kubelet."}, {"id": 679, "t": "NET-3.2", "q": "¿Cómo se envía una solicitud ARP?", "o": ["Por TCP al servidor DNS", "Por unidifusión al router", "Por difusión en la red local", "Por multidifusión a 224.0.0.1"], "a": 2, "e": "La respuesta ARP se envía en unidifusión."}, {"id": 680, "t": "NET-3.2", "q": "Un PC quiere enviar un paquete a una IP de otra red. ¿Qué MAC pide por ARP?", "o": ["La del destino final", "La del servidor DNS", "La de difusión", "La de su puerta de enlace"], "a": 3, "e": "Fuera de la red local el siguiente salto es el router."}, {"id": 681, "t": "NET-3.2", "q": "¿Qué tipo ICMP corresponde a la solicitud de eco (ping)?", "o": ["11", "3", "8", "0"], "a": 2, "e": "0 es la respuesta de eco."}, {"id": 682, "t": "NET-3.2", "q": "¿Qué tipo ICMP indica destino inalcanzable?", "o": ["11", "3", "5", "8"], "a": 1, "e": "Con códigos: 0 red, 1 host, 3 puerto, 4 fragmentación necesaria."}, {"id": 683, "t": "NET-3.2", "q": "¿Qué técnica permite que muchas IP privadas compartan una sola IP pública distinguiéndose por puerto?", "o": ["NAT estático", "PAT (NAT con sobrecarga)", "Proxy ARP", "NAT dinámico con pool"], "a": 1, "e": "También llamado NAPT; es lo que hace un router doméstico."}, {"id": 684, "t": "NET-3.2", "q": "En terminología Cisco, ¿cómo se llama la IP privada de un host interno?", "o": ["Outside local", "Inside local", "Outside global", "Inside global"], "a": 1, "e": "Inside global es la IP pública que lo representa."}, {"id": 685, "t": "NET-3.2", "q": "¿Qué stratum NTP indica un reloj no sincronizado?", "o": ["16", "0", "15", "1"], "a": 0, "e": "Stratum 0 es el reloj de referencia (atómico/GPS)."}, {"id": 686, "t": "NET-3.2", "q": "¿Qué versión de SNMP proporciona autenticación y cifrado?", "o": ["SNMPv1", "SNMPv2c", "Todas", "SNMPv3"], "a": 3, "e": "v1 y v2c usan comunidades en texto claro."}, {"id": 687, "t": "NET-3.2", "q": "¿Qué nivel de seguridad de SNMPv3 ofrece autenticación y cifrado?", "o": ["noAuthNoPriv", "authNoPriv", "privAuth", "authPriv"], "a": 3, "e": "authNoPriv autentica pero no cifra."}, {"id": 688, "t": "NET-3.2", "q": "En syslog, ¿qué nivel de gravedad es el más grave?", "o": ["0 – Emergencia", "4 – Advertencia", "7 – Depuración", "3 – Error"], "a": 0, "e": "Cuanto menor es el número, más grave."}, {"id": 689, "t": "NET-3.2", "q": "¿Qué nivel de syslog corresponde a \"Error\"?", "o": ["4", "2", "3", "5"], "a": 2, "e": "0 emerg, 1 alert, 2 crit, 3 err, 4 warning, 5 notice, 6 info, 7 debug."}, {"id": 690, "t": "NET-3.2", "q": "¿Qué tipo de consulta DNS hace un cliente a su servidor DNS?", "o": ["De transferencia", "Inversa obligatoriamente", "Iterativa", "Recursiva"], "a": 3, "e": "El resolvedor hace consultas iterativas a raíz, TLD y autoritativos."}, {"id": 691, "t": "NET-3.2", "q": "¿Qué protocolo estándar IEEE permite descubrir dispositivos vecinos en capa 2?", "o": ["CDP", "LLDP (802.1AB)", "ARP", "STP"], "a": 1, "e": "CDP es el equivalente propietario de Cisco."}, {"id": 692, "t": "NET-3.2", "q": "¿Qué es un ARP gratuito?", "o": ["Una consulta ARP a Internet", "Una respuesta ARP del router", "Un anuncio ARP de la propia IP, sin que nadie lo haya pedido", "Un ARP sin coste de licencia"], "a": 2, "e": "Se usa para detectar duplicados y en conmutaciones por error."}, {"id": 693, "t": "NET-3.2", "q": "¿Qué protocolo DNS cifra las consultas usando HTTPS?", "o": ["DoH (DNS over HTTPS)", "DNSSEC", "mDNS", "DoT"], "a": 0, "e": "DoT usa TLS en el puerto 853; DNSSEC firma pero no cifra."}, {"id": 694, "t": "NET-3.2", "q": "¿Qué proporciona DNSSEC?", "o": ["Cifrado de las consultas", "Resolución más rápida", "Balanceo de carga", "Autenticidad e integridad de las respuestas DNS mediante firmas"], "a": 3, "e": "No cifra; para confidencialidad se usan DoH/DoT."}, {"id": 695, "t": "NET-3.2", "q": "¿Por qué un \"ping\" correcto no garantiza que funcione una web en ese servidor?", "o": ["Porque ping usa UDP", "Porque ping no atraviesa routers", "Porque ping solo prueba el DNS", "Porque ping usa ICMP y no comprueba el puerto TCP del servicio"], "a": 3, "e": "Hay que probar el puerto (Test-NetConnection -Port 443)."}, {"id": 696, "t": "NET-3.3", "q": "¿Qué código HTTP indica que el usuario no se ha autenticado?", "o": ["401 Unauthorized", "403 Forbidden", "400 Bad Request", "404 Not Found"], "a": 0, "e": "403 indica que, aun autenticado, no tiene permiso."}, {"id": 697, "t": "NET-3.3", "q": "¿Qué código HTTP devuelve un proxy inverso cuando el servidor de backend responde de forma inválida?", "o": ["503 Service Unavailable", "504 Gateway Timeout", "502 Bad Gateway", "500 Internal Server Error"], "a": 2, "e": "504 es cuando el backend no responde a tiempo."}, {"id": 698, "t": "NET-3.3", "q": "¿Qué código HTTP indica redirección permanente?", "o": ["304", "307", "301", "302"], "a": 2, "e": "302 y 307 son temporales; 304 Not Modified (caché)."}, {"id": 699, "t": "NET-3.3", "q": "¿Qué método HTTP NO es idempotente?", "o": ["DELETE", "GET", "POST", "PUT"], "a": 2, "e": "Repetir un POST puede crear varios recursos."}, {"id": 700, "t": "NET-3.3", "q": "¿Qué método HTTP devuelve solo las cabeceras, sin el cuerpo?", "o": ["HEAD", "GET", "OPTIONS", "TRACE"], "a": 0, "e": "Útil para comprobar si un recurso existe o ha cambiado."}, {"id": 701, "t": "NET-3.3", "q": "¿Qué cabecera HTTP es obligatoria en HTTP/1.1?", "o": ["Accept", "Cookie", "User-Agent", "Host"], "a": 3, "e": "Permite el alojamiento virtual por nombre."}, {"id": 702, "t": "NET-3.3", "q": "¿Sobre qué transporte funciona HTTP/2?", "o": ["SCTP", "UDP", "TCP", "QUIC"], "a": 2, "e": "HTTP/3 es el que usa QUIC sobre UDP."}, {"id": 703, "t": "NET-3.3", "q": "¿Qué versiones de TLS se consideran seguras actualmente?", "o": ["TLS 1.2 y TLS 1.3", "TLS 1.0 y TLS 1.1", "SSL 3.0 y TLS 1.0", "Solo SSL 2.0"], "a": 0, "e": "SSL 2/3 y TLS 1.0/1.1 están obsoletos."}, {"id": 704, "t": "NET-3.3", "q": "¿Qué característica es obligatoria en TLS 1.3?", "o": ["Funciones hash MD5", "Cifrado RC4", "Intercambio de claves RSA estático", "Secreto perfecto hacia adelante (intercambio de claves efímero ECDHE/DHE)"], "a": 3, "e": "TLS 1.3 eliminó RSA estático, RC4, SHA-1 y modos CBC."}, {"id": 705, "t": "NET-3.3", "q": "¿Qué extensión de TLS permite alojar varios certificados en la misma IP y puerto?", "o": ["ALPN", "HSTS", "OCSP stapling", "SNI (Server Name Indication)"], "a": 3, "e": "El cliente indica el nombre de host en el saludo TLS."}, {"id": 706, "t": "NET-3.3", "q": "¿Qué cabecera obliga al navegador a usar siempre HTTPS con un sitio?", "o": ["Strict-Transport-Security (HSTS)", "Access-Control-Allow-Origin", "Content-Security-Policy", "X-Frame-Options"], "a": 0, "e": "El navegador recuerda la política durante max-age."}, {"id": 707, "t": "NET-3.3", "q": "¿Qué diferencia hay entre POP3 e IMAP?", "o": ["IMAP solo envía correo", "POP3 descarga y normalmente borra del servidor; IMAP sincroniza y mantiene el correo en el servidor", "POP3 cifra y IMAP no", "Son idénticos"], "a": 1, "e": "Ninguno de los dos envía: para eso está SMTP."}, {"id": 708, "t": "NET-3.3", "q": "¿Qué registro de autenticación de correo indica qué IP pueden enviar correo de un dominio?", "o": ["MX", "DKIM", "SPF", "DMARC"], "a": 2, "e": "DKIM firma los mensajes; DMARC define la política y los informes."}, {"id": 709, "t": "NET-3.3", "q": "¿Qué define DMARC?", "o": ["El cifrado de los buzones", "Qué hacer con los correos que fallan SPF/DKIM alineados (none, quarantine, reject) y el envío de informes", "La firma criptográfica de los mensajes", "El servidor de correo del dominio"], "a": 1, "e": "Se publica como registro TXT en _dmarc.dominio."}, {"id": 710, "t": "NET-3.3", "q": "¿Qué diferencia hay entre SFTP y FTPS?", "o": ["Son el mismo protocolo", "SFTP es un subsistema de SSH (puerto 22); FTPS es FTP sobre TLS", "SFTP es FTP sin cifrar", "FTPS usa el puerto 22"], "a": 1, "e": "Son protocolos completamente distintos."}, {"id": 711, "t": "NET-3.3", "q": "¿En qué modo FTP abre el servidor un puerto alto y el cliente se conecta a él para los datos?", "o": ["ASCII", "Activo", "Pasivo", "Binario"], "a": 2, "e": "El modo pasivo funciona mejor con NAT y firewalls del lado del cliente."}, {"id": 712, "t": "NET-3.3", "q": "¿Qué protocolo se usa típicamente para arrancar por PXE y actualizar firmware de equipos de red, sin autenticación?", "o": ["FTP", "SFTP", "TFTP (UDP 69)", "SCP"], "a": 2, "e": "Trivial File Transfer Protocol."}, {"id": 713, "t": "NET-3.3", "q": "¿Qué diferencia hay entre un proxy directo y uno inverso?", "o": ["El directo actúa en nombre de los clientes; el inverso, delante de los servidores", "El directo solo publica servidores", "Son sinónimos", "El inverso solo funciona con FTP"], "a": 0, "e": "El inverso se usa para publicar, balancear y terminar TLS."}, {"id": 714, "t": "NET-3.3", "q": "¿Qué componente de correo recibe los mensajes que envían los usuarios (normalmente en el 587)?", "o": ["POP3", "MDA", "MUA", "MSA (Mail Submission Agent)"], "a": 3, "e": "MUA es el cliente; MTA transporta; MDA entrega al buzón."}, {"id": 715, "t": "NET-3.3", "q": "¿Qué hace STARTTLS?", "o": ["Convierte una conexión iniciada en claro en una conexión cifrada con TLS", "Firma los correos", "Cambia el puerto a 443", "Inicia un túnel VPN"], "a": 0, "e": "Se usa en SMTP (587), IMAP (143) y POP3 (110)."}, {"id": 716, "t": "NET-3.3", "q": "¿Qué código HTTP indica que se han enviado demasiadas solicitudes (limitación de tasa)?", "o": ["408", "413", "503", "429"], "a": 3, "e": "429 Too Many Requests."}, {"id": 717, "t": "NET-4.1", "q": "¿Cuántos paquetes envía ping por defecto en Windows?", "o": ["10", "1", "4", "Infinitos hasta Ctrl+C"], "a": 2, "e": "En Linux es continuo hasta Ctrl+C (se limita con -c)."}, {"id": 718, "t": "NET-4.1", "q": "¿Qué opción de ping en Windows envía paquetes de forma continua?", "o": ["-c", "-t", "-n 0", "-l"], "a": 1, "e": "-n indica el número de paquetes; -l el tamaño."}, {"id": 719, "t": "NET-4.1", "q": "¿Qué comando de Windows comprueba si se puede enviar un paquete de 1500 bytes sin fragmentar?", "o": ["ping -l 1500 destino", "tracert -mtu 1500 destino", "ping -f -l 1472 destino", "ping -s 1500 -M do destino"], "a": 2, "e": "1472 de datos + 8 de cabecera ICMP + 20 de cabecera IP = 1500. -s/-M do es la sintaxis de Linux."}, {"id": 720, "t": "NET-4.1", "q": "¿Qué opción de tracert evita la resolución de nombres para que sea más rápido?", "o": ["-d", "-h", "-n", "-w"], "a": 0, "e": "-h fija el número máximo de saltos (30 por defecto); -w el tiempo de espera."}, {"id": 721, "t": "NET-4.1", "q": "¿Qué herramienta de Windows combina tracert con estadísticas de pérdida de paquetes por salto?", "o": ["pathping", "netstat -r", "tracert -s", "mtr"], "a": 0, "e": "mtr es la herramienta equivalente en Linux."}, {"id": 722, "t": "NET-4.1", "q": "¿Qué comando de Windows muestra todas las conexiones y puertos en escucha con el PID del proceso?", "o": ["netstat -ano", "netstat -e", "netstat -s", "netstat -r"], "a": 0, "e": "-a todas, -n numérico, -o PID. -b muestra el ejecutable (requiere administrador)."}, {"id": 723, "t": "NET-4.1", "q": "¿Qué comando de cmd muestra quién está usando el puerto 443?", "o": ["netstat -port 443", "ipconfig /port 443", "tasklist /port 443", "netstat -ano | findstr :443"], "a": 3, "e": "Con el PID se puede buscar el proceso con tasklist /FI \"PID eq N\"."}, {"id": 724, "t": "NET-4.1", "q": "¿Qué hace ipconfig /registerdns?", "o": ["Renueva las concesiones DHCP y vuelve a registrar el equipo en DNS", "Vacía la caché DNS", "Cambia el servidor DNS", "Muestra la caché DNS"], "a": 0, "e": "/flushdns vacía; /displaydns muestra la caché."}, {"id": 725, "t": "NET-4.1", "q": "¿Qué comando de nslookup consulta los registros MX de un dominio?", "o": ["nslookup /query:mx age.es", "nslookup -mx age.es", "nslookup age.es MX", "nslookup -type=mx age.es"], "a": 3, "e": "En modo interactivo: set type=mx."}, {"id": 726, "t": "NET-4.1", "q": "¿Cómo se consulta a un servidor DNS concreto con nslookup?", "o": ["nslookup www.age.es @8.8.8.8", "nslookup -server 8.8.8.8 www.age.es", "nslookup /dns:8.8.8.8 www.age.es", "nslookup www.age.es 8.8.8.8"], "a": 3, "e": "La sintaxis @servidor es la de dig."}, {"id": 727, "t": "NET-4.1", "q": "¿Qué comando añade una ruta estática persistente en Windows?", "o": ["route add 10.20.0.0 192.168.1.254 -save", "netsh route add 10.20.0.0 persistent", "route add -persistent 10.20.0.0/16 192.168.1.254", "route -p add 10.20.0.0 mask 255.255.0.0 192.168.1.254"], "a": 3, "e": "Sin -p la ruta desaparece al reiniciar."}, {"id": 728, "t": "NET-4.1", "q": "¿Qué comando de cmd borra toda la caché ARP?", "o": ["arp -c", "arp -flush", "arp -d *", "ipconfig /flusharp"], "a": 2, "e": "Requiere consola de administrador."}, {"id": 729, "t": "NET-4.1", "q": "¿Qué comando de netsh muestra la contraseña guardada de una red Wi-Fi?", "o": ["netsh wifi show key", "netsh wlan show password \"WiFi-Oficina\"", "netsh wlan show profile name=\"WiFi-Oficina\" key=clear", "netsh wlan export key"], "a": 2, "e": "Requiere privilegios de administrador."}, {"id": 730, "t": "NET-4.1", "q": "¿Qué comando restablece la pila TCP/IP de Windows?", "o": ["netsh int ip reset", "ipconfig /reset", "net stop tcpip", "netsh tcp reset all"], "a": 0, "e": "netsh winsock reset restablece el catálogo Winsock. Ambos requieren reiniciar."}, {"id": 731, "t": "NET-4.1", "q": "¿Qué comando configura una IP estática con netsh?", "o": ["netsh ip set Ethernet 192.168.1.50/24 gw 192.168.1.1", "netsh set address Ethernet 192.168.1.50 255.255.255.0", "netsh interface set ip Ethernet static 192.168.1.50", "netsh interface ip set address name=\"Ethernet\" static 192.168.1.50 255.255.255.0 192.168.1.1"], "a": 3, "e": "Orden: IP, máscara y puerta de enlace."}, {"id": 732, "t": "NET-4.1", "q": "¿Qué herramienta nativa de Windows permite capturar paquetes sin instalar software adicional?", "o": ["netsh trace (o pktmon)", "tcpdump", "Wireshark", "Network Monitor 3.4"], "a": 0, "e": "Genera un fichero .etl; pktmon también puede exportar a pcapng."}, {"id": 733, "t": "NET-4.1", "q": "¿Qué comando muestra las direcciones MAC de las interfaces en Windows?", "o": ["arp -m", "getmac", "ipconfig /mac", "hostname /mac"], "a": 1, "e": "También aparecen en ipconfig /all (Dirección física)."}, {"id": 734, "t": "NET-4.1", "q": "¿Qué protocolo usa tracert de Windows para sus sondas?", "o": ["TCP SYN al puerto 80", "UDP a puertos altos", "ICMP Echo", "ARP"], "a": 2, "e": "traceroute de Linux usa UDP por defecto."}, {"id": 735, "t": "NET-4.1", "q": "¿Qué opción de ping en Windows resuelve el nombre de una dirección IP?", "o": ["-a", "-n", "-r", "-i"], "a": 0, "e": "-i fija el TTL; -r registra la ruta."}, {"id": 736, "t": "NET-4.2", "q": "¿Qué cmdlet comprueba si el puerto 3389 de un servidor está abierto?", "o": ["Test-Connection SRV01 -Port 3389", "Get-NetTCPConnection -RemotePort 3389", "Test-Port SRV01 3389", "Test-NetConnection SRV01 -Port 3389"], "a": 3, "e": "Test-Connection solo hace ping (ICMP)."}, {"id": 737, "t": "NET-4.2", "q": "¿Qué valor admite -CommonTCPPort en Test-NetConnection?", "o": ["DNS, DHCP y NTP", "Cualquier número de puerto", "SSH y FTP", "HTTP, RDP, SMB o WINRM"], "a": 3, "e": "Para otros puertos se usa -Port."}, {"id": 738, "t": "NET-4.2", "q": "¿Qué cmdlet muestra el equivalente a ipconfig?", "o": ["Show-NetIPAddress", "Get-NetAdapter", "Get-NetIPConfiguration", "Get-IPConfig"], "a": 2, "e": "Get-NetAdapter muestra las tarjetas (estado, MAC, velocidad)."}, {"id": 739, "t": "NET-4.2", "q": "¿Qué cmdlet resuelve un nombre DNS y permite indicar tipo y servidor?", "o": ["nslookup-Ps age.es", "Get-DnsRecord age.es MX", "Test-Dns age.es -MX", "Resolve-DnsName age.es -Type MX -Server 8.8.8.8"], "a": 3, "e": "-DnsOnly evita LLMNR/NetBIOS y el fichero hosts."}, {"id": 740, "t": "NET-4.2", "q": "¿Qué cmdlet añade una ruta estática en PowerShell?", "o": ["New-NetRoute -DestinationPrefix 10.20.0.0/16 -InterfaceAlias LAN -NextHop 192.168.1.254", "Add-Route 10.20.0.0/16 192.168.1.254", "Set-NetRoute -Add 10.20.0.0/16", "New-Route -Network 10.20.0.0 -Gateway 192.168.1.254"], "a": 0, "e": "Por defecto se crea en el almacén persistente y en el activo."}, {"id": 741, "t": "NET-4.2", "q": "¿Qué cmdlet vuelve a configurar los servidores DNS de una interfaz para que se obtengan por DHCP?", "o": ["Remove-DnsServerAddress", "Clear-DnsClientCache", "Set-DnsClientServerAddress -InterfaceAlias LAN -Dhcp", "Set-DnsClientServerAddress -InterfaceAlias LAN -ResetServerAddresses"], "a": 3, "e": "-ResetServerAddresses elimina los DNS estáticos."}, {"id": 742, "t": "NET-4.2", "q": "¿Por qué falla New-NetIPAddress con el error \"DefaultGateway already exists\"?", "o": ["Porque la interfaz ya tiene una puerta de enlace por defecto; hay que quitarla con Remove-NetRoute", "Porque la IP está en uso", "Porque falta -Force", "Porque la interfaz está deshabilitada"], "a": 0, "e": "No pueden coexistir dos rutas por defecto iguales en la interfaz."}, {"id": 743, "t": "NET-4.2", "q": "¿Qué cmdlet muestra qué proceso escucha en el puerto 80?", "o": ["Get-Process -Port 80", "Get-Process -Id (Get-NetTCPConnection -LocalPort 80 -State Listen).OwningProcess", "Get-NetTCPConnection -Process 80", "Get-Service -Port 80"], "a": 1, "e": "OwningProcess contiene el PID."}, {"id": 744, "t": "NET-4.2", "q": "¿Qué cmdlet cambia el perfil de red de una interfaz a Privada?", "o": ["Set-NetConnectionProfile -InterfaceAlias LAN -NetworkCategory Private", "Set-NetFirewallProfile -Private LAN", "Set-NetAdapter LAN -Profile Private", "Set-NetIPInterface -Category Private"], "a": 0, "e": "El perfil Dominio no se puede asignar manualmente; se detecta solo."}, {"id": 745, "t": "NET-4.2", "q": "¿Qué cmdlet indica qué ruta e IP de origen se usarían para llegar a un destino?", "o": ["Find-NetRoute -RemoteIPAddress 10.20.5.5", "Trace-NetRoute 10.20.5.5", "Get-NetRoute -Destination 10.20.5.5", "Test-NetRoute 10.20.5.5"], "a": 0, "e": "Equivale a ip route get en Linux."}, {"id": 746, "t": "NET-4.2", "q": "¿Qué alias corto tiene Test-NetConnection?", "o": ["tnc", "ping2", "tc", "tnet"], "a": 0, "e": "Solo existe en Windows (módulo NetTCPIP)."}, {"id": 747, "t": "NET-4.2", "q": "En PowerShell 7, ¿qué parámetro de Test-Connection hace un traceroute?", "o": ["-Route", "-Trace", "-Hops", "-Traceroute"], "a": 3, "e": "Test-NetConnection usa -TraceRoute (y -Hops para el máximo)."}, {"id": 748, "t": "NET-4.2", "q": "¿Qué cmdlet vuelve a habilitar DHCP en una interfaz?", "o": ["New-NetIPAddress -Dhcp", "Set-NetIPInterface -InterfaceAlias LAN -Dhcp Enabled", "Enable-Dhcp -InterfaceAlias LAN", "Set-NetIPAddress -Dhcp $true"], "a": 1, "e": "Conviene quitar antes la IP y la ruta estáticas."}, {"id": 749, "t": "NET-4.2", "q": "¿Qué cmdlet devuelve True o False según responda un ping?", "o": ["Test-NetConnection srv01 -Ping", "Test-Connection srv01 -Count 1 -Quiet", "Test-Connection srv01 -Bool", "ping srv01 -Quiet"], "a": 1, "e": "-Quiet devuelve solo un booleano."}, {"id": 750, "t": "NET-4.2", "q": "¿Qué cmdlet obtiene una página web y devuelve el código de estado?", "o": ["Invoke-WebRequest", "Get-WebPage", "Invoke-RestMethod -Status", "Test-Url"], "a": 0, "e": "Invoke-RestMethod convierte directamente la respuesta JSON/XML en objetos."}, {"id": 751, "t": "NET-4.2", "q": "¿Qué cmdlet muestra la tabla ARP y de vecinos IPv6?", "o": ["Get-NetRoute -Arp", "Show-NetNeighbor", "Get-NetNeighbor", "Get-NetArp"], "a": 2, "e": "Remove-NetNeighbor la vacía."}, {"id": 752, "t": "NET-4.3", "q": "¿Qué comando moderno de Linux sustituye a ifconfig?", "o": ["ip a (ip addr)", "nmcli show", "ifup", "netstat -i"], "a": 0, "e": "ifconfig pertenece a net-tools, obsoleto."}, {"id": 753, "t": "NET-4.3", "q": "¿Qué comando de Linux muestra los puertos TCP y UDP en escucha con el proceso?", "o": ["ip ports", "netstat -ano", "ss -tulpn", "lsof -tcp"], "a": 2, "e": "Sustituye a netstat -tulpn."}, {"id": 754, "t": "NET-4.3", "q": "¿Qué comando de Linux muestra la tabla de rutas?", "o": ["ip addr", "ip route", "route print", "ss -r"], "a": 1, "e": "route print es de Windows."}, {"id": 755, "t": "NET-4.3", "q": "¿Qué comando de Linux envía exactamente 4 pings?", "o": ["ping -c 4 host", "ping -n 4 host", "ping -t 4 host", "ping 4 host"], "a": 0, "e": "-n en Linux significa salida numérica."}, {"id": 756, "t": "NET-4.3", "q": "¿Qué hace dig +short www.age.es?", "o": ["Hace una consulta abreviada al servidor raíz", "Muestra solo el TTL", "Resuelve en IPv6", "Muestra solo la respuesta (por ejemplo la IP), sin el resto de secciones"], "a": 3, "e": "dig @servidor fija el DNS a consultar; dig -x hace búsqueda inversa."}, {"id": 757, "t": "NET-4.3", "q": "¿Qué comando de Linux muestra el camino DNS completo desde los servidores raíz?", "o": ["nslookup -trace www.age.es", "host -r www.age.es", "traceroute -dns www.age.es", "dig +trace www.age.es"], "a": 3, "e": "Sigue las delegaciones desde la raíz."}, {"id": 758, "t": "NET-4.3", "q": "¿Qué hace nmap -sn 192.168.1.0/24?", "o": ["Escanea todos los puertos", "Detecta el sistema operativo", "Descubre qué hosts están activos sin escanear puertos", "Hace un escaneo SYN"], "a": 2, "e": "Antes se llamaba -sP (ping sweep)."}, {"id": 759, "t": "NET-4.3", "q": "¿Qué opción de nmap detecta las versiones de los servicios?", "o": ["-O", "-sS", "-sn", "-sV"], "a": 3, "e": "-O detecta el sistema operativo; -sS escaneo SYN (semiabierto)."}, {"id": 760, "t": "NET-4.3", "q": "¿Qué comando captura el tráfico DNS en la interfaz eth0 sin resolver nombres?", "o": ["wireshark -i eth0 dns", "tcpdump -i eth0 -n port 53", "tcpdump eth0 dns", "ss -i eth0 port 53"], "a": 1, "e": "-w fichero.pcap guarda la captura."}, {"id": 761, "t": "NET-4.3", "q": "¿Qué herramienta configura la red de forma persistente en Ubuntu Server moderno?", "o": ["/etc/sysconfig/network-scripts", "Netplan (/etc/netplan/*.yaml)", "route add", "ifconfig"], "a": 1, "e": "RHEL usa NetworkManager (nmcli)."}, {"id": 762, "t": "NET-4.3", "q": "¿Qué comando muestra la velocidad y el dúplex de una tarjeta en Linux?", "o": ["ethtool eth0", "ss -i eth0", "ip speed eth0", "nmcli speed"], "a": 0, "e": "Útil para detectar desajustes de dúplex."}, {"id": 763, "t": "NET-4.3", "q": "¿Qué comando de Linux muestra la tabla ARP (vecinos)?", "o": ["ip neigh", "ip arp", "ss -arp", "arp -a obligatoriamente"], "a": 0, "e": "Sustituye a arp -n."}, {"id": 764, "t": "NET-4.3", "q": "¿Qué comando de Linux comprueba si un puerto TCP remoto está abierto?", "o": ["dig srv01:443", "nc -zv srv01 443", "ping -p 443 srv01", "ip test srv01 443"], "a": 1, "e": "También curl -v telnet://srv01:443 o nmap -p 443."}, {"id": 765, "t": "NET-4.3", "q": "¿Qué paquete de Linux contiene ip y ss?", "o": ["bind-utils", "net-tools", "iputils", "iproute2"], "a": 3, "e": "net-tools (ifconfig, netstat, route, arp) está obsoleto."}, {"id": 766, "t": "NET-4.3", "q": "¿Qué comando de Linux muestra solo las cabeceras HTTP de una URL?", "o": ["curl --body https://www.age.es", "curl -I https://www.age.es", "wget -h https://www.age.es", "curl -H https://www.age.es"], "a": 1, "e": "-I hace una petición HEAD."}, {"id": 767, "t": "NET-4.4", "q": "¿Qué comando de Cisco IOS guarda la configuración para que sobreviva a un reinicio?", "o": ["copy startup-config running-config", "write erase", "copy running-config startup-config", "save config"], "a": 2, "e": "También write memory (wr). write erase borra la configuración de arranque."}, {"id": 768, "t": "NET-4.4", "q": "¿Dónde se guarda la startup-config en un equipo Cisco?", "o": ["ROM", "Flash obligatoriamente", "RAM", "NVRAM"], "a": 3, "e": "La running-config está en RAM."}, {"id": 769, "t": "NET-4.4", "q": "¿Qué comando muestra un resumen del estado e IP de todas las interfaces?", "o": ["show ip route", "show interfaces summary", "show ip interface brief", "show running-config interfaces"], "a": 2, "e": "Muestra Status y Protocol de cada interfaz."}, {"id": 770, "t": "NET-4.4", "q": "Una interfaz aparece como \"administratively down\". ¿Qué hay que hacer?", "o": ["Reiniciar el router", "Ejecutar no shutdown en la interfaz", "Configurar la VLAN", "Cambiar el cable"], "a": 1, "e": "Las interfaces de router vienen apagadas por defecto."}, {"id": 771, "t": "NET-4.4", "q": "Una interfaz aparece como \"down/down\". ¿Qué indica normalmente?", "o": ["Un problema de enrutamiento", "Un problema de DNS", "Que se ha apagado con shutdown", "Un problema de capa física (cable, conector, equipo remoto apagado)"], "a": 3, "e": "up/down suele indicar problema de capa 2."}, {"id": 772, "t": "NET-4.4", "q": "¿Qué comando configura una ruta por defecto en Cisco?", "o": ["ip route 0.0.0.0 0.0.0.0 203.0.113.1", "ip default-route 203.0.113.1", "route add default 203.0.113.1", "ip route default 203.0.113.1"], "a": 0, "e": "ip default-gateway se usa en switches de capa 2 sin enrutamiento."}, {"id": 773, "t": "NET-4.4", "q": "¿Qué comando pone un puerto de switch en modo acceso para la VLAN 10?", "o": ["switchport mode access y switchport access vlan 10", "vlan 10 access", "interface vlan 10 access", "switchport trunk vlan 10"], "a": 0, "e": "interface vlan 10 crea una SVI."}, {"id": 774, "t": "NET-4.4", "q": "¿Qué comando muestra las VLAN y los puertos asignados?", "o": ["show vlan brief", "show vlan trunk", "show interfaces vlan", "show mac vlan"], "a": 0, "e": "show interfaces trunk muestra los troncales."}, {"id": 775, "t": "NET-4.4", "q": "¿Qué comando de Cisco reenvía las peticiones DHCP de una subred a un servidor de otra red?", "o": ["dhcp forward 192.168.99.5", "ip dhcp relay 192.168.99.5", "ip helper-address 192.168.99.5", "ip dhcp server 192.168.99.5"], "a":
