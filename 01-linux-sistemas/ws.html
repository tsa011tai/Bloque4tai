**Cómo leer este temario**

# PowerShell

## Nivel 1 — Primeros pasos

### PS-1.1 · Qué es PowerShell y qué versiones existen

PowerShell es un **shell de línea de comandos + lenguaje de scripting** de Microsoft, orientado a **objetos .NET** (no a texto, como bash o cmd). Cada comando devuelve objetos con propiedades y métodos.

| | Windows PowerShell 5.1 | PowerShell 7.x |
|---|---|---|
| Ejecutable | `powershell.exe` | `pwsh.exe` (Linux/macOS: `pwsh`) |
| Plataforma | Solo Windows | Windows, Linux, macOS |
| Motor .NET | .NET Framework 4.x | .NET moderno (7.4 → .NET 8, 7.5 → .NET 9, 7.6 → .NET 10) |
| Estado | Componente de Windows, solo correcciones | Desarrollo activo, código abierto |
| Instalación | Viene con Windows | Se instala aparte (MSI, `winget install Microsoft.PowerShell`) |
| Carpeta | `C:\Windows\System32\WindowsPowerShell\v1.0` | `C:\Program Files\PowerShell\7` |

- Las dos versiones **conviven** (side-by-side): instalar la 7 no reemplaza a la 5.1.
- Ciclo de vida: versiones **LTS** (pares: 7.0, 7.2, 7.4, 7.6) con soporte de ~3 años y versiones **Stable/STS** (7.1, 7.3, 7.5) con soporte corto.
- Ver la versión: `$PSVersionTable` (propiedad `PSVersion`) o `$PSVersionTable.PSVersion`.
- Edición: `$PSVersionTable.PSEdition` → `Desktop` (5.1) o `Core` (6/7).
- Entornos: consola, **Windows Terminal**, **Visual Studio Code** con la extensión PowerShell. El **ISE** (`powershell_ise.exe`) solo soporta 5.1 y está en modo mantenimiento.

> ⚠️ Trampa: `Get-Host` / `$Host.Version` devuelve la versión del **host** (la consola), no del motor. La versión fiable es `$PSVersionTable.PSVersion`.

> ⚠️ Trampa: PowerShell 6 se llamaba "PowerShell Core". Desde la 7 se llama solo "PowerShell".

> 💡 Clave: la versión actual LTS es **7.6** (marzo 2026). En Windows Server 2025 viene de serie **Windows PowerShell 5.1**; PowerShell 7 hay que instalarlo.

### PS-1.2 · Cmdlets, sintaxis Verbo-Sustantivo y ayuda

Un **cmdlet** ("command-let") es un comando nativo con forma **Verbo-Sustantivo** en singular: `Get-Service`, `Stop-Process`, `New-ADUser`.

- Verbos aprobados: `Get-Verb` (Get, Set, New, Remove, Add, Start, Stop, Restart, Enable, Disable, Import, Export, Test, Invoke…).
- Tipos de comando: **Cmdlet**, **Function**, **Alias**, **Application** (ejecutable externo como `ipconfig.exe`), **ExternalScript** (`.ps1`).

**Sintaxis de un comando**

```powershell
Get-ChildItem -Path C:\Windows -Filter *.log -Recurse
#   cmdlet     parámetro valor   parámetro valor  switch
```

- Parámetros **con nombre** (`-Path C:\`), **posicionales** (`Get-ChildItem C:\` → el valor va a `-Path` porque es posición 0) y **switch** (sin valor: `-Recurse`, `-Force`).
- Un switch se puede forzar: `-Recurse:$false`.
- Se pueden abreviar parámetros mientras no sean ambiguos: `-Rec` = `-Recurse`.
- **Tab** completa comandos, parámetros y rutas; `Ctrl+Espacio` muestra todas las opciones.

**Sistema de ayuda**

| Comando | Qué hace |
|---|---|
| `Get-Help Get-Service` | Ayuda básica |
| `Get-Help Get-Service -Examples` | Solo ejemplos |
| `Get-Help Get-Service -Detailed` | Descripción de parámetros + ejemplos |
| `Get-Help Get-Service -Full` | Todo (incluye tipos de entrada/salida) |
| `Get-Help Get-Service -Parameter Name` | Un parámetro concreto |
| `Get-Help Get-Service -Online` | Abre la página de Microsoft Learn |
| `Get-Help about_*` | Temas conceptuales (`about_Operators`, `about_Execution_Policies`) |
| `Update-Help` | Descarga la ayuda (requiere admin en 5.1) |
| `Save-Help` | Guarda la ayuda para equipos sin Internet |
| `help` / `man` | Función/alias que pagina `Get-Help` |

**Descubrir comandos**

```powershell
Get-Command -Verb Get -Noun *Service*
Get-Command -Module ActiveDirectory
Get-Command *firewall*
Get-Command ipconfig        # muestra que es una Application
```

> ⚠️ Trampa: Windows **no trae** la ayuda completa instalada. Sin `Update-Help`, `Get-Help` solo muestra la sintaxis generada automáticamente.

> 💡 Clave: los tres comandos para aprender cualquier cosa son `Get-Command` (qué existe), `Get-Help` (cómo se usa) y `Get-Member` (qué tiene el objeto).

### PS-1.3 · Alias y equivalencias con cmd y Linux

| Cmdlet | Alias de PowerShell | Equivalente cmd | Equivalente Linux |
|---|---|---|---|
| `Get-ChildItem` | `gci`, `dir`, `ls` | `dir` | `ls` |
| `Set-Location` | `cd`, `chdir`, `sl` | `cd` | `cd` |
| `Get-Location` | `pwd`, `gl` | `cd` | `pwd` |
| `Get-Content` | `gc`, `cat`, `type` | `type` | `cat` |
| `Copy-Item` | `copy`, `cp`, `cpi` | `copy` | `cp` |
| `Move-Item` | `move`, `mv`, `mi` | `move` | `mv` |
| `Remove-Item` | `del`, `erase`, `rm`, `rd`, `rmdir`, `ri` | `del`, `rd` | `rm` |
| `Rename-Item` | `ren`, `rni` | `ren` | `mv` |
| `New-Item` | `ni` (y función `mkdir`/`md`) | `mkdir` | `mkdir`, `touch` |
| `Get-Process` | `gps`, `ps` | `tasklist` | `ps` |
| `Stop-Process` | `spps`, `kill` | `taskkill` | `kill` |
| `Get-Service` | `gsv` | `sc query` | `systemctl` |
| `Write-Output` | `echo`, `write` | `echo` | `echo` |
| `Clear-Host` | `cls`, `clear` | `cls` | `clear` |
| `Where-Object` | `where`, `?` | — | `grep` (filtrar) |
| `ForEach-Object` | `foreach`, `%` | — | `xargs` |
| `Select-Object` | `select` | — | `cut` |
| `Sort-Object` | `sort` | `sort` | `sort` |
| `Select-String` | `sls` | `findstr` | `grep` |
| `Get-Member` | `gm` | — | — |
| `Format-Table` / `Format-List` | `ft` / `fl` | — | — |
| `Invoke-WebRequest` | `iwr` | — | `curl`, `wget` |
| `Get-Alias` | `gal` | — | `alias` |

- Ver alias: `Get-Alias`, `Get-Alias -Definition Get-ChildItem`.
- Crear alias (solo para la sesión): `New-Alias -Name np -Value notepad.exe` o `Set-Alias`.
- Un alias **no admite parámetros**: para eso se usa una función.

> ⚠️ Trampa: en Windows PowerShell 5.1, `curl` y `wget` **no** son los programas reales: son alias de `Invoke-WebRequest`. Para usar el curl de verdad hay que escribir `curl.exe`. En PowerShell 7 el alias `wget` ya no existe, y en Linux/macOS tampoco `curl` (se ejecutan los programas nativos).

> ⚠️ Trampa: los alias de "Linux" no aceptan las opciones de Linux: `ls -la` falla en PowerShell porque `-la` no es un parámetro de `Get-ChildItem`. Lo correcto es `Get-ChildItem -Force`.

> ⚠️ Trampa: en PowerShell 7 sobre **Linux**, `ls`, `cp`, `mv`, `cat`, `ps`… **no son alias**: ejecutan los comandos nativos de Linux.

### PS-1.4 · Política de ejecución (Execution Policy)

Controla si se pueden ejecutar scripts `.ps1` y archivos de configuración. **No es una barrera de seguridad**, es una medida para evitar ejecuciones accidentales.

| Política | Comportamiento |
|---|---|
| `Restricted` | No ejecuta ningún script (solo comandos interactivos). **Por defecto en Windows cliente** |
| `AllSigned` | Solo scripts firmados por un editor de confianza (incluidos los locales) |
| `RemoteSigned` | Scripts locales sin firma OK; los descargados de Internet deben estar firmados. **Por defecto en Windows Server** |
| `Unrestricted` | Ejecuta todo; avisa con los descargados. Por defecto (e inmutable) en Linux/macOS |
| `Bypass` | No bloquea ni avisa |
| `Undefined` | Sin política en ese ámbito |

**Ámbitos (scope)** por orden de precedencia (el primero gana):
1. `MachinePolicy` (GPO equipo) 2. `UserPolicy` (GPO usuario) 3. `Process` (solo la sesión actual) 4. `CurrentUser` 5. `LocalMachine` (por defecto al cambiarla).

```powershell
Get-ExecutionPolicy                       # política efectiva
Get-ExecutionPolicy -List                 # todos los ámbitos
Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
Set-ExecutionPolicy Bypass -Scope Process # solo esta ventana
pwsh -ExecutionPolicy Bypass -File .\script.ps1
Unblock-File .\script.ps1                 # quita la marca "descargado de Internet"
```

- La marca de "descargado" es el flujo alternativo NTFS **`Zone.Identifier`** (Mark of the Web). `Get-Item .\s.ps1 -Stream Zone.Identifier`.
- Si la política está definida por **GPO**, `Set-ExecutionPolicy` no puede anularla.

> ⚠️ Trampa: en Windows **Server** (2012 R2 en adelante) el valor por defecto es **RemoteSigned**, no Restricted.

> ⚠️ Trampa: para ejecutar un script del directorio actual hay que escribir `.\script.ps1`. Escribir solo `script.ps1` no funciona aunque esté ahí (seguridad: el directorio actual no está en la ruta de búsqueda).

> ⚠️ Trampa: cambiar `LocalMachine` requiere **ejecutar como administrador**; `CurrentUser` y `Process`, no.

### PS-1.5 · Navegación y ficheros

```powershell
Set-Location C:\Datos                       # cd
Get-ChildItem                               # dir
Get-ChildItem -Force                        # incluye ocultos y de sistema
Get-ChildItem -Recurse -Filter *.log        # recursivo con filtro
Get-ChildItem -Path C:\Logs -Include *.log,*.txt -Recurse
Get-ChildItem -File        / -Directory     # solo ficheros / solo carpetas
New-Item -Path C:\Datos -Name Informes -ItemType Directory
New-Item -Path C:\Datos\nota.txt -ItemType File -Value "hola"
Copy-Item C:\a.txt -Destination D:\ ; Copy-Item C:\Origen D:\Destino -Recurse
Move-Item C:\a.txt D:\backup\a.txt
Rename-Item C:\a.txt -NewName b.txt
Remove-Item C:\Temp\* -Recurse -Force
Test-Path C:\Datos\nota.txt                 # True / False
Get-Content C:\log.txt -Tail 20             # últimas 20 líneas (tail)
Get-Content C:\log.txt -Wait -Tail 0        # seguir el fichero (tail -f)
Get-Content C:\log.txt -TotalCount 10       # primeras 10 (head); alias -Head / -First
Set-Content C:\a.txt "texto"                # sobrescribe
Add-Content C:\a.txt "otra línea"           # añade al final
Select-String -Path C:\Logs\*.log -Pattern "ERROR"   # grep
Get-Item C:\a.txt | Select-Object Length, LastWriteTime
```

- `-Filter` lo aplica el proveedor (rápido, sintaxis simple con `*` y `?`). `-Include`/`-Exclude` los aplica PowerShell (más lentos) y en 5.1 solo funcionan bien con `-Recurse` o con un comodín en la ruta.
- `Remove-Item` pide confirmación en carpetas con contenido si no pones `-Recurse`.
- `-WhatIf` simula sin ejecutar; `-Confirm` pide confirmación. Úsalos siempre en producción antes de borrar.

> ⚠️ Trampa: `Get-Content` devuelve un **array de líneas**, no un único texto. Para un único string: `Get-Content -Raw`.

> 💡 Clave: `-WhatIf` y `-Confirm` son **parámetros comunes de riesgo** que tienen todos los cmdlets que modifican el sistema.

## Nivel 2 — Objetos y pipeline

### PS-2.1 · Variables, tipos y operadores

```powershell
$nombre = "Teresa"           # variable (siempre con $)
$numero = 42                 # [int]
[int]$edad = "30"            # conversión forzada de tipo
$nombre.GetType().Name       # String
$lista = @(1, 2, 3)          # array
$lista[0]  ; $lista[-1]      # primero ; último
$vacio = @()                 # array vacío
$hash = @{ Nombre = "Ana"; Dpto = "TIC" }   # hashtable
$hash.Nombre ; $hash["Dpto"]
$obj = [PSCustomObject]@{ Nombre = "Ana"; Edad = 30 }   # objeto personalizado
$ordenado = [ordered]@{ a = 1; b = 2 }      # hashtable que mantiene el orden
```

**Comillas**
- Dobles `"..."`: **expanden** variables y expresiones: `"Hola $nombre"`, `"Total: $($lista.Count)"`.
- Simples `'...'`: **literales**: `'Hola $nombre'` imprime `Hola $nombre`.
- Carácter de escape: **acento grave** `` ` `` (`` `n `` salto de línea, `` `t `` tabulador). En cmd es `^` y en Linux `\`.
- Here-string: `@" ... "@` (expande) y `@' ... '@` (literal), cada marcador en su propia línea.

**Variables automáticas importantes**

| Variable | Contenido |
|---|---|
| `$_` o `$PSItem` | Objeto actual del pipeline |
| `$?` | `True` si el último comando tuvo éxito |
| `$LASTEXITCODE` | Código de salida del último programa **externo** |
| `$Error` | Lista de errores (`$Error[0]` = último) |
| `$null`, `$true`, `$false` | Valores especiales |
| `$PSVersionTable` | Versión de PowerShell |
| `$HOME`, `$PWD`, `$PSHOME` | Perfil de usuario, directorio actual, instalación de PS |
| `$args` | Argumentos no declarados de un script/función |
| `$env:COMPUTERNAME`, `$env:USERNAME`, `$env:PATH` | Variables de entorno |
| `$PROFILE` | Ruta del script de perfil |

**Operadores de comparación** (case-insensitive por defecto; prefijo `c` para sensible: `-ceq`, `-clike`; prefijo `i` explícito insensible)

| Operador | Significado | Ejemplo |
|---|---|---|
| `-eq` / `-ne` | igual / distinto | `5 -eq 5` |
| `-gt` `-ge` `-lt` `-le` | mayor, mayor o igual, menor, menor o igual | `$x -ge 10` |
| `-like` / `-notlike` | comodín `*` `?` | `"server01" -like "serv*"` |
| `-match` / `-notmatch` | expresión regular (rellena `$Matches`) | `"abc123" -match "\d+"` |
| `-contains` / `-notcontains` | ¿la **colección** contiene el valor? | `@(1,2,3) -contains 2` |
| `-in` / `-notin` | ¿el valor está en la colección? | `2 -in @(1,2,3)` |
| `-replace` | sustitución por regex | `"a-b" -replace "-", "_"` |
| `-is` / `-isnot` | tipo | `5 -is [int]` |
| `-and` `-or` `-not` `!` `-xor` | lógicos | |

Aritméticos: `+ - * / %`. Asignación: `= += -= *= /= ++ --`. Rango: `1..10`. Formato: `"{0:N2}" -f 3.14159` → `3.14`.
Unidades: `1KB`, `1MB`, `1GB`, `1TB` son numéricos (`1GB` = 1073741824).

> ⚠️ Trampa: `=` asigna; para comparar es `-eq`. `>` y `<` **no comparan**: `>` es **redirección** a fichero.

> ⚠️ Trampa: `-contains` lleva la colección a la izquierda; `-in`, a la derecha. `"Windows" -contains "Win"` es **False** (no es búsqueda de subcadena: para eso `-like "*Win*"` o `.Contains()`).

> ⚠️ Trampa: comparar con `$null`: pon `$null` a la **izquierda** (`$null -eq $x`); si `$x` es un array, `$x -eq $null` filtra elementos en vez de devolver True/False.

### PS-2.2 · El pipeline y Get-Member

El símbolo `|` pasa **objetos completos** (no texto) de un comando al siguiente.

```powershell
Get-Service | Get-Member                    # tipo (TypeName) + propiedades + métodos
Get-Process | Get-Member -MemberType Property
Get-Service -Name Spooler | Stop-Service    # el objeto servicio va entero
(Get-Service Spooler).Status                # acceder a una propiedad
(Get-Date).AddDays(-30)                     # llamar a un método
```

**Cómo enlaza el pipeline** (parameter binding):
1. **ByValue**: el objeto entero se pasa a un parámetro que acepta ese tipo (`Get-Service | Stop-Service` → `-InputObject`).
2. **ByPropertyName**: una propiedad del objeto con el mismo nombre que un parámetro (`Import-Csv` con columna `Name` → `-Name`).
- Se ve en `Get-Help Stop-Service -Full` → "Accept pipeline input?".

- Paréntesis `( )` ejecutan primero: `Get-Service -ComputerName (Get-Content servidores.txt)` (en 5.1).
- Subexpresión `$( )` dentro de cadenas.
- Bloque de script `{ }` es código que se ejecuta después.

> 💡 Clave: **Get-Member** (`gm`) es el comando para saber el **tipo** y qué propiedades/métodos tiene un objeto. Pregunta de examen recurrente.

> ⚠️ Trampa: la salida de `Format-Table`/`Format-List` son objetos de formato. **Format-* siempre al final del pipeline**: `Get-Process | Format-Table | Export-Csv` genera basura.

### PS-2.3 · Filtrar, seleccionar, ordenar y medir

```powershell
# Filtrar (WHERE)
Get-Service | Where-Object { $_.Status -eq 'Running' }
Get-Service | Where-Object Status -eq Running          # sintaxis simplificada (PS 3+)
Get-Process | Where-Object { $_.CPU -gt 100 -and $_.Name -like "s*" }

# Seleccionar (SELECT)
Get-Process | Select-Object Name, Id, CPU
Get-Process | Select-Object -First 5        # -Last 5, -Skip 2
Get-Service | Select-Object -ExpandProperty Name   # solo los valores (strings)
Get-Content log.txt | Select-Object -Unique
Get-Process | Select-Object Name, @{Name='MemoriaMB'; Expression={ $_.WorkingSet64 / 1MB }}   # propiedad calculada

# Ordenar (ORDER BY)
Get-Process | Sort-Object CPU -Descending | Select-Object -First 10
Get-ChildItem | Sort-Object Length, Name

# Agrupar y contar
Get-Service | Group-Object Status
Get-ChildItem -File | Measure-Object -Property Length -Sum -Average -Maximum -Minimum
(Get-Process).Count

# Recorrer
Get-ChildItem *.log | ForEach-Object { $_.Name.ToUpper() }
1..5 | ForEach-Object { $_ * 2 }

# Comparar
Compare-Object (Get-Content a.txt) (Get-Content b.txt)    # <= solo en referencia, => solo en diferencia
```

- **Filtra lo antes posible** ("filter left"): `Get-ChildItem -Filter *.log` es mucho más rápido que `Get-ChildItem | Where-Object Name -like *.log`. En AD: `Get-ADUser -Filter ...` mejor que traer todos y filtrar.
- `Select-Object -ExpandProperty` devuelve el **valor** (p. ej. string); `Select-Object Name` devuelve un **objeto** con la propiedad Name.

> ⚠️ Trampa: `Where-Object` filtra **filas** (objetos); `Select-Object` elige **columnas** (propiedades) o número de objetos.

> ⚠️ Trampa: `Measure-Object` por defecto solo cuenta (`Count`); para sumar hay que pedir `-Sum` y `-Property`.

### PS-2.4 · Formato, salida, exportación e importación

```powershell
Get-Service | Format-Table Name, Status -AutoSize      # ft
Get-Service Spooler | Format-List *                    # fl: todas las propiedades
Get-Process | Format-Wide Name -Column 4               # fw
Get-Service | Out-GridView                             # ventana gráfica (solo Windows)
Get-Service | Out-File C:\informe.txt                  # a fichero (como >)
Get-Service | Out-File C:\informe.txt -Append          # como >>
Get-Process | Export-Csv C:\procesos.csv -NoTypeInformation -Delimiter ';' -Encoding UTF8
$usuarios = Import-Csv C:\usuarios.csv                 # cada fila = objeto
Get-Service | ConvertTo-Json -Depth 3 | Set-Content servicios.json
$cfg = Get-Content config.json -Raw | ConvertFrom-Json
Get-Service | ConvertTo-Html | Out-File informe.html
Get-Process | Export-Clixml procesos.xml ; Import-Clixml procesos.xml   # serializa objetos completos
Get-Service | Out-Null                                 # descarta la salida
```

**Redirección**: `>` (sobrescribir), `>>` (añadir), `2>` errores, `2>&1` errores a la salida estándar, `*>` todos los flujos. Flujos: 1 Output, 2 Error, 3 Warning, 4 Verbose, 5 Debug, 6 Information.

- **Codificación por defecto**: en 5.1, `Out-File`/`>` escriben en **UTF-16LE ("Unicode")** y `Set-Content` en ANSI; en PowerShell 7 todo es **UTF-8 sin BOM**.
- En 5.1 `Export-Csv` añade una primera línea `#TYPE ...` salvo que pongas `-NoTypeInformation`; en PowerShell 6+ ya no la añade.
- `ConvertTo-Json` tiene **profundidad por defecto 2**: objetos más anidados se convierten a texto. Usa `-Depth`.

> ⚠️ Trampa: `Write-Host` escribe **directamente en pantalla** (flujo Information desde PS 5); no se puede capturar con el pipeline como `Write-Output`.

### PS-3.2 · Registro, proveedores y unidades PS (PSDrives)

PowerShell accede a distintos almacenes como si fueran discos mediante **proveedores**:

| Proveedor | Unidad | Contenido |
|---|---|---|
| FileSystem | `C:`, `D:` | Ficheros |
| Registry | `HKLM:`, `HKCU:` | Registro (solo esas dos por defecto) |
| Environment | `Env:` | Variables de entorno |
| Alias | `Alias:` | Alias |
| Function / Variable | `Function:` / `Variable:` | Funciones / variables |
| Certificate | `Cert:` | Almacén de certificados |
| WSMan | `WSMan:` | Configuración de WinRM |

```powershell
Get-PSDrive ; Get-PSProvider
New-PSDrive -Name Datos -PSProvider FileSystem -Root \\srv01\datos -Persist   # unidad de red
Set-Location HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion
Get-ChildItem HKLM:\SOFTWARE\Microsoft                   # subclaves
Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections
Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
New-Item -Path HKCU:\Software\MiApp                       # crear clave
New-ItemProperty -Path HKCU:\Software\MiApp -Name Version -Value 1 -PropertyType DWord   # crear valor
Remove-ItemProperty -Path HKCU:\Software\MiApp -Name Version
Get-ChildItem Cert:\LocalMachine\My                       # certificados del equipo
Get-ChildItem Env:                                        # variables de entorno
```

- **Claves** = carpetas (`New-Item`, `Get-ChildItem`); **valores** = propiedades (`*-ItemProperty`).
- Tipos de valor: `String` (REG_SZ), `ExpandString`, `Binary`, `DWord`, `MultiString`, `QWord`.
- Clásico: `reg query`, `reg add HKLM\... /v Nombre /t REG_DWORD /d 1 /f`, `reg export`.

> ⚠️ Trampa: `HKEY_CLASSES_ROOT`, `HKEY_USERS` y `HKEY_CURRENT_CONFIG` **no tienen PSDrive por defecto**. Se usa `Registry::HKEY_USERS\...` o se crea con `New-PSDrive`.

**Registro Sistema**: 6005/6006 servicio de eventos iniciado/detenido (arranque/apagado), **6008** apagado inesperado, **41** Kernel-Power (reinicio sin apagado limpio), **1074** apagado/reinicio iniciado por proceso o usuario, **7036** servicio cambió de estado, 7034 servicio terminó inesperadamente.

## Nivel 4 — Scripting

### PS-4.1 · Estructuras de control

```powershell
if ($espacio -lt 10GB) { "Poco espacio" } elseif ($espacio -lt 50GB) { "Aviso" } else { "OK" }

switch ($estado) {
    'Running' { "En marcha" }
    'Stopped' { "Parado" ; break }
    default   { "Desconocido" }
}
switch -Wildcard ($nombre) { 'srv*' { "Servidor" } 'pc*' { "Puesto" } }
switch -Regex ($ip) { '^10\.' { "Privada clase A" } }

foreach ($srv in $servidores) { Test-Connection $srv -Count 1 }   # sentencia foreach
for ($i = 0; $i -lt 10; $i++) { $i }
while ($intentos -lt 3) { $intentos++ }
do { $r = Read-Host "¿Seguir? (s/n)" } while ($r -ne 'n')          # se ejecuta al menos 1 vez
do { ... } until ($condicion)                                       # repite HASTA que sea cierta
break      # sale del bucle ; continue  # salta a la siguiente iteración
```

- `foreach (...)` (sentencia) carga toda la colección en memoria y es más rápida; `ForEach-Object` procesa **en streaming** objeto a objeto (menos memoria).
- `switch` sin `break` evalúa **todas** las coincidencias (puede ejecutar varias ramas).

> ⚠️ Trampa: `do { } while (cond)` repite **mientras** sea verdadera; `do { } until (cond)` repite **hasta** que sea verdadera. Ambos se ejecutan al menos una vez.

### PS-4.2 · Funciones, parámetros y scripts

```powershell
function Get-EspacioLibre {
    [CmdletBinding()]                           # función avanzada: -Verbose, -ErrorAction, etc.
    param(
        [Parameter(Mandatory, ValueFromPipeline)]
        [string[]]$ComputerName,
        [ValidateSet('C','D','E')][string]$Unidad = 'C',
        [ValidateRange(1,100)][int]$Umbral = 10
    )
    begin   { Write-Verbose "Inicio" }
    process {                                   # se ejecuta una vez por objeto del pipeline
        foreach ($c in $ComputerName) {
            [PSCustomObject]@{ Equipo = $c; Unidad = $Unidad }
        }
    }
    end     { Write-Verbose "Fin" }
}
Get-EspacioLibre -ComputerName SRV01 -Verbose
'SRV01','SRV02' | Get-EspacioLibre
```

- Un **script** `.ps1` puede tener su propio `param()` al principio: `.\alta.ps1 -Fichero usuarios.csv`.
- **Dot sourcing**: `. .\funciones.ps1` carga las funciones en el ámbito actual.
- `return` sale de la función; **todo lo que no se asigna ni se descarta se devuelve** como salida.
- Ámbitos (scopes): `$global:`, `$script:`, `$local:`, `$using:` (remoto/paralelo), `$private:`.
- Comentarios: `#` una línea; `<# ... #>` bloque. **Comment-based help** con `.SYNOPSIS`, `.DESCRIPTION`, `.PARAMETER`, `.EXAMPLE` hace que `Get-Help` funcione con tu función.
- **Perfil**: `$PROFILE` (script que se ejecuta al abrir la consola). `Test-Path $PROFILE`; `New-Item $PROFILE -Force`.

> ⚠️ Trampa: en PowerShell las funciones se llaman **sin paréntesis ni comas**: `MiFuncion -A 1 -B 2` o `MiFuncion 1 2`. `MiFuncion(1,2)` pasa **un array** como primer argumento.

### PS-4.3 · Gestión de errores

- **Errores no terminales** (non-terminating): el cmdlet informa y **sigue** (p. ej. `Get-ChildItem` de 10 rutas, falla 1). Por defecto `try/catch` **no los captura**.
- **Errores terminales**: detienen la ejecución (`throw`, errores de sintaxis, `-ErrorAction Stop`).

```powershell
try {
    Get-Item C:\noexiste -ErrorAction Stop          # convierte el error en terminal
}
catch [System.Management.Automation.ItemNotFoundException] {
    Write-Warning "No existe: $($_.Exception.Message)"
}
catch {
    Write-Error "Otro error: $_"
}
finally {
    "Se ejecuta siempre"
}
```

- `-ErrorAction` (`-EA`): `Continue` (por defecto), `SilentlyContinue`, `Stop`, `Inquire`, `Ignore`, `Break` (PS7).
- `$ErrorActionPreference = 'Stop'` lo cambia para todo el script.
- `-ErrorVariable err` guarda los errores en `$err`.
- `throw "mensaje"` genera error terminal; `Write-Error` genera no terminal.
- Programas externos (`.exe`) no lanzan excepciones: se comprueba `$LASTEXITCODE` (0 = OK).
- Flujos de mensajes: `Write-Verbose` (con `-Verbose`), `Write-Debug`, `Write-Warning`, `Write-Information`, `Write-Progress`.

> ⚠️ Trampa: la pregunta típica: "¿Por qué el `catch` no se ejecuta si falla `Get-ChildItem`?" → porque es un error **no terminal**; hay que añadir `-ErrorAction Stop`.

Get-Module                          # cargados
Get-Module -ListAvailable           # instalados
Import-Module ActiveDirectory       # carga manual (desde PS 3 hay autocarga)
Remove-Module ActiveDirectory
$env:PSModulePath -split ';'        # rutas donde busca módulos
Find-Module -Name *Pester*          # buscar en PowerShell Gallery
Install-Module -Name Pester -Scope CurrentUser
Update-Module ; Uninstall-Module
Install-PSResource -Name Pester     # PSResourceGet (incluido desde PS 7.4)
Get-InstalledModule ; Get-InstalledPSResource

- Tipos de fichero: `.ps1` script, `.psm1` módulo de script, `.psd1` manifiesto (metadatos y versión), `.ps1xml` formato/tipos, `.pssc` configuración de sesión JEA, `.psrc` capacidad de rol JEA.
- Rutas de módulos: usuario (`Documentos\PowerShell\Modules` en 7, `Documentos\WindowsPowerShell\Modules` en 5.1), todos los usuarios (`C:\Program Files\PowerShell\Modules` / `C:\Program Files\WindowsPowerShell\Modules`) y sistema (`$PSHOME\Modules`).
- Repositorio público: **PowerShell Gallery** (powershellgallery.com). `Get-PSRepository` muestra `PSGallery` como **Untrusted** por defecto (pregunta al instalar).
- Compatibilidad: PowerShell 7 puede cargar módulos solo de Windows PowerShell con `Import-Module -UseWindowsPowerShell` (sesión implícita).
- Módulos clave para un administrador: `ActiveDirectory`, `GroupPolicy`, `DnsServer`, `DhcpServer`, `NetTCPIP`, `NetAdapter`, `NetSecurity`, `SmbShare`, `Storage`, `Hyper-V`, `ServerManager`, `ScheduledTasks`, `LAPS`, `Defender`, `BitLocker`.

> ⚠️ Trampa: `ActiveDirectory` y `GroupPolicy` no vienen en un servidor miembro ni en un cliente: hay que instalar **RSAT** (`Install-WindowsFeature RSAT-AD-PowerShell` en servidor; en Windows 11, "Características opcionales" → RSAT).

### PS-4.5 · Trabajos, tareas programadas y paralelismo

```powershell
Start-Job -ScriptBlock { Get-ChildItem C:\ -Recurse } -Name inventario
Get-Job ; Wait-Job -Name inventario ; Receive-Job -Name inventario -Keep ; Remove-Job -Name inventario
Start-ThreadJob { ... }                                  # en hilos (más ligero), incluido en PS 7
1..50 | ForEach-Object -Parallel { Test-Connection "10.0.0.$_" -Count 1 -Quiet } -ThrottleLimit 10   # solo PS 7
Invoke-Command -ComputerName (Get-Content srv.txt) -ScriptBlock { ... } -AsJob

# Tareas programadas
$accion  = New-ScheduledTaskAction -Execute 'pwsh.exe' -Argument '-File C:\Scripts\backup.ps1'
$disparo = New-ScheduledTaskTrigger -Daily -At 2am
Register-ScheduledTask -TaskName "BackupDiario" -Action $accion -Trigger $disparo -User "SYSTEM" -RunLevel Highest
Get-ScheduledTask -TaskName BackupDiario ; Start-ScheduledTask -TaskName BackupDiario
Disable-ScheduledTask ; Unregister-ScheduledTask -TaskName BackupDiario -Confirm:$false
```

Clásico: `schtasks /create /tn "Backup" /tr "C:\backup.bat" /sc daily /st 02:00 /ru SYSTEM`, `schtasks /query`, `taskschd.msc`.

- `ForEach-Object -Parallel` **solo PowerShell 7+**; por defecto `-ThrottleLimit 5`. Las variables externas se pasan con `$using:variable`.

> ⚠️ Trampa: `Receive-Job` **vacía** los resultados del trabajo tras leerlos salvo que uses `-Keep`.

## Nivel 5 — Administración remota y a escala

### PS-5.1 · PowerShell Remoting (WinRM / WS-Management)

- Usa el protocolo **WS-Management**, servicio **WinRM**. Puertos **5985/TCP (HTTP)** y **5986/TCP (HTTPS)**. Aunque sea HTTP, en dominio el tráfico va **cifrado por Kerberos**.
- **Habilitado por defecto en Windows Server 2012 y posteriores** (en red de dominio/privada). En clientes: `Enable-PSRemoting -Force` (crea listener, regla de firewall y arranca WinRM). `winrm quickconfig` es la versión clásica.
- Autenticación: **Kerberos** en dominio (por nombre, no por IP). Fuera de dominio o por IP: NTLM + **TrustedHosts** o HTTPS.

```powershell
Enable-PSRemoting -Force
Test-WSMan -ComputerName SRV01                     # ¿responde WinRM?
Enter-PSSession -ComputerName SRV01                # sesión interactiva 1 a 1 (prompt [SRV01]: PS>)
Exit-PSSession
Invoke-Command -ComputerName SRV01, SRV02 -ScriptBlock { Get-Service Spooler }    # 1 a muchos (en paralelo, 32 por defecto)
Invoke-Command -ComputerName SRV01 -FilePath C:\Scripts\inventario.ps1
Invoke-Command -ComputerName SRV01 -ScriptBlock { param($n) Get-Service $n } -ArgumentList Spooler
$svc = 'Spooler' ; Invoke-Command -ComputerName SRV01 { Get-Service $using:svc }
$s = New-PSSession -ComputerName SRV01, SRV02      # sesiones persistentes
Invoke-Command -Session $s -ScriptBlock { $x = 1 } ; Remove-PSSession $s
Set-Item WSMan:\localhost\Client\TrustedHosts -Value "192.168.1.50" -Force    # equipos no Kerberos
Get-PSSessionConfiguration
Copy-Item -Path C:\a.txt -Destination C:\ -ToSession $s                     # copiar a través de la sesión
```

- PowerShell 7 añade remoting por **SSH**: `Enter-PSSession -HostName srv01 -UserName admin` (`-HostName` = SSH, `-ComputerName` = WinRM).
- `Invoke-Command` devuelve **objetos deserializados** (sin métodos, con la propiedad `PSComputerName`).
- Variables locales dentro del bloque remoto: `$using:` o `-ArgumentList`.
- Límite por defecto de conexiones simultáneas de `Invoke-Command`: **`-ThrottleLimit 32`**.

> ⚠️ Trampa: `Enter-PSSession` es **1 a 1** (interactivo); `Invoke-Command` es **1 a muchos**.

> ⚠️ Trampa: el "doble salto" (**second hop**): desde una sesión remota no puedes acceder a un tercer recurso (p. ej. una carpeta compartida) con tus credenciales. Solución recomendada: **delegación Kerberos restringida basada en recursos** (CredSSP es inseguro).

> ⚠️ Trampa: 5985 = HTTP, 5986 = HTTPS. No confundir con RDP 3389 ni con SMB 445.

### PS-5.2 · CIM/WMI

**WMI** (Windows Management Instrumentation) es la implementación de Microsoft del estándar **CIM** (DMTF). Clases organizadas en espacios de nombres (`root\cimv2` por defecto).

```powershell
Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object Caption, Version, LastBootUpTime
Get-CimInstance Win32_ComputerSystem | Select-Object Name, Domain, Manufacturer, Model, TotalPhysicalMemory
Get-CimInstance Win32_BIOS | Select-Object SerialNumber        # número de serie
Get-CimInstance Win32_Processor ; Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "IPEnabled=True"
Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3"
Get-CimInstance Win32_Product                 # software MSI (lento y lanza reparaciones; evitar)
Get-CimInstance -Query "SELECT * FROM Win32_Service WHERE State='Stopped'"   # WQL
Get-CimInstance Win32_OperatingSystem -ComputerName SRV01                   # remoto vía WS-Man
$cs = New-CimSession -ComputerName SRV01 ; Get-CimInstance Win32_BIOS -CimSession $cs
Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = 'notepad.exe' }
Get-CimClass -ClassName *disk*
```

- `Get-WmiObject` (usa **DCOM/RPC**) es antiguo y **no existe en PowerShell 7**. `Get-CimInstance` usa **WS-Man** (o DCOM con `New-CimSessionOption -Protocol Dcom`).
- Clásico: `wmic` está **obsoleto** (deprecated) y se elimina de las nuevas versiones de Windows.
- Lenguaje de consulta: **WQL** (parecido a SQL).

> ⚠️ Trampa: `Win32_Product` consulta MSI y fuerza una validación/reparación de cada producto: no se usa para inventario. Mejor leer `HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall`.

### PS-5.3 · Seguridad en PowerShell

- **Credenciales**: `$cred = Get-Credential` (objeto `PSCredential` = usuario + SecureString). Nunca contraseñas en claro en scripts.
- `ConvertTo-SecureString "P@ss" -AsPlainText -Force` (solo laboratorio). `ConvertFrom-SecureString` cifra con **DPAPI** (solo descifrable por el mismo usuario en el mismo equipo).
- Módulo **SecretManagement** + **SecretStore**: almacén de secretos (`Get-Secret`, `Set-Secret`).
- **Firma de scripts**: `Set-AuthenticodeSignature -FilePath s.ps1 -Certificate $cert` ; `Get-AuthenticodeSignature`.
- **Registro (logging)** por GPO (Plantillas administrativas → Componentes de Windows → Windows PowerShell):
  - **Module Logging** (evento 4103).
  - **Script Block Logging** → evento **4104** en `Microsoft-Windows-PowerShell/Operational`. Registra el código ejecutado incluso ofuscado.
  - **Transcription**: `Start-Transcript -Path C:\logs\sesion.txt` / `Stop-Transcript`; por GPO en carpeta centralizada.
- **Modos de lenguaje**: `$ExecutionContext.SessionState.LanguageMode` → `FullLanguage`, `ConstrainedLanguage` (impuesto por AppLocker/WDAC), `RestrictedLanguage`, `NoLanguage`.
- **AMSI** (Antimalware Scan Interface): Defender inspecciona el contenido de los scripts antes de ejecutarlos.
- **JEA** (Just Enough Administration): puntos de conexión restringidos donde un usuario no admin puede ejecutar solo ciertos cmdlets (con cuenta virtual).
  ```powershell
  New-PSRoleCapabilityFile -Path .\Soporte.psrc        # qué cmdlets se permiten (VisibleCmdlets)
  New-PSSessionConfigurationFile -Path .\Soporte.pssc -SessionType RestrictedRemoteServer -RunAsVirtualAccount
  Register-PSSessionConfiguration -Name Soporte -Path .\Soporte.pssc
  Enter-PSSession -ComputerName SRV01 -ConfigurationName Soporte
  ```
- PowerShell **2.0** debe estar **deshabilitado/eliminado** (no tiene logging ni AMSI; se usaba para "downgrade"). En Windows 11 24H2 y Windows Server 2025 ya se eliminó.

> 💡 Clave: el evento **4104** (Script Block Logging) es la prueba forense de qué ejecutó un atacante con PowerShell.

> 🏛️ AGE: el **ENS** (RD 311/2022) exige registro de actividad (op.exp.8) y protección frente a código dañino; las guías **CCN-STIC** recomiendan activar Script Block Logging, transcripción y restringir PowerShell con AppLocker/WDAC.

## Nivel 6 — Nivel profesional

### PS-6.1 · Automatización de altas masivas y scripts reales

**Alta masiva de usuarios desde CSV** (columnas: `Nombre;Apellido;Usuario;Departamento`):

```powershell
Import-Module ActiveDirectory
$pwd = Read-Host -AsSecureString "Contraseña inicial"
Import-Csv C:\altas.csv -Delimiter ';' | ForEach-Object {
    $upn = "$($_.Usuario)@contoso.local"
    if (Get-ADUser -Filter "SamAccountName -eq '$($_.Usuario)'") {
        Write-Warning "$($_.Usuario) ya existe"
    } else {
        New-ADUser -Name "$($_.Nombre) $($_.Apellido)" `
                   -GivenName $_.Nombre -Surname $_.Apellido `
                   -SamAccountName $_.Usuario -UserPrincipalName $upn `
                   -Department $_.Departamento `
                   -Path "OU=$($_.Departamento),OU=Usuarios,DC=contoso,DC=local" `
                   -AccountPassword $pwd -ChangePasswordAtLogon $true -Enabled $true
    }
}
```

**Informe de usuarios inactivos 90 días** y deshabilitarlos:
```powershell
Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly |
  Where-Object Enabled |
  Export-Csv C:\inactivos.csv -NoTypeInformation
Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly | Disable-ADAccount -WhatIf
```

**Comprobar disponibilidad de servidores**:
```powershell
Get-Content C:\servidores.txt | ForEach-Object {
    [PSCustomObject]@{
        Servidor = $_
        Ping     = Test-Connection $_ -Count 1 -Quiet
        RDP      = (Test-NetConnection $_ -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
    }
} | Format-Table -AutoSize
```

**Limpiar logs con más de 30 días**:
```powershell
Get-ChildItem C:\Logs -Recurse -File | Where-Object LastWriteTime -lt (Get-Date).AddDays(-30) | Remove-Item -WhatIf
```

- El **acento grave** `` ` `` al final de línea continúa el comando en la siguiente (cuidado: un espacio detrás lo rompe). Alternativa más segura: **splatting**.

**Splatting** (pasar parámetros con un hashtable y `@`):
```powershell
$params = @{ Name = 'Ana López'; SamAccountName = 'alopez'; Enabled = $true; AccountPassword = $pwd }
New-ADUser @params
```

> ⚠️ Trampa: en splatting se usa `@params` (arroba), no `$params`.

### PS-6.2 · Configuración deseada (DSC), buenas prácticas y depuración

- **DSC** (Desired State Configuration): configuración **declarativa** (se describe el estado, no los pasos). DSC v1.1 viene en **Windows PowerShell 5.1** (con el motor LCM; cmdlets como `Start-DscConfiguration` no existen en PowerShell 7); **DSC v3** es una herramienta independiente moderna. En Azure: **Azure Machine Configuration**.
  ```powershell
  Configuration ServidorWeb {
      Node 'SRV-WEB01' {
          WindowsFeature IIS { Ensure = 'Present'; Name = 'Web-Server' }
      }
  }
  ServidorWeb -OutputPath C:\DSC          # genera SRV-WEB01.mof
  Start-DscConfiguration -Path C:\DSC -Wait -Verbose
  Test-DscConfiguration ; Get-DscConfiguration
  ```
- **Pester**: framework de pruebas (`Describe`, `It`, `Should`). `Invoke-Pester`.
- **PSScriptAnalyzer**: análisis estático (`Invoke-ScriptAnalyzer -Path .\script.ps1`).
- Depuración: `Set-PSBreakpoint -Script s.ps1 -Line 10`, `Set-PSDebug -Trace 1`, `Set-StrictMode -Version Latest` (error al usar variables no inicializadas).
- Buenas prácticas: nombres Verbo-Sustantivo con verbos aprobados, `[CmdletBinding(SupportsShouldProcess)]` para soportar `-WhatIf`, no usar alias en scripts, comment-based help, control de versiones (Git), firmar scripts, mínimo privilegio.

**Novedades PowerShell 7.x (para preguntas de "actualidad")**
- Operador ternario `$a ? 'sí' : 'no'`, cadena de pipeline `cmd1 && cmd2` / `cmd1 || cmd2`, operadores null `??` y `??=`, `?.` (null-conditional, con `${var}?.Propiedad`).
- `ForEach-Object -Parallel`, `Get-Error` (detalle del último error), `$ErrorView = 'ConciseView'`.
- PSResourceGet (`Install-PSResource`) incluido desde 7.4.
- 7.6 (LTS, .NET 10): nuevas opciones como `Get-Command -ExcludeModule`, `Get-Clipboard -Delimiter`; alias `PSForEach()`/`PSWhere()` de los métodos `.ForEach()`/`.Where()`; respeta la variable `NO_COLOR`.

> ⚠️ Trampa: `&&` y `||` **no existen en Windows PowerShell 5.1** (error de sintaxis). En 5.1 se usa `;` o `if ($?)`.

> ⚠️ Trampa: DSC **no es** un sistema de despliegue de software tipo SCCM; es gestión de configuración declarativa (como Ansible/Puppet).

# Windows Server

## Nivel 1 — Fundamentos

### WS-1.1 · Versiones, ediciones y licencias

**Historia de versiones de servidor**: NT 4.0 → 2000 (aparece **Active Directory**) → 2003 → 2008 (Server Core, Hyper-V; **última versión con edición de 32 bits**) → 2008 R2 (primera **solo de 64 bits**) → 2012 / 2012 R2 → 2016 → 2019 → 2022 → **2025** (disponible desde noviembre de 2024).

- Canal **LTSC** (Long-Term Servicing Channel): una versión cada 2-3 años, **5 años de soporte estándar + 5 de soporte extendido**.
- Canal **Annual Channel (AC)**: orientado a contenedores y Azure Stack HCI/Azure Local.

**Ediciones de Windows Server 2025**

| Edición | Uso | Virtualización incluida |
|---|---|---|
| **Standard** | Entornos físicos o poco virtualizados | **2 VM** (OSE) por cada licencia completa de núcleos |
| **Datacenter** | Centros de datos muy virtualizados | **VM ilimitadas**, Storage Spaces Direct, SDN, Storage Replica sin límites, VM blindadas (Shielded VMs) |
| **Datacenter: Azure Edition** | Azure / Azure Local | Funciones exclusivas (como Hotpatch sin Arc) |
| Essentials | Pequeñas empresas (OEM, máximo 25 usuarios / 50 dispositivos) | — |

- **Licencia por núcleos**: mínimo **8 núcleos por procesador** y **16 núcleos por servidor**. Además los usuarios/dispositivos necesitan **CAL** (Client Access License) de Windows Server; y para Escritorio Remoto, **RDS CAL**.
- Windows Server 2025 permite también licencia **pago por uso** a través de Azure Arc.

**Opciones de instalación**
- **Server Core** (opción **por defecto**): sin interfaz gráfica de escritorio. Menos superficie de ataque, menos parches, menos recursos. Se gestiona con **sconfig**, PowerShell, Windows Admin Center o RSAT.
- **Server with Desktop Experience** (Experiencia de escritorio): con GUI.
- Desde Windows Server 2016 **no se puede cambiar** entre Core y Escritorio después de instalar (en 2012/2012 R2 sí se podía); hay que reinstalar.
- **Nano Server**: solo existe como **imagen base de contenedor**.

**Novedades clave de Windows Server 2025** (Microsoft Learn)
- **Hotpatch** (parches de seguridad **sin reinicio**) con Azure Arc.
- AD DS: nuevo **nivel funcional Windows Server 2025** (valor `10`), base de datos con páginas de **32 KB** opcional, LDAP sobre **TLS 1.3**, contraseñas de cuenta de equipo aleatorias, **dMSA** (cuentas de servicio administradas delegadas).
- **Windows LAPS** con gestión automática de cuenta, frases de paso y detección de rollback de imagen.
- **SMB**: firma SMB **requerida por defecto** en todas las conexiones de cliente salientes; **SMB over QUIC** en Standard y Datacenter; bloqueo NTLM opcional en el cliente SMB; limitador de autenticaciones fallidas.
- **Credential Guard** activado por defecto en equipos compatibles.
- **OpenSSH Server** instalado por defecto; **WinGet** instalado por defecto; **Wi-Fi** y Bluetooth soportados.
- RRAS: las nuevas instalaciones **no aceptan PPTP ni L2TP** por defecto (sí SSTP e IKEv2).
- Kerberos: el KDC **ya no emite TGT con RC4**. WINS y mailslots, **obsoletos**.
- Actualización in situ desde **2012 R2** o posterior (hasta 4 versiones de salto).
- Hyper-V: **Generación 2 por defecto**, GPU partitioning, hasta 4 PB de RAM por host.

> ⚠️ Trampa: Standard = **2** máquinas virtuales por licencia (de 16 núcleos); Datacenter = **ilimitadas**. Para 4 VM con Standard hay que licenciar dos veces los núcleos.

> ⚠️ Trampa: no existe "nivel funcional 2019" ni "2022". Tras **2016** el siguiente es **2025**.

### WS-1.2 · Herramientas de administración

| Herramienta | Uso |
|---|---|

## Nivel 2 — Archivos, almacenamiento y copias

### WS-2.1 · Permisos NTFS y de recurso compartido

**Permisos NTFS estándar**: Control total, Modificar, Lectura y ejecución, Mostrar el contenido de la carpeta, Lectura, Escritura (+ permisos especiales).

| Permiso | Permite |
|---|---|
| **Control total** (F) | Todo, incluido **cambiar permisos** y tomar posesión |
| **Modificar** (M) | Leer, escribir, ejecutar **y eliminar** |
| **Lectura y ejecución** (RX) | Ver y ejecutar |
| **Lectura** (R) | Ver contenido y atributos |
| **Escritura** (W) | Crear y modificar, **no eliminar** |

**Reglas de evaluación**
1. Los permisos se **acumulan** (usuario + todos sus grupos).
2. **Denegar explícito** gana sobre permitir explícito. Pero un **permitir explícito gana sobre un denegar heredado**. Orden: denegar explícito > permitir explícito > denegar heredado > permitir heredado.
3. Desde la red se combinan **NTFS** y **recurso compartido**: el permiso efectivo es el **más restrictivo** de los dos.

**Permisos de recurso compartido**: Control total, Cambiar, Leer. Por defecto en 2012+: `Todos: Leer`.
Buena práctica: compartido con *Usuarios autenticados: Control total* (o Cambiar) y controlar el acceso con **NTFS**.

**Copiar y mover**
- **Copiar** (cualquier volumen): hereda los permisos del **destino**.
- **Mover dentro del mismo volumen NTFS**: **conserva** los permisos explícitos.
- **Mover a otro volumen**: es copiar + borrar → hereda del destino.
- Copiar a FAT32: se pierden todos los permisos.

**icacls**
```cmd
icacls D:\Datos                                         :: ver permisos
icacls D:\Datos /grant "AGE\GG_Contabilidad:(OI)(CI)M"  :: Modificar, heredado a ficheros (OI) y subcarpetas (CI)
icacls D:\Datos /grant "AGE\GG_Lectura:(OI)(CI)RX"
icacls D:\Datos /deny "AGE\usuario1:(OI)(CI)W"
icacls D:\Datos /remove "AGE\usuario1"
icacls D:\Datos /inheritance:d                          :: deshabilitar herencia copiando (d), eliminar (r), habilitar (e)
icacls D:\Datos /reset /T                               :: restablecer herencia recursivamente
icacls D:\Datos /save permisos.txt /T ; icacls D:\ /restore permisos.txt
takeown /F D:\Datos /R                                  :: tomar posesión
```
Herencia: `(OI)` object inherit (ficheros), `(CI)` container inherit (carpetas), `(IO)` inherit only, `(NP)` no propagar. Derechos: `F`, `M`, `RX`, `R`, `W`, `D` (eliminar).

**PowerShell**
```powershell
New-SmbShare -Name Contabilidad -Path D:\Datos\Contabilidad -FullAccess "AGE\Admins TIC" -ChangeAccess "AGE\GG_Contabilidad" -FolderEnumerationMode AccessBased
Get-SmbShare ; Get-SmbShareAccess -Name Contabilidad
Grant-SmbShareAccess -Name Contabilidad -AccountName "AGE\GG_Auditoria" -AccessRight Read -Force
Revoke-SmbShareAccess -Name Contabilidad -AccountName Todos -Force
Remove-SmbShare -Name Contabilidad
Get-SmbSession ; Get-SmbOpenFile | Close-SmbOpenFile        # quién está conectado / ficheros abiertos
Get-Acl D:\Datos | Format-List ; Get-Acl D:\A | Set-Acl D:\B  # copiar ACL
```
cmd: `net share Datos=D:\Datos /grant:Todos,READ`, `net use Z: \\srv01\Datos /persistent:yes`, `net session`, `net file`.

- **Recursos administrativos ocultos** (terminan en `$`): `C$`, `ADMIN$` (C:\Windows), `IPC$` (comunicación entre procesos), `PRINT$`. En DC: **`NETLOGON`** y **`SYSVOL`**.
- **ABE** (Access-Based Enumeration): el usuario solo ve las carpetas a las que tiene acceso.

> ⚠️ Trampa: NTFS *Modificar* + compartido *Leer* → desde la red solo **lee**. En local (iniciando sesión en el servidor) solo cuentan los NTFS.

> ⚠️ Trampa: *Escritura* no permite **borrar**; *Modificar* sí.

> 💡 Clave: modelo **AGDLP**: cuentas (**A**) → grupos **G**lobales → grupos de **D**ominio **L**ocal → **P**ermisos. En multidominio: **AGUDLP** (con grupos **U**niversales).

### WS-2.2 · Discos, sistemas de archivos y Storage Spaces

| | MBR | GPT |
|---|---|---|
| Particiones | 4 primarias (o 3 + extendida) | **128** en Windows |
| Tamaño máximo | **2 TB** | 18 EB (teórico) |
| Arranque | BIOS | **UEFI** |
| Redundancia | No | Cabecera y tabla duplicadas + CRC |

| | NTFS | ReFS | FAT32 | exFAT |
|---|---|---|---|---|
| Permisos ACL | Sí | Sí | No | No |
| Cifrado EFS / compresión | Sí | No | No | No |
| Cuotas de disco | Sí | No | No | No |
| Arranque del SO | Sí | **No** | Sí (UEFI) | No |
| Tamaño máx. fichero | 16 TB-8 PB (según clúster) | 35 PB | **4 GB** | 16 EB |
| Uso típico | General | Hyper-V, Storage Spaces Direct, backups | USB, partición EFI | USB grandes |

- **ReFS** (Resilient File System): integridad por sumas de comprobación, reparación automática con Storage Spaces, **clonación de bloques** (VHDX). En 2025: desduplicación y compresión ReFS.
- **Discos dinámicos** (simple, distribuido, seccionado/RAID 0, reflejado/RAID 1, RAID 5) están **obsoletos**: se usan **Storage Spaces**.

**Storage Spaces** (Espacios de almacenamiento): agrupa discos en un **pool** y crea **discos virtuales** con resiliencia:
| Resiliencia | Discos mínimos | Tolera |
|---|---|---|
| Simple (stripe) | 1 | 0 fallos |
| Espejo doble (two-way mirror) | 2 | 1 fallo |
| Espejo triple | 5 | 2 fallos |
| Paridad | 3 | 1 fallo |
| Paridad doble | 7 | 2 fallos |

```powershell
Get-PhysicalDisk -CanPool $true
New-StoragePool -FriendlyName Pool1 -StorageSubSystemFriendlyName "Windows Storage*" -PhysicalDisks (Get-PhysicalDisk -CanPool $true)
New-VirtualDisk -StoragePoolFriendlyName Pool1 -FriendlyName VD1 -ResiliencySettingName Mirror -Size 500GB -ProvisioningType Thin
```
- **Storage Spaces Direct (S2D)**: almacenamiento hiperconvergente con discos locales de los nodos de un clúster (**Datacenter**).
- **Aprovisionamiento** fino (thin, crece bajo demanda) o fijo (fixed).
- **VHD**: máx. **2 TB**; **VHDX**: máx. **64 TB**, resistente a cortes. `New-VHD -Path D:\d.vhdx -SizeBytes 100GB -Dynamic`; `Mount-VHD`.

**RAID (repaso)**: RAID 0 (bandas, sin redundancia, mín. 2), RAID 1 (espejo, mín. 2, capacidad 50 %), RAID 5 (paridad distribuida, mín. 3, capacidad n-1, tolera 1), RAID 6 (doble paridad, mín. 4, tolera 2), RAID 10 (espejo + bandas, mín. 4).

> ⚠️ Trampa: un disco MBR no puede usar más de **2 TB**. Para un disco de 4 TB hay que convertir a **GPT** (`Initialize-Disk -PartitionStyle GPT`, o en diskpart `convert gpt` sobre un disco vacío).

> ⚠️ Trampa: **ReFS no sirve para el volumen de arranque** (C:).

### WS-2.3 · Servicios de archivos avanzados: DFS, FSRM, desduplicación, VSS

**DFS (Distributed File System)**
- **DFS Namespaces (DFSN)**: ruta lógica única (`\\age.local\Publico`) que apunta a carpetas en distintos servidores. Tipos: **basado en dominio** (en AD, alta disponibilidad, ruta `\\dominio\raíz`) o **independiente** (`\\servidor\raíz`).
- **DFS Replication (DFSR)**: replicación multimaestro de carpetas con **RDC** (Remote Differential Compression, solo cambios). Sustituye a **FRS**. Desde nivel funcional 2008, **SYSVOL** se replica con DFSR (FRS ya no es compatible desde 2019).
- `New-DfsnRoot`, `New-DfsnFolder`, `New-DfsReplicationGroup`, `dfsutil`, `dfsrdiag`.

**FSRM (File Server Resource Manager)**
- **Cuotas de carpeta**: **rígidas** (hard, impiden superar el límite) o **flexibles** (soft, solo avisan/registran). `New-FsrmQuota -Path D:\Usuarios\ana -Size 5GB`.
- **Filtrado de archivos** (file screening): bloquear tipos (`.mp3`, `.exe`) activo o pasivo. `New-FsrmFileScreen`.
- Informes de almacenamiento y **clasificación** de archivos.
- Las cuotas **NTFS** clásicas son por **usuario y volumen** (según propietario); las de FSRM por **carpeta**.

**Desduplicación** (`FS-Data-Deduplication`): elimina bloques repetidos (ideal para servidores de archivos, VDI, backups). `Enable-DedupVolume -Volume E: -UsageType Default`. No para el volumen de sistema.

**Instantáneas (VSS — Volume Shadow Copy Service)**
- "Versiones anteriores" de ficheros en carpetas compartidas. Por defecto, si se habilitan: 7:00 y 12:00 de lunes a viernes; máximo 64 instantáneas por volumen.
- `vssadmin list shadows`, `vssadmin list writers` (estado de los escritores VSS, útil si falla un backup), `vssadmin create shadow /for=C:` (en servidor).

> ⚠️ Trampa: DFSR **no es una copia de seguridad**: si alguien borra un fichero, el borrado se replica.

### WS-2.4 · Copias de seguridad y recuperación

- **Windows Server Backup** (característica `Windows-Server-Backup`), consola `wbadmin.msc`, línea de comandos **`wbadmin`**.
```cmd
wbadmin start backup -backupTarget:E: -include:C:,D: -allCritical -quiet
wbadmin start systemstatebackup -backupTarget:E:
wbadmin get versions
wbadmin start recovery -version:11/09/2026-02:00 -itemType:File -items:D:\Datos -recursive
wbadmin start systemstaterecovery -version:...       :: en modo DSRM para un DC
```
- **Estado del sistema** (System State) en un DC incluye: **base de datos de AD (NTDS.dit)**, **SYSVOL**, registro, archivos de arranque, base de datos COM+, y (si existen) base de datos de ADCS, configuración de clúster, metabase de IIS.
- `-allCritical` incluye todos los volúmenes necesarios para la **recuperación completa (bare metal)**.

**Tipos de copia**
| Tipo | Copia | Restaurar necesita | Bit de archivo |
|---|---|---|---|
| **Completa** | Todo | Solo la completa | Lo **borra** |
| **Incremental** | Cambios desde la **última copia (de cualquier tipo)** | Completa + **todas** las incrementales | Lo **borra** |
| **Diferencial** | Cambios desde la **última completa** | Completa + **la última** diferencial | **No** lo borra |

- **Regla 3-2-1**: 3 copias, en 2 soportes distintos, 1 fuera de las instalaciones (moderna: **3-2-1-1-0**: +1 inmutable/offline, 0 errores en la verificación).
- **RPO** (Recovery Point Objective): cuántos datos puedo perder (antigüedad de la última copia). **RTO** (Recovery Time Objective): cuánto tiempo puedo estar caído.
- Restauración de AD: **no autoritativa** (el DC se restaura y recibe los cambios del resto por replicación) o **autoritativa** (marca objetos para que ganen a los demás: `ntdsutil` → `authoritative restore` → `restore object` / `restore subtree`), ambas desde **DSRM** (Directory Services Restore Mode). Hoy, para objetos borrados, mejor la **papelera de reciclaje de AD**.

> ⚠️ Trampa: restaurar con **incrementales** requiere la completa y **todas** las incrementales; con **diferenciales**, la completa y **solo la última** diferencial.

## Nivel 3 — Active Directory

### WS-3.1 · Conceptos de Active Directory

**Active Directory Domain Services (AD DS)**: servicio de directorio basado en **LDAP**, que usa **Kerberos** para autenticación y **DNS** para localizar servicios.

**Estructura lógica**
- **Bosque** (forest): límite de **seguridad**. Comparte esquema, configuración y catálogo global. El primer dominio es el **dominio raíz del bosque**.
- **Árbol**: dominios con espacio de nombres DNS **contiguo** (`age.local`, `madrid.age.local`).
- **Dominio**: límite de **replicación** y de administración (y de la directiva de contraseñas por defecto).
- **Unidad organizativa (OU)**: contenedor para **delegar administración** y **vincular GPO**.
- Contenedores por defecto: `CN=Users`, `CN=Computers`, `CN=Builtin` (son **contenedores**, no OU: **no se pueden vincular GPO**). OU por defecto: `OU=Domain Controllers`.

**Estructura física**
- **Controlador de dominio (DC)**: servidor con copia de la base de datos **NTDS.dit** (`C:\Windows\NTDS`). Replicación **multimaestro**.
- **RODC** (controlador de solo lectura): para sucursales sin seguridad física; no almacena contraseñas salvo las permitidas (Password Replication Policy).
- **Sitio**: conjunto de subredes IP con buena conectividad. Controla la replicación (intrasitio inmediata/~15 s; intersitio por **programación**, por defecto cada **180 minutos**) y a qué DC se autentica cada cliente.
- **Catálogo global (GC)**: copia parcial de todos los objetos del bosque. Puertos **3268** (LDAP) y **3269** (LDAPS). Necesario para iniciar sesión (pertenencia a grupos universales) y buscar en el bosque.

**Particiones (naming contexts) de NTDS.dit**: **Esquema** (bosque), **Configuración** (bosque), **Dominio** (cada dominio), **Aplicación** (p. ej. `DomainDnsZones`, `ForestDnsZones`).

**Nombres**
- DN (Distinguished Name): `CN=Ana López,OU=TIC,DC=age,DC=local`.
- UPN: `alopez@age.local`. sAMAccountName (pre-Windows 2000): `AGE\alopez` (máx. 20 caracteres).
- SID = SID del dominio + **RID**; GUID = identificador único que nunca cambia.

**Puertos de AD**: DNS 53, **Kerberos 88**, RPC 135 + dinámicos 49152-65535, NetBIOS 137-139, **LDAP 389**, SMB 445 (SYSVOL), kpasswd 464, **LDAPS 636**, **GC 3268/3269**, ADWS (módulo PowerShell de AD) **9389**.

**Kerberos**: KDC en cada DC (AS + TGS). Flujo: el cliente obtiene un **TGT** (AS-REQ/AS-REP) y con él pide **tickets de servicio** (TGS-REQ/TGS-REP). Tolerancia de reloj por defecto **5 minutos**: si el reloj difiere más, la autenticación falla. Cuenta `krbtgt` firma los TGT. `klist` (ver tickets), `klist purge` (borrarlos).

**Hora en el dominio**: jerarquía **NT5DS**. El **PDC emulador del dominio raíz** es la fuente de hora del bosque y debe sincronizar con una fuente externa fiable.
```cmd
w32tm /query /status ; w32tm /query /source ; w32tm /resync
w32tm /config /manualpeerlist:"hora.roa.es" /syncfromflags:manual /reliable:yes /update
```

> 🏛️ AGE: la hora oficial de España la mantiene el **Real Instituto y Observatorio de la Armada (ROA)**, que ofrece servidores NTP públicos (`hora.roa.es`).

> ⚠️ Trampa: el límite de **seguridad** es el **bosque**, no el dominio.

> ⚠️ Trampa: `CN=Users` es un contenedor: no se le puede vincular una GPO. Para aplicar directivas a usuarios hay que moverlos a una **OU** (o redirigir con `redirusr`/`redircmp`).

### WS-3.2 · Roles FSMO y niveles funcionales

**5 roles FSMO** (Flexible Single Master Operations):

| Rol | Ámbito | Función |
|---|---|---|
| **Maestro de esquema** (Schema Master) | 1 por **bosque** | Único que puede modificar el esquema |
| **Maestro de nomenclatura de dominios** (Domain Naming Master) | 1 por **bosque** | Añadir/quitar dominios del bosque |
| **Maestro RID** | 1 por **dominio** | Reparte bloques de **500 RID** a los DC para crear objetos (SID) |
| **Emulador de PDC** | 1 por **dominio** | Cambios de contraseña prioritarios, **bloqueos de cuenta**, **hora**, edición de GPO por defecto, compatibilidad NT4 |
| **Maestro de infraestructura** | 1 por **dominio** | Actualiza referencias a objetos de otros dominios (no debe estar en un GC salvo que todos los DC sean GC) |

Total en un bosque de N dominios: **2 + 3N**.

```powershell
netdom query fsmo
Get-ADForest | Select-Object SchemaMaster, DomainNamingMaster
Get-ADDomain | Select-Object PDCEmulator, RIDMaster, InfrastructureMaster
Move-ADDirectoryServerOperationMasterRole -Identity DC02 -OperationMasterRole PDCEmulator, RIDMaster          # transferir
Move-ADDirectoryServerOperationMasterRole -Identity DC02 -OperationMasterRole SchemaMaster -Force             # apropiarse (seize) si el titular murió
```
Clásico: `ntdsutil` → `roles` → `connections` → `connect to server DC02` → `quit` → `transfer pdc` / `seize pdc`.
Números para `-OperationMasterRole`: 0 PDCEmulator, 1 RIDMaster, 2 InfrastructureMaster, 3 SchemaMaster, 4 DomainNamingMaster.

- **Transferir**: el titular está vivo (ordenado). **Apropiarse (seize)**: el titular ha muerto definitivamente; ese DC **no debe volver** a la red (hacer limpieza de metadatos).

**Niveles funcionales** (determinan qué funciones están disponibles y qué versión mínima de DC se admite):
| Nivel | Valor |
|---|---|
| Windows Server 2008 | 3 |
| 2008 R2 | 4 |
| 2012 | 5 |
| 2012 R2 | 6 |
| **2016** (`WinThreshold`) | 7 |
| **2025** | 10 |

- No existen niveles 2019 ni 2022: un dominio de DC 2019/2022 queda en **nivel 2016**.
- Elevar: `Set-ADDomainMode -Identity age.local -DomainMode Windows2016Domain` ; `Set-ADForestMode -Identity age.local -ForestMode Windows2016Forest`. Elevar es (en general) **irreversible**; el de bosque requiere que todos los dominios estén en ese nivel.
- Requisitos: nuevos bosques en 2025 exigen nivel mínimo 2016. El nivel 2025 es necesario para las páginas de base de datos de 32 KB.

> ⚠️ Trampa: los bloqueos de cuenta y el evento 4740 → **PDC emulador**. Si fallan las altas de objetos ("no hay RID disponibles") → **maestro RID**. Si no se puede extender el esquema (Exchange) → **maestro de esquema**.

### WS-3.3 · Instalación y promoción de controladores de dominio

```powershell
Install-WindowsFeature AD-Domain-Services -IncludeManagementTools

# 1) Nuevo bosque (primer DC)
Install-ADDSForest -DomainName "age.local" -DomainNetbiosName "AGE" -InstallDns `
  -ForestMode WinThreshold -DomainMode WinThreshold `
  -SafeModeAdministratorPassword (Read-Host -AsSecureString "DSRM")

# 2) DC adicional en un dominio existente
Install-ADDSDomainController -DomainName "age.local" -InstallDns -Credential (Get-Credential AGE\admin) -SiteName "Madrid"

# 3) RODC
Install-ADDSDomainController -DomainName "age.local" -ReadOnlyReplica -SiteName "Sucursal" -Credential (Get-Credential)

# 4) Dominio hijo
Install-ADDSDomain -NewDomainName "madrid" -ParentDomainName "age.local" -DomainType ChildDomain -Credential (Get-Credential)

# Comprobación previa y degradación
Test-ADDSForestInstallation -DomainName "age.local"
Uninstall-ADDSDomainController -DemoteOperationMasterRole -RemoveApplicationPartitions
```

- Rutas por defecto: base de datos y logs en **`%SYSTEMROOT%\NTDS`**, SYSVOL en **`%SYSTEMROOT%\SYSVOL`**.
- `-ForestMode`/`-DomainMode` admiten nombre o número (`WinThreshold` = 7 = 2016).
- La contraseña **DSRM** (modo de restauración de servicios de directorio) es la del administrador **local** del DC, usada para arrancar en DSRM. Se cambia con `ntdsutil` → `set dsrm password`.
- `dcpromo` está **obsoleto** desde 2012 (solo sirve con archivo de respuesta).
- **Clonación de DC virtualizados** y **IFM** (Install From Media: `ntdsutil "ac i ntds" "ifm" "create sysvol full C:\IFM"`) para no replicar toda la base por la WAN.

> ⚠️ Trampa: el primer DC del bosque **debe** ser catálogo global y tendrá **los 5 roles FSMO**.

> ⚠️ Trampa: `Install-ADDSForest` crea un **bosque** nuevo; `Install-ADDSDomainController` añade un DC a un dominio **existente**; `Install-ADDSDomain` crea un dominio **nuevo** (hijo o árbol) en un bosque existente.

### WS-3.5 · Directivas de contraseñas, cuentas de servicio y papelera de reciclaje

**Directiva de contraseñas del dominio**: se define **solo** a nivel de dominio (normalmente en *Default Domain Policy*): longitud mínima, historial, vigencia máxima/mínima, complejidad, umbral de bloqueo, duración del bloqueo, restablecer contador.

**Directivas de contraseña específicas (FGPP / PSO)** — nivel funcional ≥ 2008:
```powershell
New-ADFineGrainedPasswordPolicy -Name "PSO_Admins" -Precedence 10 -MinPasswordLength 15 `
  -ComplexityEnabled $true -LockoutThreshold 5 -LockoutDuration 00:30:00 -LockoutObservationWindow 00:30:00 `
  -MaxPasswordAge 90.00:00:00 -MinPasswordAge 1.00:00:00 -PasswordHistoryCount 24 -ReversibleEncryptionEnabled $false
Add-ADFineGrainedPasswordPolicySubject -Identity PSO_Admins -Subjects "Domain Admins"
Get-ADUserResultantPasswordPolicy alopez
```
- Se aplican a **usuarios** y **grupos globales de seguridad** (no a OU).
- Si varias aplican: gana el **valor de precedencia más bajo**. Una PSO aplicada directamente al usuario gana a las de sus grupos.

**Cuentas de servicio**
- **sMSA** (Managed Service Account, 2008 R2): contraseña gestionada automáticamente, **un solo equipo**.
- **gMSA** (group MSA, 2012+): contraseña gestionada por AD (cambio cada 30 días) y usable en **varios** servidores (granjas, clústeres). Requiere la **clave raíz KDS**.
  ```powershell
  Add-KdsRootKey -EffectiveImmediately          # en producción espera 10 h a que replique
  New-ADServiceAccount -Name gmsaWeb -DNSHostName gmsaWeb.age.local -PrincipalsAllowedToRetrieveManagedPassword "GG_ServidoresWeb"
  Install-ADServiceAccount gmsaWeb               # en el servidor que la usará
  Test-ADServiceAccount gmsaWeb                  # True si funciona
  ```
  Al configurar el servicio se pone `AGE\gmsaWeb$` (con **$**) y la contraseña vacía.
- **dMSA** (delegated MSA, Windows Server 2025): permite migrar una cuenta de servicio clásica a una cuenta administrada, deshabilitando la contraseña original.

**Papelera de reciclaje de AD** (nivel funcional ≥ 2008 R2, **irreversible** una vez activada)
```powershell
Enable-ADOptionalFeature -Identity 'Recycle Bin Feature' -Scope ForestOrConfigurationSet -Target 'age.local'
Get-ADObject -Filter 'isDeleted -eq $true -and Name -like "*Ana*"' -IncludeDeletedObjects
Get-ADObject -Filter 'samaccountname -eq "alopez"' -IncludeDeletedObjects | Restore-ADObject
```
- Restaura el objeto con **todos sus atributos** (pertenencia a grupos incluida) durante la vida útil de objeto eliminado (por defecto **180 días**).
- **Tombstone lifetime**: 180 días por defecto en bosques creados con 2003 SP1 o posterior. Un DC desconectado más tiempo que esto no debe volver a replicar (objetos persistentes / *lingering objects*).
- También se puede usar desde **ADAC** (`dsac.exe`).

**Protección contra borrado accidental**: casilla en la pestaña Objeto (Denegar *Eliminar* y *Eliminar subárbol* a Todos). Por defecto activa en las OU nuevas.

> ⚠️ Trampa: las PSO **no se pueden vincular a una OU**; solo a usuarios o grupos globales (para una OU se usa un "grupo sombra").

> ⚠️ Trampa: varias GPO con directivas de contraseña en distintas OU **no** cambian la contraseña de los usuarios de dominio: solo cuenta la vinculada al **dominio**. En una OU afectarían a las cuentas **locales** de los equipos de esa OU.

### WS-3.6 · Directivas de grupo (GPO)

- Una GPO tiene dos partes: **Configuración del equipo** (al arrancar y cada intervalo) y **Configuración del usuario** (al iniciar sesión y cada intervalo). Cada una con *Directivas* (Software, Windows, Plantillas administrativas) y *Preferencias*.
- Se almacena en dos sitios: **GPC** (contenedor en AD) y **GPT** (plantilla en `\\dominio\SYSVOL\dominio\Policies\{GUID}`).

**Orden de aplicación: LSDOU** — **L**ocal → **S**itio → **D**ominio → **O**U (de la padre a la hija). **La última que se aplica gana** en caso de conflicto (la OU más cercana al objeto).
- Dentro de un mismo contenedor, gana la GPO con **orden de vínculo 1**.
- **Exigido** (*Enforced*, antes "No reemplazar"): la GPO no puede ser sobrescrita por GPO de niveles inferiores y **ignora el bloqueo de herencia**.
- **Bloquear herencia**: en una OU, impide recibir GPO de niveles superiores (salvo las exigidas).
- **Filtrado de seguridad**: por defecto *Usuarios autenticados* con **Leer** + **Aplicar directiva de grupo**. Para aplicar solo a un grupo: quitar Usuarios autenticados de "Filtrado de seguridad" y añadir el grupo (y dar **Leer** a *Equipos del dominio* por la actualización MS16-072).
- **Filtro WMI**: aplica la GPO solo si se cumple una consulta WQL (p. ej. `SELECT * FROM Win32_OperatingSystem WHERE ProductType = 1` → solo clientes; `ProductType = 2` DC; `3` servidores miembro).
- **Procesamiento de bucle invertido** (*loopback*): aplica la configuración de **usuario** según la OU del **equipo** (terminales, aulas, RDS). Modos **Combinar** (Merge) y **Reemplazar** (Replace).
- **Actualización**: equipos y usuarios cada **90 minutos ± 30** aleatorios; **controladores de dominio cada 5 minutos**. Algunas configuraciones (instalación de software, redirección de carpetas) solo al **arranque/inicio de sesión**.
- **Almacén central** de plantillas ADMX: `\\dominio\SYSVOL\dominio\Policies\PolicyDefinitions` (ficheros `.admx` + carpeta de idioma `es-ES` con `.adml`).
- **Preferencias** (GPP): mapear unidades, impresoras, accesos directos, registro, tareas… Admiten **segmentación a nivel de elemento** (item-level targeting). No "tatúan" igual que las directivas: el usuario puede cambiarlas salvo que se configure "aplicar una vez".
- GPO por defecto: **Default Domain Policy** (contraseñas, bloqueo, Kerberos) y **Default Domain Controllers Policy** (derechos de usuario y auditoría de los DC).

**Comandos**
```cmd
gpupdate /force                     :: reaplica todas las directivas
gpupdate /target:computer /force    :: solo equipo
gpupdate /boot ; gpupdate /logoff   :: reinicia/cierra sesión si es necesario
gpresult /r                         :: resumen de GPO aplicadas (RSoP)
gpresult /r /scope computer
gpresult /h C:\informe.html         :: informe HTML
gpresult /user AGE\alopez /v
```
```powershell

New-GPLink -Name "GPO_Fondo_Escritorio" -Target "OU=Usuarios,DC=age,DC=local" -LinkEnabled Yes
Set-GPLink -Name "GPO_Seguridad" -Target "DC=age,DC=local" -Enforced Yes
Set-GPInheritance -Target "OU=Laboratorio,DC=age,DC=local" -IsBlocked Yes
Set-GPRegistryValue -Name "GPO_X" -Key "HKCU\Software\Policies\Microsoft\Windows\Control Panel\Desktop" -ValueName ScreenSaveTimeOut -Type String -Value 600
Set-GPPermission -Name "GPO_X" -TargetName "GG_Contabilidad" -TargetType Group -PermissionLevel GpoApply
Get-GPO -All ; Get-GPInheritance -Target "OU=TIC,DC=age,DC=local"
Get-GPOReport -Name "GPO_X" -ReportType Html -Path C:\gpo.html
Get-GPResultantSetOfPolicy -ReportType Html -Path C:\rsop.html
Backup-GPO -All -Path \\srv\backups\gpo ; Restore-GPO -Name "GPO_X" -Path \\srv\backups\gpo

> ⚠️ Trampa: el orden es **L-S-D-OU** y gana la **última** (la más cercana). Pero **Exigido** en un nivel superior gana a todo lo de abajo, incluso con bloqueo de herencia.

> ⚠️ Trampa: `gpresult` sin ser administrador solo muestra la parte de usuario; para la de equipo, consola elevada.

> ⚠️ Trampa: las GPO **no se aplican** a los contenedores `CN=Users` ni `CN=Computers` (salvo las del dominio y del sitio).

### WS-3.7 · Confianzas, sitios y replicación

**Relaciones de confianza**
| Tipo | Transitiva | Dirección | Uso |
|---|---|---|---|
| **Padre-hijo** | Sí | Bidireccional | Automática al crear un dominio hijo |
| **Raíz de árbol** | Sí | Bidireccional | Automática al crear un árbol nuevo en el bosque |
| **Externa** | No | Uni/bi | Con un dominio de **otro bosque** (o NT4) |
| **De bosque** | Sí (entre los dos bosques) | Uni/bi | Entre dominios raíz de dos bosques (nivel ≥ 2003) |
| **Acceso directo** (shortcut) | Parcialmente | Uni/bi | Acelerar autenticación entre dominios lejanos del mismo bosque |
| **Territorio** (realm) | Configurable | Uni/bi | Con un territorio Kerberos no Windows (MIT) |

- Dirección: si el dominio A **confía en** B, los usuarios de **B** pueden acceder a recursos de **A** (la confianza va en sentido contrario al acceso).
- Autenticación selectiva y filtrado de SID para limitar.

**Sitios y replicación**
- Objetos en `dssite.msc`: Sitios, **Subredes** (asociadas a un sitio), **Vínculos de sitio** (coste, programación, intervalo por defecto **180 min**; `DEFAULTIPSITELINK`), servidores **cabeza de puente** (bridgehead).
- **KCC** (Knowledge Consistency Checker) genera automáticamente la topología de replicación (anillo dentro del sitio, máx. 3 saltos).
- Replicación: intrasitio sin compresión y por notificación; intersitio comprimida y programada.

**Diagnóstico de AD**
```cmd
dcdiag /v                         :: diagnóstico completo del DC
dcdiag /test:dns /v               :: pruebas DNS
dcdiag /s:DC02 /a                 :: todos los DC del sitio
repadmin /replsummary             :: resumen de replicación de todos los DC
repadmin /showrepl                :: estado de replicación de este DC
repadmin /syncall /AdeP           :: forzar replicación (All partitions, enterprise, Push)
repadmin /queue                   :: cola de replicación
repadmin /showbackup              :: última copia de seguridad por partición
nltest /dsgetdc:age.local         :: qué DC me atiende
nltest /sc_verify:age.local       :: canal seguro equipo-dominio
nltest /dclist:age.local          :: lista de DC
```
```powershell
Get-ADReplicationFailure -Target DC01
Get-ADReplicationPartnerMetadata -Target DC01
Sync-ADObject ; Get-ADDomainController -Filter * | Select-Object Name, Site, IsGlobalCatalog, IsReadOnly
Test-ComputerSecureChannel -Repair -Credential AGE\admin        # repara la relación de confianza del equipo (5.1)
